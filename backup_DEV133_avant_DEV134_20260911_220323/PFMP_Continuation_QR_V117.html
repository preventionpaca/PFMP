<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:760px;margin:24px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:16px;padding:22px;box-shadow:0 8px 28px #00000012}.eyebrow{font-weight:700;color:#07866e}h1{margin:.2rem 0 1rem}.identity{background:#f4faf8;border-radius:10px;padding:12px 14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700}.wide{grid-column:1/-1}input,button,select{font:inherit;padding:.75rem;border:1px solid #b9cbc6;border-radius:7px}button{background:#07866e;color:white;border:0;font-weight:700;cursor:pointer}.siret{display:grid;grid-template-columns:1fr auto;gap:8px}.confirm{display:flex;gap:8px;align-items:center;margin:16px 0}.confirm input{width:auto}.status{margin:14px 0;padding:12px;border-radius:8px;background:#f2f6f5}.error{background:#fff0f0;color:#8a1111}.ok{background:#e7f7ef}.busy{display:flex;align-items:center;gap:10px}.busy:before{content:"";width:16px;height:16px;border:3px solid #b8d8d1;border-top-color:#07866e;border-radius:50%;animation:spin .75s linear infinite;flex:0 0 auto}@keyframes spin{to{transform:rotate(360deg)}}.actions{display:flex;justify-content:flex-end;margin-top:18px}.hint{color:#59746e;font-size:.92rem}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.siret{grid-template-columns:1fr}}button:disabled{opacity:.65;cursor:wait}
.build{font-size:.7rem;color:#78918b;text-align:right;margin-bottom:4px}
</style></head><body><main><section class="card"><div class="build">DEV.132</div><p class="eyebrow">LYCÉE LES EUCALYPTUS · PFMP</p><h1>Entreprise et tuteur</h1><div id="identity" class="identity">Chargement de votre convention…</div><p id="status" class="status" role="status"></p><form id="f" hidden novalidate><h2>Entreprise</h2><div class="grid"><label class="wide">SIRET<div class="siret"><input name="entrepriseSiret" id="siret" inputmode="numeric"><button type="button" id="search">Rechercher</button></div></label><label>Raison sociale *<input name="entrepriseRaisonSociale" required></label><label>Nom commercial<input name="entrepriseEnseigne"></label><label class="wide">Adresse *<input name="entrepriseAdresse" required></label><label class="wide">Complément d’adresse<input name="entrepriseComplement"></label><label>Code postal<input name="entrepriseCodePostal"></label><label>Ville *<input name="entrepriseCommune" required></label><label>Pays *<input name="entreprisePays" value="France" required></label></div><h2>Responsable dans l’entreprise</h2><div class="grid"><label>Nom *<input name="responsableNom" required></label><label>Prénom<input name="responsablePrenom"></label><label>Fonction<input name="responsableFonction"></label><label>Téléphone<input name="responsableTelephone" type="tel"></label><label class="wide">Courriel<input name="responsableCourriel" type="email"></label></div><label class="confirm"><input type="checkbox" name="tuteurEstResponsable" id="same"> Le tuteur est également le responsable dans l’entreprise</label><div id="tuteur"><h2>Tuteur</h2><div class="grid"><label>Nom *<input name="tuteurNom"></label><label>Prénom<input name="tuteurPrenom"></label><label>Fonction<input name="tuteurFonction"></label><label>Téléphone<input name="tuteurTelephone" type="tel"></label><label class="wide">Courriel<input name="tuteurCourriel" type="email"></label></div></div><div class="actions"><button id="save" type="button">Enregistrer les informations</button></div></form></section></main><script>
(function(){const $=s=>document.querySelector(s),form=$('#f'),status=$('#status');let RESUME='';function field(n){return form.elements[n]}function msg(t,e,busy){status.textContent=t||'';status.className='status'+(e?' error':busy?' busy':'')}function fill(o){o=o||{};Object.keys(o).forEach(k=>{const el=field(k);if(el)el.value=o[k]??''})}function initData(r){$('#identity').textContent=[r.eleve.prenom,r.eleve.nom,'—',r.eleve.classe,'—',r.eleve.annee,'— Réf.',r.reference].filter(Boolean).join(' ');fill({entrepriseSiret:r.entreprise.siret,entrepriseRaisonSociale:r.entreprise.raisonSociale,entrepriseEnseigne:r.entreprise.enseigne,entrepriseAdresse:r.entreprise.adresse,entrepriseComplement:r.entreprise.complement,entrepriseCodePostal:r.entreprise.codePostal,entrepriseCommune:r.entreprise.commune,entreprisePays:r.entreprise.pays||'France',responsableNom:r.responsable.nom,responsablePrenom:r.responsable.prenom,responsableFonction:r.responsable.fonction,responsableTelephone:r.responsable.telephone,responsableCourriel:r.responsable.courriel,tuteurNom:r.tuteur.nom,tuteurPrenom:r.tuteur.prenom,tuteurFonction:r.tuteur.fonction,tuteurTelephone:r.tuteur.telephone,tuteurCourriel:r.tuteur.courriel});field('tuteurEstResponsable').checked=!!r.tuteur.estResponsable;toggleTutor();form.hidden=false;msg(r.entreprise.raisonSociale?'✓ Élève reconnu — informations existantes chargées, vous pouvez les modifier.':'✓ Élève reconnu — renseignez maintenant l’entreprise puis le tuteur.');status.className='status ok';}
function toggleTutor(){const same=field('tuteurEstResponsable').checked;$('#tuteur').hidden=same;field('tuteurNom').required=!same;}$('#same').onchange=toggleTutor;
function applyCompany(r){if(r&&r.introuvable){msg('Aucune entreprise trouvée pour ce SIRET.',true);return}const d=r&&r.entreprise||{};fill({entrepriseSiret:d.siret||field('entrepriseSiret').value,entrepriseRaisonSociale:d.raisonSociale,entrepriseEnseigne:d.enseigne,entrepriseAdresse:d.numeroVoie,entrepriseComplement:d.complementAdresse,entrepriseCodePostal:d.codePostal,entrepriseCommune:d.commune,entreprisePays:d.pays||'France'});msg(r&&r.source==='grist'?'Entreprise existante chargée.':'Données publiques chargées.');}
async function publicApi(r){const b=$('#search');try{msg('Recherche des données publiques de l’entreprise…',false,true);const rep=await fetch(r.url,{headers:{Accept:'application/json'}});if(!rep.ok)throw new Error('API entreprises indisponible ('+rep.status+').');google.script.run.withSuccessHandler(x=>{b.disabled=false;applyCompany(x)}).withFailureHandler(e=>{b.disabled=false;msg(e.message||String(e),true)}).EUC_ENT_traiterReponseApiNavigateur(await rep.json(),r.siret);}catch(e){b.disabled=false;msg(e.message||String(e),true)}}
$('#search').onclick=()=>{const b=$('#search');b.disabled=true;msg('Recherche du SIRET en cours…',false,true);google.script.run.withSuccessHandler(r=>{if(r.source==='api_navigateur'){publicApi(r)}else{b.disabled=false;applyCompany(r)}}).withFailureHandler(e=>{b.disabled=false;msg(e.message||String(e),true)}).EUC_ENT_rechercherSiret(field('entrepriseSiret').value)};
function EUC_SAVE_retablirBouton_(){
  const b=$('#save');
  b.disabled=false;
  b.textContent='Enregistrer les informations';
}

function EUC_SAVE_executer_(){
  const b=$('#save');
  if(b.disabled)return;

  // Réaction visuelle IMMÉDIATE au clic
  b.disabled=true;
  b.textContent='Enregistrement…';
  msg('Vérification des informations avant enregistrement…',false,true);

  // Laisse au navigateur le temps d'afficher spinner + texte.
  setTimeout(function(){
    try{
      if(!form.checkValidity()){
        const bad=form.querySelector(':invalid');

        EUC_SAVE_retablirBouton_();

        msg(
          'Impossible d’enregistrer : un champ obligatoire ou une adresse courriel est invalide.',
          true
        );

        if(bad){
          try{
            bad.scrollIntoView({behavior:'smooth',block:'center'});
            bad.focus();
          }catch(ignore){}
        }
        return;
      }

      const d=Object.fromEntries(new FormData(form));
      d.tuteurEstResponsable=field('tuteurEstResponsable').checked;

      msg('Enregistrement des informations dans Grist…',false,true);

      google.script.run
        .withSuccessHandler(function(r){
          EUC_SAVE_retablirBouton_();

          if(!r || !r.ok){
            msg('Réponse inattendue du serveur pendant l’enregistrement.',true);
            return;
          }

          msg(
            '✓ Informations enregistrées — N° d’enregistrement : '+
            (r.numeroEnregistrement||r.reference||'non disponible')+'.',
            false
          );
          status.className='status ok';
        })
        .withFailureHandler(function(err){
          EUC_SAVE_retablirBouton_();
          msg(
            'Erreur d’enregistrement : '+
            (err && err.message ? err.message : String(err)),
            true
          );
        })
        .EUC_CONVENTION_enregistrerEntrepriseV117(RESUME,d);

    }catch(err){
      EUC_SAVE_retablirBouton_();
      msg(
        'Erreur technique avant enregistrement : '+
        (err && err.message ? err.message : String(err)),
        true
      );
    }
  },80);
}

$('#save').onclick=EUC_SAVE_executer_;
window.addEventListener('error',function(e){
  try{
    msg('Erreur technique du formulaire : '+(e.message||'erreur Javascript'),true);
  }catch(ignore){}
});
window.addEventListener('unhandledrejection',function(e){
  try{
    const x=e.reason;
    msg('Erreur technique du formulaire : '+(x&&x.message?x.message:String(x)),true);
  }catch(ignore){}
});
function start(){msg('Chargement et reconnaissance de la convention…',false,true);google.script.url.getLocation(loc=>{RESUME=String((loc.parameter||{}).resume||'').trim();if(!RESUME){msg('Session de reprise absente. Rescannez le QR code.',true);return}google.script.run.withSuccessHandler(initData).withFailureHandler(e=>msg(e.message||String(e),true)).EUC_CONVENTION_repriseEntrepriseV117(RESUME);});}start();})();
</script></body></html>
