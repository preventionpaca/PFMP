<style>:root{font-family:Arial,sans-serif;color:#073b35;background:#eef7f4}main{max-width:1150px;margin:auto;padding:2rem}.eyebrow{color:#07866e;font-weight:700}aside{padding:1rem;background:#fff0b3}form,label{display:grid;gap:.4rem}form{grid-template-columns:1fr auto;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.7rem}button{background:#07866e;color:white;border:0;font-weight:700}#sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}#sections section{background:white;padding:1rem}dl div{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}dd{margin:0}label{margin:.7rem 0}footer{text-align:center;margin-top:2rem}@media(max-width:650px){main{padding:1rem}form{grid-template-columns:1fr}#sections{grid-template-columns:1fr}}</style>
