<style>:root{font-family:Inter,system-ui,sans-serif;color:#15332c;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:40px 20px}header{margin-bottom:24px}.eyebrow{color:#287660;font-weight:700;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(2rem,6vw,4rem);margin:.15em 0}.card{background:#fff;border:1px solid #dbe5df;border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 16px 40px #173b2d14}label{display:grid;gap:7px;font-weight:650}input,textarea{width:100%;border:1px solid #b8c9c1;border-radius:9px;padding:12px;font:inherit}input:focus,textarea:focus{outline:3px solid #bde6d8;border-color:#287660}.row{display:flex;gap:10px}.row input{flex:1}button{border:0;border-radius:9px;background:#176c53;color:#fff;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}fieldset{border:0;padding:24px 0 0;margin:20px 0 0;border-top:1px solid #dbe5df}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;flex-direction:row}.check input{width:auto}#saveBtn{margin-top:24px}#status{min-height:1.5em;color:#755400}footer{text-align:center;color:#687c74;font-size:.8rem;padding:24px}@media(max-width:620px){main{padding:20px 12px}.row{display:grid}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style>
