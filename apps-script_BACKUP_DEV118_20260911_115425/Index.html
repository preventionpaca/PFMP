<!doctype html><html lang="fr"><head><base target="_top"><?!= EUC_ENT_inclure('Styles'); ?></head><body>
<main><header><p class="eyebrow">Lycée Les Eucalyptus</p><h1>Référentiel entreprises</h1><p>Recherchez un établissement français, vérifiez les données publiques, puis complétez sa fiche.</p></header>
<section class="card"><form id="form"><input type="hidden" name="gristId"><div class="search"><label for="siret">Numéro SIRET</label><div class="row"><input id="siret" name="siret" inputmode="numeric" autocomplete="off" placeholder="123 456 789 00012" required><button id="searchBtn" type="button">Rechercher</button></div><p id="status" role="status"></p></div>
<fieldset id="details" disabled><legend>Entreprise</legend><div class="grid">
<label>Raison sociale<input name="raisonSociale" required></label><label>Enseigne<input name="enseigne"></label><label>SIREN<input name="siren" readonly></label><label>État<input name="etat"></label><label>Forme juridique<input name="formeJuridique"></label><label>Code APE / NAF<input name="codeApe"></label><label>Date de création<input name="dateCreation" type="date"></label><label>Code postal<input name="codePostal"></label><label>Commune<input name="commune"></label><label class="wide">Adresse complète<input name="adresseComplete"></label><label>Téléphone<input name="telephone" type="tel"></label><label>Courriel général<input name="courriel" type="email"></label><label class="wide">Site Internet<input name="siteWeb" type="url"></label><label class="check"><input name="accueilEleves" type="checkbox"> Susceptible d’accueillir des élèves</label><label>Statut de la relation<input name="statutRelation"></label><label class="wide">Commentaire interne<textarea name="commentaireInterne" rows="4"></textarea></label></div><h2>Contact facultatif</h2><div class="grid"><label>Civilité<input name="contactCivilite"></label><label>Prénom<input name="contactPrenom"></label><label>Nom<input name="contactNom"></label><label>Fonction<input name="contactFonction"></label><label>Téléphone direct<input name="contactTelephone" type="tel"></label><label>Courriel direct<input name="contactCourriel" type="email"></label><label>Type de contact<input name="contactType"></label><label class="wide">Commentaire contact<textarea name="contactCommentaire" rows="2"></textarea></label></div><button id="saveBtn" type="submit">Enregistrer dans Grist</button></fieldset></form></section>
<footer>Eucalyptus Entreprises SIRET — v1.0.0-dev.8</footer></main><?!= EUC_ENT_inclure('Scripts'); ?></body></html>
