<style>body{font-family:Arial,sans-serif;background:#f5fbf8;color:#16342e;margin:0}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.head{display:flex;align-items:center;gap:20px;margin-bottom:18px}.head h1{margin:0}.actions{margin-left:auto;display:flex;gap:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #bfe4da;border-radius:16px;padding:18px}.card h2{color:#08705d}.btn{display:inline-flex;align-items:center;gap:7px;background:#079b79;color:#fff;border:0;text-decoration:none;padding:9px 13px;border-radius:9px;font-weight:800;cursor:pointer}.count-panel{display:none;margin-top:12px;border-top:1px solid #e5efec;padding-top:9px}.count-panel.visible{display:block}.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:4px 0}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.loading{pointer-events:none;opacity:.9}</style></head><body><main class="wrap"><div class="head"><h1>Point sur les stages</h1><div class="actions"><button class="btn" id="toggle">Afficher les décomptes</button></div></div><div class="grid" id="grid"></div></main>
<script>
(function(){const P=<?!= paramsJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;function busy(b,t){b.classList.add('loading');b.innerHTML='<span class="spin"></span>'+t}function url(f){return BASE+'?page=suivi-conventions-public-famille&annee='+encodeURIComponent(P.annee)+'&famille='+f}function card(f,l){return '<section class="card"><h2>'+l+'</h2><button class="btn fam" data-f="'+f+'">Voir les classes</button><div class="count-panel" id="c-'+f+'"></div></section>'}grid.innerHTML=card('BACPRO','BAC PRO')+card('BTS','BTS')+card('CAP','CAP');document.querySelectorAll('.fam').forEach(function(b){b.onclick=function(){busy(b,'Chargement…');location.href=url(b.dataset.f)}});let loaded=false,visible=false;function render(D){
 ['BACPRO','BTS','CAP'].forEach(function(f){
  var fam=(D.familles&&D.familles[f])||{},box=document.getElementById('c-'+f);
  box.innerHTML=(fam.niveaux||[]).map(function(l){
   var h='<div><b>'+l.niveau+'</b>';
   h+=(l.periodes||[]).map(function(p){
    return '<div class="row"><span>'+p.libelle+'</span><strong>'+Number(p.conventions||0)+' / '+Number(p.eleves||0)+(Number(p.apprentis||0)?' + '+Number(p.apprentis)+' apprenti(s)':'')+'</strong></div>';
   }).join('');
   if(f==='BACPRO'&&l.niveau==='Terminale'&&l.pdif){
    h+='<div class="row"><span>P.dif.</span><strong>'+Number(l.pdif.lycee||0)+' lycée · '+Number(l.pdif.entreprise||0)+' entreprise · '+Number(l.pdif.aDefinir||0)+' à définir</strong></div>';
   }
   return h+'</div>';
  }).join('');
 });
}toggle.onclick=function(){visible=!visible;document.querySelectorAll('.count-panel').forEach(function(x){x.classList.toggle('visible',visible)});if(!visible){toggle.textContent='Afficher les décomptes';return}if(loaded){toggle.textContent='Masquer les décomptes';return}document.querySelectorAll('.count-panel').forEach(function(x){x.innerHTML='<em>Chargement du décompte…</em>'});busy(toggle,'Chargement…');google.script.run.withSuccessHandler(function(r){loaded=true;render(r||{});toggle.classList.remove('loading');toggle.textContent='Masquer les décomptes'}).withFailureHandler(function(e){toggle.classList.remove('loading');toggle.textContent='Réessayer';alert(String(e&&e.message||e))}).EUC_DEV348_resumeAccueil({annee:P.annee})}})();
</script>
