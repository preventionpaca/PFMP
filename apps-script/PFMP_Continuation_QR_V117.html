<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:760px;margin:24px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:16px;padding:22px;box-shadow:0 8px 28px #00000012}.eyebrow{font-weight:700;color:#07866e}h1{margin:.2rem 0 1rem}.identity{background:#f4faf8;border-radius:10px;padding:12px 14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700}.wide{grid-column:1/-1}input,button,select{font:inherit;padding:.75rem;border:1px solid #b9cbc6;border-radius:7px}button{background:#07866e;color:white;border:0;font-weight:700;cursor:pointer}.siret{display:grid;grid-template-columns:1fr auto;gap:8px}.confirm{display:flex;gap:8px;align-items:center;margin:16px 0}.confirm input{width:auto}.status{margin:14px 0;padding:12px;border-radius:8px;background:#f2f6f5}.error{background:#fff0f0;color:#8a1111}.ok{background:#e7f7ef}.actions{display:flex;justify-content:flex-end;margin-top:18px}.hint{color:#59746e;font-size:.92rem}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.siret{grid-template-columns:1fr}}</style></head><body><main><section class="card"><p class="eyebrow">LYCÉE LES EUCALYPTUS · PFMP</p><h1>Entreprise et tuteur</h1><div id="identity" class="identity">Chargement de votre convention…</div><p id="status" class="status" role="status"></p><form id="f" hidden><h2>Entreprise</h2><div class="grid"><label class="wide">SIRET<div class="siret"><input name="entrepriseSiret" id="siret" inputmode="numeric"><button type="button" id="search">Rechercher</button></div></label><label>Raison sociale *<input name="entrepriseRaisonSociale" required></label><label>Nom commercial<input name="entrepriseEnseigne"></label><label class="wide">Adresse *<input name="entrepriseAdresse" required></label><label class="wide">Complément d’adresse<input name="entrepriseComplement"></label><label>Code postal<input name="entrepriseCodePostal"></label><label>Ville *<input name="entrepriseCommune" required></label><label>Pays *<input name="entreprisePays" value="France" required></label></div><h2>Responsable dans l’entreprise</h2><div class="grid"><label>Nom *<input name="responsableNom" required></label><label>Prénom<input name="responsablePrenom"></label><label>Fonction<input name="responsableFonction"></label><label>Téléphone<input name="responsableTelephone" type="tel"></label><label class="wide">Courriel<input name="responsableCourriel" type="email"></label></div><label class="confirm"><input type="checkbox" name="tuteurEstResponsable" id="same"> Le tuteur est également le responsable dans l’entreprise</label><div id="tuteur"><h2>Tuteur</h2><div class="grid"><label>Nom *<input name="tuteurNom"></label><label>Prénom<input name="tuteurPrenom"></label><label>Fonction<input name="tuteurFonction"></label><label>Téléphone<input name="tuteurTelephone" type="tel"></label><label class="wide">Courriel<input name="tuteurCourriel" type="email"></label></div></div><div class="actions"><button id="save" type="submit">Enregistrer les informations</button></div></form></section></main><script>
(function(){const $=s=>document.querySelector(s),form=$('#f'),status=$('#status');let RESUME='';function field(n){return form.elements[n]}function msg(t,e){status.textContent=t||'';status.className='status'+(e?' error':'')}function fill(o){o=o||{};Object.keys(o).forEach(k=>{const el=field(k);if(el)el.value=o[k]??''})}function initData(r){$('#identity').textContent=[r.eleve.prenom,r.eleve.nom,'—',r.eleve.classe,'—',r.eleve.annee,'— Réf.',r.reference].filter(Boolean).join(' ');fill({entrepriseSiret:r.entreprise.siret,entrepriseRaisonSociale:r.entreprise.raisonSociale,entrepriseEnseigne:r.entreprise.enseigne,entrepriseAdresse:r.entreprise.adresse,entrepriseComplement:r.entreprise.complement,entrepriseCodePostal:r.entreprise.codePostal,entrepriseCommune:r.entreprise.commune,entreprisePays:r.entreprise.pays||'France',responsableNom:r.responsable.nom,responsablePrenom:r.responsable.prenom,responsableFonction:r.responsable.fonction,responsableTelephone:r.responsable.telephone,responsableCourriel:r.responsable.courriel,tuteurNom:r.tuteur.nom,tuteurPrenom:r.tuteur.prenom,tuteurFonction:r.tuteur.fonction,tuteurTelephone:r.tuteur.telephone,tuteurCourriel:r.tuteur.courriel});field('tuteurEstResponsable').checked=!!r.tuteur.estResponsable;toggleTutor();form.hidden=false;msg(r.entreprise.raisonSociale?'Informations existantes chargées : vous pouvez les modifier.':'Renseignez l’entreprise puis le tuteur.');}
function toggleTutor(){const same=field('tuteurEstResponsable').checked;$('#tuteur').hidden=same;field('tuteurNom').required=!same;}$('#same').onchange=toggleTutor;
function applyCompany(r){if(r&&r.introuvable){msg('Aucune entreprise trouvée pour ce SIRET.',true);return}const d=r&&r.entreprise||{};fill({entrepriseSiret:d.siret||field('entrepriseSiret').value,entrepriseRaisonSociale:d.raisonSociale,entrepriseEnseigne:d.enseigne,entrepriseAdresse:d.numeroVoie,entrepriseComplement:d.complementAdresse,entrepriseCodePostal:d.codePostal,entrepriseCommune:d.commune,entreprisePays:d.pays||'France'});msg(r&&r.source==='grist'?'Entreprise existante chargée.':'Données publiques chargées.');}
async function publicApi(r){try{const rep=await fetch(r.url,{headers:{Accept:'application/json'}});if(!rep.ok)throw new Error('API entreprises indisponible ('+rep.status+').');google.script.run.withSuccessHandler(applyCompany).withFailureHandler(e=>msg(e.message||String(e),true)).EUC_ENT_traiterReponseApiNavigateur(await rep.json(),r.siret);}catch(e){msg(e.message||String(e),true)}}
$('#search').onclick=()=>{msg('Recherche du SIRET…');google.script.run.withSuccessHandler(r=>r.source==='api_navigateur'?publicApi(r):applyCompany(r)).withFailureHandler(e=>msg(e.message||String(e),true)).EUC_ENT_rechercherSiret(field('entrepriseSiret').value)};
form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const d=Object.fromEntries(new FormData(form));d.tuteurEstResponsable=field('tuteurEstResponsable').checked;const b=$('#save');b.disabled=true;msg('Enregistrement en cours…');google.script.run.withSuccessHandler(r=>{b.disabled=false;msg('Enregistré. Référence '+r.reference+'.',false);status.className='status ok';}).withFailureHandler(x=>{b.disabled=false;msg(x.message||String(x),true)}).EUC_CONVENTION_enregistrerEntrepriseV117(RESUME,d)};
function start(){google.script.url.getLocation(loc=>{RESUME=String((loc.parameter||{}).resume||'').trim();if(!RESUME){msg('Session de reprise absente. Rescannez le QR code.',true);return}google.script.run.withSuccessHandler(initData).withFailureHandler(e=>msg(e.message||String(e),true)).EUC_CONVENTION_repriseEntrepriseV117(RESUME);});}start();})();
</script></body></html>
