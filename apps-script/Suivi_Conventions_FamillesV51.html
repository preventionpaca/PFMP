<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>Suivi des conventions PFMP</title>
<style>
:root{--g:#0b8f72;--g2:#dff4ed;--g3:#eef9f5;--ink:#17312b;--mut:#5f746e;--line:#cfe5de;--bg:#f7fbf9;--red:#d92d20;--orange:#e67e00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.hero{background:#fff;border-bottom:1px solid var(--line);padding:24px 18px}.wrap{max-width:1180px;margin:auto}.eyebrow{color:var(--g);font-weight:800;font-size:13px}.hero h1{margin:7px 0 4px;font-size:30px;color:#0f4035}.sub{color:var(--mut)}.content{padding:20px 18px}.crumb{font-size:13px;color:#0b745f;font-weight:800;margin-bottom:15px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 3px 14px rgba(12,76,62,.05)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:22px;font-weight:800;color:#0c5f4e}.go{background:var(--g);color:#fff;border-radius:9px;padding:8px 11px;font-weight:800;font-size:12px}.meta{font-size:12px;color:var(--mut);margin:7px 0 12px}.period{padding:10px 0;border-top:1px solid #e7f1ed}.row{display:flex;justify-content:space-between;gap:12px}.label{font-weight:700}.count{font-weight:800}.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--g)}.bar{height:6px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%}.fill.red{background:var(--red)}.fill.orange{background:var(--orange)}.fill.green{background:var(--g)}.wait{padding:12px;background:var(--g3);border-radius:10px;color:var(--mut);font-size:13px}.busy{opacity:.7;pointer-events:none}.busy .go::after{content:' · chargement…'}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">LYCÉE LES EUCALYPTUS</div><h1>Suivi des conventions PFMP</h1><div class="sub">Synthèse par famille de formation</div></div></header>
<main class="content"><div class="wrap"><div class="crumb"><a id="EUC_DEV175C_HOME" href="#" style="color:#0b745f;text-decoration:none;font-weight:800">← Accueil PFMP</a> <span style="color:#667085">›</span> Suivi des conventions</div><div class="top"><strong id="summary"></strong><label>Année scolaire <select id="year"></select></label></div><div class="grid" id="grid"></div></div></main>
<script>
const C=<?!= config ?>; const REQUESTED_YEAR=<?!= requestedYear ?>;
(function(){var h=document.getElementById('EUC_DEV175C_HOME');if(h)h.href=C.baseUrl+'?page=admin-pfmp';const fams=[{code:'BACPRO',libelle:'BAC PRO'},{code:'BTS',libelle:'BTS'},{code:'CAP',libelle:'CAP'}],TTL=300000;
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cls(p){const n=Number(p.total)||0,r=n?100*(Number(p.conventions)||0)/n:0;return r>=100?'green':(r>=65?'orange':'red')}
function currentYear(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,a=m>=9?y:y-1;return a+'-'+(a+1)}
const active=REQUESTED_YEAR||currentYear(),y0=Number(active.slice(0,4));
year.innerHTML=[y0-1,y0,y0+1].map(y=>'<option value="'+y+'-'+(y+1)+'"'+((y+'-'+(y+1))===active?' selected':'')+'>'+y+'-'+(y+1)+'</option>').join('');
year.onchange=()=>location.href=C.baseUrl+'?page=suivi-conventions&annee='+encodeURIComponent(year.value);summary.textContent='Année '+active;
grid.innerHTML=fams.map(f=>{const href=C.baseUrl+'?page=suivi-conventions-famille&annee='+encodeURIComponent(active)+'&famille='+encodeURIComponent(f.code);return '<a class="card" data-card="'+f.code+'" href="'+href+'"><div class="head"><div class="title">'+esc(f.libelle)+'</div><div class="go">Voir les classes</div></div><div class="meta" id="meta-'+f.code+'">Décompte en attente</div><div id="periods-'+f.code+'" class="wait">Chargement…</div></a>';}).join('');
document.querySelectorAll('[data-card]').forEach(a=>a.addEventListener('click',()=>a.classList.add('busy')));
function render(code,f){document.getElementById('meta-'+code).textContent=(f.classes||0)+' classe(s) · '+(f.effectif||0)+' élève(s) · '+(f.apprentis||0)+' apprenti(s)';const box=document.getElementById('periods-'+code),ps=f.periodes||[];box.className='';box.innerHTML=ps.length?ps.map(p=>{const c=cls(p);return '<div class="period"><div class="row"><div class="label">'+esc(p.libelle)+'</div><div class="count '+c+'">'+p.conventions+' / '+p.total+'</div></div><div class="bar"><div class="fill '+c+'" style="width:'+Math.min(100,p.pourcentage||0)+'%"></div></div></div>';}).join(''):'Aucune période.';}
function key(code){return 'PFMP_V51_OV_'+active+'_'+code}
function loadOne(i){if(i>=fams.length)return;const f=fams[i],k=key(f.code);try{const raw=sessionStorage.getItem(k);if(raw){const o=JSON.parse(raw);if(Date.now()-o.t<TTL)render(f.code,o.v);}}catch(e){}google.script.run.withSuccessHandler(r=>{render(f.code,r||{});try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),v:r||{}}));}catch(e){}loadOne(i+1);}).withFailureHandler(()=>loadOne(i+1)).EUC_APP172_resumeFamille({annee:active,famille:f.code});}loadOne(0);})();
</script>
<style id="EUC_DEV190E_SNAPSHOT_TILE_STYLE">
.euc190e-snapshot-tile{
  border:1px solid #cfe5de;
  background:#fff;
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  margin-top:12px;
}
.euc190e-snapshot-tile:hover{
  border-color:#0b8f72;
}
.euc190e-snapshot-tile strong{
  display:block;
  color:#0c5f4e;
  font-size:16px;
  margin-bottom:5px;
}
.euc190e-snapshot-tile span{
  color:#667085;
  font-size:12px;
}
</style>

<script id="EUC_DEV190E_SNAPSHOT_TILE">
(function(){

  function addTile(){

    if(document.querySelector('.euc190e-snapshot-tile')){
      return;
    }

    var tile = document.createElement('div');
    tile.className = 'euc190e-snapshot-tile';

    tile.innerHTML =
      '<strong>Maintenance Snapshot PFMP</strong>' +
      '<span>Diagnostic, synchronisation ciblée et index rapides BAC PRO / BTS / CAP.</span>';

    tile.onclick = function(){
      var u = new URL(location.href);
      u.search = '';
      u.searchParams.set('page','snapshot-pfmp-admin');
      location.href = u.toString();
    };

    var host =
      document.querySelector('.dashboard-grid') ||
      document.querySelector('.cards-grid') ||
      document.querySelector('.card-grid') ||
      document.querySelector('.tiles') ||
      document.querySelector('.modules') ||
      document.querySelector('.grid') ||
      document.querySelector('.cards') ||
      document.querySelector('main') ||
      document.body;

    host.appendChild(tile);
  }

  if(document.readyState === 'loading'){
    document.addEventListener(
      'DOMContentLoaded',
      addTile
    );
  }else{
    addTile();
  }

})();
</script>

</body></html>
