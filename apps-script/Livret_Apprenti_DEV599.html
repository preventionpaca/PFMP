<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon livret d’apprentissage</title>
<style>
:root{--vert:#0b6b4f;--texte:#16302a;--gris:#5b6b66;--bord:#cfe3da}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 Arial,sans-serif;color:var(--texte);background:#f7fbf9}
header{background:linear-gradient(135deg,#eef9f5,#d8f0e6);color:#0b4f40;border-bottom:1px solid #bfe2da;padding:14px 16px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.92;font-size:14px}
main{max-width:820px;margin:auto;padding:10px 16px 60px}
section{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 14px;margin:12px 0}
h2{font-size:17px;margin:0 0 8px;color:var(--vert)}h3{font-size:15px;margin:14px 0 6px}
.note{color:var(--gris);font-size:14px}
label{display:block}
input[type=date],input[type=email],input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
textarea{min-height:64px}
.choix{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.choix label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bord);border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff;font-size:14px}
.choix input{margin:0}.choix label:has(input:checked){background:#e7f5ef;border-color:var(--vert);font-weight:700}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border-top:1px solid #e3eee9;padding:8px 0}
button{font:inherit;border:1px solid var(--vert);background:#fff;color:var(--vert);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.plein{background:var(--vert);color:#fff}button:disabled{opacity:.55;cursor:default}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:t .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes t{to{transform:rotate(360deg)}}
.fiches{display:grid;gap:8px}
.carte{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--bord);border-radius:10px;padding:8px 10px;background:#fff;cursor:pointer;text-align:left;width:100%;color:inherit;font-weight:400}
.carte.on{outline:3px solid var(--vert)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.BROUILLON{background:#f1f5f9;color:#475569}.A_VALIDER{background:#fef9c3;color:#854d0e}.VALIDE{background:#dcfce7;color:#166534}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.photos figure{margin:0;position:relative}.photos img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--bord)}
.photos button{position:absolute;top:4px;right:4px;padding:2px 7px;font-size:13px}
.barre{position:sticky;bottom:0;background:rgba(247,251,249,.96);border-top:1px solid var(--bord);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.erreur{color:#991b1b;font-weight:700}.ok{color:#166534;font-weight:700}
#qr{display:inline-block;background:#fff;padding:10px;border:1px solid var(--bord);border-radius:10px}
.lu p{white-space:pre-wrap;margin:2px 0 8px}
ul.obj{margin:2px 0 6px 18px;padding:0;color:#1b396a}.dates.lien input.lu_url{flex:2;min-width:180px}
</style>
</head>
<body>
<header><h1>Mon livret d’apprentissage</h1><p id="sousTitre">Chargement…</p></header>
<main>
  <div id="etat" class="note" role="status">Chargement…</div>
  <div id="contenu" hidden>
    <section><h2>Mes fiches</h2><div class="fiches" id="fiches"></div><p><button type="button" id="nouvelle" class="plein">+ Nouvelle fiche</button></p></section>
    <section id="editeur" hidden></section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id);},L=<?= jeton ?>,D=null,F=null;
var NIV={NON_ABORDE:'Pas encore',OBSERVE:'J’ai observé',AVEC_AIDE:'Avec aide',AUTONOME:'Seul(e)'},ST={BROUILLON:'Brouillon',A_VALIDER:'En attente de validation',VALIDE:'Validée'};
function msgErr(e){return String(e&&e.message||e||'Erreur inconnue').replace(/^(?:Exception|Error):\s*/,'');}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dfr(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';}
function occupe(b,txt){b.disabled=true;b.dataset.lib=b.dataset.lib||b.textContent;b.innerHTML='<span class="spin"></span>'+esc(txt);}
function libre(b){b.disabled=false;b.textContent=b.dataset.lib||b.textContent;}
function appel(fn,arg,ok,ko,delai){var fini=false,minu=setTimeout(function(){if(fini)return;fini=true;ko(new Error('Le serveur ne répond pas. Vérifiez la connexion puis réessayez.'));},delai||60000);
  google.script.run.withSuccessHandler(function(r){if(fini)return;fini=true;clearTimeout(minu);ok(r);}).withFailureHandler(function(e){if(fini)return;fini=true;clearTimeout(minu);ko(e);})[fn](arg);}
var CLE='dev599:'+L;
function brouillon(){if(!F||F.statut==='VALIDE')return;try{localStorage.setItem(CLE,JSON.stringify({id:F.id||0,q:lire()}));}catch(e){}}
function oublier(){try{localStorage.removeItem(CLE);}catch(e){}}

function liste(){
  $('fiches').innerHTML=D.fiches.length?D.fiches.map(function(f){return '<button type="button" class="carte'+(F&&F.id===f.id?' on':'')+'" data-id="'+f.id+'"><span><b>'+(f.periode?esc(f.periode)+' · ':'')+(f.lieu==='LYCEE'?'🏫 Au lycée':'🔧 En entreprise')+'</b><br><span class="note">du '+dfr(f.du)+' au '+dfr(f.au)+'</span></span><span class="chip '+f.statut+'">'+ST[f.statut]+'</span></button>';}).join(''):'<p class="note">Aucune fiche pour l’instant. Créez la première pour votre séquence en cours.</p>';
  Array.prototype.forEach.call($('fiches').querySelectorAll('.carte'),function(b){b.onclick=function(){ouvrir(D.fiches.filter(function(x){return x.id===Number(b.dataset.id);})[0]);};});
}
function ouvrir(f){F=f;liste();var z=$('editeur');z.hidden=false;
  if(f.statut==='VALIDE'){lecture(f);z.scrollIntoView({behavior:'smooth'});return;}
  var m=D.modele,c=f.contenu||{},bloc='';
  if(D.livret){ouvrirPeriode(f);return;}
  z.innerHTML='<h2>'+(f.id?'Fiche du '+dfr(f.du):'Nouvelle fiche')+'</h2>'+
    '<div class="choix" id="lieu"><label><input type="radio" name="lieu" value="LYCEE"> 🏫 Au lycée</label><label><input type="radio" name="lieu" value="ENTREPRISE"> 🔧 En entreprise</label></div>'+
    '<div class="dates"><label>Du <input type="date" id="du" value="'+esc(f.du||'')+'"></label><label>Au <input type="date" id="au" value="'+esc(f.au||'')+'"></label></div>'+
    (m.activites.length?'<p class="note">Pour chaque activité travaillée pendant la séquence, dites ce que vous avez fait. Laissez vide ce qui n’a pas été fait.</p>':'<p class="note">Les activités de votre diplôme ne sont pas encore listées : décrivez ce que vous avez fait ci-dessous.</p>')+
    m.activites.map(function(a){var h='',x=(c.activites||{})[a.id]||{};if(a.bloc&&a.bloc!==bloc){bloc=a.bloc;h='<h3>'+esc(a.bloc)+'</h3>';}
      return h+'<div class="act"><b>'+esc(a.libelle)+'</b><div class="choix">'+Object.keys(NIV).map(function(k){return '<label><input type="radio" data-dec="1" name="n_'+a.id+'" value="'+k+'"'+(x.niveau===k?' checked data-was="1"':'')+'> '+NIV[k]+'</label>';}).join('')+'</div><textarea id="t_'+a.id+'" placeholder="Ce que j’ai fait (véhicule, pièce, outil, difficulté…)">'+esc(x.texte||'')+'</textarea></div>';}).join('')+
    '<h3>Autres activités et remarques</h3><textarea id="autres">'+esc(c.autres||'')+'</textarea>'+
    '<h3>Ce que j’en retiens</h3><textarea id="ressenti">'+esc(c.ressenti||'')+'</textarea>'+
    '<h3>Photos</h3><div class="photos" id="photos"></div>'+(f.id?'<label class="note">Ajouter une photo (4 au plus) <input type="file" id="photo" accept="image/*"></label>':'<p class="note">Enregistrez la fiche pour pouvoir ajouter des photos.</p>')+
    '<div id="validation"></div>'+
    '<div class="barre"><button type="button" class="plein" id="enregistrer">Enregistrer</button>'+(f.id?'<button type="button" id="demander">Demander la validation</button>':'')+'<span id="msg" role="status"></span></div>';
  Array.prototype.forEach.call(document.querySelectorAll('input[name="lieu"]'),function(i){i.checked=i.value===(f.lieu||'');});
  Array.prototype.forEach.call(z.querySelectorAll('input[data-dec]'),function(i){i.addEventListener('click',function(){if(i.dataset.was==='1'){i.checked=false;i.dataset.was='';}else{Array.prototype.forEach.call(z.querySelectorAll('input[name="'+i.name+'"]'),function(o){o.dataset.was='';});i.dataset.was='1';}brouillon();});});
  z.oninput=brouillon;
  photos(f);validation(f);
  $('enregistrer').onclick=enregistrer;if($('demander'))$('demander').onclick=demander;
  if($('photo'))$('photo').onchange=ajouterPhoto;
  z.scrollIntoView({behavior:'smooth'});
}
/* Livret par période (S1, S2… au lycée ; P1, P2… en entreprise) : dates et objectifs viennent du planning. */
function periodeDe(lab){return (D.livret.periodes||[]).filter(function(p){return p.label===lab;})[0]||null;}
function objectifsDe(f,p,bloc){return (p&&p.objectifs[bloc]||[]);}
function lienLigne(x){return '<div class="dates lien"><input type="url" class="lu_url" placeholder="https://…" value="'+esc(x.url||'')+'"><input class="lu_titre" placeholder="Titre (facultatif)" value="'+esc(x.titre||'')+'"><button type="button" class="retirerLien" aria-label="Retirer le lien">✕</button></div>';}
function ouvrirPeriode(f){var z=$('editeur'),c=f.contenu||{},P=D.livret.periodes||[];
  var deja={};D.fiches.forEach(function(x){if(x.periode&&x.id!==f.id)deja[x.periode]=1;});
  z.innerHTML='<h2>'+(f.id?'Fiche '+esc(f.periode||'du '+dfr(f.du)):'Nouvelle fiche')+'</h2>'+
    (f.id&&f.periode?'':'<label>Période <select id="periode"><option value="">— choisir —</option>'+P.map(function(x){return '<option value="'+esc(x.label)+'"'+(x.label===f.periode?' selected':'')+'>'+esc(x.label)+' · '+(x.lieu==='LYCEE'?'au lycée':'en entreprise')+' du '+dfr(x.du)+' au '+dfr(x.au)+(deja[x.label]?' (fiche déjà créée)':'')+'</option>';}).join('')+'</select></label>')+
    '<div id="corps"></div>';
  var corps=function(){var p=periodeDe(f.periode||($('periode')?$('periode').value:''));
    if(!p){$('corps').innerHTML='<p class="note">Choisissez la période : ses dates et ses objectifs s’affichent.</p>';return;}
    var aut=objectifsDe(f,p,'AUTRES');
    $('corps').innerHTML='<p class="note">'+(p.lieu==='LYCEE'?'🏫 Au lycée':'🔧 En entreprise')+' du <b>'+dfr(p.du)+'</b> au <b>'+dfr(p.au)+'</b> — '+esc(D.livret.diplome||'')+'</p>'+
      D.livret.blocs.map(function(b,i){var o=objectifsDe(f,p,b.code);return '<div class="act"><h3>'+esc(b.intitule)+'</h3>'+(o.length?'<p class="note"><b>Objectifs de la période :</b></p><ul class="obj">'+o.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+
        '<textarea id="b_'+i+'" placeholder="Ce que j’ai fait dans ce bloc (tâches, pièces, outils, difficultés, résultats…)">'+esc((c.blocs||{})[b.code]||'')+'</textarea></div>';}).join('')+
      '<div class="act"><h3>Autres activités</h3><p class="note">Activités hors référentiel mais formatrices : visite, site ou émission conseillés, formation à un logiciel, sujet transversal…</p>'+(aut.length?'<ul class="obj">'+aut.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'<textarea id="autres">'+esc(c.autres||'')+'</textarea></div>'+
      '<h3>Ce que j’en retiens</h3><textarea id="ressenti">'+esc(c.ressenti||'')+'</textarea>'+
      '<h3>Liens</h3><p class="note">Pages web en lien avec la période (site d’un fabricant, vidéo, document en ligne…).</p><div id="liens">'+(c.liens||[]).map(lienLigne).join('')+'</div><button type="button" id="ajouterLien">+ Ajouter un lien</button>'+
      '<h3>Photos</h3><div class="photos" id="photos"></div>'+(f.id?'<label class="note">Ajouter une photo (4 au plus) <input type="file" id="photo" accept="image/*"></label>':'<p class="note">Enregistrez la fiche pour pouvoir ajouter des photos.</p>')+
      '<div id="validation"></div>'+
      '<div class="barre"><button type="button" class="plein" id="enregistrer">Enregistrer le brouillon</button>'+(f.id?'<button type="button" id="demander">Demander la validation</button>':'')+'<span id="msg" role="status"></span></div>';
    var lierRetrait=function(){Array.prototype.forEach.call(z.querySelectorAll('.retirerLien'),function(b){b.onclick=function(){b.parentNode.remove();brouillon();};});};lierRetrait();
    $('ajouterLien').onclick=function(){$('liens').insertAdjacentHTML('beforeend',lienLigne({}));lierRetrait();};
    photos(f);validation(f);$('enregistrer').onclick=enregistrer;if($('demander'))$('demander').onclick=demander;if($('photo'))$('photo').onchange=ajouterPhoto;};
  if($('periode'))$('periode').onchange=function(){corps();brouillon();};
  corps();z.oninput=brouillon;z.scrollIntoView({behavior:'smooth'});}
function lirePeriode(){var lab=F&&F.id&&F.periode?F.periode:($('periode')?$('periode').value:''),c={activites:{},blocs:{},liens:[]};
  D.livret.blocs.forEach(function(b,i){var t=$('b_'+i);if(t&&t.value.trim())c.blocs[b.code]=t.value;});
  c.autres=$('autres')?$('autres').value:'';c.ressenti=$('ressenti')?$('ressenti').value:'';
  Array.prototype.forEach.call(document.querySelectorAll('#liens .lien'),function(d){var u=d.querySelector('.lu_url').value.trim();if(u)c.liens.push({url:u,titre:d.querySelector('.lu_titre').value.trim()});});
  var p=periodeDe(lab);return {l:L,ficheId:F&&F.id||0,periode:lab,lieu:p?p.lieu:'',du:p?p.du:'',au:p?p.au:'',contenu:c};}
function lire(){if(D.livret)return lirePeriode();var m=D.modele,c={activites:{}},l=document.querySelector('input[name="lieu"]:checked');
  m.activites.forEach(function(a){var n=document.querySelector('input[name="n_'+a.id+'"]:checked'),t=$('t_'+a.id).value;if(n||t.trim())c.activites[a.id]={niveau:n?n.value:'',texte:t};});
  c.autres=$('autres').value;c.ressenti=$('ressenti').value;
  return {l:L,ficheId:F&&F.id||0,lieu:l?l.value:'',du:$('du').value,au:$('au').value,contenu:c};}
function maj(f){var i=-1;D.fiches.forEach(function(x,k){if(x.id===f.id)i=k;});if(i>=0)D.fiches[i]=f;else D.fiches.unshift(f);F=f;}
function enregistrer(){var b=$('enregistrer'),q=lire();$('msg').textContent='';occupe(b,'Enregistrement…');
  appel('EUC_DEV599_enregistrer',q,function(r){oublier();maj(r.fiche);ouvrir(r.fiche);$('msg').innerHTML='<span class="ok">Enregistré.</span>';},function(e){libre(b);$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';});}
function demander(){var b=$('demander'),q=lire();$('msg').textContent='';occupe(b,'Envoi…');
  /* La fiche est d'abord enregistrée telle qu'affichée. */
  appel('EUC_DEV599_enregistrer',q,function(r){oublier();maj(r.fiche);
    appel('EUC_DEV599_demanderValidation',{l:L,ficheId:r.fiche.id},function(s){maj(s.fiche);ouvrir(s.fiche);
      $('msg').innerHTML='<span class="ok">'+(s.envoyeA?'Demande envoyée à '+esc(s.envoyeA)+'.':'Faites scanner le QR code par votre tuteur.')+'</span>';},
      function(e){libre(b);$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';});},
    function(e){libre(b);$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';});}
function validation(f){var z=$('validation');if(!z)return;
  if(f.statut!=='A_VALIDER'||f.lieu!=='ENTREPRISE'){z.innerHTML=f.statut==='A_VALIDER'?'<p class="note">Envoyée à votre professeur référent'+(f.lienEnvoyeA?' ('+esc(f.lienEnvoyeA)+')':'')+' : en attente de sa validation. Vous pouvez encore corriger la fiche.</p>':'';return;}
  z.innerHTML='<h3>Validation par votre tuteur</h3><p class="note">Montrez ce QR code à votre tuteur : il le scanne avec son téléphone, relit votre fiche et signe.</p><div id="qr"></div>'+
    '<p class="note">Ou envoyez-lui le lien par courriel :</p><div class="dates"><input type="email" id="mailTuteur" value="'+esc(f.lienEnvoyeA||D.tuteur.email||'')+'" placeholder="courriel du tuteur"><button type="button" id="envoyerTuteur">Envoyer au tuteur</button></div>';
  try{new QRCode($('qr'),{text:f.lienValidation,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}catch(e){$('qr').innerHTML='<a href="'+esc(f.lienValidation)+'">Lien de validation</a>';}
  $('envoyerTuteur').onclick=function(){var b=this;occupe(b,'Envoi…');appel('EUC_DEV599_demanderValidation',{l:L,ficheId:f.id,email:$('mailTuteur').value},function(s){libre(b);maj(s.fiche);F=s.fiche;$('msg').innerHTML='<span class="ok">Lien envoyé à '+esc(s.envoyeA)+'.</span>';},function(e){libre(b);$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';});};
}
function photos(f){var z=$('photos');if(!z)return;z.innerHTML=(f.photos||[]).map(function(p){return '<figure data-id="'+esc(p.id)+'"><img alt="'+esc(p.nom)+'">'+(f.statut!=='VALIDE'?'<button type="button" class="retirer" aria-label="Retirer la photo">✕</button>':'')+'</figure>';}).join('');
  Array.prototype.forEach.call(z.querySelectorAll('figure'),function(fig){var id=fig.dataset.id;appel('EUC_DEV599_photo',{l:L,ficheId:f.id,photoId:id},function(src){fig.querySelector('img').src=src;},function(){});
    var b=fig.querySelector('.retirer');if(b)b.onclick=function(){occupe(b,'');appel('EUC_DEV599_retirerPhoto',{l:L,ficheId:f.id,photoId:id},function(r){maj(r.fiche);photos(r.fiche);},function(e){libre(b);$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';});};});}
/* Photo réduite (1280 px, JPEG) avant l'envoi. */
function ajouterPhoto(){var inp=$('photo'),fic=inp.files&&inp.files[0];if(!fic)return;inp.disabled=true;$('msg').innerHTML='<span class="spin"></span>Envoi de la photo…';
  var img=new Image(),url=URL.createObjectURL(fic);
  img.onload=function(){var k=Math.min(1,1280/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    appel('EUC_DEV599_ajouterPhoto',{l:L,ficheId:F.id,nom:fic.name,data:cv.toDataURL('image/jpeg',0.75)},function(r){inp.disabled=false;inp.value='';maj(r.fiche);photos(r.fiche);$('msg').innerHTML='<span class="ok">Photo ajoutée.</span>';},
      function(e){inp.disabled=false;inp.value='';$('msg').innerHTML='<span class="erreur">'+esc(msgErr(e))+'</span>';},120000);};
  img.onerror=function(){inp.disabled=false;$('msg').innerHTML='<span class="erreur">Image illisible.</span>';};img.src=url;}
function lecture(f){var m=D.modele,c=f.contenu||{},z=$('editeur'),bloc='',p=D.livret&&f.periode?periodeDe(f.periode):null;
  z.innerHTML='<h2>'+(f.periode?esc(f.periode)+' · ':'')+(f.lieu==='LYCEE'?'🏫 Au lycée':'🔧 En entreprise')+' — du '+dfr(f.du)+' au '+dfr(f.au)+'</h2><div class="lu">'+
    (D.livret?D.livret.blocs.filter(function(b){return (c.blocs||{})[b.code]||(p&&(p.objectifs[b.code]||[]).length);}).map(function(b){var o=p?objectifsDe(f,p,b.code):[];return '<h3>'+esc(b.intitule)+'</h3>'+(o.length?'<ul class="obj">'+o.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'<p>'+esc((c.blocs||{})[b.code]||'—')+'</p>';}).join(''):'')+
    ((c.liens||[]).length?'<h3>Liens</h3>'+c.liens.map(function(x){return '<p><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.titre||x.url)+'</a></p>';}).join(''):'')+
    m.activites.filter(function(a){return (c.activites||{})[a.id];}).map(function(a){var h='',x=c.activites[a.id];if(a.bloc&&a.bloc!==bloc){bloc=a.bloc;h='<h3>'+esc(a.bloc)+'</h3>';}return h+'<b>'+esc(a.libelle)+'</b>'+(x.niveau?' <span class="chip VALIDE">'+NIV[x.niveau]+'</span>':'')+'<p>'+esc(x.texte)+'</p>';}).join('')+
    (c.autres?'<h3>Autres activités et remarques</h3><p>'+esc(c.autres)+'</p>':'')+(c.ressenti?'<h3>Ce que j’en retiens</h3><p>'+esc(c.ressenti)+'</p>':'')+'</div><div class="photos" id="photos"></div>'+
    '<p class="ok">Validée par '+esc(f.valideur)+(f.valideurFonction?' ('+esc(f.valideurFonction)+')':'')+' le '+dfr(f.valideLe.slice(0,10))+'.</p>'+(f.commentaire?'<p><b>Commentaire :</b> '+esc(f.commentaire)+'</p>':'')+
    (f.diffuseLe?'<p class="note">Compte rendu envoyé le '+dfr(f.diffuseLe.slice(0,10))+'.</p>':'');
  photos(f);}
