<!doctype html><html lang="fr"><head><base target="_self"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#07856f;--d:#173b34;--b:#bfe1d8;--bg:#f5fbf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial,sans-serif;color:#1f2a3d}.hero{background:linear-gradient(120deg,#066b5c,var(--g));color:#fff;padding:28px max(24px,calc((100% - 1130px)/2))}.hero h1{margin:0 0 6px;font-size:30px}.wrap{max-width:1130px;margin:0 auto;padding:20px}.crumb{font-size:13px;font-weight:700;color:var(--g);margin-bottom:18px}.crumb a{color:inherit;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;box-shadow:0 2px 7px #0c5b4b10}.card h2{margin:0 0 8px;color:#075e50;font-size:20px}.period{display:block;border-top:1px solid #e7efec;padding:10px 4px;color:inherit;text-decoration:none;position:relative}.period:hover,.period:focus{background:#effaf6;outline:2px solid transparent}.line{display:flex;justify-content:space-between;gap:10px}.count{font-weight:800;color:var(--g)}.bad{color:#c33120}.meta{font-size:12px;color:#617085;margin-top:3px}.tip{display:none;position:absolute;z-index:5;left:2px;right:2px;top:calc(100% - 3px);background:#fff;border:1px solid var(--b);border-radius:10px;padding:10px;box-shadow:0 10px 25px #173b3430;font-size:12px}.period:hover .tip,.period:focus .tip{display:block}.tip b{color:#075e50}.tip ul{margin:5px 0 8px;padding-left:18px;max-height:150px;overflow:auto}.empty{font-style:italic;color:#7b8797}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.print{border:1px solid var(--b);background:#fff;color:var(--g);padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}.level-box{margin:14px 0;border:1px solid var(--b);border-radius:14px;background:#fff;overflow:visible}.level-box>summary{cursor:pointer;list-style:none;padding:13px 16px;color:#075e50;font-size:20px;font-weight:800}.level-box>summary::-webkit-details-marker{display:none}.level-box>summary:after{content:'\25BC';float:right;font-size:14px}.level-box:not([open])>summary:after{content:'\25B6'}.level-body{padding:0 14px 14px}.period.is-loading{pointer-events:none;background:#effaf6}.period.is-loading .count{font-size:0}.period.is-loading .count:after,.nav-loading:after{content:'';display:inline-block;width:15px;height:15px;border:2px solid #acd9ce;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}.nav-loading{pointer-events:none;opacity:.75}.nav-loading:after{margin-left:7px}@keyframes spin{to{transform:rotate(360deg)}}@media print{.print{display:none}.hero{background:#fff;color:#111;padding:12px 0}.wrap{padding:0}.card{break-inside:avoid;box-shadow:none}.level-box{border:0}.level-body{padding:0}}@media(max-width:600px){.hero h1{font-size:24px}.wrap{padding:12px}}
</style></head><body><header class="hero"><h1 id="title"></h1><div>Synthèse par classe et période</div></header><main class="wrap"><div class="toolbar"><nav class="crumb" id="crumb"></nav><button class="print" onclick="window.print()">Exporter PDF</button></div><div id="root"></div></main>
<script>
const P=<?!= paramsJson ?>,D=<?!= dataJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('title').textContent=P.famille==='BACPRO'?'BAC PRO':P.famille;
const crumbs=[];if(!P.publicMode)crumbs.push('<a class="top-nav" target="_top" href="'+esc(BASE+'?page=admin-pfmp')+'">Accueil PFMP</a>');crumbs.push('<a class="top-nav" target="_top" href="'+esc(BASE+'?page='+(P.publicMode?'suivi-conventions-public':'suivi-conventions'))+'">Suivi des conventions</a>');crumbs.push(esc(P.famille==='BACPRO'?'BAC PRO':P.famille));document.getElementById('crumb').innerHTML=crumbs.join(' <span>›</span> ');
function list(title,arr){arr=arr||[];return '<div><b>'+esc(title)+' ('+arr.length+')</b>'+(arr.length?'<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="empty">Aucun</div>')+'</div>'}
function period(c,p){const q=p.quick||{},pd=!!q.isPdif,total=Number(q.total||0),covered=pd?Number((q.lycee||[]).length+(q.entreprise||[]).length):Number(q.couverts||0),missing=pd?Number((q.indefini||[]).length):Number((q.sans||[]).length),route=P.publicMode?'suivi-pfmp-classe-public':'suivi-pfmp-classe',href=BASE+'?page='+route+'&annee='+encodeURIComponent(P.annee)+'&famille='+encodeURIComponent(P.famille)+'&familleLibelle='+encodeURIComponent(P.famille==='BACPRO'?'BAC PRO':P.famille)+'&classe='+encodeURIComponent(c.classeId||c.id)+'&periode='+encodeURIComponent(p.id||p.periodeId)+'&origine=suivi-conventions',tip=pd?list('Au lycée',q.lycee)+list('En entreprise',q.entreprise)+list('À définir',q.indefini):list('Avec convention',q.avec)+list('Apprentis',q.apprentis)+list('Sans convention',q.sans)+list('Situation administrative',q.situations);return '<a class="period" href="'+esc(href)+'"><div class="line"><strong>'+esc(p.libelle||p.nom||'Période')+'</strong><span class="count '+(missing?'bad':'')+'">'+covered+' / '+total+'</span></div><div class="meta">'+esc(p.debutFr||p.debut||'')+(p.finFr||p.fin?' → '+esc(p.finFr||p.fin):'')+'</div><div class="meta">'+(pd?esc((q.lycee||[]).length+' lycée · '+(q.entreprise||[]).length+' entreprise · '+missing+' à définir'):esc((q.avec||[]).length+' conventions + '+(q.apprentis||[]).length+' apprentis · '+missing+' sans convention'))+'</div><div class="tip">'+tip+'</div></a>'}
function level(c){const explicit=String(c.niveau||c.niveauLibelle||c.section||'').trim();if(explicit&&explicit!=='Classes')return explicit;const n=String(c.classe||c.nom||'').toUpperCase().replace(/\s+/g,'');if(P.famille==='BTS')return /^2/.test(n)?'Deuxième année BTS':'Première année BTS';if(P.famille==='CAP')return /^(T|2)/.test(n)?'Terminale CAP':'Première CAP';return /^T/.test(n)?'Terminale':(/^1/.test(n)?'Première':'Seconde')}
const order=P.famille==='BTS'?['Première année BTS','Deuxième année BTS']:P.famille==='CAP'?['Première CAP','Terminale CAP']:['Terminale','Première','Seconde'];
const groups={};(D.classes||[]).forEach(c=>(groups[level(c)]=groups[level(c)]||[]).push(c));const root=document.getElementById('root');Object.keys(groups).sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b,'fr')}).forEach(g=>{const sec=document.createElement('details');sec.className='level-box';sec.open=true;sec.innerHTML='<summary>'+esc(g)+'</summary><div class="level-body"><div class="grid">'+groups[g].sort((a,b)=>String(a.classe||a.nom).localeCompare(String(b.classe||b.nom),'fr')).map(c=>'<article class="card"><h2>'+esc(c.classe||c.nom)+'</h2>'+(c.periodes||[]).map(p=>period(c,p)).join('')+'</article>').join('')+'</div></div>';root.appendChild(sec)});
document.addEventListener('click',ev=>{const a=ev.target.closest&&ev.target.closest('a.period,a.top-nav');if(!a)return;a.classList.add(a.classList.contains('period')?'is-loading':'nav-loading');a.setAttribute('aria-busy','true')},true);
document.querySelector('.print').addEventListener('click',function(){const b=this;b.classList.add('nav-loading');setTimeout(()=>b.classList.remove('nav-loading'),500)});
</script></body></html>
