<style>:root{font-family:Arial,sans-serif;color:#073b35;background:#eef7f4}main{max-width:1100px;margin:auto;padding:2rem}.eyebrow{color:#07866e;font-weight:700}aside{padding:1rem;background:#fff0b3;border-radius:.6rem}form{display:grid;gap:1rem;margin:1rem 0;background:#fff;padding:1rem}label{display:grid;gap:.35rem;font-weight:700}input,select,button{font:inherit;padding:.7rem}button{background:#07866e;color:#fff;border:0;border-radius:.4rem;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.table{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:.6rem;border-bottom:1px solid #ccd;vertical-align:top}.confirm{display:flex;margin:1rem 0}.actions{display:flex;gap:.7rem;flex-wrap:wrap}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}dl div{background:#fff;padding:.6rem}dl .count-alert{background:#fff0f0;border:1px solid #d88}dd{font-size:1.4rem;font-weight:700;margin:0}.row-alert td{background:#fff8f8}.busy-overlay{position:fixed;inset:0;background:rgba(238,247,244,.84);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem}.busy-overlay[hidden]{display:none}.busy-card{background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.18);border-radius:.8rem;padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1rem;max-width:520px}.spinner{width:34px;height:34px;border:4px solid #cfe4df;border-top-color:#07866e;border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}.busy-detail{margin-top:.3rem;color:#476b66;font-size:.95rem}.is-busy{overflow:hidden}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;margin-top:2rem}@media(max-width:650px){main{padding:1rem}.busy-card{width:100%}}</style>
