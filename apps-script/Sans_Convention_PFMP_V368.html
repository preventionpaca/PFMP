<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#087f70;--bg:#f4f8f7;--line:#cfe5de;--mut:#667085;--ink:#17352f;--soft:#eef8f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1d2939}
.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:26px 0}
.wrap{max-width:1450px;margin:auto;padding:0 22px}.hero h1{margin:0 0 6px;font-size:29px}.hero .sub{opacity:.9}
main.wrap{padding-top:20px;padding-bottom:35px}.crumb{margin-bottom:16px}.crumb a{color:var(--g);font-weight:700;text-decoration:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.filters{display:grid;grid-template-columns:160px 210px 1fr auto auto;gap:10px;align-items:end}
label{font-size:12px;font-weight:800;color:var(--mut)}select{width:100%;padding:9px;border:1px solid #b9cfc9;border-radius:8px;background:#fff}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid #9fcfc3}
.status{margin-top:12px;color:var(--mut)}.level-title{font-size:18px;font-weight:900;color:var(--ink);margin:0 0 10px}
.class-block{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}.class-head{display:flex;justify-content:space-between;background:var(--soft);padding:11px 13px;font-weight:900;color:var(--ink)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-top:1px solid #edf2f0;text-align:left}th{font-size:12px;color:var(--mut);background:#fbfdfc}
.student{font-weight:800}.badge{background:#dff5ee;color:#086856;padding:3px 8px;border-radius:999px;font-size:12px}
.empty{text-align:center;padding:28px;color:var(--mut)}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}button:disabled{opacity:.65;cursor:wait}</style></head><body>
<header class="hero"><div class="wrap"><h1>Élèves sans convention</h1><div class="sub">Liste administrative par niveau, classe et période — apprentis considérés comme couverts PFMP.</div></div></header>
<main class="wrap">
<div class="crumb"><a id="back">← Accueil PFMP</a></div>
<section class="card"><div class="filters">
<div><label>Année scolaire</label><select id="year"></select></div>
<div><label>Niveau</label><select id="niveau"><option value="">Tous les niveaux</option></select></div>
<div><label>Période</label><select id="periode"><option value="">Toutes les périodes</option></select></div>
<button id="load" class="primary">Afficher</button><button id="pdf" class="secondary" disabled>Exporter PDF</button>
</div><div id="status" class="status"></div></section>
<section id="results" class="card"><div class="empty">Choisissez un niveau et une période, puis cliquez sur Afficher.</div></section>
</main><script>
const B=<?!= bootJson ?>;let CAT={levels:[]},LAST=null;
back.href=B.baseUrl+'?page=admin-pfmp';
year.innerHTML=(B.years||[]).map(x=>'<option '+(x===B.current?'selected':'')+'>'+x+'</option>').join('');
function busy(btn,on,label){if(on){btn.dataset.old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'+label}else{btn.disabled=false;btn.innerHTML=btn.dataset.old||btn.innerHTML}}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function loadCatalog(){google.script.run.withSuccessHandler(function(d){CAT=d||{levels:[]};niveau.innerHTML='<option value="">Tous les niveaux</option>'+CAT.levels.map(x=>'<option value="'+x.code+'">'+esc(x.label)+'</option>').join('');fillPeriods()}).EUC_DEV371_catalog(year.value)}
function fillPeriods(){let l=CAT.levels.find(x=>x.code===niveau.value),ps=(l&&l.periods)||[];periode.innerHTML='<option value="">Toutes les périodes</option>'+ps.map(p=>'<option value="'+p.kind+'">'+esc(p.label)+'</option>').join('')}
niveau.onchange=fillPeriods;year.onchange=loadCatalog;
function render(d){let by={};(d.lignes||[]).forEach(x=>(by[x.classe]||(by[x.classe]=[])).push(x));let ks=Object.keys(by).sort((a,b)=>a.localeCompare(b,'fr'));if(!ks.length){results.innerHTML='<div class="empty">Aucun élève sans convention pour ce filtre.</div>';return}results.innerHTML=ks.map(k=>'<section class="class-block"><div class="class-head"><span>'+esc(k)+'</span><span class="badge">'+by[k].length+' sans convention</span></div><table><thead><tr><th>Élève</th><th>Période</th><th>Professeur principal</th></tr></thead><tbody>'+by[k].map(x=>'<tr><td class="student">'+esc(x.eleve)+'</td><td>'+esc(x.periode)+'</td><td>'+esc(x.professeurPrincipal||'—')+'</td></tr>').join('')+'</tbody></table></section>').join('')}
load.onclick=function(){busy(load,true,'Chargement…');status.textContent='Calcul en cours…';let q={annee:year.value,niveau:niveau.value,periodeKind:periode.value};google.script.run.withSuccessHandler(function(d){busy(load,false);LAST=q;status.textContent=d.total+' élève(s) sans convention.';pdf.disabled=!d.total;render(d)}).withFailureHandler(function(e){busy(load,false);status.textContent='Erreur : '+(e&&e.message||e)}).EUC_DEV371_sansConvention(q)}
pdf.onclick=function(){if(!LAST)return;busy(pdf,true,'Génération PDF…');google.script.run.withSuccessHandler(function(r){busy(pdf,false);let a=document.createElement('a');a.href='data:'+r.mime+';base64,'+r.base64;a.download=r.name;a.click()}).withFailureHandler(function(e){busy(pdf,false);alert(e&&e.message||e)}).EUC_DEV371_pdfSans(LAST)}
loadCatalog();
</script></body></html>
