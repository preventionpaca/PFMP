<!doctype html>
<html lang="fr">
<head>
<base target="_self">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#0b8f72;--bg:#f7fbf9;--line:#cfe5de}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172033}
.wrap{max-width:1450px;margin:auto;padding:22px}
.crumb{display:flex;gap:7px;align-items:center;font-size:13px;margin-bottom:14px}
.crumb a{color:#0b745f;text-decoration:none;font-weight:800;cursor:pointer}
.crumb a.busy{opacity:.6}
.crumb a.busy::after{content:" · chargement…";font-size:11px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);margin-top:16px}
th,td{padding:9px;border-bottom:1px solid #edf2ef;text-align:left}
th{background:#f5faf8}
.app{background:#fff7bf}
.pdif{background:#efe6ff}
.mix{background:#ffe6b3}
.badge{font-size:10px;font-weight:900;padding:3px 6px;border-radius:999px;background:#dff4ed}
</style>
<script>

</script>
</head>
<body>
<main class="wrap">
<div id="crumb" class="crumb"></div>
<h2 id="title"></h2>
<table>
<thead>
<tr>
<th>Élève</th>
<th>Statut</th>
<th>Entreprise</th>
<th>Contact entreprise</th>
<th>Tuteur</th>
<th>Professeur principal</th>
<th>Suivi téléphonique</th>
<th>Professeur visiteur</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</main>
<script>
const C=<?!= config ?>;
const D=<?!= detailJson ?>;
const F=<?!= famille ?>;

(function(){
  const famLabel=F==='BACPRO'?'BAC PRO':F;

  function navigate(state,el){
    if(el)el.classList.add('busy');
    try{
      window.top.postMessage({
        type:'EUC_ATRIUM_NAV',
        state:state
      },'*');
    }catch(e){}
  }

  crumb.innerHTML=
    '<a id="crumbAccueil">Accueil</a> › '+
    '<a id="crumbSuivi">Suivi des conventions</a> › '+
    '<a id="crumbFamille">'+famLabel+'</a> › '+
    '<strong>'+D.classe.nom+'</strong> › '+
    '<strong>'+
      (D.periode&&D.periode.libelle||'Période')+
    '</strong>';

  crumbAccueil.onclick=function(ev){
    ev.preventDefault();
    navigate({
      page:'suivi-conventions-public',
      annee:D.annee
    },this);
  };

  crumbSuivi.onclick=function(ev){
    ev.preventDefault();
    navigate({
      page:'suivi-conventions-public',
      annee:D.annee
    },this);
  };

  crumbFamille.onclick=function(ev){
    ev.preventDefault();
    navigate({
      page:'suivi-conventions-public-famille',
      annee:D.annee,
      famille:F
    },this);
  };

  title.textContent=
    D.classe.nom+
    ' — '+
    (D.periode&&D.periode.libelle||'');

  tb.innerHTML=(D.lignes||[]).map(function(x){
    return '<tr class="'+
      (x.apprenti
        ? 'app'
        : x.parcoursDifferencie
        ? 'pdif'
        : x.statutMixte
        ? 'mix'
        : '')+
      '">'+

      '<td><b>'+
        x.nom+' '+x.prenom+
        '</b>'+
        (x.apprenti
          ? '<br><span class="badge">APPRENTI</span>'
          : x.parcoursDifferencie
          ? '<br><span class="badge">P.DIF.</span>'
          : x.statutMixte
          ? '<br><span class="badge">À VÉRIFIER</span>'
          : '')+
      '</td>'+

      '<td>'+(x.statut||'')+'</td>'+
      '<td>'+(x.entreprise||'—')+'</td>'+
      '<td>'+(x.contactEntreprise||'—')+'</td>'+
      '<td>'+(x.tuteurEntreprise||'—')+'</td>'+
      '<td>'+(x.professeurPrincipal||'—')+'</td>'+
      '<td>'+(x.professeurTelephone||'—')+'</td>'+
      '<td>'+(x.professeurVisiteur||'—')+'</td>'+
      '</tr>';
  }).join('');
})();
</script>
</body>
</html>
