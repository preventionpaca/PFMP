<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial,sans-serif;background:#f5fbf8;color:#16342e;margin:0}.wrap{max-width:1500px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:20px}.filters{display:grid;grid-template-columns:250px 420px;gap:12px}.filters select{width:100%;padding:9px;margin-top:5px;border:1px solid #b9ded5;border-radius:8px;background:#fff}.dash{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid #c8e6df;border-radius:14px;margin:18px 0}.kpi{padding:13px;border-right:1px solid #e1efeb}.kpi b{display:block;font-size:18px;color:#08705d}.kpi span{font-size:11px}.card{background:#fff;border:1px solid #c8e6df;border-radius:14px;padding:16px;margin:14px 0}.cols{display:grid;grid-template-columns:170px 190px 1fr 1fr 1fr;gap:16px}.badge{display:inline-block;background:#eaf2ff;color:#2058a6;border-radius:999px;padding:5px 9px;font-weight:800}.spin{width:14px;height:14px;border:2px solid #a9d8cd;border-top-color:#08705d;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style></head><body><main class="wrap"><div class="top"><div><h1>Apprentis — consultation</h1><div>Lecture seule</div></div><div class="filters"><label>Année<select id="year"></select></label><label>Classe<select id="classe"></select></label></div></div><div class="dash"><div class="kpi"><b id="a">0</b><span>Apprentis classe entière</span></div><div class="kpi"><b id="m">0</b><span>Apprentis en mixité</span></div><div class="kpi"><b id="t">0</b><span>Total apprentis</span></div><div class="kpi"><b id="d">0</b><span>Dossiers remis</span></div><div class="kpi"><b id="c">0</b><span>Transmis CFA</span></div><div class="kpi"><b id="v">0</b><span>Contrats valides</span></div><div class="kpi"><b id="r">0</b><span>Ruptures</span></div></div><div id="status">Choisissez une classe.</div><div id="rows"></div></main>
<script>
const B=<?!= bootJson ?>;(function(){function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function classes(x){classe.innerHTML='<option value="">— Choisir une classe —</option>'+(x||[]).map(q=>'<option value="'+q.id+'">'+esc(q.nom)+'</option>').join('')}year.innerHTML=(B.years||[]).map(y=>'<option'+(y===B.currentYear?' selected':'')+'>'+esc(y)+'</option>').join('');classes(B.classes||[]);function dash(){google.script.run.withSuccessHandler(function(z){var l=(z&&z.lists)||{};a.textContent=(l.classeEntiere||[]).length;m.textContent=(l.mixite||[]).length;t.textContent=(l.total||[]).length;d.textContent=(l.dossier||[]).length;c.textContent=(l.cfa||[]).length;v.textContent=(l.contrats||[]).length;r.textContent=(l.ruptures||[]).length}).EUC_DEV348_dashboard(year.value)}function render(x){rows.innerHTML=(x||[]).map(function(q){return '<section class="card"><div class="cols"><div><b>'+esc(q.nom)+' '+esc(q.prenom)+'</b><br><span class="badge">Apprenti</span></div><div>'+esc(q.debut||'—')+' → '+esc(q.fin||'—')+'</div><div><b>'+esc(q.nomCommercial||q.nomEntreprise||q.entreprise||'—')+'</b><br>'+esc([q.adresse,q.cp,q.ville].filter(Boolean).join(' · '))+'</div><div>'+esc([q.telEntreprise,q.mailEntreprise].filter(Boolean).join(' · ')||'—')+'</div><div>'+esc([q.tuteur,q.telTuteur,q.mailTuteur].filter(Boolean).join(' · ')||'—')+'</div></div></section>'}).join('');status.textContent=(x||[]).length?((x||[]).length+' apprenti(s) affiché(s).'):'Aucun apprenti dans cette classe.'}dash();year.onchange=function(){rows.innerHTML='';status.innerHTML='<span class="spin"></span> Mise à jour…';google.script.run.withSuccessHandler(function(z){classes(z.classes||[]);status.textContent='Choisissez une classe.';dash()}).EUC_DEV348_getClasses(year.value)};classe.onchange=function(){if(!classe.value){rows.innerHTML='';status.textContent='Choisissez une classe.';return}status.innerHTML='<span class="spin"></span> Chargement des apprentis…';var n=
