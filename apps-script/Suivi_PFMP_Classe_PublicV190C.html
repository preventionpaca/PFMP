<!doctype html>
<html lang="fr">
<head>
<base target="_self">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --g:#0b8f72;
  --bg:#f7fbf9;
  --line:#cfe5de;
  --mut:#667085;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:#172033;
}
.wrap{
  max-width:1450px;
  margin:auto;
  padding:24px;
}
h2{margin:0 0 8px}
.status{
  margin:0 0 12px;
  color:var(--mut);
  font-size:13px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border:1px solid var(--line);
}
th,td{
  padding:9px;
  border-bottom:1px solid #edf2ef;
  text-align:left;
}
th{background:#f5faf8}
.skeleton td{padding:11px 9px}
.shimmer{
  display:block;
  height:12px;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    #edf3f1 20%,
    #f7faf9 40%,
    #edf3f1 60%
  );
  background-size:200% 100%;
  animation:shimmer 1.2s infinite linear;
}
@keyframes shimmer{
  from{background-position:100% 0}
  to{background-position:-100% 0}
}
</style>
<style id="EUC_DEV190S_APPRENTIS_STYLE">
/* Tant qu'aucune classe n'est choisie, aucun tableau/chargement métier visible. */
body:not(.euc190s-class-selected) table{
  display:none !important;
}
body:not(.euc190s-class-selected) [class*="loading"],
body:not(.euc190s-class-selected) [id*="loading"],
body:not(.euc190s-class-selected) [class*="chargement"],
body:not(.euc190s-class-selected) [id*="chargement"]{
  display:none !important;
}

.euc190s-siret-cell{min-width:205px}
.euc190s-siret-line{display:flex;gap:5px;align-items:center}
.euc190s-siret-line input{width:105px}
.euc190s-siret-line button{
  padding:7px 8px;
  border:0;
  border-radius:7px;
  background:#0b8f72;
  color:white;
  font-weight:800;
  cursor:pointer;
}
.euc190s-siret-msg{font-size:10px;color:#667085;margin-top:3px}
.euc190s-company input,
.euc190s-contact input{
  width:100%;
  margin:2px 0;
}
.euc190s-company{min-width:170px}
.euc190s-contact{min-width:155px}
</style>

<style id="EUC_DEV190S_PDIF_STYLE">
body:not(.euc190s-class-selected) table{
  display:none !important;
}
body:not(.euc190s-class-selected) [class*="loading"],
body:not(.euc190s-class-selected) [id*="loading"],
body:not(.euc190s-class-selected) [class*="chargement"],
body:not(.euc190s-class-selected) [id*="chargement"]{
  display:none !important;
}
</style>

</head>

<body>

<main class="wrap">

<h2 id="title">
Chargement de la classe…
</h2>

<p id="status" class="status">
Lecture du snapshot incrémental…
</p>

<table>
<thead>
<tr>
<th>Élève</th>
<th>Statut</th>
<th>Entreprise</th>
<th>Contact entreprise</th>
<th>Tuteur</th>
<th>Professeur principal</th>
<th>Suivi téléphonique</th>
<th>Professeur visiteur</th>
</tr>
</thead>

<tbody id="tb"></tbody>
</table>

</main>

<script>

const P = (() => {
  const q=new URLSearchParams(location.search);

  return {
    annee:q.get('annee')||'',
    famille:q.get('famille')||'',
    classe:Number(q.get('classe'))||0,
    periode:Number(q.get('periode'))||0
  };
})();

(function(){

  function skeleton(){
    tb.innerHTML=
      Array.from({length:12})
        .map(function(){
          return '<tr class="skeleton">'+
            '<td><span class="shimmer" style="width:72%"></span></td>'+
            '<td><span class="shimmer" style="width:65%"></span></td>'+
            '<td><span class="shimmer" style="width:70%"></span></td>'+
            '<td><span class="shimmer" style="width:70%"></span></td>'+
            '<td><span class="shimmer" style="width:55%"></span></td>'+
            '<td><span class="shimmer" style="width:75%"></span></td>'+
            '<td><span class="shimmer" style="width:55%"></span></td>'+
            '<td><span class="shimmer" style="width:55%"></span></td>'+
          '</tr>';
        })
        .join('');
  }

  function render(r){

    if(!r || r.ready===false || !r.detail){

      title.textContent='Snapshot non préparé';

      status.textContent=
        'Cette classe / période doit être amorcée depuis Maintenance Snapshot PFMP.';

      tb.innerHTML=
        '<tr><td colspan="8" style="padding:24px;text-align:center;color:#667085">'+
        'Données non encore préparées dans le snapshot.'+
        '</td></tr>';

      return;
    }

    const d=r.detail||{};

    title.textContent=
      ((d.classe&&d.classe.nom)||'Classe')+
      ' — '+
      ((d.periode&&d.periode.libelle)||'');

    status.textContent=
      'Source : '+
      (r.source||'snapshot-hot-read')+
      ' · '+
      Number(r.totalMs||0)+
      ' ms';

    tb.innerHTML=
      (d.lignes||[])
        .map(function(x){
          return '<tr>'+
            '<td><b>'+
              (x.nom||'')+' '+(x.prenom||'')+
            '</b></td>'+
            '<td>'+(x.statut||'')+'</td>'+
            '<td>'+(x.entreprise||'—')+'</td>'+
            '<td>'+(x.contactEntreprise||'—')+'</td>'+
            '<td>'+(x.tuteurEntreprise||'—')+'</td>'+
            '<td>'+(x.professeurPrincipal||'—')+'</td>'+
            '<td>'+(x.professeurTelephone||'—')+'</td>'+
            '<td>'+(x.professeurVisiteur||'—')+'</td>'+
          '</tr>';
        })
        .join('');
  }

  skeleton();

  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(e){
      status.textContent=
        'Erreur snapshot : '+
        String(e&&e.message||e);
    })
    .EUC_DEV190G_getPublicDetail(P);

})();

</script>

</body>
</html>
