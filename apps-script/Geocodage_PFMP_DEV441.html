<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172b27}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:28px}.wrap{max-width:1400px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.filters{display:grid;grid-template-columns:150px 140px 1fr 1fr auto;gap:10px;align-items:end}label{font-size:12px;font-weight:800;color:var(--mut)}select,input{width:100%;padding:9px;border:1px solid #aacfc5;border-radius:8px;background:#fff}button,a.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid #8bcabb}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e8efed;text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut)}.coords{display:grid;grid-template-columns:1fr 1fr auto;gap:5px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf7f4;font-size:11px;font-weight:800}@media(max-width:850px){.filters{grid-template-columns:1fr}.coords{grid-template-columns:1fr}}
</style></head><body><header class="hero"><div class="wrap"><h1>Géocodage des entreprises PFMP</h1><p>France : Géoplateforme / Base Adresse Nationale. Monaco et étranger : validation manuelle uniquement.</p></div></header><main class="wrap"><p><a id="back" class="btn secondary">← Administration PFMP</a> <a id="map" class="btn secondary">Voir la cartographie</a></p><section class="card"><div class="filters"><label>Année<select id="year"></select></label><label>Famille<select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></label><label>Classe<select id="classe"><option value="">Toutes</option></select></label><label>Période<select id="periode"><option value="">Toutes</option></select></label><button id="analyze" class="secondary">Analyser</button></div><p><button id="geocode" class="primary">Géocoder les adresses françaises non traitées</button></p><div id="status" class="muted"></div></section><section class="card"><div id="results" class="muted">L’analyse ne modifie aucune donnée. Lancez-la pour préparer la liste.</div></section></main><script>
const B=<?!= bootJson ?>,$=id=>document.getElementById(id);let CAT={classes:[]},ROWS=[];$('back').href=B.baseUrl+'?page=admin-pfmp';$('map').href=B.baseUrl+'?page=cartographie-pfmp';$('year').innerHTML=(B.years||[]).map(x=>'<option '+(x===B.current?'selected':'')+'>'+x+'</option>').join('');function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function q(){return{annee:$('year').value,famille:$('family').value,classeId:Number($('classe').value)||0,periodeId:Number($('periode').value)||0}}function fail(e){$('status').textContent='Erreur : '+(e&&e.message||e)}
function cat(){google.script.run.withSuccessHandler(d=>{CAT=d||{classes:[]};classes()}).withFailureHandler(fail).EUC_DEV441_catalogAdmin($('year').value)}function classes(){let a=CAT.classes||[];if($('family').value)a=a.filter(x=>x.famille===$('family').value);$('classe').innerHTML='<option value="">Toutes</option>'+a.map(x=>'<option value="'+x.classeId+'">'+esc(x.classe)+'</option>').join('');periods()}function periods(){let c=(CAT.classes||[]).find(x=>String(x.classeId)===String($('classe').value));$('periode').innerHTML='<option value="">Toutes</option>'+((c&&c.periodes)||[]).map(x=>'<option value="'+x.id+'">'+esc(x.libelle)+'</option>').join('')}
function render(r){ROWS=r.candidats||r;let pending=ROWS.filter(x=>x.pays==='FRANCE'&&x.statut==='A_GEOCODER').length;$('status').textContent=ROWS.length+' adresse(s), dont '+pending+' adresse(s) française(s) à géocoder.';$('results').innerHTML=ROWS.length?'<table><thead><tr><th>Entreprise / adresse</th><th>Périmètre</th><th>Traitement</th><th>Coordonnées</th></tr></thead><tbody>'+ROWS.map(x=>'<tr><td><b>'+esc(x.entreprise)+'</b><br>'+esc(x.adresse)+'</td><td>'+esc(x.classe)+'<br>'+esc(x.periode)+'</td><td><span class="badge">'+esc(x.pays)+'</span><br>'+esc(x.statut)+(x.adresseNormalisee?'<br><small>'+esc(x.adresseNormalisee)+'</small>':'')+'</td><td><div class="coords"><input data-lat="'+x.key+'" placeholder="Latitude" value="'+(x.latitude==null?'':x.latitude)+'"><input data-lon="'+x.key+'" placeholder="Longitude" value="'+(x.longitude==null?'':x.longitude)+'"><button class="secondary save" data-key="'+x.key+'">Valider</button></div></td></tr>').join('')+'</tbody></table>':'Aucune adresse pour ces filtres.';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>{let key=b.dataset.key,lat=document.querySelector('[data-lat="'+key+'"]').value,lon=document.querySelector('[data-lon="'+key+'"]').value;b.disabled=true;google.script.run.withSuccessHandler(r=>{b.disabled=false;render(r.candidats)}).withFailureHandler(e=>{b.disabled=false;fail(e)}).EUC_DEV441_saveManualGeo({...q(),key:key,latitude:lat,longitude:lon})})}
function analyze(){ $('status').textContent='Analyse des snapshots…';google.script.run.withSuccessHandler(render).withFailureHandler(fail).EUC_DEV441_geoAdminData(q())}$('analyze').onclick=analyze;$('geocode').onclick=()=>{let keys=ROWS.filter(x=>x.pays==='FRANCE'&&x.statut==='A_GEOCODER').map(x=>x.key);if(!keys.length){$('status').textContent='Aucune adresse française non traitée.';return}$('geocode').disabled=true;$('status').textContent='Géocodage officiel en cours…';google.script.run.withSuccessHandler(r=>{$('geocode').disabled=false;render(r)}).withFailureHandler(e=>{$('geocode').disabled=false;fail(e)}).EUC_DEV441_geocodeFrance({...q(),keys:keys})};$('year').onchange=cat;$('family').onchange=classes;$('classe').onchange=periods;cat();
</script></body></html>
