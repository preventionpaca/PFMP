<script>(function(){
const $=s=>document.querySelector(s),form=$('#import-form'),status=$('#status'),preview=$('#preview'),simulate=$('#simulate'),diag=$('#auth-diagnostic'),mapping=$('#mapping'),mappingRows=$('#mapping-rows'),reanalyze=$('#reanalyze');
let payload=null,busy=false,lastResult=null;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function classOptions(classes,selected){return '<option value="">— choisir —</option>'+classes.map(c=>`<option value="${esc(String(c.id||c.nom))}" ${String(c.id||c.nom)===String(selected||'')?'selected':''}>${esc(c.nom)}${c.niveau?' — '+esc(c.niveau):''}${c.formation?' — '+esc(c.formation):''}</option>`).join('')}
function currentMappings(){const out={};mappingRows.querySelectorAll('select[data-pronote]').forEach(s=>{if(s.value)out[s.dataset.pronote]=s.value});return out}
function runAnalysis(extraMappings){if(busy)return;const texte=$('#paste').value;if(!texte.trim()){status.textContent='Collez d’abord le tableau Pronote.';return}busy=true;status.textContent='Analyse du copier-coller…';payload={annee:$('#annee').value,texte:texte,source:'COPIER_COLLER_PRONOTE',correspondances:extraMappings||{}};google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_IMPORT_previsualiserTexte(payload)}
$('#version').textContent=IMPORT_CONFIG.version||'';$('#back-admin').href=(IMPORT_CONFIG.baseUrl||'')+'?page=admin-pfmp';
google.script.run.withSuccessHandler(r=>{diag.textContent='Diagnostic accès : environnement='+r.environnement+' ; email='+r.emailDetecte+' ; liste admin='+(r.listeAdminConfiguree?'oui':'non')+' ; email autorisé='+(r.emailDansListe?'oui':'non')+' ; contexte='+(r.autorise?'autorisé':'refusé')+' ; rôle='+(r.role||'—')+' ; origine='+(r.origine||'—');}).withFailureHandler(e=>{diag.textContent='Diagnostic accès indisponible : '+(e&&e.message||e)}).EUC_IMPORT_diagnosticAutorisation();
form.onsubmit=e=>{e.preventDefault();runAnalysis({})};
reanalyze.onclick=()=>runAnalysis(currentMappings());
function show(r){busy=false;lastResult=r;status.textContent=r.pretAValider?'Prévisualisation prête à contrôler.':'Prévisualisation bloquée : contrôlez les anomalies ou classes inconnues.';$('#counts').innerHTML=Object.entries(r.compteurs).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${Number(v)||0}</dd></div>`).join('');$('#changes').innerHTML=(r.modifications||[]).map(x=>`<tr><td>${x.ligne||''}</td><td>${esc(x.type)}</td><td>${esc(x.classeAvant||'')}</td><td>${esc(x.classeApres||'')}</td></tr>`).join('');preview.hidden=false;$('#confirm').checked=false;simulate.disabled=true;
const inconnues=r.classesInconnues||[];if(inconnues.length){const classes=r.classesCamin||[];mappingRows.innerHTML=inconnues.map(x=>`<tr><td>${esc(x.pronote)}</td><td>${Number(x.effectif)||0}</td><td><select data-pronote="${esc(x.pronote)}">${classOptions(classes,'')}</select></td></tr>`).join('');mapping.hidden=false;}else{mapping.hidden=true;mappingRows.innerHTML='';}}
function fail(e){busy=false;status.textContent='Erreur : '+(e&&e.message||e);simulate.disabled=true}
$('#confirm').onchange=()=>simulate.disabled=!$('#confirm').checked;
simulate.onclick=()=>{if(busy||!payload||!$('#confirm').checked)return;busy=true;simulate.disabled=true;google.script.run.withSuccessHandler(()=>{busy=false;status.textContent='Simulation terminée : aucune écriture réalisée.'}).withFailureHandler(fail).EUC_IMPORT_confirmerSimulationTexte({...payload,correspondances:currentMappings(),confirmation:'CONFIRMER_IMPORT'})};
})();</script>
