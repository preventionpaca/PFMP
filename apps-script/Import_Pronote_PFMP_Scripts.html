<script>(function(){
const $=s=>document.querySelector(s),form=$('#import-form'),status=$('#status'),preview=$('#preview'),simulate=$('#simulate'),importReal=$('#real-import'),diag=$('#auth-diagnostic'),mapping=$('#mapping'),mappingRows=$('#mapping-rows'),reanalyze=$('#reanalyze'),saveMappings=$('#save-mappings'),busyOverlay=$('#busy-overlay'),busyTitle=$('#busy-title'),busyDetail=$('#busy-detail');
let payload=null,busy=false,lastResult=null,postImportNotice=null;
const labels={lignes:'Lignes lues',lignesAffichees:'Élèves affichés',admissibles:'Élèves admissibles',nouveaux:'Nouveaux élèves',inchanges:'Déjà présents, inchangés',misesAJour:'Élèves à mettre à jour',changementsClasse:'Changements de classe',changementsCoordonnees:'Dates / données modifiées',nouveauxSortis:'Nouveaux déjà sortis',reactives:'Réactivations',absentsNouvelExport:'Absents du nouvel export',doublons:'Doublons dans le collage',homonymes:'Correspondances multiples',ambiguites:'Ambiguïtés à contrôler',rejets:'Lignes rejetées',horsPerimetre:'Hors périmètre',sansClasse:'Sans classe',sansNumeroNational:'Sans numéro national',classesCaminDisponibles:'Classes Grist disponibles',classesInconnues:'Classes inconnues',classesEcartees:'Classes écartées',elevesEcartes:'Élèves écartés'};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function setBusy(on,title,detail){busy=!!on;busyOverlay.hidden=!on;if(title)busyTitle.textContent=title;if(detail)busyDetail.textContent=detail;document.body.classList.toggle('is-busy',!!on)}
function classOptions(classes,selected){return '<option value="">— choisir —</option>'+classes.map(c=>`<option value="${esc(String(c.id||c.nom))}" ${String(c.id||c.nom)===String(selected||'')?'selected':''}>${esc(c.nom)}${c.niveau?' — '+esc(c.niveau):''}${c.formation?' — '+esc(c.formation):''}</option>`).join('')}
function currentChoices(){const correspondances={},classesExclues=[];mappingRows.querySelectorAll('tr[data-pronote]').forEach(tr=>{const p=tr.dataset.pronote,exclude=tr.querySelector('input[data-exclude]'),sel=tr.querySelector('select[data-pronote]');if(exclude&&exclude.checked)classesExclues.push(p);else if(sel&&sel.value)correspondances[p]=sel.value;});return {correspondances,classesExclues}}
function runAnalysis(extra){if(busy)return;const texte=$('#paste').value,sourcePronote=$('#source-pronote').value;if(!texte.trim()){status.textContent='Collez d’abord le tableau Pronote.';return}setBusy(true,'Analyse du fichier Pronote…','Lecture des élèves, comparaison avec Grist et contrôle des classes.');status.textContent='Analyse du copier-coller en cours…';payload={annee:$('#annee').value,texte:texte,source:'COPIER_COLLER_PRONOTE',sourcePronote:sourcePronote,correspondances:(extra&&extra.correspondances)||{},classesExclues:(extra&&extra.classesExclues)||[]};google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_IMPORT_previsualiserTexte(payload)}
$('#version').textContent=IMPORT_CONFIG.version||'';$('#back-admin').href=(IMPORT_CONFIG.baseUrl||'')+'?page=admin-pfmp';
google.script.run.withSuccessHandler(r=>{diag.textContent='Diagnostic accès : environnement='+r.environnement+' ; email='+r.emailDetecte+' ; liste admin='+(r.listeAdminConfiguree?'oui':'non')+' ; email autorisé='+(r.emailDansListe?'oui':'non')+' ; contexte='+(r.autorise?'autorisé':'refusé')+' ; rôle='+(r.role||'—')+' ; origine='+(r.origine||'—');}).withFailureHandler(e=>{diag.textContent='Diagnostic accès indisponible : '+(e&&e.message||e)}).EUC_IMPORT_diagnosticAutorisation();
form.onsubmit=e=>{e.preventDefault();postImportNotice=null;runAnalysis({correspondances:{},classesExclues:[]})};
reanalyze.onclick=()=>{postImportNotice=null;runAnalysis(currentChoices())};
saveMappings.onclick=()=>{if(busy)return;const c=currentChoices(),annee=$('#annee').value,sourcePronote=(lastResult&&lastResult.sourcePronote)||$('#source-pronote').value;if(!annee||!sourcePronote||sourcePronote==='AUTO'){status.textContent='La source LP/LGT doit être déterminée avant la mémorisation.';return}setBusy(true,'Mémorisation des correspondances…','Enregistrement des choix de classes dans Grist.');saveMappings.disabled=true;status.textContent='Enregistrement des choix de classes dans Grist…';google.script.run.withSuccessHandler(r=>{setBusy(false);saveMappings.disabled=false;status.textContent='Choix mémorisés dans Grist pour '+r.sourcePronote+' : '+r.crees+' créé(s), '+r.misAJour+' mis à jour.';runAnalysis(c)}).withFailureHandler(fail).EUC_CORRESPONDANCE_enregistrerChoix({annee:annee,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues});};
function actionLabel(t){return ({CREATION:'NOUVEAU',INCHANGE:'INCHANGÉ',ECARTE:'ÉCARTÉ',SANS_CLASSE:'SANS CLASSE',CLASSE_INCONNUE:'CLASSE INCONNUE',MISE_A_JOUR:'MISE À JOUR',CHANGEMENT_CLASSE:'CHANGEMENT CLASSE',SORTIE_EXPLICITE:'SORTIE',REACTIVATION:'RÉACTIVATION',AMBIGUITE:'AMBIGUÏTÉ'})[t]||t||''}
function show(r){
  setBusy(false);lastResult=r;if(r.sourcePronote&&(r.sourcePronote==='LP'||r.sourcePronote==='LGT'))$('#source-pronote').value=r.sourcePronote;
  const c=r.compteurs||{},src=r.sourcePronote?' Source : '+r.sourcePronote+'.':'',amb=Number(c.ambiguites)||0,nouveaux=Number(c.nouveaux)||0,maj=Number(c.misesAJour)||0,reactives=Number(c.reactives)||0,deja=Number(c.inchanges)||0,ecartes=Number(c.elevesEcartes)||0,admissibles=Number(c.admissibles)||0,inconnues=Number(c.classesInconnues)||0,rejets=Number(c.rejets)||0,sansClasse=Number(c.sansClasse)||0,actions=nouveaux+maj+reactives;
  status.className='analysis-status';
  if(postImportNotice&&amb===0&&inconnues===0&&rejets===0&&actions===0){
    const p=postImportNotice;status.classList.add('status-ok');status.textContent='IMPORT RÉUSSI — '+p.crees+' nouvel(aux), '+p.misAJour+' mis à jour. Contrôle après écriture : données présentes dans Grist, 0 modification restante. '+deja+' élève(s) sont maintenant reconnus comme inchangés. Un nouvel import identique est inutile et reste désactivé.'+src;postImportNotice=null;
  }else if(amb){status.classList.add('status-alert');status.textContent='IMPORT BLOQUÉ — '+amb+' ambiguïté(s) à contrôler. Consultez la colonne « Détail ». Aucun élève ne sera écrit.'+src;}
  else if(r.dejaImporte){status.classList.add('status-ok');status.textContent='DONNÉES DÉJÀ PRÉSENTES — cet export Pronote a déjà été traité pour cette source. 0 création, 0 mise à jour. Un nouvel import est inutile et les boutons restent désactivés. La liste complète reste affichée pour contrôle.'+src;}
  else if(inconnues>0){status.classList.add('status-alert');status.textContent='IMPORT BLOQUÉ — '+inconnues+' classe(s) Pronote ne sont ni rattachées à une classe Grist ni mises de côté. Complétez les choix puis cliquez sur « Ré-analyser avec ces choix ».'+src;}
  else if(rejets>0){status.classList.add('status-alert');status.textContent='IMPORT BLOQUÉ — '+rejets+' ligne(s) rejetée(s) doivent être contrôlées avant toute écriture.'+src;}
  else if(admissibles===0&&ecartes>0){status.classList.add('status-info');status.textContent='AUCUN ÉLÈVE À IMPORTER — toutes les classes retenues dans ce collage ont été mises de côté. '+ecartes+' élève(s) sont volontairement exclus de l’import. Si c’est bien voulu, il n’y a rien à écrire dans Grist.'+src;}
  else if(r.pretAValider&&actions===0&&deja>0){status.classList.add('status-ok');status.textContent='DONNÉES PRÉSENTES — 0 création, 0 mise à jour. '+deja+' élève(s) sont déjà présents et inchangés dans Grist. Import inutile ; les boutons sont désactivés. Les '+(r.lignesAnalysees||[]).length+' élèves analysés restent affichés ci-dessous pour contrôle.'+src;}
  else if(r.pretAValider&&actions===0){status.classList.add('status-info');status.textContent='AUCUNE ÉCRITURE À EFFECTUER — 0 création, 0 mise à jour. '+ecartes+' élève(s) sont écartés ; '+sansClasse+' sans classe. Toute la liste analysée reste visible ci-dessous.'+src;}
  else if(r.pretAValider){status.classList.add('status-ready');status.textContent='IMPORT À CONTRÔLER — '+nouveaux+' nouveau(x), '+maj+' mise(s) à jour, '+deja+' inchangé(s). Vérifiez la liste complète avant validation.'+src;}
  else{status.classList.add('status-alert');status.textContent='IMPORT BLOQUÉ — cause non résolue. Consultez les compteurs ci-dessous ; aucun élève ne sera écrit tant que le contrôle n’est pas valide.'+src;}
  $('#counts').innerHTML=Object.entries(c).map(([k,v])=>`<div class="${k==='ambiguites'&&Number(v)?'count-alert':''}"><dt>${esc(labels[k]||k)}</dt><dd>${Number(v)||0}</dd></div>`).join('');
  const lignes=r.lignesAnalysees||r.modifications||[];
  $('#changes').innerHTML=lignes.map(x=>`<tr class="${x.type==='AMBIGUITE'?'row-alert':x.type==='INCHANGE'?'row-unchanged':x.type==='ECARTE'?'row-excluded':''}"><td>${x.ligne||''}</td><td>${esc(x.nom||'')}</td><td>${esc(x.prenom||'')}</td><td>${esc(x.professeurPrincipal||'')}</td><td>${esc(actionLabel(x.type))}</td><td>${esc(x.motif||'')}</td><td>${esc(x.classeAvant||x.classePronote||'')}</td><td>${esc(x.classeApres||'')}</td></tr>`).join('');
  preview.hidden=false;$('#confirm').checked=false;simulate.disabled=true;importReal.disabled=true;$('#confirm').disabled=(actions===0)||!r.pretAValider||!!r.dejaImporte;
  const rows=r.classesPronote||[],classes=r.classesCamin||[];if(rows.length){mappingRows.innerHTML=rows.map(x=>`<tr data-pronote="${esc(x.pronote)}"><td>${esc(x.pronote)}</td><td>${Number(x.effectif)||0}</td><td><select data-pronote="${esc(x.pronote)}" ${x.exclue?'disabled':''}>${classOptions(classes,x.classeGristId||'')}</select></td><td><label><input type="checkbox" data-exclude ${x.exclue?'checked':''}> Écarter</label></td></tr>`).join('');mapping.hidden=false;mappingRows.querySelectorAll('input[data-exclude]').forEach(cb=>cb.onchange=()=>{const tr=cb.closest('tr'),sel=tr.querySelector('select[data-pronote]');sel.disabled=cb.checked;if(cb.checked)sel.value='';});}else{mapping.hidden=true;mappingRows.innerHTML='';}
}
function fail(e){setBusy(false);postImportNotice=null;status.className='analysis-status status-alert';status.textContent='Erreur : '+(e&&e.message||e);simulate.disabled=true;importReal.disabled=true;saveMappings.disabled=false}
$('#confirm').onchange=()=>{const c=lastResult&&lastResult.compteurs||{},actions=(Number(c.nouveaux)||0)+(Number(c.misesAJour)||0)+(Number(c.reactives)||0);const ok=$('#confirm').checked&&!$('#confirm').disabled&&lastResult&&lastResult.pretAValider&&!lastResult.dejaImporte&&actions>0;simulate.disabled=!ok;importReal.disabled=!ok;};
simulate.onclick=()=>{if(busy||!payload||!$('#confirm').checked)return;setBusy(true,'Simulation de l’import…','Recalcul complet et contrôle de sécurité. Aucune donnée élève ne sera écrite.');simulate.disabled=true;importReal.disabled=true;const c=currentChoices(),sourcePronote=(lastResult&&lastResult.sourcePronote)||payload.sourcePronote;google.script.run.withSuccessHandler(r=>{setBusy(false);status.className='analysis-status status-ok';status.textContent='Simulation terminée : '+((r.compteurs&&r.compteurs.admissibles)||0)+' élève(s) contrôlé(s). Aucune écriture réalisée.';$('#confirm').checked=false}).withFailureHandler(fail).EUC_IMPORT_confirmerSimulationTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'CONFIRMER_IMPORT'})};
importReal.onclick=()=>{if(busy||!payload||!$('#confirm').checked||!lastResult||!lastResult.pretAValider||lastResult.dejaImporte)return;const c=currentChoices(),sourcePronote=lastResult.sourcePronote;if(!confirm('Confirmer l’import RÉEL dans Grist pour la source '+sourcePronote+' ? Aucune suppression automatique ne sera effectuée.'))return;setBusy(true,'Import réel dans Grist…','Création / mise à jour des élèves puis relecture de contrôle. Ne fermez pas cette page.');simulate.disabled=true;importReal.disabled=true;status.className='analysis-status status-info';status.textContent='Import réel dans Grist en cours…';google.script.run.withSuccessHandler(r=>{setBusy(false);postImportNotice={crees:Number(r.crees)||0,misAJour:Number(r.misAJour)||0,total:Number(r.total)||0};status.className='analysis-status status-ok';status.textContent='IMPORT RÉUSSI — '+postImportNotice.crees+' nouvel(aux), '+postImportNotice.misAJour+' mis à jour, '+postImportNotice.total+' ligne(s) contrôlée(s). Vérification finale en cours…';$('#confirm').checked=false;runAnalysis(c)}).withFailureHandler(fail).EUC_IMPORT_importerReelTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'IMPORTER_REELLEMENT_DANS_GRIST'})};
})();</script>
