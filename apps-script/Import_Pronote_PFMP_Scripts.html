<script>(function(){
const $=s=>document.querySelector(s),form=$('#import-form'),status=$('#status'),preview=$('#preview'),simulate=$('#simulate'),importReal=$('#real-import'),diag=$('#auth-diagnostic'),mapping=$('#mapping'),mappingRows=$('#mapping-rows'),reanalyze=$('#reanalyze'),saveMappings=$('#save-mappings'),busyOverlay=$('#busy-overlay'),busyTitle=$('#busy-title'),busyDetail=$('#busy-detail');
let payload=null,busy=false,lastResult=null;
const labels={lignes:'Lignes lues',admissibles:'Élèves admissibles',nouveaux:'Nouveaux élèves',inchanges:'Déjà présents, inchangés',misesAJour:'Élèves à mettre à jour',changementsClasse:'Changements de classe',changementsCoordonnees:'Dates / données modifiées',nouveauxSortis:'Nouveaux déjà sortis',reactives:'Réactivations',absentsNouvelExport:'Absents du nouvel export',doublons:'Doublons dans le collage',homonymes:'Correspondances multiples',ambiguites:'Ambiguïtés à contrôler',rejets:'Lignes rejetées',horsPerimetre:'Hors périmètre',sansClasse:'Sans classe',sansNumeroNational:'Sans numéro national',classesCaminDisponibles:'Classes Grist disponibles',classesInconnues:'Classes inconnues',classesEcartees:'Classes écartées',elevesEcartes:'Élèves écartés'};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function setBusy(on,title,detail){busy=!!on;busyOverlay.hidden=!on;if(title)busyTitle.textContent=title;if(detail)busyDetail.textContent=detail;document.body.classList.toggle('is-busy',!!on)}
function classOptions(classes,selected){return '<option value="">— choisir —</option>'+classes.map(c=>`<option value="${esc(String(c.id||c.nom))}" ${String(c.id||c.nom)===String(selected||'')?'selected':''}>${esc(c.nom)}${c.niveau?' — '+esc(c.niveau):''}${c.formation?' — '+esc(c.formation):''}</option>`).join('')}
function currentChoices(){const correspondances={},classesExclues=[];mappingRows.querySelectorAll('tr[data-pronote]').forEach(tr=>{const p=tr.dataset.pronote,exclude=tr.querySelector('input[data-exclude]'),sel=tr.querySelector('select[data-pronote]');if(exclude&&exclude.checked)classesExclues.push(p);else if(sel&&sel.value)correspondances[p]=sel.value;});return {correspondances,classesExclues}}
function runAnalysis(extra){if(busy)return;const texte=$('#paste').value,sourcePronote=$('#source-pronote').value;if(!texte.trim()){status.textContent='Collez d’abord le tableau Pronote.';return}setBusy(true,'Analyse du fichier Pronote…','Lecture des élèves, comparaison avec Grist et contrôle des classes.');status.textContent='Analyse du copier-coller en cours…';payload={annee:$('#annee').value,texte:texte,source:'COPIER_COLLER_PRONOTE',sourcePronote:sourcePronote,correspondances:(extra&&extra.correspondances)||{},classesExclues:(extra&&extra.classesExclues)||[]};google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_IMPORT_previsualiserTexte(payload)}
$('#version').textContent=IMPORT_CONFIG.version||'';$('#back-admin').href=(IMPORT_CONFIG.baseUrl||'')+'?page=admin-pfmp';
google.script.run.withSuccessHandler(r=>{diag.textContent='Diagnostic accès : environnement='+r.environnement+' ; email='+r.emailDetecte+' ; liste admin='+(r.listeAdminConfiguree?'oui':'non')+' ; email autorisé='+(r.emailDansListe?'oui':'non')+' ; contexte='+(r.autorise?'autorisé':'refusé')+' ; rôle='+(r.role||'—')+' ; origine='+(r.origine||'—');}).withFailureHandler(e=>{diag.textContent='Diagnostic accès indisponible : '+(e&&e.message||e)}).EUC_IMPORT_diagnosticAutorisation();
form.onsubmit=e=>{e.preventDefault();runAnalysis({correspondances:{},classesExclues:[]})};
reanalyze.onclick=()=>runAnalysis(currentChoices());
saveMappings.onclick=()=>{if(busy)return;const c=currentChoices(),annee=$('#annee').value,sourcePronote=(lastResult&&lastResult.sourcePronote)||$('#source-pronote').value;if(!annee||!sourcePronote||sourcePronote==='AUTO'){status.textContent='La source LP/LGT doit être déterminée avant la mémorisation.';return}setBusy(true,'Mémorisation des correspondances…','Enregistrement des choix de classes dans Grist.');saveMappings.disabled=true;status.textContent='Enregistrement des choix de classes dans Grist…';google.script.run.withSuccessHandler(r=>{setBusy(false);saveMappings.disabled=false;status.textContent='Choix mémorisés dans Grist pour '+r.sourcePronote+' : '+r.crees+' créé(s), '+r.misAJour+' mis à jour.';runAnalysis(c)}).withFailureHandler(fail).EUC_CORRESPONDANCE_enregistrerChoix({annee:annee,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues});};
function show(r){setBusy(false);lastResult=r;if(r.sourcePronote&&(r.sourcePronote==='LP'||r.sourcePronote==='LGT'))$('#source-pronote').value=r.sourcePronote;let src=r.sourcePronote?' Source détectée : '+r.sourcePronote+'.':'';let amb=Number(r.compteurs&&r.compteurs.ambiguites)||0;status.textContent=(r.pretAValider?'Prévisualisation prête à contrôler.':amb?'Prévisualisation bloquée : '+amb+' ambiguïté(s). Consultez la colonne « Détail » avant toute écriture.':'Prévisualisation bloquée : contrôlez les anomalies, classes inconnues ou exclusions.')+src;$('#counts').innerHTML=Object.entries(r.compteurs||{}).map(([k,v])=>`<div class="${k==='ambiguites'&&Number(v)?'count-alert':''}"><dt>${esc(labels[k]||k)}</dt><dd>${Number(v)||0}</dd></div>`).join('');$('#changes').innerHTML=(r.modifications||[]).map(x=>`<tr class="${x.type==='AMBIGUITE'?'row-alert':''}"><td>${x.ligne||''}</td><td>${esc(x.nom||'')}</td><td>${esc(x.prenom||'')}</td><td>${esc(x.professeurPrincipal||'')}</td><td>${esc(x.type==='CREATION'?'NOUVEAU':x.type||'')}</td><td>${esc(x.motif|| (x.type==='AMBIGUITE'?'Plusieurs fiches Grist peuvent correspondre à cet élève.':'') )}</td><td>${esc(x.classeAvant||'')}</td><td>${esc(x.classeApres||'')}</td></tr>`).join('');preview.hidden=false;$('#confirm').checked=false;simulate.disabled=true;importReal.disabled=true;
const rows=r.classesPronote||[],classes=r.classesCamin||[];if(rows.length){mappingRows.innerHTML=rows.map(x=>`<tr data-pronote="${esc(x.pronote)}"><td>${esc(x.pronote)}</td><td>${Number(x.effectif)||0}</td><td><select data-pronote="${esc(x.pronote)}" ${x.exclue?'disabled':''}>${classOptions(classes,x.classeGristId||'')}</select></td><td><label><input type="checkbox" data-exclude ${x.exclue?'checked':''}> Écarter</label></td></tr>`).join('');mapping.hidden=false;mappingRows.querySelectorAll('input[data-exclude]').forEach(cb=>cb.onchange=()=>{const tr=cb.closest('tr'),sel=tr.querySelector('select[data-pronote]');sel.disabled=cb.checked;if(cb.checked)sel.value='';});}else{mapping.hidden=true;mappingRows.innerHTML='';}}
function fail(e){setBusy(false);status.textContent='Erreur : '+(e&&e.message||e);simulate.disabled=true;importReal.disabled=true;saveMappings.disabled=false}
$('#confirm').onchange=()=>{const ok=$('#confirm').checked&&lastResult&&lastResult.pretAValider;simulate.disabled=!ok;importReal.disabled=!ok;};
simulate.onclick=()=>{if(busy||!payload||!$('#confirm').checked)return;setBusy(true,'Simulation de l’import…','Recalcul complet et contrôle de sécurité. Aucune donnée élève ne sera écrite.');simulate.disabled=true;importReal.disabled=true;const c=currentChoices(),sourcePronote=(lastResult&&lastResult.sourcePronote)||payload.sourcePronote;google.script.run.withSuccessHandler(r=>{setBusy(false);status.textContent='Simulation terminée : '+((r.compteurs&&r.compteurs.admissibles)||0)+' élève(s) contrôlé(s). Aucune écriture réalisée.';$('#confirm').checked=false}).withFailureHandler(fail).EUC_IMPORT_confirmerSimulationTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'CONFIRMER_IMPORT'})};
importReal.onclick=()=>{if(busy||!payload||!$('#confirm').checked||!lastResult||!lastResult.pretAValider)return;const c=currentChoices(),sourcePronote=lastResult.sourcePronote;if(!confirm('Confirmer l’import RÉEL dans Grist pour la source '+sourcePronote+' ? Aucune suppression automatique ne sera effectuée.'))return;setBusy(true,'Import réel dans Grist…','Création / mise à jour des élèves puis relecture de contrôle. Ne fermez pas cette page.');simulate.disabled=true;importReal.disabled=true;status.textContent='Import réel dans Grist en cours…';google.script.run.withSuccessHandler(r=>{setBusy(false);status.textContent='Import Grist terminé : '+r.crees+' nouvel(aux), '+r.misAJour+' déjà présent(s) mis à jour, '+r.total+' ligne(s) relue(s) et contrôlée(s). Aucune suppression.';$('#confirm').checked=false;runAnalysis(c)}).withFailureHandler(fail).EUC_IMPORT_importerReelTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'IMPORTER_REELLEMENT_DANS_GRIST'})};
})();</script>
