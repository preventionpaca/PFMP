<script>(function(){
const $=s=>document.querySelector(s),form=$('#import-form'),status=$('#status'),preview=$('#preview'),simulate=$('#simulate'),importReal=$('#import-real'),diag=$('#auth-diagnostic'),mapping=$('#mapping'),mappingRows=$('#mapping-rows'),reanalyze=$('#reanalyze'),saveMappings=$('#save-mappings');
let payload=null,busy=false,lastResult=null;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function classOptions(classes,selected){return '<option value="">— choisir —</option>'+classes.map(c=>`<option value="${esc(String(c.id||c.nom))}" ${String(c.id||c.nom)===String(selected||'')?'selected':''}>${esc(c.nom)}${c.niveau?' — '+esc(c.niveau):''}${c.formation?' — '+esc(c.formation):''}</option>`).join('')}
function currentChoices(){const correspondances={},classesExclues=[];mappingRows.querySelectorAll('tr[data-pronote]').forEach(tr=>{const p=tr.dataset.pronote,exclude=tr.querySelector('input[data-exclude]'),sel=tr.querySelector('select[data-pronote]');if(exclude&&exclude.checked)classesExclues.push(p);else if(sel&&sel.value)correspondances[p]=sel.value;});return {correspondances,classesExclues}}
function runAnalysis(extra){if(busy)return;const texte=$('#paste').value,sourcePronote=$('#source-pronote').value;if(!texte.trim()){status.textContent='Collez d’abord le tableau Pronote.';return}busy=true;status.textContent='Analyse du copier-coller…';payload={annee:$('#annee').value,texte:texte,source:'COPIER_COLLER_PRONOTE',sourcePronote:sourcePronote,correspondances:(extra&&extra.correspondances)||{},classesExclues:(extra&&extra.classesExclues)||[]};google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_IMPORT_previsualiserTexte(payload)}
$('#version').textContent=IMPORT_CONFIG.version||'';$('#back-admin').href=(IMPORT_CONFIG.baseUrl||'')+'?page=admin-pfmp';
google.script.run.withSuccessHandler(r=>{diag.textContent='Diagnostic accès : environnement='+r.environnement+' ; email='+r.emailDetecte+' ; liste admin='+(r.listeAdminConfiguree?'oui':'non')+' ; email autorisé='+(r.emailDansListe?'oui':'non')+' ; contexte='+(r.autorise?'autorisé':'refusé')+' ; rôle='+(r.role||'—')+' ; origine='+(r.origine||'—');}).withFailureHandler(e=>{diag.textContent='Diagnostic accès indisponible : '+(e&&e.message||e)}).EUC_IMPORT_diagnosticAutorisation();
form.onsubmit=e=>{e.preventDefault();runAnalysis({correspondances:{},classesExclues:[]})};
reanalyze.onclick=()=>runAnalysis(currentChoices());
saveMappings.onclick=()=>{if(busy)return;const c=currentChoices(),annee=$('#annee').value,sourcePronote=(lastResult&&lastResult.sourcePronote)||$('#source-pronote').value;if(!annee||!sourcePronote||sourcePronote==='AUTO'){status.textContent='La source LP/LGT doit être déterminée avant la mémorisation.';return}busy=true;saveMappings.disabled=true;status.textContent='Enregistrement des choix de classes dans Grist…';google.script.run.withSuccessHandler(r=>{busy=false;saveMappings.disabled=false;status.textContent='Choix mémorisés dans Grist pour '+r.sourcePronote+' : '+r.crees+' créé(s), '+r.misAJour+' mis à jour.';runAnalysis(c)}).withFailureHandler(e=>{busy=false;saveMappings.disabled=false;fail(e)}).EUC_CORRESPONDANCE_enregistrerChoix({annee:annee,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues});};
function show(r){busy=false;lastResult=r;if(r.sourcePronote&&(r.sourcePronote==='LP'||r.sourcePronote==='LGT'))$('#source-pronote').value=r.sourcePronote;let src='';if(r.sourcePronote)src=' Source détectée : '+r.sourcePronote+'.';status.textContent=(r.pretAValider?'Prévisualisation prête à contrôler.':'Prévisualisation bloquée : contrôlez les anomalies, classes inconnues ou exclusions.')+src;$('#counts').innerHTML=Object.entries(r.compteurs).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${Number(v)||0}</dd></div>`).join('');$('#changes').innerHTML=(r.modifications||[]).map(x=>`<tr><td>${x.ligne||''}</td><td>${esc(x.nom||'')}</td><td>${esc(x.prenom||'')}</td><td>${esc(x.professeurPrincipal||'')}</td><td>${esc(x.type||'')}</td><td>${esc(x.classeAvant||'')}</td><td>${esc(x.classeApres||'')}</td></tr>`).join('');preview.hidden=false;$('#confirm').checked=false;simulate.disabled=true;importReal.disabled=true;
const rows=r.classesPronote||[],classes=r.classesCamin||[];if(rows.length){mappingRows.innerHTML=rows.map(x=>`<tr data-pronote="${esc(x.pronote)}"><td>${esc(x.pronote)}</td><td>${Number(x.effectif)||0}</td><td><select data-pronote="${esc(x.pronote)}" ${x.exclue?'disabled':''}>${classOptions(classes,x.classeGristId||'')}</select></td><td><label><input type="checkbox" data-exclude ${x.exclue?'checked':''}> Écarter</label></td></tr>`).join('');mapping.hidden=false;mappingRows.querySelectorAll('input[data-exclude]').forEach(cb=>cb.onchange=()=>{const tr=cb.closest('tr'),sel=tr.querySelector('select[data-pronote]');sel.disabled=cb.checked;if(cb.checked)sel.value='';});}else{mapping.hidden=true;mappingRows.innerHTML='';}}
function fail(e){busy=false;status.textContent='Erreur : '+(e&&e.message||e);simulate.disabled=true;importReal.disabled=true;saveMappings.disabled=false}
$('#confirm').onchange=()=>{const ok=$('#confirm').checked&&lastResult&&lastResult.pretAValider;simulate.disabled=!ok;importReal.disabled=!ok;};
simulate.onclick=()=>{if(busy||!payload||!$('#confirm').checked)return;busy=true;simulate.disabled=true;importReal.disabled=true;const c=currentChoices(),sourcePronote=(lastResult&&lastResult.sourcePronote)||payload.sourcePronote;google.script.run.withSuccessHandler(()=>{busy=false;status.textContent='Simulation terminée : aucune écriture élève réalisée.';$('#confirm').checked=false}).withFailureHandler(fail).EUC_IMPORT_confirmerSimulationTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'CONFIRMER_IMPORT'})};
importReal.onclick=()=>{if(busy||!payload||!$('#confirm').checked||!lastResult||!lastResult.pretAValider)return;const c=currentChoices(),sourcePronote=lastResult.sourcePronote;if(!confirm('Confirmer l’import RÉEL dans Grist pour la source '+sourcePronote+' ? Aucune suppression automatique ne sera effectuée.'))return;busy=true;simulate.disabled=true;importReal.disabled=true;status.textContent='Import réel dans Grist en cours…';google.script.run.withSuccessHandler(r=>{busy=false;status.textContent='Import Grist terminé : '+r.crees+' créé(s), '+r.misAJour+' mis à jour, '+r.total+' ligne(s) contrôlée(s). Aucune suppression.';$('#confirm').checked=false;runAnalysis(c)}).withFailureHandler(fail).EUC_IMPORT_importerReelTexte({...payload,sourcePronote:sourcePronote,correspondances:c.correspondances,classesExclues:c.classesExclues,confirmation:'IMPORTER_REELLEMENT_DANS_GRIST'})};
})();</script>
