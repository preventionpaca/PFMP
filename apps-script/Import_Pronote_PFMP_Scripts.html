<script>(function(){const $=s=>document.querySelector(s),form=$('#import-form'),status=$('#status'),preview=$('#preview'),simulate=$('#simulate');let payload=null,busy=false;function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function read(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;status.textContent='Analyse locale sécurisée…';try{payload={annee:$('#annee').value,nomFichier:$('#file').files[0].name,base64:await read($('#file').files[0])};google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_IMPORT_previsualiserBase64(payload)}catch(x){fail(x)}};function show(r){busy=false;status.textContent=r.pretAValider?'Prévisualisation prête à contrôler.':'Prévisualisation bloquée.';$('#counts').innerHTML=Object.entries(r.compteurs).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${Number(v)||0}</dd></div>`).join('');$('#changes').innerHTML=r.modifications.map(x=>`<tr><td>${x.ligne}</td><td>${esc(x.type)}</td><td>${esc(x.classeAvant)}</td><td>${esc(x.classeApres)}</td></tr>`).join('');preview.hidden=false;simulate.disabled=!r.pretAValider||!$('#confirm').checked}function fail(e){busy=false;status.textContent='Erreur : '+(e&&e.message||e);simulate.disabled=true}$('#confirm').onchange=()=>simulate.disabled=!$('#confirm').checked;simulate.onclick=()=>{if(busy||!payload||!$('#confirm').checked)return;busy=true;simulate.disabled=true;google.script.run.withSuccessHandler(r=>{busy=false;status.textContent='Simulation terminée : aucune écriture réalisée.'}).withFailureHandler(fail).EUC_IMPORT_confirmerSimulation({...payload,confirmation:'CONFIRMER_IMPORT'})}})();</script>
