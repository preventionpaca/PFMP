:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172b27}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:22px}.wrap{max-width:1450px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:150px 140px 1fr 1fr auto;gap:10px;align-items:end}label{font-size:12px;font-weight:800;color:var(--mut)}select{width:100%;padding:9px;border:1px solid #aacfc5;border-radius:8px;background:#fff}button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--g);color:#fff}#map{height:68vh;min-height:460px;border-radius:10px}.muted{color:var(--mut)}@media(max-width:850px){.filters{grid-template-columns:1fr}#map{height:60vh}}
</style></head><body><header class="hero"><div class="wrap"><h1>Cartographie des entreprises PFMP</h1><p>Les points affichés proviennent exclusivement des coordonnées validées et réutilisables.</p></div></header><main class="wrap"><section class="card"><div class="filters"><label>Année<select id="year"></select></label><label>Famille<select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></label><label>Classe<select id="classe"><option value="">Toutes</option></select></label><label>Période<select id="periode"><option value="">Toutes</option></select></label><button id="show">Afficher</button></div><p id="status" class="muted"></p></section><section class="card"><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const B=<?!= bootJson ?>,$=id=>document.getElementById(id),P=B.params||{};let CAT={classes:[]},markers=[];const map=L.map('map').setView([43.7102,7.2620],10),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);$('year').innerHTML='<option>'+String(P.annee||B.current||'')+'</option>';$('family').value=P.famille||'';function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function q(){return{annee:$('year').value,famille:$('family').value,classeId:Number($('classe').value)||0,periodeId:Number($('periode').value)||0}}
function cat(){google.script.run.withSuccessHandler(d=>{CAT=d||{classes:[]};classes();if(P.classe){$('classe').value=P.classe;periods()}if(P.periode)$('periode').value=P.periode;show()}).withFailureHandler(e=>$('status').textContent='Erreur : '+(e&&e.message||e)).EUC_DEV441_catalogPublic($('year').value)}function classes(){let a=CAT.classes||[];if($('family').value)a=a.filter(x=>x.famille===$('family').value);$('classe').innerHTML='<option value="">Toutes</option>'+a.map(x=>'<option value="'+x.classeId+'">'+esc(x.classe)+'</option>').join('');periods()}function periods(){let c=(CAT.classes||[]).find(x=>String(x.classeId)===String($('classe').value));$('periode').innerHTML='<option value="">Toutes</option>'+((c&&c.periodes)||[]).map(x=>'<option value="'+x.id+'">'+esc(x.libelle)+'</option>').join('')}
function show(){$('status').textContent='Chargement des points validés…';google.script.run.withSuccessHandler(r=>{layer.clearLayers();let bounds=[];(r.points||[]).forEach(x=>{let ll=[x.latitude,x.longitude];bounds.push(ll);L.marker(ll).addTo(layer).bindPopup('<b>'+esc(x.entreprise)+'</b><br>'+esc(x.adresse)+'<br>'+esc(x.classe)+' — '+esc(x.periode))});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:15});$('status').textContent=r.total+' entreprise(s) géolocalisée(s) pour ces filtres.'}).withFailureHandler(e=>$('status').textContent='Erreur : '+(e&&e.message||e)).EUC_DEV441_mapData(q())}$('show').onclick=show;$('family').onchange=classes;$('classe').onchange=periods;cat();
</script></body></html>
