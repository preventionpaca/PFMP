</head><body><main class="wrap"><div class="top"><div><h1>Parcours différencié</h1><div>Terminales uniquement — décision annuelle.</div></div><a id="back" class="back">← Accueil PFMP</a></div><section class="card"><div class="filters"><label>Année<select id="year"></select></label><label>Classe<select id="classe"></select></label></div><div id="rows">Chargement…</div></section></main>
<script>const C=<?!= config ?>;(function(){back.href=C.baseUrl+'?page=admin-pfmp';function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function load(){rows.textContent='Chargement…';google.script.run.withSuccessHandler(render).withFailureHandler(e=>rows.textContent='Erreur : '+(e&&e.message||e)).EUC_DEV174_pdifData({annee:year.value,classe:classe.value})}function render(d){year.innerHTML=(d.annees||[]).map(x=>'<option value="'+x.code+'"'+(x.code===d.annee?' selected':'')+'>'+esc(x.libelle||x.code)+'</option>').join('');classe.innerHTML=(d.classes||[]).map(x=>'<option value="'+x.id+'"'+(Number(x.id)===Number(d.classeId)?' selected':'')+'>'+esc(x.nom)+'</option>').join('');rows.innerHTML='<div class="row head"><div>Élève</div><div>P.dif.</div><div>Date décision</div><div>Remarque</div><div></div></div>'+(d.eleves||[]).map(x=>'<div class="row" data-id="'+x.id+'" data-record="'+x.recordId+'"><div><b>'+esc(x.nom+' '+x.prenom)+'</b></div><div><input class="pd" type="checkbox"'+(x.pdif?' checked':'')+'></div><div><input class="date" type="date" value="'+x.date+'"></div><div><input class="rem" value="'+esc(x.remarque)+'"></div><div><button class="save">OK</button></div></div>').join('');document.querySelectorAll('.save').forEach(b=>b.onclick=function(){const r=b.closest('.row');b.disabled=true;google.script.run.withSuccessHandler(load).withFailureHandler(e=>{b.disabled=false;alert(e&&e.message||e)}).EUC_DEV174_pdifSave({annee:year.value,eleve:Number(r.dataset.id),recordId:Number(r.dataset.record),pdif:r.querySelector('.pd').checked,date:r.querySelector('.date').value,remarque:r.querySelector('.rem').value})})}year.onchange=load;classe.onchange=load;load()})();</script>

<script id="EUC_DEV190E_SNAPSHOT_TILE">
(function(){

  function addTile(){

    if(document.querySelector('.euc190e-snapshot-tile')){
      return;
    }

    var tile = document.createElement('div');
    tile.className = 'euc190e-snapshot-tile';

    tile.innerHTML =
      '<strong>Maintenance Snapshot PFMP</strong>' +
      '<span>Diagnostic, synchronisation ciblée et index rapides BAC PRO / BTS / CAP.</span>';

    tile.onclick = function(){
      var u = new URL(location.href);
      u.search = '';
      u.searchParams.set('page','snapshot-pfmp-admin');
      location.href = u.toString();
    };

    var host =
      document.querySelector('.dashboard-grid') ||
      document.querySelector('.cards-grid') ||
      document.querySelector('.card-grid') ||
      document.querySelector('.tiles') ||
      document.querySelector('.modules') ||
      document.querySelector('.grid') ||
      document.querySelector('.cards') ||
      document.querySelector('main') ||
      document.body;

    host.appendChild(tile);
  }

  if(document.readyState === 'loading'){
    document.addEventListener(
      'DOMContentLoaded',
      addTile
    );
  }else{
    addTile();
  }

})();
</script>





<script id="EUC_DEV190T_PDIF">
(function(){

  function academicYearNow(){
    var d=new Date(),y=d.getFullYear();
    return d.getMonth()>=8 ? y+'-'+(y+1) : (y-1)+'-'+y;
  }

  function sels(){ return Array.from(document.querySelectorAll('select')); }
  function ysel(){ return sels()[0]||null; }
  function csel(){ return sels()[1]||null; }

  function blank(){
    var c=csel();
    if(!c)return;

    var o=Array.from(c.options).find(function(x){return x.value==='';});

    if(!o){
      o=document.createElement('option');
      o.value='';
      o.textContent='— Choisir une classe —';
      c.insertBefore(o,c.firstChild);
    }

    if(!window.__EUC190T_PDIF_USER){
      c.value='';
      document.documentElement.classList.add('euc190t-waiting');
      document.body.classList.add('euc190t-waiting');
    }
  }

  function init(){
    var y=ysel(),c=csel();

    if(!y||!c){
      setTimeout(init,25);
      return;
    }

    var current=academicYearNow();
    y.value=current;
    blank();

    c.addEventListener('pointerdown',function(){
      window.__EUC190T_PDIF_POINTER=true;
    },true);

    c.addEventListener('change',function(ev){
      if(window.__EUC190T_PDIF_POINTER||ev.isTrusted){
        window.__EUC190T_PDIF_POINTER=false;
        window.__EUC190T_PDIF_USER=!!c.value;

        if(window.__EUC190T_PDIF_USER){
          document.documentElement.classList.remove('euc190t-waiting');
          document.body.classList.remove('euc190t-waiting');
        }else{
          blank();
        }
      }
    },true);

    y.addEventListener('change',function(){
      window.__EUC190T_PDIF_USER=false;
      blank();
    },true);

    var guard=setInterval(function(){
      if(window.__EUC190T_PDIF_USER){
        clearInterval(guard);
        return;
      }
      blank();
    },40);

    setTimeout(function(){
      if(!window.__EUC190T_PDIF_USER)blank();
      clearInterval(guard);
    },10000);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init);
  }else{
    init();
  }

})();
</script>
