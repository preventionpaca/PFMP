<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Composition des lignes de la convention…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.107 — les phrases sont composées par ligne depuis la table Grist, puis injectées dans des zones uniques.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download'),printBtn=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const masterBytes=Uint8Array.from(atob(PAYLOAD.pdfBase64),c=>c.charCodeAt(0));
  const ink=rgb(17/255,17/255,17/255),white=rgb(1,1,1);
  function safe(v){return String(v??'').replace(/\u00a0|\u202f/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'').trim()}
  function fieldInfo(form,name){let f;try{f=form.getTextField(name)}catch(e){throw new Error('Champ AcroForm manquant : '+name)}const widgets=f.acroField.getWidgets();if(!widgets.length)throw new Error('Champ PDF sans zone : '+name);return{field:f,rect:widgets[0].getRectangle()}}
  function rectUnion(rects){const x=Math.min(...rects.map(r=>r.x)),y=Math.min(...rects.map(r=>r.y)),rgt=Math.max(...rects.map(r=>r.x+r.width)),top=Math.max(...rects.map(r=>r.y+r.height));return{x:x,y:y,width:rgt-x,height:top-y}}
  function getRects(form,names){return names.map(n=>fieldInfo(form,n).rect)}
  function removeFields(form,names){names.forEach(n=>{try{form.removeField(form.getTextField(n))}catch(e){}})}
  function clearRect(page,r,pad){pad=pad||{};page.drawRectangle({x:r.x-(pad.l||0),y:r.y-(pad.b||0),width:r.width+(pad.l||0)+(pad.r||0),height:r.height+(pad.t||0)+(pad.b||0),color:white});}
  function parseRuns(text,baseBold){const s=safe(text),parts=s.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);return parts.map(p=>{const b=/^\*\*[^*]+\*\*$/.test(p);return{text:b?p.slice(2,-2):p,bold:baseBold||b}})}
  function runsWidth(runs,size,font,bold){return runs.reduce((n,r)=>n+(r.bold?bold:font).widthOfTextAtSize(r.text,size),0)}
  function drawRich(page,r,line,font,bold,minSize){const txt=line&&line.texte||'',runs=parseRuns(txt,line&&line.gras===true),start=Number(line&&line.taille||6),min=minSize||3.7;let size=start;while(size>min&&runsWidth(runs,size,font,bold)>r.width)size-=.1;let x=r.x,y=r.y+(r.height-size)/2+.45;runs.forEach(run=>{const f=run.bold?bold:font;page.drawText(run.text,{x:x,y:y,size:size,font:f,color:ink});x+=f.widthOfTextAtSize(run.text,size)});}
  function lineRect(form,names,opt){opt=opt||{};const u=rectUnion(getRects(form,names));return{x:u.x-(opt.left||0),y:u.y-(opt.bottom||0),width:u.width+(opt.left||0)+(opt.right||0),height:u.height+(opt.top||0)+(opt.bottom||0)}}
  function drawLine(page,form,names,line,opt){const r=lineRect(form,names,opt||{});clearRect(page,r);drawRich(page,r,line,font,bold,opt&&opt.min||3.7);removeFields(form,names);}
  function qrRect(form){const o=fieldInfo(form,'QR_ANCHOR'),r=o.rect;form.removeField(o.field);return r}
  function drawQR(page,form,url){const r=qrRect(form),q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),quiet=4,total=n+quiet*2,box=Math.min(r.width,r.height),cell=box/total,x0=r.x+(r.width-box)/2,y0=r.y+(r.height-box)/2;page.drawRectangle({x:r.x,y:r.y,width:r.width,height:r.height,color:white});for(let row=0;row<n;row++)for(let col=0;col<n;col++)if(q.isDark(row,col))page.drawRectangle({x:x0+(col+quiet)*cell,y:y0+box-(row+quiet+1)*cell,width:cell+.03,height:cell+.03,color:ink})}
  function requireFields(form){['QR_ANCHOR','DATE_DEBUT','DATE_FIN','NB_JOURS','CLASSE','ELEVE','NAISSANCE','ADRESSE_ELEVE','TEL_ELEVE','EMAIL_ELEVE','DIPLOME','ETABLISSEMENT','ADRESSE_ETAB','PROVISEUR','FONCTION_PROVISEUR','PROF_REFERENT','EMAIL_PROF','PROF_REFERENT_SIGNATURE','REFERENCE'].forEach(n=>fieldInfo(form,n));}
  async function buildOne(data){
   const pdf=await PDFDocument.load(masterBytes.slice());if(pdf.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');
   const form=pdf.getForm();requireFields(form);const pages=pdf.getPages();font=await pdf.embedFont(StandardFonts.Helvetica);bold=await pdf.embedFont(StandardFonts.HelveticaBold);const L=data.lignes||{};
   const classX=fieldInfo(form,'CLASSE').rect.x,qrX=fieldInfo(form,'QR_ANCHOR').rect.x,leftLimit=20,rightMain=Math.max(360,qrX-65);
   let rPer=lineRect(form,['DATE_DEBUT','DATE_FIN'],{left:35,right:10,top:1,bottom:1});rPer.width=Math.min(rPer.width,rightMain-rPer.x);clearRect(pages[0],rPer);drawRich(pages[0],rPer,L.PERIODE_L1,font,bold,4.5);
   let rJ=lineRect(form,['NB_JOURS'],{left:28,right:45,top:0,bottom:0});clearRect(pages[0],rJ);drawRich(pages[0],rJ,L.PERIODE_L2,font,bold,4.5);removeFields(form,['DATE_DEBUT','DATE_FIN','NB_JOURS']);
   let rC=lineRect(form,['CLASSE'],{left:25,right:2,top:1,bottom:1});clearRect(pages[0],rC);drawRich(pages[0],rC,L.CLASSE_LIGNE,font,bold,4.8);removeFields(form,['CLASSE']);
   let rE=lineRect(form,['ELEVE','NAISSANCE'],{left:0,right:Math.max(0,rightMain-(fieldInfo(form,'NAISSANCE').rect.x+fieldInfo(form,'NAISSANCE').rect.width)),top:0,bottom:0});clearRect(pages[0],rE);drawRich(pages[0],rE,L.ELEVE_LIGNE,font,bold,4.5);removeFields(form,['ELEVE','NAISSANCE']);
   let rA=lineRect(form,['ADRESSE_ELEVE'],{left:Math.max(0,fieldInfo(form,'ADRESSE_ELEVE').rect.x-leftLimit),right:Math.max(0,rightMain-(fieldInfo(form,'ADRESSE_ELEVE').rect.x+fieldInfo(form,'ADRESSE_ELEVE').rect.width)),top:0,bottom:0});clearRect(pages[0],rA);drawRich(pages[0],rA,L.ADRESSE_ELEVE_LIGNE,font,bold,4.0);removeFields(form,['ADRESSE_ELEVE']);
   let rCt=rectUnion(getRects(form,['TEL_ELEVE','EMAIL_ELEVE']));rCt.x=leftLimit;rCt.width=rightMain-leftLimit;clearRect(pages[0],rCt);drawRich(pages[0],rCt,L.CONTACT_ELEVE_LIGNE,font,bold,4.0);removeFields(form,['TEL_ELEVE','EMAIL_ELEVE']);
   let rD=lineRect(form,['DIPLOME'],{left:Math.max(0,fieldInfo(form,'DIPLOME').rect.x-leftLimit),right:Math.max(0,rightMain-(fieldInfo(form,'DIPLOME').rect.x+fieldInfo(form,'DIPLOME').rect.width)),top:0,bottom:0});clearRect(pages[0],rD);drawRich(pages[0],rD,L.DIPLOME_LIGNE,font,bold,4.2);removeFields(form,['DIPLOME']);
   let rEt=rectUnion(getRects(form,['ETABLISSEMENT','ADRESSE_ETAB']));rEt.x=35;rEt.width=rightMain-35;clearRect(pages[0],rEt);drawRich(pages[0],rEt,L.ETABLISSEMENT_LIGNE,font,bold,3.9);removeFields(form,['ETABLISSEMENT','ADRESSE_ETAB']);
   let rP=rectUnion(getRects(form,['PROVISEUR','FONCTION_PROVISEUR']));rP.x=leftLimit;rP.width=rightMain-leftLimit;clearRect(pages[0],rP);drawRich(pages[0],rP,L.PROVISEUR_LIGNE,font,bold,3.9);removeFields(form,['PROVISEUR','FONCTION_PROVISEUR']);
   let rPr=rectUnion(getRects(form,['PROF_REFERENT','EMAIL_PROF']));rPr.x=leftLimit;rPr.width=rightMain-leftLimit;clearRect(pages[0],rPr);drawRich(pages[0],rPr,L.PROF_LIGNE,font,bold,3.9);removeFields(form,['PROF_REFERENT','EMAIL_PROF']);
   let rS=lineRect(form,['PROF_REFERENT_SIGNATURE'],{left:0,right:0,top:0,bottom:0});clearRect(pages[1],rS);drawRich(pages[1],rS,L.PROF_SIGNATURE_LIGNE,font,bold,3.6);removeFields(form,['PROF_REFERENT_SIGNATURE']);
   let rR=lineRect(form,['REFERENCE'],{left:25,right:0,top:0,bottom:0});clearRect(pages[1],rR);drawRich(pages[1],rR,L.REFERENCE_LIGNE,font,bold,3.4);removeFields(form,['REFERENCE']);
   drawQR(pages[0],form,data.formUrl);
   form.getFields().slice().forEach(f=>form.removeField(f));
   return await pdf.save({useObjectStreams:false});
  }
  let font,bold,finalBytes;
  if(PAYLOAD.items.length===1){status.textContent='Fusion de la convention…';finalBytes=await buildOne(PAYLOAD.items[0]);}
  else{const out=await PDFDocument.create();for(let i=0;i<PAYLOAD.items.length;i++){status.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const oneBytes=await buildOne(PAYLOAD.items[i]),one=await PDFDocument.load(oneBytes),cp=await out.copyPages(one,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);}finalBytes=await out.save({useObjectStreams:false});}
  const url=URL.createObjectURL(new Blob([finalBytes],{type:'application/pdf'}));download.href=url;download.download=PAYLOAD.filename||'Convention_PFMP.pdf';printBtn.onclick=()=>window.open(url,'_blank');actions.hidden=false;status.className='status ok';status.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.107 — fusion par lignes paramétrées Grist + QR diagnostiquable — '+(PAYLOAD.version||'');
 }catch(e){console.error(e);status.className='status err';status.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
