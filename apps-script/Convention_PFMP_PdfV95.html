<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Composition chirurgicale des lignes…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.108 — un champ unique par ligne, texte riche paramétré dans Grist.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download'),printBtn=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const masterBytes=Uint8Array.from(atob(PAYLOAD.pdfBase64),c=>c.charCodeAt(0));
  const COLORS={NOIR:rgb(17/255,17/255,17/255),ORANGE:rgb(227/255,92/255,0),ROUGE:rgb(190/255,30/255,30/255),BLEU:rgb(30/255,70/255,145/255)};
  function safe(v){return String(v??'').replace(/\u00a0|\u202f/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').trim()}
  function fieldInfo(form,name){let f;try{f=form.getTextField(name)}catch(e){throw new Error('Champ AcroForm manquant : '+name)}const widgets=f.acroField.getWidgets();if(!widgets.length)throw new Error('Champ PDF sans zone : '+name);return{field:f,rect:widgets[0].getRectangle()}}
  function parseRich(text,defaultColor,baseSize){
    const tokens=safe(text).split(/(\*\*|\[orange\]|\[\/orange\]|\[rouge\]|\[\/rouge\]|\[bleu\]|\[\/bleu\]|\[size=\d+(?:\.\d+)?\]|\[\/size\])/i).filter(Boolean);
    let bold=false,color=(defaultColor||'NOIR').toUpperCase(),size=baseSize,runs=[];
    tokens.forEach(t=>{const l=t.toLowerCase();if(t==='**'){bold=!bold;return}if(l==='[orange]'){color='ORANGE';return}if(l==='[/orange]'||l==='[/rouge]'||l==='[/bleu]'){color=(defaultColor||'NOIR').toUpperCase();return}if(l==='[rouge]'){color='ROUGE';return}if(l==='[bleu]'){color='BLEU';return}let m=/^\[size=(\d+(?:\.\d+)?)\]$/i.exec(t);if(m){size=Number(m[1]);return}if(l==='[/size]'){size=baseSize;return}if(t)runs.push({text:t,bold:bold,color:color,size:size});});return runs;
  }
  function widthRuns(runs,font,bold,scale){return runs.reduce((n,r)=>n+(r.bold?bold:font).widthOfTextAtSize(r.text,r.size*scale),0)}
  function drawRich(page,r,line,font,bold){
    const base=Number(line&&line.taille||6),min=Number(line&&line.tailleMin||4),runs=parseRich(line&&line.texte||'',line&&line.couleur||'NOIR',base);if(!runs.length)return;
    let scale=1,w=widthRuns(runs,font,bold,scale),minScale=Math.min(1,min/base);while(scale>minScale&&w>r.width-2){scale-=.01;w=widthRuns(runs,font,bold,scale)}
    const align=String(line&&line.alignement||'LEFT').toUpperCase(),v=String(line&&line.alignementVertical||'MIDDLE').toUpperCase(),maxSize=Math.max(...runs.map(x=>x.size*scale));let x=r.x+1;if(align==='CENTER')x=r.x+(r.width-w)/2;else if(align==='RIGHT')x=r.x+r.width-w-1;
    let y=r.y+1;if(v==='MIDDLE')y=r.y+(r.height-maxSize)/2+.7;else if(v==='TOP')y=r.y+r.height-maxSize-1;
    runs.forEach(run=>{const f=run.bold?bold:font,s=run.size*scale;page.drawText(run.text,{x:x,y:y,size:s,font:f,color:COLORS[run.color]||COLORS.NOIR});x+=f.widthOfTextAtSize(run.text,s)});
  }
  function drawLine(page,form,name,line,font,bold){const o=fieldInfo(form,name);drawRich(page,o.rect,line,font,bold);form.removeField(o.field)}
  function drawQR(page,form,url){const o=fieldInfo(form,'QR_ANCHOR'),r=o.rect;form.removeField(o.field);const q=qrcode(0,'L');q.addData(String(url||''));q.make();const n=q.getModuleCount(),quiet=4,total=n+quiet*2,box=Math.min(r.width,r.height),cell=box/total,x0=r.x+(r.width-box)/2,y0=r.y+(r.height-box)/2;for(let row=0;row<n;row++)for(let col=0;col<n;col++)if(q.isDark(row,col))page.drawRectangle({x:x0+(col+quiet)*cell,y:y0+box-(row+quiet+1)*cell,width:cell+.04,height:cell+.04,color:COLORS.NOIR})}
  function requireFields(form){['PERIODE_LIGNE','CLASSE_LIGNE','ELEVE_LIGNE','ADRESSE_ELEVE_LIGNE','CONTACT_ELEVE_LIGNE','DIPLOME_LIGNE','ETABLISSEMENT_LIGNE','PROVISEUR_LIGNE','PROF_LIGNE','QR_ANCHOR','PROF_SIGNATURE_LIGNE','REFERENCE_LIGNE'].forEach(n=>fieldInfo(form,n));}
  async function buildOne(data){
   const pdf=await PDFDocument.load(masterBytes.slice());if(pdf.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const form=pdf.getForm();requireFields(form);const pages=pdf.getPages(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold),L=data.lignes||{};
   ['PERIODE_LIGNE','CLASSE_LIGNE','ELEVE_LIGNE','ADRESSE_ELEVE_LIGNE','CONTACT_ELEVE_LIGNE','DIPLOME_LIGNE','ETABLISSEMENT_LIGNE','PROVISEUR_LIGNE','PROF_LIGNE'].forEach(n=>drawLine(pages[0],form,n,L[n]||{},font,bold));
   drawLine(pages[1],form,'PROF_SIGNATURE_LIGNE',L.PROF_SIGNATURE_LIGNE||{},font,bold);drawLine(pages[1],form,'REFERENCE_LIGNE',L.REFERENCE_LIGNE||{},font,bold);drawQR(pages[0],form,data.formUrl);form.getFields().slice().forEach(f=>form.removeField(f));return await pdf.save({useObjectStreams:false});
  }
  let finalBytes;if(PAYLOAD.items.length===1){status.textContent='Fusion de la convention…';finalBytes=await buildOne(PAYLOAD.items[0]);}else{const out=await PDFDocument.create();for(let i=0;i<PAYLOAD.items.length;i++){status.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const oneBytes=await buildOne(PAYLOAD.items[i]),one=await PDFDocument.load(oneBytes),cp=await out.copyPages(one,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);}finalBytes=await out.save({useObjectStreams:false});}
  const url=URL.createObjectURL(new Blob([finalBytes],{type:'application/pdf'}));download.href=url;download.download=PAYLOAD.filename||'Convention_PFMP.pdf';printBtn.onclick=()=>window.open(url,'_blank');actions.hidden=false;status.className='status ok';status.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.108 — lignes riches Grist + QR signé par ID — '+(PAYLOAD.version||'');
 }catch(e){console.error(e);status.className='status err';status.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
