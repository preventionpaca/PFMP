<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Remplissage du modèle PDF AcroForm…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.106 — AcroForm vierge OK4. Aucune recherche de marqueur, aucun masque graphique.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download'),printBtn=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const masterBytes=Uint8Array.from(atob(PAYLOAD.pdfBase64),c=>c.charCodeAt(0));
  const ink=rgb(17/255,17/255,17/255),orange=rgb(227/255,92/255,0);
  function safe(v){return String(v??'').replace(/\u00a0|\u202f/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'').trim()}
  function fit(font,text,start,width,min){let s=start,t=safe(text);while(s>min&&font.widthOfTextAtSize(t,s)>width)s-=.1;return s}
  function fieldInfo(form,name){let f;try{f=form.getTextField(name)}catch(e){throw new Error('Champ AcroForm manquant : '+name)}const widgets=f.acroField.getWidgets();if(!widgets.length)throw new Error('Champ PDF sans zone : '+name);return{field:f,rect:widgets[0].getRectangle()}}
  function drawField(form,page,name,value,opt){opt=opt||{};const o=fieldInfo(form,name),r=o.rect,f=opt.bold===false?opt.font:opt.boldFont,t=safe(value),pad=opt.pad||0,size=fit(f,t,opt.size||7,Math.max(1,r.width-pad),opt.min||3.8),y=r.y+(r.height-size)/2+.5;page.drawText(t,{x:r.x+pad,y:y,size:size,font:f,color:opt.color||ink,maxWidth:Math.max(1,r.width-pad)});form.removeField(o.field)}
  function qrRect(form){const o=fieldInfo(form,'QR_ANCHOR'),r=o.rect;form.removeField(o.field);return r}
  function drawQR(page,form,url){const r=qrRect(form),q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),quiet=4,total=n+quiet*2,box=Math.min(r.width,r.height),cell=box/total,x0=r.x+(r.width-box)/2,y0=r.y+(r.height-box)/2;for(let row=0;row<n;row++)for(let col=0;col<n;col++)if(q.isDark(row,col))page.drawRectangle({x:x0+(col+quiet)*cell,y:y0+box-(row+quiet+1)*cell,width:cell+.03,height:cell+.03,color:ink})}
  function requireFields(form){['QR_ANCHOR','DATE_DEBUT','DATE_FIN','NB_JOURS','CLASSE','ELEVE','NAISSANCE','ADRESSE_ELEVE','TEL_ELEVE','EMAIL_ELEVE','DIPLOME','ETABLISSEMENT','ADRESSE_ETAB','PROVISEUR','FONCTION_PROVISEUR','PROF_REFERENT','EMAIL_PROF','PROF_REFERENT_SIGNATURE','REFERENCE'].forEach(n=>fieldInfo(form,n));}
  async function buildOne(data){
   const pdf=await PDFDocument.load(masterBytes.slice());if(pdf.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');
   const form=pdf.getForm();requireFields(form);const pages=pdf.getPages(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold),e=data.eleve||{},et=data.etablissement||{},common={font:font,boldFont:bold};
   drawField(form,pages[0],'DATE_DEBUT',data.debutCourt||data.debut,{...common,size:8.0,min:5.2});
   drawField(form,pages[0],'DATE_FIN',data.finCourt||data.fin,{...common,size:8.0,min:5.2});
   drawField(form,pages[0],'NB_JOURS',String(data.jours||0),{...common,size:7.0,min:5.3});
   drawField(form,pages[0],'CLASSE',data.classe||'',{...common,size:8.0,min:5.3});
   drawField(form,pages[0],'ELEVE',[e.nom||'',e.prenom||''].filter(Boolean).join(' '),{...common,size:7.0,min:4.0});
   drawField(form,pages[0],'NAISSANCE',e.dateNaissance||'',{...common,size:7.0,min:5.1});
   drawField(form,pages[0],'ADRESSE_ELEVE',[e.adresse||'',[e.codePostal||'',e.ville||''].join(' ').trim()].filter(Boolean).join(' - '),{...common,size:6.5,min:4.1});
   drawField(form,pages[0],'TEL_ELEVE',e.telephone||'',{...common,size:6.5,min:4.8});
   drawField(form,pages[0],'EMAIL_ELEVE',e.courriel||'',{...common,size:6.2,min:4.0});
   drawField(form,pages[0],'DIPLOME',data.diplome||e.formation||'',{...common,size:7.0,min:4.4});
   drawField(form,pages[0],'ETABLISSEMENT',et.libelle||'',{...common,size:6.2,min:3.8,color:orange});
   drawField(form,pages[0],'ADRESSE_ETAB',et.adresse||'',{...common,size:5.8,min:3.7,bold:false});
   drawField(form,pages[0],'PROVISEUR',et.proviseur||'',{...common,size:6.2,min:4.1});
   drawField(form,pages[0],'FONCTION_PROVISEUR',et.fonctionProviseur||'',{...common,size:5.9,min:4.0,bold:false});
   drawField(form,pages[0],'PROF_REFERENT',data.professeurReferent||'',{...common,size:6.2,min:3.9});
   drawField(form,pages[0],'EMAIL_PROF',data.professeurReferentEmail||'',{...common,size:5.9,min:3.9,bold:false});
   drawField(form,pages[1],'PROF_REFERENT_SIGNATURE',data.professeurReferent||'',{...common,size:5.8,min:3.8});
   drawField(form,pages[1],'REFERENCE',data.reference||'',{...common,size:5.0,min:3.2,bold:false});
   drawQR(pages[0],form,data.formUrl);
   form.getFields().slice().forEach(f=>form.removeField(f));
   return await pdf.save({useObjectStreams:false});
  }
  let finalBytes;
  if(PAYLOAD.items.length===1){status.textContent='Fusion de la convention…';finalBytes=await buildOne(PAYLOAD.items[0]);}
  else{const out=await PDFDocument.create();for(let i=0;i<PAYLOAD.items.length;i++){status.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const oneBytes=await buildOne(PAYLOAD.items[i]),one=await PDFDocument.load(oneBytes),cp=await out.copyPages(one,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);}finalBytes=await out.save({useObjectStreams:false});}
  const url=URL.createObjectURL(new Blob([finalBytes],{type:'application/pdf'}));download.href=url;download.download=PAYLOAD.filename||'Convention_PFMP.pdf';printBtn.onclick=()=>window.open(url,'_blank');actions.hidden=false;status.className='status ok';status.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.106 — AcroForm vierge OK4 + QR ancré + double contrôle référence/jeton — '+(PAYLOAD.version||'');
 }catch(e){console.error(e);status.className='status err';status.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
