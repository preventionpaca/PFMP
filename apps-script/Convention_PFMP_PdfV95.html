<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:1000px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,a.btn{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.muted{color:#52756f;font-size:13px}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Préparation du PDF…</div><div id="actions" class="actions" hidden><a id="download" class="btn" download>Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><p class="muted" id="meta"></p><div class="note">Le PDF est généré directement à partir du modèle maître 2 pages. Aucun aperçu intermédiaire n’est utilisé afin de préserver l’impression recto-verso.</div></section></main><script>const PAYLOAD=<?!= payload ?>;(async function(){const s=document.getElementById('status'),ac=document.getElementById('actions'),dl=document.getElementById('download'),pr=document.getElementById('print'),meta=document.getElementById('meta');try{if(!window.PDFLib)throw new Error('Bibliothèque PDF non chargée.');const {PDFDocument,StandardFonts,rgb}=PDFLib;const b64ToBytes=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));const master=await PDFDocument.load(b64ToBytes(PAYLOAD.pdfBase64));if(master.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold),black=rgb(0,0,0),white=rgb(1,1,1);function erase(p,x,top,w,h){p.drawRectangle({x:x,y:p.getHeight()-top-h,width:w,height:h,color:white});}function fitSize(f,t,start,maxWidth,min){let z=start;while(z>min&&f.widthOfTextAtSize(t,z)>maxWidth)z-=.2;return z;}function value(p,t,x,top,w,h,size,opt){t=String(t||'');opt=opt||{};erase(p,x,top,w,h);const f=opt.font||font,z=fitSize(f,t,size,w,opt.min||5.2);p.drawText(t,{x:x,y:p.getHeight()-top-h+(h-z)*.53,size:z,font:f,color:black,maxWidth:w});}function drawData(p1,p2,d,qr){/* DEV96 : les masques restent strictement à l'intérieur des zones variables. */value(p1,d.debutCourt||d.debut,171,48,70,12,7.7,{font:bold,min:6.3});value(p1,d.finCourt||d.fin,260,48,67,12,7.7,{font:bold,min:6.3});value(p1,String(d.jours||0),219,61,24,10,6.5,{font:bold,min:5.8});value(p1,d.classe,409,48,52,13,8.2,{font:bold,min:6.4});value(p1,(d.eleve.nom||'')+' '+(d.eleve.prenom||''),66,72,132,11,7.0,{font:bold,min:5.5});value(p1,d.eleve.dateNaissance||'',237,72,76,11,7.0,{font:bold,min:5.7});value(p1,[d.eleve.adresse||'',[d.eleve.codePostal||'',d.eleve.ville||''].join(' ').trim()].filter(Boolean).join(' — '),96,87,292,11,6.6,{font:bold,min:5.1});value(p1,d.eleve.telephone||'',83,102,70,10,6.5,{font:bold,min:5.1});value(p1,d.eleve.courriel||'',184,102,208,10,6.2,{font:bold,min:4.9});value(p1,d.diplome||d.eleve.formation||'',101,118,347,12,7.4,{font:bold,min:5.8});let et=d.etablissement||{};value(p1,String(et.libelle||''),84,139,176,11,6.7,{font:bold,min:5.4});value(p1,[et.adresse||'',et.telephone||''].filter(Boolean).join(' - '),264,139,196,11,6.2,{min:5.1});value(p1,d.professeurReferent||'',91,167,92,10,6.3,{font:bold,min:5.0});value(p1,d.professeurReferentEmail||'',211,167,185,10,6.1,{font:bold,min:4.8});value(p2,d.professeurReferent||'',375,716,83,12,5.9,{font:bold,min:4.7});value(p2,d.reference||'',525,789,58,11,5.5,{min:4.2});/* Le PDF maître peut encore contenir l'ancien QR : on nettoie toute sa zone intérieure, sans toucher aux bordures. */erase(p1,477,45,76,69);p1.drawImage(qr,{x:490,y:p1.getHeight()-104,width:52,height:52});}
for(let i=0;i<PAYLOAD.items.length;i++){s.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const copied=await out.copyPages(master,[0,1]),p1=copied[0],p2=copied[1];out.addPage(p1);out.addPage(p2);const qr=await out.embedPng(b64ToBytes(PAYLOAD.qrs[i]));drawData(p1,p2,PAYLOAD.items[i],qr);}const bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob);dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>{const w=window.open(url,'_blank');if(!w)throw new Error('Le navigateur a bloqué l’ouverture du PDF.');};ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+(PAYLOAD.items.length*2)+' page(s).';meta.textContent='Modèle maître figé sur 2 pages — '+(PAYLOAD.mode==='batch'?'lot imprimable recto-verso':'convention individuelle')+' — '+(PAYLOAD.version||'');}catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e));}})();</script></body></html>
