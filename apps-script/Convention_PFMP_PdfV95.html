ount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);function safe(v){return String(v??'').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'').replace(/\u202f/g,' ').replace(/\u00a0/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...')}function py(p,top){return p.getHeight()-top}function clearExact(p,b,pad){pad=pad===undefined?.55:pad;const x=Math.max(0,b[0]-pad),top=Math.max(0,b[1]-pad),w=(b[2]-b[0])+pad*2,h=(b[3]-b[1])+pad*2;p.drawRectangle({x:x,y:py(p,top+h),width:w,height:h,color:white})}function fit(f,t,z,w,min){t=safe(t);while(z>min&&f.widthOfTextAtSize(t,z)>w)z-=.1;return z}function draw(p,t,x,top,w,z,opt){opt=opt||{};t=safe(t);const f=opt.font||font,zz=fit(f,t,z,w,opt.min||4.4),col=opt.color||ink;p.drawText(t,{x:x,y:py(p,top+zz),size:zz,font:f,color:col,maxWidth:w})}function replace(p,box,val,x,top,w,z,opt){clearExact(p,box);draw(p,val,x===undefined?box[0]:x,top===undefined?box[1]:top,w===undefined?(box[2]-box[0]):w,z,opt)}const B={dateDeb:[169.09,47.80,239.42,64.14],dateFin:[254.11,47.80,307.80,64.14],jours:[213.54,59.03,246.03,71.52],classe:[408.72,47.52,457.43,64.82],nom:[65.71,72.37,123.59,86.79],prenom:[125.63,72.37,198.92,86.79],naiss:[235.83,72.37,314.56,86.79],adr:[94.21,92.44,170.83,106.86],cpville:[182.35,92.44,258.54,106.86],tel:[81.58,106.67,136.12,121.09],mail:[167.58,106.67,229.95,121.09],diplome:[99.26,121.52,160.33,140.74],etab:[35.05,143.07,114.99,158.45],adrEtab:[120.87,144.89,214.05,158.20],telEtab:[221.43,145.31,302.25,157.80],prov:[99.70,163.24,148.06,175.74],fonction:[190.22,162.82,272.34,176.13],prof:[91.04,179.01,162.94,192.46],mailProf:[194.71,179.01,250.67,192.46],prof2:[376.55,724.70,438.18,736.23],ref:[525.49,797.68,575.07,811.00]};function drawQR(p,url){const q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),size=51,x0=493,top=49, ntent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const d=PAYLOAD.items[i],cp=await out.copyPages(master,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);mergePage1(cp[0],d);mergePage2(cp[1],d)}const bytes=await out.save({useObjectStreams:false}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>window.open(url,'_blank');ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.102 — modèle maître 2 pages — '+(PAYLOAD.version||'')}catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}})();</script></body></html>
