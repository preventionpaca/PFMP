<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Lecture des ancres du modèle…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.103 — fusion par ancres [[...]] du PDF maître ; aucune coordonnée de champ n’est codée en dur.</div></section></main><script>const PAYLOAD=<?!= payload ?>;(async()=>{const s=document.getElementById('status'),ac=document.getElementById('actions'),dl=document.getElementById('download'),pr=document.getElementById('print'),meta=document.getElementById('meta');try{if(!window.PDFLib||!window.pdfjsLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const{PDFDocument,StandardFonts,rgb}=PDFLib,b64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ink=rgb(17/255,17/255,17/255),orange=rgb(227/255,92/255,0),white=rgb(1,1,1);const src=b64(PAYLOAD.pdfBase64),master=await PDFDocument.load(src);if(master.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const probe=await pdfjsLib.getDocument({data:src.slice()}).promise;const anchorPages=[];for(let pn=1;pn<=2;pn++){const pg=await probe.getPage(pn),tc=await pg.getTextContent();anchorPages.push(tc.items.filter(i=>i&&i.str).map(i=>({str:String(i.str),x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.max(4,i.height||Math.abs(i.transform[3])||7)})))}const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);function safe(v){return String(v??'').replace(/\u202f/g,' ').replace(/\u00a0/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'')}function fit(f,t,z,w,min){t=safe(t);while(z>min&&f.widthOfTextAtSize(t,z)>w)z-=.1;return z}function occurrences(pageIndex,key){const mark='[['+key+']]',arr=[];for(const it of anchorPages[pageIndex]){let from=0,pos;while((pos=it.str.indexOf(mark,from))>=0){const len=Math.max(1,it.str.length),unit=it.w/len;arr.push({x:it.x+unit*pos,y:it.y,w:Math.max(unit*mark.length,2),h:it.h});from=pos+mark.length}}return arr}function replaceAnchors(p,pageIndex,key,val,opt){opt=opt||{};const found=occurrences(pageIndex,key);if(!found.length){if(opt.optional)return 0;throw new Error('Ancre [['+key+']] introuvable page '+(pageIndex+1)+'. Réexportez le PDF maître depuis le Word OK3.')}for(const a of found){const pad=.8;p.drawRectangle({x:a.x-pad,y:a.y-2,width:a.w+pad*2,height:a.h+4,color:white});const f=opt.bold===false?font:bold,maxW=opt.maxWidth||Math.max(a.w,70),size=fit(f,safe(val),opt.size||Math.max(5,Math.min(9,a.h*.95)),maxW,opt.min||4.3);p.drawText(safe(val),{x:a.x,y:a.y,size:size,font:f,color:opt.color||ink,maxWidth:maxW})}return found.length}function drawQR(p,url){const q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),size=54,x0=493,top=48,cell=size/n;p.drawRectangle({x:489,y:p.getHeight()-106,width:60,height:60,color:white});for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p.drawRectangle({x:x0+c*cell,y:p.getHeight()-(top+(r+1)*cell),width:cell+.08,height:cell+.08,color:ink})}function mergePage1(p,d){const e=d.etablissement||{};replaceAnchors(p,0,'DATE_DEBUT',d.debutCourt||d.debut,{maxWidth:62,size:8.5});replaceAnchors(p,0,'DATE_FIN',d.finCourt||d.fin,{maxWidth:62,size:8.5});replaceAnchors(p,0,'NB_JOURS',String(d.jours||0),{maxWidth:28,size:7});replaceAnchors(p,0,'CLASSE',d.classe,{maxWidth:60,size:9});replaceAnchors(p,0,'ELEVE',(d.eleve.nom||'')+' '+(d.eleve.prenom||''),{maxWidth:145,size:7.5});replaceAnchors(p,0,'NAISSANCE',d.eleve.dateNaissance||'',{maxWidth:75,size:7.3});replaceAnchors(p,0,'ADRESSE_ELEVE',[d.eleve.adresse||'',[d.eleve.codePostal||'',d.eleve.ville||''].join(' ').trim()].filter(Boolean).join(' - '),{maxWidth:285,size:6.7});replaceAnchors(p,0,'TEL_ELEVE',d.eleve.telephone||'',{maxWidth:75,size:6.8});replaceAnchors(p,0,'EMAIL_ELEVE',d.eleve.courriel||'',{maxWidth:165,size:6.5,min:4.5});replaceAnchors(p,0,'DIPLOME',d.diplome||d.eleve.formation||'',{maxWidth:275,size:7.5,min:5});replaceAnchors(p,0,'ETABLISSEMENT',e.libelle||'',{maxWidth:145,size:6.7,min:4.8,color:orange});replaceAnchors(p,0,'ADRESSE_ETAB',e.adresse||'',{maxWidth:170,size:6.2,min:4.5,bold:false});replaceAnchors(p,0,'PROVISEUR',e.proviseur||'',{maxWidth:90,size:6.4});replaceAnchors(p,0,'FONCTION_PROVISEUR',e.fonctionProviseur||'',{maxWidth:90,size:6.2,bold:false});replaceAnchors(p,0,'PROF_REFERENT',d.professeurReferent||'',{maxWidth:120,size:6.5,min:4.6});replaceAnchors(p,0,'EMAIL_PROF',d.professeurReferentEmail||'',{maxWidth:155,size:6.2,min:4.4});drawQR(p,d.formUrl)}function mergePage2(p,d){replaceAnchors(p,1,'PROF_REFERENT',d.professeurReferent||'',{maxWidth:90,size:5.8,min:4.2});replaceAnchors(p,1,'REFERENCE',d.reference||'',{maxWidth:80,size:5.2,min:3.9,bold:false})}for(let i=0;i<PAYLOAD.items.length;i++){s.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const d=PAYLOAD.items[i],cp=await out.copyPages(master,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);mergePage1(cp[0],d);mergePage2(cp[1],d)}const bytes=await out.save({useObjectStreams:false}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>window.open(url,'_blank');ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.103 — ancres automatiques — '+(PAYLOAD.version||'')}catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}})();</script></body></html>
