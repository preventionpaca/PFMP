<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:1000px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,a.btn{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.muted{color:#52756f;font-size:13px}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Préparation du PDF…</div><div id="actions" class="actions" hidden><a id="download" class="btn" download>Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><p class="muted" id="meta"></p><div class="note">Le PDF est généré directement à partir du modèle maître 2 pages.</div></section></main><script>const PAYLOAD=<?!= payload ?>;(async()=>{const s=document.getElementById('status'),ac=document.getElementById('actions'),dl=document.getElementById('download'),pr=document.getElementById('print'),meta=document.getElementById('meta');try{if(!window.PDFLib)throw new Error('Bibliothèque PDF non chargée.');const{PDFDocument,StandardFonts,rgb}=PDFLib,b64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));const master=await PDFDocument.load(b64(PAYLOAD.pdfBase64));if(master.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold),black=rgb(0,0,0),white=rgb(1,1,1);function erase(p,b){p.drawRectangle({x:b[0],y:p.getHeight()-b[3],width:b[2]-b[0],height:b[3]-b[1],color:white})}function fit(f,t,z,w,min){while(z>min&&f.widthOfTextAtSize(t,z)>w)z-=.15;return z}function put(p,t,b,z,o){t=String(t||'');o=o||{};erase(p,b);const f=o.font||font,pad=.5,w=b[2]-b[0]-1,zz=fit(f,t,z,w,o.min||4.8),h=b[3]-b[1];p.drawText(t,{x:b[0]+pad,y:p.getHeight()-b[3]+Math.max(.5,(h-zz)*.48),size:zz,font:f,color:black,maxWidth:w})}function draw(p1,p2,d,qr){put(p1,d.debutCourt||d.debut,[168.3,47.4,240.2,64.5],8.5,{font:bold,min:7.2});put(p1,d.finCourt||d.fin,[253.3,47.4,308.5,64.5],8.5,{font:bold,min:7.2});put(p1,String(d.jours||0),[212.8,58.7,246.8,71.9],6.5,{font:bold,min:5.8});put(p1,d.classe,[408,47.2,458.2,65.1],9,{font:bold,min:7});put(p1,(d.eleve.nom||'')+' '+(d.eleve.prenom||''),[63.9,71,198.8,86.1],7.5,{font:bold,min:5.8});put(p1,d.eleve.dateNaissance||'',[234.1,71,314.3,86.1],7.5,{font:bold,min:6});put(p1,[d.eleve.adresse||'',[d.eleve.codePostal||'',d.eleve.ville||''].join(' ').trim()].filter(Boolean).join(' — '),[93.4,85.5,259.2,100.7],7.5,{font:bold,min:5.5});put(p1,d.eleve.telephone||'',[80.8,99.8,136.9,114.9],7.5,{font:bold,min:5.7});put(p1,d.eleve.courriel||'',[166.9,99.8,230.7,114.9],7.5,{font:bold,min:5.2});put(p1,d.diplome||d.eleve.formation||'',[98.5,115,161.1,134.9],10,{font:bold,min:6});const et=d.etablissement||{};put(p1,String(et.libelle||''),[31,135.5,112.2,151.6],8,{font:bold,min:5.5});put(p1,[et.adresse||'',et.telephone||''].filter(Boolean).join(' - '),[116.5,137.3,299.5,151.3],6.5,{min:5});put(p1,et.proviseur||'',[98.9,150.1,148.8,163.4],6.5,{font:bold,min:5.3});put(p1,et.fonctionProviseur||'',[189.4,149.7,273.1,163.7],6.5,{min:5.1});put(p1,d.professeurReferent||'',[90.3,165.9,163.7,180],7,{font:bold,min:5.1});put(p1,d.professeurReferentEmail||'',[194,165.9,251.5,180],7,{font:bold,min:4.8});erase(p1,[491.7,50.7,544.7,104.8]);p1.drawImage(qr,{x:492.5,y:p1.getHeight()-104,width:51.3,height:52.5});put(p2,d.professeurReferent||'',[375.8,716.8,438.9,729.1],6,{font:bold,min:4.7});put(p2,d.reference||'',[524.8,789.8,575.7,803.9],5.7,{min:4.2})}for(let i=0;i<PAYLOAD.items.length;i++){s.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const cp=await out.copyPages(master,[0,1]),p1=cp[0],p2=cp[1];out.addPage(p1);out.addPage(p2);draw(p1,p2,PAYLOAD.items[i],await out.embedPng(b64(PAYLOAD.qrs[i])))}const bytes=await out.save(),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>window.open(url,'_blank');ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='Modèle maître 2 pages — '+(PAYLOAD.version||'')}catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}})();</script></body></html>
