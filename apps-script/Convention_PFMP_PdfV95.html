<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Lecture du modèle et de ses ancres…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.104 — fusion par ancres reconstruites, sans coordonnées de champs codées en dur.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const s=document.getElementById('status'),ac=document.getElementById('actions'),dl=document.getElementById('download'),pr=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.pdfjsLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const{PDFDocument,StandardFonts,rgb}=PDFLib,b64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ink=rgb(17/255,17/255,17/255),orange=rgb(227/255,92/255,0),white=rgb(1,1,1);
  const src=b64(PAYLOAD.pdfBase64),master=await PDFDocument.load(src);if(master.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');
  const probe=await pdfjsLib.getDocument({data:src.slice()}).promise;
  const pages=[];
  for(let pn=1;pn<=2;pn++){
   const pg=await probe.getPage(pn),tc=await pg.getTextContent(),items=tc.items.filter(i=>i&&i.str).map(i=>({str:String(i.str),x:Number(i.transform[4]||0),y:Number(i.transform[5]||0),w:Number(i.width||0),h:Math.max(4,Number(i.height||Math.abs(i.transform[3])||7))}));
   const lines=[];
   items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x).forEach(it=>{let line=lines.find(l=>Math.abs(l.y-it.y)<=2);if(!line){line={y:it.y,items:[]};lines.push(line)}line.items.push(it)});
   lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
   pages.push(lines);
  }
  const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);
  function safe(v){return String(v??'').replace(/\u202f/g,' ').replace(/\u00a0/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'')}
  function fit(f,t,z,w,min){t=safe(t);while(z>min&&f.widthOfTextAtSize(t,z)>w)z-=.1;return z}
  function lineChars(line){const chars=[];for(const it of line.items){const txt=it.str||'',n=Math.max(1,txt.length),u=it.w/n;for(let i=0;i<txt.length;i++)chars.push({ch:txt[i],x1:it.x+u*i,x2:it.x+u*(i+1),y:it.y,h:it.h})}return chars}
  function findAnchor(pageIndex,key){const mark='[['+key+']]';for(const line of pages[pageIndex]){const chars=lineChars(line),txt=chars.map(c=>c.ch).join(''),idx=txt.indexOf(mark);if(idx>=0){const a=chars[idx],b=chars[idx+mark.length-1];return{x:a.x1,y:Math.min(a.y,b.y),w:Math.max(2,b.x2-a.x1),h:Math.max(a.h,b.h)}}}return null}
  function replaceAnchor(p,pageIndex,key,val,opt){opt=opt||{};const a=findAnchor(pageIndex,key);if(!a){if(opt.optional)return;throw new Error('Ancre [['+key+']] introuvable page '+(pageIndex+1)+'.')}const pad=.45;p.drawRectangle({x:a.x-pad,y:a.y-1.4,width:a.w+pad*2,height:a.h+2.8,color:white});const f=opt.bold===false?font:bold,maxW=opt.maxWidth||Math.max(a.w,10),size=fit(f,safe(val),opt.size||Math.max(5,Math.min(8.5,a.h*.92)),maxW,opt.min||4.2);p.drawText(safe(val),{x:a.x,y:a.y,size:size,font:f,color:opt.color||ink,maxWidth:maxW})}
  function drawQR(p,url){const q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),box=56,x0=491,top=45,cell=box/n;/* on efface toute la zone QR du patron pour éviter tout QR résiduel */p.drawRectangle({x:484,y:p.getHeight()-125,width:72,height:88,color:white});for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p.drawRectangle({x:x0+c*cell,y:p.getHeight()-(top+(r+1)*cell),width:cell+.06,height:cell+.06,color:ink})}
  function merge1(p,d){const e=d.etablissement||{};replaceAnchor(p,0,'DATE_DEBUT',d.debutCourt||d.debut,{maxWidth:58,size:8.2});replaceAnchor(p,0,'DATE_FIN',d.finCourt||d.fin,{maxWidth:58,size:8.2});replaceAnchor(p,0,'NB_JOURS',String(d.jours||0),{maxWidth:28,size:7});replaceAnchor(p,0,'CLASSE',d.classe,{maxWidth:48,size:8.6});replaceAnchor(p,0,'ELEVE',(d.eleve.nom||'')+' '+(d.eleve.prenom||''),{maxWidth:118,size:7,min:5});replaceAnchor(p,0,'NAISSANCE',d.eleve.dateNaissance||'',{maxWidth:67,size:7,min:5.5});replaceAnchor(p,0,'ADRESSE_ELEVE',[d.eleve.adresse||'',[d.eleve.codePostal||'',d.eleve.ville||''].join(' ').trim()].filter(Boolean).join(' - '),{maxWidth:250,size:6.6,min:4.3});replaceAnchor(p,0,'TEL_ELEVE',d.eleve.telephone||'',{maxWidth:70,size:6.7,min:5});replaceAnchor(p,0,'EMAIL_ELEVE',d.eleve.courriel||'',{maxWidth:145,size:6.2,min:4.2});replaceAnchor(p,0,'DIPLOME',d.diplome||d.eleve.formation||'',{maxWidth:250,size:7.2,min:4.7});replaceAnchor(p,0,'ETABLISSEMENT',e.libelle||'',{maxWidth:130,size:6.1,min:4.2,color:orange});replaceAnchor(p,0,'ADRESSE_ETAB',e.adresse||'',{maxWidth:155,size:5.8,min:4,bold:false});replaceAnchor(p,0,'PROVISEUR',e.proviseur||'',{maxWidth:82,size:6.2,min:4.7});replaceAnchor(p,0,'FONCTION_PROVISEUR',e.fonctionProviseur||'',{maxWidth:82,size:5.9,min:4.5,bold:false});replaceAnchor(p,0,'PROF_REFERENT',d.professeurReferent||'',{maxWidth:108,size:6.2,min:4.4});replaceAnchor(p,0,'EMAIL_PROF',d.professeurReferentEmail||'',{maxWidth:145,size:5.9,min:4.1});drawQR(p,d.formUrl)}
  function merge2(p,d){replaceAnchor(p,1,'PROF_REFERENT',d.professeurReferent||'',{maxWidth:82,size:5.6,min:4});replaceAnchor(p,1,'REFERENCE',d.reference||'',{maxWidth:78,size:5,min:3.8,bold:false})}
  for(let i=0;i<PAYLOAD.items.length;i++){s.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const d=PAYLOAD.items[i],cp=await out.copyPages(master,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);merge1(cp[0],d);merge2(cp[1],d)}
  const bytes=await out.save({useObjectStreams:false}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>window.open(url,'_blank');ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.104 — ancres reconstruites — '+(PAYLOAD.version||'')
 }catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
