<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Préparation du PDF…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.101 — patron PDF maître 2 pages, fusion ciblée, QR vectoriel.</div></section></main><script>const PAYLOAD=<?!= payload ?>;(async()=>{const s=document.getElementById('status'),ac=document.getElementById('actions'),dl=document.getElementById('download'),pr=document.getElementById('print'),meta=document.getElementById('meta');try{if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');const{PDFDocument,StandardFonts,rgb}=PDFLib,b64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),black=rgb(0,0,0),white=rgb(1,1,1);const master=await PDFDocument.load(b64(PAYLOAD.pdfBase64));if(master.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const out=await PDFDocument.create(),font=await out.embedFont(StandardFonts.Helvetica),bold=await out.embedFont(StandardFonts.HelveticaBold);function safe(v){return String(v??'').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'').replace(/\u202f/g,' ').replace(/\u00a0/g,' ').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...')}function y(p,t){return p.getHeight()-t}function mask(p,x,t,w,h){p.drawRectangle({x:x,y:y(p,t+h),width:w,height:h,color:white})}function fit(f,t,z,w,min){t=safe(t);while(z>min&&f.widthOfTextAtSize(t,z)>w)z-=.15;return z}function txt(p,t,x,top,w,z,opt){opt=opt||{};t=safe(t);const f=opt.font||font,zz=fit(f,t,z,w,opt.min||4.6);p.drawText(t,{x:x,y:y(p,top+zz),size:zz,font:f,color:black,maxWidth:w})}function field(p,x,t,w,h,val,z,opt){mask(p,x,t,w,h);txt(p,val,x+1,t+1,w-2,z,opt)}function drawQR(p,url){const q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),size=51,x0=493,top=49,cell=size/n;mask(p,490,47,57,60);for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p.drawRectangle({x:x0+c*cell,y:y(p,top+(r+1)*cell),width:cell+.08,height:cell+.08,color:black})}function mergePage1(p,d){/* Les libellés, flèches et traits restent ceux du PDF maître ok2. On masque uniquement les placeholders. */field(p,171,45,70,18,d.debutCourt||d.debut,8.2,{font:bold,min:6});field(p,252,45,68,18,d.finCourt||d.fin,8.2,{font:bold,min:6});field(p,210,57,40,15,String(d.jours||0),6.7,{font:bold,min:5});field(p,406,45,53,18,d.classe,8.4,{font:bold,min:6});field(p,63,70,138,18,(d.eleve.nom||'')+' '+(d.eleve.prenom||''),7.2,{font:bold,min:5.2});field(p,233,70,84,18,d.eleve.dateNaissance||'',7,{font:bold,min:5.5});field(p,92,90,172,18,[d.eleve.adresse||'',[d.eleve.codePostal||'',d.eleve.ville||''].join(' ').trim()].filter(Boolean).join(' - '),6.5,{font:bold,min:4.5});field(p,79,105,59,18,d.eleve.telephone||'',6.6,{font:bold,min:5});field(p,165,105,150,18,d.eleve.courriel||'',6.2,{font:bold,min:4.3});field(p,97,120,265,21,d.diplome||d.eleve.formation||'',7.1,{font:bold,min:4.8});const e=d.etablissement||{};field(p,33,141,84,19,e.libelle||'',6.1,{font:bold,min:4.4});field(p,118,141,99,19,e.adresse||'',5.7,{min:4.1});field(p,219,141,86,19,e.telephone||'',5.8,{min:4.5});field(p,97,160,55,18,e.proviseur||'',6.1,{font:bold,min:4.8});field(p,204,160,63,18,e.fonctionProviseur||'',5.9,{min:4.6});field(p,89,176,76,18,d.professeurReferent||'',6.1,{font:bold,min:4.5});field(p,192,176,150,18,d.professeurReferentEmail||'',5.8,{font:bold,min:4.2});drawQR(p,d.formUrl)}function mergePage2(p,d){field(p,374,722,68,17,d.professeurReferent||'',5.7,{font:bold,min:4.2});field(p,523,795,55,17,d.reference||'',5.2,{min:3.9})}for(let i=0;i<PAYLOAD.items.length;i++){s.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const d=PAYLOAD.items[i],cp=await out.copyPages(master,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);mergePage1(cp[0],d);mergePage2(cp[1],d)}const bytes=await out.save({useObjectStreams:false}),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));dl.href=url;dl.download=PAYLOAD.filename||'Convention_PFMP.pdf';pr.onclick=()=>window.open(url,'_blank');ac.hidden=false;s.className='status ok';s.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.101 — modèle maître 2 pages — '+(PAYLOAD.version||'')}catch(e){console.error(e);s.className='status err';s.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}})();</script></body></html>
