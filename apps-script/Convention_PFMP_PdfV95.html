<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Remplissage du modèle PDF…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.105 — vrais champs PDF AcroForm. Plus de recherche de marqueurs ni de masques calculés.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download'),printBtn=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const masterBytes=Uint8Array.from(atob(PAYLOAD.pdfBase64),c=>c.charCodeAt(0));
  const ink=rgb(17/255,17/255,17/255),orange=rgb(227/255,92/255,0);
  function safe(v){return String(v??'').replace(/\u00a0|\u202f/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[\u2190-\u21ff\u27a0-\u27ff]/g,'').trim()}
  function fit(font,text,start,width,min){let s=start,t=safe(text);while(s>min&&font.widthOfTextAtSize(t,s)>width)s-=.1;return s}
  function rectOf(form,name){const f=form.getTextField(name),widgets=f.acroField.getWidgets();if(!widgets.length)throw new Error('Champ PDF sans zone : '+name);return{field:f,rect:widgets[0].getRectangle()}}
  function drawField(form,page,name,value,opt){opt=opt||{};const o=rectOf(form,name),r=o.rect,f=opt.bold===false?opt.font:opt.boldFont,t=safe(value),size=fit(f,t,opt.size||7,r.width-(opt.pad||0),opt.min||3.8),y=r.y+(r.height-size)/2+.5;page.drawText(t,{x:r.x+(opt.pad||0),y:y,size:size,font:f,color:opt.color||ink,maxWidth:r.width-(opt.pad||0)});form.removeField(o.field)}
  function drawQR(page,url){const q=qrcode(0,'M');q.addData(String(url||''));q.make();const n=q.getModuleCount(),quiet=4,box=54,total=n+quiet*2,cell=box/total,x0=490,top=52,H=page.getHeight();for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))page.drawRectangle({x:x0+(c+quiet)*cell,y:H-(top+(r+quiet+1)*cell),width:cell+.03,height:cell+.03,color:ink})}
  async function buildOne(data){
   const pdf=await PDFDocument.load(masterBytes.slice());if(pdf.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');
   const form=pdf.getForm(),pages=pdf.getPages(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold),e=data.eleve||{},et=data.etablissement||{};
   const common={font:font,boldFont:bold};
   drawField(form,pages[0],'DATE_DEBUT',data.debutCourt||data.debut,{...common,size:8.2,min:5.2});
   drawField(form,pages[0],'DATE_FIN',data.finCourt||data.fin,{...common,size:8.2,min:5.2});
   drawField(form,pages[0],'NB_JOURS',String(data.jours||0),{...common,size:7.2,min:5.5});
   drawField(form,pages[0],'CLASSE',data.classe||'',{...common,size:8.6,min:5.5});
   drawField(form,pages[0],'ELEVE',[e.nom||'',e.prenom||''].filter(Boolean).join(' '),{...common,size:7,min:3.9});
   drawField(form,pages[0],'NAISSANCE',e.dateNaissance||'',{...common,size:7,min:5.2});
   drawField(form,pages[0],'ADRESSE_ELEVE',[e.adresse||'',[e.codePostal||'',e.ville||''].join(' ').trim()].filter(Boolean).join(' - '),{...common,size:6.6,min:4.2});
   drawField(form,pages[0],'TEL_ELEVE',e.telephone||'',{...common,size:6.7,min:4.8});
   drawField(form,pages[0],'EMAIL_ELEVE',e.courriel||'',{...common,size:6.2,min:4.1});
   drawField(form,pages[0],'DIPLOME',data.diplome||e.formation||'',{...common,size:7.2,min:4.5});
   drawField(form,pages[0],'ETABLISSEMENT',et.libelle||'',{...common,size:6.1,min:4.0,color:orange});
   drawField(form,pages[0],'ADRESSE_ETAB',et.adresse||'',{...common,size:5.8,min:3.8,bold:false});
   drawField(form,pages[0],'PROVISEUR',et.proviseur||'',{...common,size:6.2,min:4.2});
   drawField(form,pages[0],'FONCTION_PROVISEUR',et.fonctionProviseur||'',{...common,size:5.9,min:4.2,bold:false});
   drawField(form,pages[0],'PROF_REFERENT',data.professeurReferent||'',{...common,size:6.2,min:4.0});
   drawField(form,pages[0],'EMAIL_PROF',data.professeurReferentEmail||'',{...common,size:5.9,min:4.0,bold:false});
   drawField(form,pages[1],'PROF_REFERENT_SIGNATURE',data.professeurReferent||'',{...common,size:5.6,min:3.8});
   drawField(form,pages[1],'REFERENCE',data.reference||'',{...common,size:5,min:3.3,bold:false});
   drawQR(pages[0],data.formUrl);
   const rest=form.getFields().slice();rest.forEach(f=>form.removeField(f));
   return await pdf.save({useObjectStreams:false});
  }
  let finalBytes;
  if(PAYLOAD.items.length===1){status.textContent='Fusion de la convention…';finalBytes=await buildOne(PAYLOAD.items[0]);}
  else{
   const out=await PDFDocument.create();
   for(let i=0;i<PAYLOAD.items.length;i++){status.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const oneBytes=await buildOne(PAYLOAD.items[i]),one=await PDFDocument.load(oneBytes),cp=await out.copyPages(one,[0,1]);out.addPage(cp[0]);out.addPage(cp[1]);}
   finalBytes=await out.save({useObjectStreams:false});
  }
  const url=URL.createObjectURL(new Blob([finalBytes],{type:'application/pdf'}));download.href=url;download.download=PAYLOAD.filename||'Convention_PFMP.pdf';printBtn.onclick=()=>window.open(url,'_blank');actions.hidden=false;status.className='status ok';status.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.105 — AcroForm + QR unique vérifié côté serveur — '+(PAYLOAD.version||'');
 }catch(e){console.error(e);status.className='status err';status.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
