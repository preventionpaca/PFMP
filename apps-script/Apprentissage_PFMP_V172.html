<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--g:#079669;--bg:#f5fbf8;--line:#cde7df;--mut:#667085;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17243b}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.top h1{margin:0;color:#064e3b}.back{color:#087f70;font-weight:800;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}.filters{display:grid;grid-template-columns:220px 260px 1fr 190px auto;gap:10px;align-items:end}.filters label{font-weight:700;font-size:13px}.filters select,.filters input{width:100%;margin-top:4px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.status{margin-top:10px;font-size:13px;font-weight:700;color:var(--mut)}.status.err{color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:8px;border-bottom:1px solid #e7efec;text-align:left;vertical-align:top}th{font-size:11px;color:#667085}.student{font-weight:800}.badge{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900}.save{border:0;border-radius:8px;padding:8px 11px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.save:disabled{opacity:.5}.cell input{width:100%;padding:6px;border:1px solid #d4dde5;border-radius:6px}.check{width:20px;height:20px}.hidden{display:none!important}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.top{display:block}.back{display:inline-block;margin-top:8px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Gestion des apprentis</h1><div>Lecture directe des classes et des contrats — sans dépendre du snapshot de chargement.</div></div><a id="back" class="back" href="#">← Accueil PFMP</a></div>
<section class="panel"><div class="filters"><label>Année scolaire<select id="year"><option>Chargement…</option></select></label><label>Classe<select id="classe"><option>Chargement…</option></select></label><label>Entreprise<input id="companyFilter" placeholder="Filtrer par entreprise"></label><label>Apprenti jusqu’au<input id="until" type="date"></label><button id="refresh" class="save" type="button">Actualiser</button></div><div id="status" class="status">Chargement des années et des classes…</div></section>
<section id="results" class="panel hidden"><div class="table-wrap"><table><thead><tr><th>Élève</th><th>Apprenti</th><th>Début</th><th>Fin</th><th>Entreprise</th><th>Tuteur</th><th>Tél.</th><th>Courriel</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main><script>
(function(){'use strict';
// EUC_DEV334_DOM_REFS
var year=document.getElementById('year');
var classe=document.getElementById('classe');
var companyFilter=document.getElementById('companyFilter');
var until=document.getElementById('until');
var refresh=document.getElementById('refresh');
var status=document.getElementById('status');
var results=document.getElementById('results');
var tbody=document.getElementById('tbody');
var back=document.getElementById('back');

if(
  !year||!classe||!companyFilter||!until||
  !refresh||!status||!results||!tbody||!back
){
  throw new Error('DEV334 : éléments DOM apprentissage manquants.');
}

var data=null;function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}function setStatus(t,err){status.textContent=t;status.className='status'+(err?' err':'');}function home(){var u=new URL(location.href);u.search='';u.searchParams.set('page','admin-pfmp');back.href=u.toString();}function fill(d){data=d||{};var years=d.annees||[];year.innerHTML=years.map(function(x){var code=typeof x==='string'?x:(x.code||x.Code||'');var lab=typeof x==='string'?x:(x.libelle||x.Libelle||code);return '<option value="'+esc(code)+'"'+(code===d.annee?' selected':'')+'>'+esc(lab)+'</option>';}).join('');classe.innerHTML=(d.classes||[]).map(function(x){return '<option value="'+Number(x.id)+'"'+(Number(x.id)===Number(d.classeId)?' selected':'')+'>'+esc(x.nom)+'</option>';}).join('');render();}
function visible(x){var q=String(companyFilter.value||'').trim().toUpperCase(),limit=until.value||'';if(q&&String(x.entreprise||'').toUpperCase().indexOf(q)<0)return false;if(limit&&x.apprenti&&x.fin&&x.fin>limit)return false;return true;}
function render(){var rows=(data&&data.eleves||[]).filter(visible);results.classList.remove('hidden');tbody.innerHTML=rows.map(function(x){return '<tr data-id="'+x.id+'" data-record="'+Number(x.recordId||0)+'"><td><div class="student">'+esc(x.nom+' '+x.prenom)+'</div>'+(x.apprenti?'<span class="badge">APPRENTI</span>':'')+'</td><td><input class="check app" type="checkbox"'+(x.apprenti?' checked':'')+'></td><td class="cell"><input class="deb" type="date" value="'+esc(x.debut||'')+'"></td><td class="cell"><input class="fin" type="date" value="'+esc(x.fin||'')+'"></td><td class="cell"><input class="ent" value="'+esc(x.entreprise||'')+'"></td><td class="cell"><input class="tut" value="'+esc(x.tuteur||'')+'"></td><td class="cell"><input class="tel" value="'+esc(x.tel||'')+'"></td><td class="cell"><input class="mail" value="'+esc(x.mail||'')+'"></td><td><button class="save saveRow" type="button">OK</button></td></tr>';}).join('');Array.from(document.querySelectorAll('.saveRow')).forEach(function(b){b.onclick=function(){var r=b.closest('tr');b.disabled=true;setStatus('Enregistrement de '+r.querySelector('.student').textContent+'…');google.script.run.withSuccessHandler(function(){b.disabled=false;load();}).withFailureHandler(function(e){b.disabled=false;setStatus('Erreur : '+String(e&&e.message||e),true);}).EUC_DEV334_appSave({annee:year.value,eleve:Number(r.dataset.id),recordId:Number(r.dataset.record),apprenti:r.querySelector('.app').checked,debut:r.querySelector('.deb').value,fin:r.querySelector('.fin').value,entreprise:r.querySelector('.ent').value,tuteur:r.querySelector('.tut').value,tel:r.querySelector('.tel').value,mail:r.querySelector('.mail').value});};});setStatus(rows.length+' élève(s) affiché(s).');}
function load(){refresh.disabled=true;setStatus('Chargement…');google.script.run.withSuccessHandler(function(d){refresh.disabled=false;fill(d);}).withFailureHandler(function(e){refresh.disabled=false;setStatus('Erreur de chargement : '+String(e&&e.message||e),true);}).EUC_DEV334_appData({annee:year.value&&year.value!=='Chargement…'?year.value:'',classe:Number(classe.value)||0});}
year.onchange=function(){classe.value='';load();};classe.onchange=load;companyFilter.oninput=render;until.onchange=render;refresh.onclick=load;home();load();
})();</script></body></html>
