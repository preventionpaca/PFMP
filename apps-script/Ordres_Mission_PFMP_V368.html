<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#087f70;--bg:#f4f8f7;--line:#cfe5de;--mut:#667085;--ink:#17352f;--soft:#eef8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1d2939}
.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:26px 0}.wrap{max-width:1450px;margin:auto;padding:0 22px}.hero h1{margin:0 0 6px;font-size:29px}.hero .sub{opacity:.9}main.wrap{padding-top:20px;padding-bottom:35px}
.crumb{margin-bottom:16px}.crumb a{color:var(--g);font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.filters{display:grid;grid-template-columns:160px 160px 220px 1fr auto;gap:10px;align-items:end}label{font-size:12px;font-weight:800;color:var(--mut)}select{width:100%;padding:9px;border:1px solid #b9cfc9;border-radius:8px;background:#fff}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:38px}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid #9fcfc3}
button:disabled{opacity:.65;cursor:wait}.spinner{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
.status{margin-top:12px;color:var(--mut)}.mission{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:#fff}.mission-head{display:flex;justify-content:space-between;align-items:flex-start;background:var(--soft);padding:13px 15px}.mission-title{font-size:18px;font-weight:900;color:var(--ink)}
.mission-sub{font-size:12px;color:var(--mut);margin-top:4px}.mission-tools{display:flex;gap:8px;align-items:center}.mail-prof{padding:6px 10px;min-height:auto;font-size:12px}.badge{background:#dff5ee;color:#086856;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-top:1px solid #edf2f0;text-align:left}th{font-size:12px;color:var(--mut);background:#fbfdfc}.student{font-weight:800}.row-save{display:block;min-height:15px;margin-top:4px;font-size:11px;color:var(--mut)}.row-save.ok{color:#087f70}.row-save.err{color:#b42318}.actions{padding:12px 15px;display:flex;gap:10px;align-items:center;justify-content:flex-end}.actions label{display:flex;gap:7px;align-items:center}.actions select{min-width:250px}.empty{text-align:center;padding:28px;color:var(--mut)}
.model-settings summary{cursor:pointer;font-weight:900;color:var(--ink)}.model-grid{display:grid;grid-template-columns:180px 1fr 2fr auto auto;gap:10px;align-items:end;margin-top:14px}.model-list{margin-top:12px;color:var(--mut);font-size:13px}.model-list span{display:inline-block;margin:3px 6px 3px 0;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
</style></head><body>
<header class="hero"><div class="wrap"><h1>Ordres de mission — visites PFMP</h1><div class="sub">Préparation des visites par professeur visiteur, classe et période. Chaque PDF comprend l’ordre de mission puis le récapitulatif horaire.</div></div></header>
<main class="wrap"><div class="crumb"><a id="back">← Accueil PFMP</a></div>
<section class="card"><div class="filters"><div><label>Année scolaire</label><select id="year"></select></div><div><label>Famille</label><select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></div><div><label>Classe</label><select id="classe"><option value="">Toutes classes</option></select></div><div><label>Période</label><select id="periode"><option value="">Toutes périodes</option></select></div><button id="load" class="primary">Afficher</button></div><div id="status" class="status"></div></section>
<details class="card model-settings"><summary>Gérer les modèles d’ordre de mission</summary><div class="model-grid"><div><label>Famille</label><select id="modelFamily"><option value="TOUS">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></div><div><label>Nom du modèle</label><input id="modelLabel" placeholder="Ex. Modèle BTS" style="width:100%;padding:9px;border:1px solid #b9cfc9;border-radius:8px"></div><div><label>Lien du document Google Docs</label><input id="modelDocument" placeholder="https://docs.google.com/document/d/…" style="width:100%;padding:9px;border:1px solid #b9cfc9;border-radius:8px"></div><label style="padding-bottom:10px"><input id="modelDefault" type="checkbox" checked> Par défaut</label><button id="saveModel" class="secondary">Ajouter</button></div><div id="modelStatus" class="status"></div><div id="modelList" class="model-list"></div></details>
<section id="results" class="card"><div class="empty">Sélectionnez les filtres puis cliquez sur Afficher.</div></section></main>
<script>
const B=<?!= bootJson ?>;let CAT={classes:[]},Q=null,G=[],MODELS=[];const statusEl=document.getElementById('status');back.href=B.baseUrl+'?page=admin-pfmp';year.innerHTML=(B.years||[]).map(x=>'<option '+(x===B.current?'selected':'')+'>'+x+'</option>').join('');
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function busy(btn,on,label){if(on){btn.dataset.old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'+label}else{btn.disabled=false;btn.innerHTML=btn.dataset.old||btn.innerHTML}}
function cat(){google.script.run.withSuccessHandler(function(d){CAT=d||{classes:[]};fc()}).EUC_DEV368_catalog(year.value)}function fc(){let a=CAT.classes||[];if(family.value)a=a.filter(x=>x.famille===family.value);classe.innerHTML='<option value="">Toutes classes</option>'+a.map(x=>'<option value="'+x.classeId+'">'+esc(x.classe)+'</option>').join('');fp()}function fp(){let c=(CAT.classes||[]).find(x=>String(x.classeId)===String(classe.value));periode.innerHTML='<option value="">Toutes périodes</option>'+((c&&c.periodes)||[]).map(p=>'<option value="'+p.id+'">'+esc(p.libelle)+'</option>').join('')}family.onchange=fc;classe.onchange=fp;year.onchange=cat;
const M=['','Bus','Tram','Train','Véhicule personnel','Visio'];
function modelOptions(g){let list=MODELS.filter(x=>x.famille==='TOUS'||x.famille===g.famille),preferred=list.find(x=>x.defaut&&x.famille===g.famille)||list.find(x=>x.defaut&&x.famille==='TOUS')||list[0];return list.map(x=>'<option value="'+esc(x.id)+'" '+(preferred&&preferred.id===x.id?'selected':'')+'>'+esc(x.label)+(x.famille==='TOUS'?'':' — '+esc(x.famille))+'</option>').join('')}
function showModels(){modelList.innerHTML=MODELS.map(x=>'<span>'+esc(x.label)+' · '+esc(x.famille)+(x.defaut?' · défaut':'')+'</span>').join('')}
function loadModels(done){google.script.run.withSuccessHandler(function(r){MODELS=(r&&r.models)||[];showModels();if(done)done()}).withFailureHandler(function(e){modelStatus.textContent='Erreur : '+(e&&e.message||e)}).EUC_DEV436_listMissionModels()}
function render(){if(!G.length){results.innerHTML='<div class="empty">Aucun professeur visiteur / élève conventionné ou apprenti pour ce filtre.</div>';return}results.innerHTML=G.map((g,gi)=>'<section class="mission"><div class="mission-head"><div><div class="mission-title">'+esc(g.professeur)+' — '+esc(g.classe)+'</div><div class="mission-sub">'+esc(g.periode)+' · '+esc(g.debut||'')+' → '+esc(g.fin||'')+'</div></div><div class="mission-tools"><button class="secondary mail-prof" data-g="'+gi+'">Envoyer par e-mail</button><span class="badge">'+g.lignes.length+' visite(s)</span></div></div><table><thead><tr><th>Élève</th><th>Entreprise</th><th>Adresse</th><th>Moyen de transport</th></tr></thead><tbody>'+g.lignes.map((x,xi)=>'<tr><td class="student">'+esc(x.eleve)+'</td><td>'+esc(x.entreprise||'—')+'</td><td>'+esc(x.adresse||'—')+'</td><td><select data-g="'+gi+'" data-x="'+xi+'">'+M.map(m=>'<option value="'+esc(m)+'" '+(m===x.transport?'selected':'')+'>'+(m||'— à définir —')+'</option>').join('')+'</select><span class="row-save" data-save="'+gi+'-'+xi+'" aria-live="polite"></span></td></tr>').join('')+'</tbody></table><div class="actions"><label>Modèle <select class="mission-model">'+modelOptions(g)+'</select></label><button class="primary pdf" data-g="'+gi+'">Générer PDF</button></div></section>').join('');document.querySelectorAll('select[data-g]').forEach(function(s){s.onchange=function(){let g=G[+s.dataset.g],x=g.lignes[+s.dataset.x],msg=document.querySelector('[data-save="'+s.dataset.g+'-'+s.dataset.x+'"]');x.transport=s.value;s.disabled=true;msg.className='row-save';msg.textContent='Enregistrement…';google.script.run.withSuccessHandler(function(){s.disabled=false;msg.className='row-save ok';msg.textContent='Enregistré'}).withFailureHandler(function(e){s.disabled=false;msg.className='row-save err';msg.textContent='Échec de l’enregistrement';alert(e&&e.message||e)}).EUC_DEV368_sauverTransport({annee:year.value,classeId:g.classeId,classe:g.classe,periodeId:g.periodeId,periode:g.periode,eleveId:x.eleveId,eleve:x.eleve,professeur:g.professeur,transport:x.transport,missionToken:g.pdfToken})}});document.querySelectorAll('.mail-prof').forEach(function(b){b.onclick=function(){let g=G[+b.dataset.g],payload={...Q,groupKey:g.key,missionToken:g.pdfToken};busy(b,true,'Préparation…');google.script.run.withSuccessHandler(function(p){busy(b,false);if(!confirm('Envoyer à '+p.to+' ?\n\nObjet : '+p.subject+'\n\n'+p.body))return;busy(b,true,'Envoi…');google.script.run.withSuccessHandler(function(r){busy(b,false);statusEl.textContent='Message envoyé à '+r.to+'.'}).withFailureHandler(function(e){busy(b,false);statusEl.textContent='Échec de l’envoi.';alert(e&&e.message||e)}).EUC_DEV440_sendMissionTransportEmail(payload)}).withFailureHandler(function(e){busy(b,false);alert(e&&e.message||e)}).EUC_DEV440_prepareMissionTransportEmail(payload)}});document.querySelectorAll('.pdf').forEach(function(b){b.onclick=function(){let g=G[+b.dataset.g],model=b.closest('.actions').querySelector('.mission-model').value;busy(b,true,'Génération PDF…');statusEl.textContent='Génération du document en cours…';google.script.run.withSuccessHandler(function(r){busy(b,false);statusEl.textContent='PDF généré en '+((Number(r.generationMs)||0)/1000).toFixed(1)+' s.';let a=document.createElement('a');a.href='data:'+r.mime+';base64,'+r.base64;a.download=r.name;a.click()}).withFailureHandler(function(e){busy(b,false);statusEl.textContent='Erreur de génération.';alert(e&&e.message||e)}).EUC_DEV436_pdfMission({...Q,groupKey:g.key,modelId:model,missionToken:g.pdfToken})}})}
saveModel.onclick=function(){busy(saveModel,true,'Ajout…');modelStatus.textContent='Vérification du document…';google.script.run.withSuccessHandler(function(r){busy(saveModel,false);MODELS=r.models||[];showModels();modelStatus.textContent='Modèle ajouté.';modelLabel.value='';modelDocument.value='';if(G.length)render()}).withFailureHandler(function(e){busy(saveModel,false);modelStatus.textContent='Erreur : '+(e&&e.message||e)}).EUC_DEV436_saveMissionModel({famille:modelFamily.value,label:modelLabel.value,documentId:modelDocument.value,defaut:modelDefault.checked})};
load.onclick=function(){busy(load,true,'Chargement…');statusEl.textContent='Lecture des conventions et affectations visiteurs…';Q={annee:year.value,famille:family.value,classeId:Number(classe.value)||0,periodeId:Number(periode.value)||0};google.script.run.withSuccessHandler(function(d){busy(load,false);G=d.groups||[];statusEl.textContent=G.length+' ordre(s) de mission à préparer.';render()}).withFailureHandler(function(e){busy(load,false);statusEl.textContent='Erreur : '+(e&&e.message||e)}).EUC_DEV374_missions(Q)};cat();loadModels();
</script></body></html>
