<!doctype html>
<html lang="fr">
<head>
<base target="_self">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#0b8f72;--bg:#f7fbf9;--line:#cfe5de;--mut:#667085;--red:#d92d20;--orange:#e67e00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17312b}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:24px}
h1{color:#0f4035;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--g)}
.title{font-size:22px;font-weight:800;color:#0c5f4e}
.meta{font-size:12px;color:var(--mut);margin:6px 0 12px}
.period{border-top:1px solid #edf2ef;padding:9px 0}
.row{display:flex;justify-content:space-between;gap:10px}
.count{font-weight:800}.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--g)}
.go{display:inline-block;margin-top:10px;background:var(--g);color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>

<style id="EUC_DEV178_EMBED_FIX">
html.euc-atrium-embedded body{
  padding-top:92px!important;
}
</style>
<script id="EUC_DEV178_EMBED_FIX_JS">
(function(){
  try{
    if(window.self!==window.top){
      document.documentElement.classList.add('euc-atrium-embedded');
    }
  }catch(e){
    document.documentElement.classList.add('euc-atrium-embedded');
  }
})();
</script>

</head>
<body>
<header class="hero"><div class="wrap"><h1>Point sur les stages</h1></div></header>
<main class="wrap">
<label>Année scolaire <select id="year"></select></label>
<div id="grid" class="grid"></div>
</main>
<script>
const C=<?!= config ?>;
const REQUESTED_YEAR=<?!= requestedYear ?>;

(function(){
  function currentYear(){
    const d=new Date(),y=d.getFullYear(),a=d.getMonth()+1>=9?y:y-1;
    return a+'-'+(a+1);
  }
  function col(p){
    const n=Number(p.total)||0,r=n?100*(Number(p.conventions)||0)/n:0;
    return r>=100?'green':(r>=65?'orange':'red');
  }

  const active=REQUESTED_YEAR||currentYear(),y0=Number(active.slice(0,4));
  year.innerHTML=[y0-1,y0,y0+1].map(y=>{
    const c=y+'-'+(y+1);
    return '<option value="'+c+'"'+(c===active?' selected':'')+'>'+c+'</option>';
  }).join('');
  year.onchange=()=>location.href=C.baseUrl+'?page=suivi-conventions-public&annee='+encodeURIComponent(year.value);

  google.script.run.withSuccessHandler(function(fams){
    grid.innerHTML=(fams||[]).map(f=>{
      const href=C.baseUrl+'?page=suivi-conventions-public-famille&annee='+encodeURIComponent(active)+'&famille='+encodeURIComponent(f.code);
      return '<a class="card" href="'+href+'">'+
        '<div class="title">'+f.libelle+'</div>'+
        '<div class="meta">'+(f.classes||0)+' classe(s) · '+(f.effectif||0)+' élève(s) · '+(f.apprentis||0)+' apprenti(s)</div>'+
        (f.periodes||[]).map(p=>'<div class="period"><div class="row"><b>'+p.libelle+'</b><span class="count '+col(p)+'">'+p.conventions+' / '+p.total+'</span></div></div>').join('')+
        '<span class="go">Voir les classes</span>'+
      '</a>';
    }).join('');
  }).EUC_DEV176_resumeFamilles({annee:active});
})();
</script>
</body>
</html>
