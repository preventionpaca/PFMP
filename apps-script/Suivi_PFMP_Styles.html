<style>:root{font-family:Arial,sans-serif;color:#073b35;background:#eef7f4}body{margin:0}main{max-width:1450px;margin:auto;padding:2rem}h1{font-size:clamp(2rem,5vw,4rem);margin:.2rem 0}.eyebrow{font-weight:700;color:#07866e}.test-banner{display:grid;gap:.4rem;margin:1rem 0;padding:1rem;border:4px solid #9a5b00;background:#fff0b3;color:#5c3500;border-radius:.7rem}#status{padding:.8rem;background:#fff4c2;border-radius:.6rem}.toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;margin:1rem 0}.quick{display:flex;flex-wrap:wrap;gap:.5rem}label{display:grid;gap:.3rem;font-weight:700}input,select,button{font:inherit;padding:.65rem;border:1px solid #83b7ab;border-radius:.45rem}button{cursor:pointer;background:#07866e;color:#fff;font-weight:700}#breadcrumb{padding:.7rem 0;font-weight:700}.back{background:#426d65;margin:.5rem}.list-head{display:flex;gap:.5rem}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7rem;background:#fff;padding:1rem;border-radius:.7rem}#table-loading{padding:.8rem;margin:.8rem 0;background:#dff2ed}.table-wrap{overflow:auto;background:#fff;border-radius:.8rem}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:.7rem;text-align:left;border-bottom:1px solid #d8e8e4}th{background:#dff2ed}.badge{display:inline-block;padding:.25rem .5rem;border-radius:999px;background:#e3ecea}.exit{background:#ffe0d5;color:#7b2600}.present{background:#dff4df}.pager{display:flex;justify-content:center;align-items:center;gap:1rem;margin:1rem}footer{text-align:center;margin-top:1rem;color:#4c706b}.compact-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.compact-tabs button[aria-selected="true"],.compact-tabs button[aria-pressed="true"]{background:#fff;color:#073b35;border:3px solid #07866e}.selector-layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(380px,1.25fr);gap:1rem;align-items:start}.class-panel,.period-panel{background:#fff;padding:1rem;border-radius:.8rem;min-height:360px}.compact-cla
