<style>
    .eff-tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
    .eff-tuile{text-align:left;border:1px solid #cfe3dc;border-radius:12px;background:#f3faf7;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
    .eff-tuile[aria-pressed="true"]{background:#0f766e;color:#fff;border-color:#0f766e}
    .eff-tuile .nom{font-weight:800;font-size:1.02rem}.eff-tuile .gros{font-size:1.7rem;font-weight:800;line-height:1.1;margin:4px 0}
    .eff-tuile .det{font-size:.78rem;opacity:.85}
    .eff-total{background:#fff7e6;border-color:#f3d9a4}
    .eff-vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
    .eff-v{border:1px solid #dce3ea;border-radius:10px;padding:8px 10px;background:#fff}
    button.eff-v{text-align:left;font:inherit;color:inherit;cursor:pointer}button.eff-v:hover{border-color:#0f766e}button.eff-v[aria-expanded="true"]{border-color:#0f766e;box-shadow:0 0 0 2px #99d5cc}
    .eff-v .voir{display:block;font-size:.72rem;color:#0f766e;font-weight:700;margin-top:5px}
    .eff-liste{border:1px solid #99d5cc;border-radius:10px;background:#fff;padding:10px 12px;margin-top:10px}.eff-liste h3{margin:0;font-size:1rem}
    .eff-v b{display:block}.eff-v .badge{font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 5px;background:#eef2f6;color:#475569}
    .bulles{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
    .bulle{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:50%;font-weight:800;font-size:.95rem;line-height:1}
    .bulle small{font-size:.55rem;font-weight:700;margin-top:2px}
    .b-sco{background:#e0f2fe;color:#075985}.b-app{background:#fde7c7;color:#92400e}.b-ent{background:#dcfce7;color:#166534}.b-nr{background:#f1f5f9;color:#475569}
</style>
<script>
/* DEV736 — Rendu du bloc « Effectifs » (tuiles, vignettes, liste des jeunes d'une classe entière), partagé par
 * l'accueil d'administration et le tableau de bord de la direction : mêmes chiffres, même présentation. */
window.EUC736=(function(){'use strict';
var CHOIX='',CLASSE=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var MODE={CLASSE_ENTIERE:'Classe entière',FORMATION_CONTINUE:'Formation continue',MIXITE:'Mixité'};
function bulles(c,ce){return '<div class="bulles">'+(ce?'':'<span class="bulle b-sco">'+c.scolaires+'<small>scol.</small></span>')+'<span class="bulle b-app">'+(c.mode==='FORMATION_CONTINUE'?c.stagiaires:c.apprentis)+'<small>'+(c.mode==='FORMATION_CONTINUE'?'stag.':'appr.')+'</small></span><span class="bulle b-ent">'+c.entreprises+'<small>entr.</small></span>'+(c.entreprisesNonRenseignees?'<span class="bulle b-nr" title="Apprentis sous contrat sans employeur identifié (un jeune = une entreprise)">'+c.entreprisesNonRenseignees+'<small>non rens.</small></span>':'')+'</div>';}
/* DEV732 : établissement (LP, LGT) → apprentis en mixité + apprentis des classes entières rattachées ; organisme → classes dédiées, apprentis, entreprises. */
/* DEV735 : entreprises = estimation (identifiées + apprentis sans employeur identifié + stagiaires FC, un jeune = une entreprise). */
function entr(t){if(t.entreprises==null)return '';var nr=t.entreprisesNonRenseignees||0,st=t.stagiaires||0;if(!nr&&!st)return ' · '+t.entreprises+' entreprise(s)';return ' · ≈ '+(t.entreprisesEstimees!=null?t.entreprisesEstimees:t.entreprises+nr+st)+' entreprise(s) : '+t.entreprises+' identifiée(s)'+(nr?' + '+nr+' non renseignée(s)':'')+(st?' + '+st+' stagiaire(s) FC':'');}
function detail(t){var fc=t.stagiaires?' · '+t.stagiaires+' stagiaire(s) FC':'',en=entr(t);
  if(t.general)return t.classes+' classe(s) · '+t.scolaires+' scolaire(s) · '+t.apprentis+' apprenti(s) ('+(t.apprentisMixite||0)+' en mixité, '+(t.apprentisClasseEntiere||0)+' en classe entière)'+fc+en;
  if(t.etablissement)return t.classes+' classe(s) · '+t.scolaires+' scolaire(s) · '+t.apprentisMixite+' apprenti(s) en mixité · '+t.apprentisClasseEntiere+' apprenti(s) en classe entière rattachée(s)'+(t.classesRattachees&&t.classesRattachees.length?' ('+esc(t.classesRattachees.join(', '))+')':'')+fc+en;
  if(t.organisme)return t.classes+' classe(s) dédiée(s) · '+t.apprentis+' apprenti(s)'+fc+en;
  return t.classes+' classe(s) · '+t.scolaires+' scolaire(s) · '+t.apprentis+' apprenti(s)'+fc+en;}
function tuile(nom,t,cl){return '<button type="button" class="eff-tuile '+(cl||'')+'" data-g="'+esc(nom)+'" aria-pressed="'+(CHOIX===nom)+'"><span class="nom">'+esc(nom)+'</span><div class="gros">'+t.effectif+'</div><div class="det">'+detail(t)+'</div></button>';}
function rendre(D,tuiles,classes){
  tuiles.innerHTML=tuile('Total',D.total,'eff-total')+D.groupes.map(function(g){return tuile(g.nom,g.totaux);}).join('');
  var g=D.groupes.filter(function(x){return x.nom===CHOIX;})[0];
  /* DEV635 : une classe entière se déplie (jeunes, entreprise, tuteur ; même couleur = même entreprise). */
  var ouverte=g&&g.classes.filter(function(c){return c.id===CLASSE&&c.liste;})[0];
  classes.innerHTML=g?'<div class="eff-vignettes">'+g.classes.map(function(c){var ce=c.mode==='CLASSE_ENTIERE'||c.mode==='FORMATION_CONTINUE',corps='<b>'+esc(c.nom)+'</b><span class="badge">'+esc(MODE[c.mode]||c.mode)+(ce&&c.opco?' · '+esc(c.opco)+(c.organismes.filter(function(o){return o!==c.opco;}).length?' (avec '+esc(c.organismes.filter(function(o){return o!==c.opco;}).join(' + '))+')':''):'')+'</span><div class="det">'+c.effectif+' élève(s)</div>'+bulles(c,ce);return c.liste?'<button type="button" class="eff-v" data-c="'+c.id+'" aria-expanded="'+(ouverte===c)+'">'+corps+'<span class="voir">'+(ouverte===c?'▲ Masquer les jeunes':'▼ Voir les jeunes et leurs entreprises')+'</span></button>':'<div class="eff-v">'+corps+'</div>';}).join('')+'</div>'+(ouverte&&window.EUC635?'<div class="eff-liste a635"><h3>'+esc(ouverte.nom)+' — '+ouverte.liste.length+' jeune(s)</h3>'+EUC635.tableau(ouverte,EUC635.entreprises([].concat.apply([],D.groupes.map(function(x){return x.classes;}))))+EUC635.LEGENDE+'</div>':''):'';
  Array.prototype.forEach.call(classes.querySelectorAll('button.eff-v'),function(b){b.onclick=function(){var id=Number(b.getAttribute('data-c'));CLASSE=CLASSE===id?0:id;rendre(D,tuiles,classes);};});
  Array.prototype.forEach.call(tuiles.querySelectorAll('.eff-tuile'),function(b){b.onclick=function(){var n=b.getAttribute('data-g');CHOIX=(CHOIX===n||n==='Total')?'':n;CLASSE=0;rendre(D,tuiles,classes);};});
}
return{rendre:rendre,detail:detail,entr:entr,bulles:bulles,esc:esc};
})();
</script>
