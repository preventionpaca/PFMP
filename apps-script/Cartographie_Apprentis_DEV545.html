<!doctype html>
<html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartographie des apprentis</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhHdWqK6MZUkMZ2d2I8LPwVfvE=" crossorigin="">
<style>
:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--ink:#172b27;--mut:#667085;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:24px}.hero h1{margin:0 0 6px}.hero p{margin:0}.wrap{max-width:1500px;margin:auto;padding:16px}.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.crumbs a{color:var(--g);font-weight:800;text-decoration:none}.readonly{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf7f3;color:#075f55;font-size:13px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:220px minmax(240px,1fr) auto;gap:10px;align-items:end}label{display:grid;gap:5px;font-size:14px;font-weight:800;color:var(--mut)}select{width:100%;padding:10px;border:1px solid #aacfc5;border-radius:8px;background:#fff;font-size:15px}button{border:0;border-radius:8px;padding:11px 16px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.62;cursor:wait}.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}#status{margin-top:10px;color:var(--mut)}#status.error{color:var(--danger);font-weight:800}#map{height:calc(100vh - 330px);min-height:520px;border-radius:12px}.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}.popup-title{font-weight:900;font-size:15px;margin-bottom:3px}.popup-count{margin:7px 0;font-weight:900;color:#075f55}.popup-history{max-height:230px;overflow:auto;border-top:1px solid #dbeae6;margin-top:8px;padding-top:6px}.popup-person{padding:7px 0;border-bottom:1px solid #edf1f0}.popup-person:last-child{border-bottom:0}.popup-person strong{display:block}.popup-person small{display:block;color:#475467;margin-top:2px}.route-link{display:inline-block;margin-bottom:8px;padding:6px 9px;border-radius:7px;background:#087f70;color:#fff!important;font-weight:800;text-decoration:none}@media(max-width:700px){.filters{grid-template-columns:1fr}#map{height:65vh;min-height:440px}}
</style></head><body>
<header class="hero"><div class="wrap"><h1>Cartographie des apprentis</h1><p>Implantation des entreprises accueillant actuellement des apprentis.</p></div></header>
<main class="wrap"><nav class="crumbs" aria-label="Fil d’Ariane"><span id="adminCrumb"><a id="home" target="_top">Accueil PFMP</a> <span>›</span> </span><a id="back" target="_top">Gestion des apprentis</a><span>›</span><strong>Cartographie</strong><span class="readonly">Lecture seule</span></nav>
<section class="card"><div class="filters"><label>Année scolaire<select id="year"></select></label><label>Classe<select id="classe"><option value="">Toutes les classes actives</option></select></label><button id="show" type="button">Afficher</button></div><div id="status" role="status"></div></section>
<section class="card"><div id="map" aria-label="Carte des entreprises accueillant des apprentis"></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const BOOT=<?!= bootJson ?>,$=id=>document.getElementById(id);let map=L.map('map').setView([43.71,7.26],10),layer=L.layerGroup().addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function busy(on){let b=$('show');if(!b.dataset.label)b.dataset.label=b.textContent;b.disabled=!!on;b.innerHTML=on?'<span class="spin"></span>Chargement…':esc(b.dataset.label)}
function routeLink(x){let lat=Number(x.latitude),lon=Number(x.longitude);if(!isFinite(lat)||!isFinite(lon))return'';return '<a class="route-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&amp;destination='+encodeURIComponent(lat+','+lon)+'">Itinéraire depuis ma position</a>'}
function popup(p){let html='<div class="popup-title">'+esc(p.entreprise)+'</div><div>'+esc(p.adresse)+'</div><div class="popup-count">'+Number(p.apprentis||0)+' apprenti'+(Number(p.apprentis||0)>1?'s':'')+'</div>'+routeLink(p);if(BOOT.mode==='ADMIN'){html+='<div class="popup-history">'+(p.details||[]).map(d=>'<div class="popup-person"><strong>'+esc(d.eleve)+'</strong><small>'+esc(d.annee)+' · '+esc(d.classe)+'</small><small>Professeur visiteur : '+esc((d.professeursVisiteurs||[]).join(', ')||'Non renseigné')+'</small></div>').join('')+'</div>'}return html}
function render(data){layer.clearLayers();let selected=$('classe').value,bounds=[];$('classe').innerHTML='<option value="">Toutes les classes actives</option>'+(data.classes||[]).map(c=>'<option value="'+Number(c.id||0)+'">'+esc(c.classe)+'</option>').join('');if([...$('classe').options].some(o=>o.value===selected))$('classe').value=selected;(data.points||[]).forEach(p=>{let marker=L.marker([p.latitude,p.longitude]).bindPopup(popup(p),{maxWidth:460});marker.addTo(layer);bounds.push([p.latitude,p.longitude])});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:14});else map.setView([43.71,7.26],10);requestAnimationFrame(()=>map.invalidateSize(true));setTimeout(()=>map.invalidateSize(true),180);$('status').className='';$('status').textContent=Number(data.total||0)+' entreprise(s) géolocalisée(s) pour ces filtres.'}
function load(){busy(true);$('status').className='';$('status').textContent='Chargement des positions…';let done=false,t=setTimeout(()=>{if(done)return;done=true;busy(false);$('status').className='error';$('status').textContent='Le serveur n’a pas répondu sous 20 secondes. Réessayez.'},20000);google.script.run.withSuccessHandler(data=>{if(done)return;done=true;clearTimeout(t);busy(false);render(data||{})}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(t);busy(false);$('status').className='error';$('status').textContent='Erreur : '+String(e&&e.message||e)}).EUC_DEV545_apprenticeMapData({annee:$('year').value,classeId:Number($('classe').value||0),mode:BOOT.mode})}
let years=(BOOT.years||[]).filter(Boolean),classes=BOOT.classes||[];$('year').innerHTML=years.map(y=>'<option value="'+esc(y)+'">'+esc(y)+'</option>').join('');$('year').value=BOOT.params&&BOOT.params.annee||BOOT.current||years[0]||'';$('classe').innerHTML+='<option disabled>──────────</option>'+classes.map(c=>'<option value="'+Number(c.id||0)+'">'+esc(c.classe||c.nom)+'</option>').join('');$('classe').value=String(BOOT.params&&BOOT.params.classeId||'');$('show').onclick=load;$('year').onchange=()=>{$('classe').value='';load()};if(BOOT.mode==='ADMIN')$('home').href='https://alternance.loucodi.fr/';else $('adminCrumb').remove();$('back').href=String(BOOT.webappUrl||location.href.split('?')[0])+'?page='+(BOOT.mode==='ADMIN'?'apprentissage-pfmp':'apprentissage-public-pfmp');load();
</script>
<script id="EUC_DEV556_APPRENTIS_MAP_NAV">
(function(){'use strict';if(BOOT.mode!=='PUBLIC')return;var ready=false,pending='',timer=0,allowed={'apprentissage-public-pfmp':1,'cartographie-apprentis-public-pfmp':1};function route(raw){try{var u=new URL(raw,location.href);return allowed[u.searchParams.get('page')||'']?u.toString():''}catch(e){return''}}function send(data){var w=window;for(var i=0;i<7;i++){try{w=w.parent;w.postMessage(data,'*')}catch(e){break}}}function go(){if(!pending)return;var url=pending;pending='';clearTimeout(timer);if(ready)send({type:'EUC_APPRENTIS_WRAPPER_NAVIGATE',url:url});else window.location.href=url}function navigate(raw){var url=route(raw);if(!url)return;pending=url;if(ready){go();return}send({type:'EUC_APPRENTIS_WRAPPER_QUERY'});clearTimeout(timer);timer=setTimeout(go,450)}window.EUC_DEV556_apprentisNavigate=navigate;addEventListener('message',function(ev){if(ev.data&&ev.data.type==='EUC_APPRENTIS_WRAPPER_READY'){ready=true;go()}});document.addEventListener('click',function(ev){var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null,url=a&&route(a.href);if(!url)return;ev.preventDefault();ev.stopImmediatePropagation();a.setAttribute('aria-busy','true');navigate(url)},true);send({type:'EUC_APPRENTIS_WRAPPER_QUERY'});setTimeout(function(){send({type:'EUC_APPRENTIS_WRAPPER_QUERY'})},120)})();
</script></body></html>
