<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>Suivi des conventions PFMP</title>
<style>:root{--g:#087f70;--bg:#f4fbf8;--line:#c9e7df;--red:#d92d20;--orange:#a66200}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17312b}.wrap{max-width:1120px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.title{font-size:28px;font-weight:900;color:#0c4f42}.back{font-weight:800;color:#087f70;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8efec;padding-bottom:10px;margin-bottom:7px}.fam{font-size:21px;font-weight:900;color:#066a56}.btn{border:0;border-radius:9px;background:#087f70;color:white;padding:9px 11px;font-weight:800;cursor:pointer}.level{padding:9px 0;border-top:1px solid #edf2f0}.level:first-of-type{border-top:0}.lt{font-weight:900;color:#0b6b58;margin-bottom:4px}.row{display:flex;justify-content:space-between;gap:9px;padding:3px 0;font-size:13px}.lab{font-weight:800}.count{font-weight:900;color:var(--red);text-align:right}.app{color:#087f70}.pdif{font-size:11px;font-weight:800;color:var(--orange);text-align:right}.foot{margin-top:16px;color:#667085;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="wrap"><div class="top"><div><div class="title">Suivi des conventions PFMP</div><div>Synthèse par niveau et période</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a class="back" id="home">← Accueil PFMP</a><a class="back" id="snapshot340" style="border:1px solid #9ed6ca;border-radius:9px;padding:8px 10px">Maintenance Snapshot</a></div></div><div class="grid" id="grid"></div><div class="foot" id="foot"></div></main>
<script>
(function(){'use strict';
const DATA=<?!= dataJson ?>;const P=<?!= paramsJson ?>;const BASE=<?!= JSON.stringify(baseUrl) ?>;
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
function apps(f,l){return f==='BTS'||(f==='BACPRO'&&(l==='Terminale'||l==='Première'));}
function row(f,l,p){const a=apps(f,l)?Number(p.apprentis||0):0;return '<div class="row"><span class="lab">'+esc(p.libelle)+'</span><span class="count">'+Number(p.conventions||0)+' / '+Number(p.eleves||0)+' élèves'+(apps(f,l)?' <span class="app">+ '+a+' apprenti(s)</span>':'')+'</span></div>';}
function level(f,l){let h='<section class="level"><div class="lt">'+esc(l.niveau)+'</div>';h+=(l.periodes||[]).map(p=>row(f,l.niveau,p)).join('');if(f==='BACPRO'&&l.niveau==='Terminale'&&l.pdif){h+='<div class="row"><span class="lab">P.dif.</span><span class="pdif">'+Number(l.pdif.lycee||0)+' lycée · '+Number(l.pdif.entreprise||0)+' entreprise · '+Number(l.pdif.aDefinir||0)+' à définir</span></div>';}return h+'</section>';}
function url(page,extra){const u=new URL(BASE);u.searchParams.set('page',page);u.searchParams.set('annee',P.annee||DATA.annee||'');Object.keys(extra||{}).forEach(k=>u.searchParams.set(k,extra[k]));return u.toString();}
function card(code,title){const d=(DATA.familles||{})[code]||{niveaux:[]};return '<section class="card"><div class="head"><span class="fam">'+title+'</span><button class="btn" data-fam="'+code+'">Voir les classes</button></div>'+(d.niveaux||[]).map(l=>level(code,l)).join('')+'</section>';}
document.getElementById('home').href=url('admin-pfmp',{});document.getElementById('grid').innerHTML=card('BACPRO','BAC PRO')+card('BTS','BTS')+card('CAP','CAP');document.querySelectorAll('[data-fam]').forEach(b=>b.onclick=()=>location.assign(url('suivi-conventions-famille',{famille:b.dataset.fam})));document.getElementById('foot').textContent='Année scolaire : '+(P.annee||DATA.annee||'');
})();
</script>
<style id='EUC_DEV339_LOADING_STYLE'>
#euc339Loading{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;background:rgba(247,251,249,.82)}
#euc339Loading.show{display:flex}#euc339Loading>div{background:#fff;border:1px solid #b9ddd4;border-radius:14px;padding:16px 22px;box-shadow:0 10px 30px rgba(0,0,0,.14);font-weight:900;color:#087f70;font-size:16px}
.euc339-busy{opacity:.72!important;cursor:wait!important}.euc419-inline-spin{display:inline-block;width:12px;height:12px;margin-right:7px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:euc419spin .65s linear infinite}@keyframes euc419spin{to{transform:rotate(360deg)}}
</style>
<div id='euc339Loading'><div>Chargement des donnees...</div></div>
<script id='EUC_DEV339_LOADING_JS'>(function(){function busy(el){var o=document.getElementById('euc339Loading');if(o)o.classList.add('show');if(el){el.classList.add('euc339-busy');el.setAttribute('aria-busy','true');if('disabled' in el)el.disabled=true;el.innerHTML='<span class="euc419-inline-spin" aria-hidden="true"></span>Chargement…';}}document.addEventListener('click',function(ev){var b=ev.target.closest('[data-fam],.period,[data-period],article.card[data-class],a[href*="suivi-pfmp-classe"]');if(b)busy(b);},true);window.addEventListener('pageshow',function(){var o=document.getElementById('euc339Loading');if(o)o.classList.remove('show');});})();</script>
