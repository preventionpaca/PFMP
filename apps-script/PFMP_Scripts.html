<script>(function(){
const form=document.querySelector('#pfmpForm'),steps=[...document.querySelectorAll('.step')],progress=document.querySelector('#progress'),status=document.querySelector('#globalStatus'),started=Date.now();let step=0,catalog=null,turnstileToken='';
for(let i=0;i<8;i++)progress.insertAdjacentHTML('beforeend','<li>Étape '+(i+1)+'</li>');
const field=n=>form.elements[n],selectedOffer=()=>catalog&&catalog.offres.find(x=>String(x.id)===field('offreId').value),selectedPeriod=()=>{const o=selectedOffer();return o&&o.periodes.find(x=>String(x.id)===field('periodeId').value)};
function msg(t,error){status.textContent=t||'';status.classList.toggle('error',!!error)}
function show(){steps.forEach((x,i)=>x.classList.toggle('active',i===step));[...progress.children].forEach((x,i)=>x.classList.toggle('active',i<=step));field('prevBtn')&&0;document.querySelector('#prevBtn').hidden=step===0;document.querySelector('#nextBtn').hidden=step===7;if(step===3)applyDateRules();scrollTo({top:0,behavior:'smooth'});if(step===6)summary()}
function clearErrors(panel){panel.querySelectorAll('.field-error,.step-error-summary').forEach(x=>x.remove());panel.querySelectorAll('[aria-invalid=true]').forEach(x=>x.removeAttribute('aria-invalid'))}
function labelText(x){const label=x.closest('label');return label?label.childNodes[0].textContent.trim()||x.name:x.name}
function validate(){const panel=steps[step];clearErrors(panel);applyDateRules();applyCountryRules();validateAllPhones(false);const controls=[...panel.querySelectorAll('input,select,textarea')].filter(x=>x.type!=='hidden'&&!x.disabled&&x.offsetParent!==null),invalid=[];controls.forEach(x=>{if(!x.checkValidity()){invalid.push(x);x.setAttribute('aria-invalid','true');const e=document.createElement('span');e.className='field-error';e.textContent=x.validationMessage||'Champ obligatoire ou invalide.';x.insertAdjacentElement('afterend',e)}});if(invalid.length){const s=document.createElement('div');s.className='step-error-summary';s.setAttribute('role','alert');s.textContent=invalid.length+' champ'+(invalid.length>1?'s':'')+' à corriger dans cette étape.';panel.prepend(s);invalid[0].focus();invalid[0].scrollIntoView({behavior:'smooth',block:'center'});return false}msg('');return true}
document.querySelector('#nextBtn').onclick=()=>{if(validate()){step++;show()}};document.querySelector('#prevBtn').onclick=()=>{step--;show()};
function setMotifState(visible){const wrap=document.querySelector('#motifWrap'),motif=field('motif');wrap.hidden=!visible;wrap.setAttribute('aria-hidden',String(!visible));motif.disabled=!visible;motif.required=visible;motif.tabIndex=visible?0:-1;if(!visible){motif.value='';motif.setCustomValidity('');motif.removeAttribute('aria-invalid');wrap.querySelectorAll('.field-error').forEach(x=>x.remove())}}
function applyStatus(){const apprentice=field('statutJeune').value==='Apprenti';document.querySelector('.periodWrap').hidden=apprentice;document.querySelector('#schoolDates').hidden=apprentice;field('periodeId').required=!apprentice;field('scenarioDates').required=!apprentice;if(apprentice){field('periodeId').value='';field('scenarioDates').value='';field('dateDeclareeDebut').disabled=false;field('dateDeclareeFin').disabled=false;setMotifState(false);document.querySelector('#officialDates').textContent='Les apprentis saisissent leurs dates réelles de début et de fin.'}else applyDateRules()}
[...form.elements.statutJeune].forEach(x=>x.onchange=applyStatus);
function loadCatalog(data){catalog=data;field('anneeId').innerHTML=data.annees.map(x=>`<option value="${x.id}">${esc(x.code)}</option>`).join('');field('offreId').insertAdjacentHTML('beforeend',data.offres.map(x=>`<option value="${x.id}">${esc(x.classe)} — ${esc(x.diplome)}</option>`).join(''));document.querySelector('#catalogInfo').textContent=data.offres.length+' classes disponibles depuis le référentiel Grist.';msg('Référentiel chargé.')}
field('offreId').onchange=()=>{const o=selectedOffer();field('periodeId').innerHTML='<option value="">Choisir…</option>'+((o&&o.periodes)||[]).map(x=>`<option value="${x.id}">${esc(x.libelle)} — ${formatDateFrPourAffichage(x.debut)} au ${formatDateFrPourAffichage(x.fin)}</option>`).join('');applyDateRules()};
field('periodeId').onchange=()=>{const p=selectedPeriod();document.querySelector('#officialDates').textContent=p?'Dates officielles : '+formatDateFrPourAffichage(p.debut)+' au '+formatDateFrPourAffichage(p.fin):'';if(p){field('scenarioDates').value='Dates officielles';applyDateRules()}};
function applyDateRules(){if(field('statutJeune').value==='Apprenti')return;const p=selectedPeriod(),scenario=field('scenarioDates').value,start=field('dateDeclareeDebut'),end=field('dateDeclareeFin'),showMotif=scenario==='Début retardé'||scenario==='Autre situation exceptionnelle';start.disabled=false;end.disabled=false;setMotifState(showMotif);if(scenario==='Dates officielles'&&p){start.value=p.debut;end.value=p.fin;start.disabled=true;end.disabled=true}else if(scenario==='Début retardé'&&p){end.value=p.fin;end.disabled=true;start.max=p.fin}else{start.removeAttribute('max')}}
field('scenarioDates').onchange=applyDateRules;
function applyCountryRules(){const pays=field('entreprisePays').value.trim(),france=pays.toLowerCase()==='france';field('entrepriseSiret').required=france;field('entrepriseSiret').setAttribute('aria-required',String(france));document.querySelector('#siretRequired').hidden=!france;document.querySelector('#searchSiret').disabled=!france;const aide=pays.toLowerCase()==='monaco'?'Format monégasque ou numéro français accepté.':france?'Format français attendu : 10 chiffres, par exemple 06 12 34 56 78.':'Format du pays sélectionné ou numéro français accepté.';document.querySelectorAll('.phone-help').forEach(x=>x.textContent=aide);validateAllPhones(false)}
field('entreprisePays').oninput=applyCountryRules;
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function formatDateFrPourAffichage(value){const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(value||'')}
function normalizeCountry(p){return String(p||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function formatPhone(digits){return String(digits).replace(/(\d{2})(?=\d)/g,'$1 ').trim()}
function phoneResult(value,country,required){const raw=String(value||'').trim();if(!raw)return required?{valid:false,message:'Téléphone obligatoire.'}:{valid:true,normalized:''};if(!/^[0-9 .()\-]+$/.test(raw)||raw.includes('+'))return {valid:false,message:'Lettres ou caractères interdits.'};if((raw.match(/\(/g)||[]).length!==(raw.match(/\)/g)||[]).length)return {valid:false,message:'Parenthèses invalides.'};const digits=raw.replace(/[ .()\-]/g,''),p=normalizeCountry(country);if(p==='france'&&!/^0[1-9]\d{8}$/.test(digits))return {valid:false,message:'10 chiffres commençant par 01 à 09 attendus.'};if(p==='monaco'&&!(/^(?:87\d{6}|9\d{7})$/.test(digits)||/^(?:3\d{7}|(?:44|45|46)\d{6})$/.test(digits)||/^0[67]\d{8}$/.test(digits)||/^2\d{11}$/.test(digits)))return {valid:false,message:'Numéro national monégasque invalide.'};if(p!=='france'&&p!=='monaco'&&!/^\d{6,15}$/.test(digits))return {valid:false,message:'6 à 15 chiffres attendus.'};return {valid:true,normalized:formatPhone(digits)}}
function professionalPhoneResult(value,country){const national=phoneResult(value,country,false);if(national.valid||!String(value||'').trim()||normalizeCountry(country)==='france')return national;return phoneResult(value,'France',false)}
function validatePhone(input,country,required,format){const r=phoneResult(input.value,country,required);input.setCustomValidity(r.valid?'':r.message);if(r.valid&&format&&r.normalized)input.value=r.normalized;return r.valid}
function validateProfessionalPhone(input,country,format){const r=professionalPhoneResult(input.value,country);input.setCustomValidity(r.valid?'':'Numéro invalide pour le pays sélectionné et pour la France.');if(r.valid&&format&&r.normalized)input.value=r.normalized;return r.valid}
function validateAllPhones(format){validatePhone(field('jeuneTelephone'),'France',true,format);const p=field('entreprisePays').value;validateProfessionalPhone(field('responsableTelephone'),p,format);validateProfessionalPhone(field('tuteurTelephone'),p,format)}
['jeuneTelephone','responsableTelephone','tuteurTelephone'].forEach(n=>{field(n).addEventListener('input',()=>validateAllPhones(false));field(n).addEventListener('blur',()=>validateAllPhones(true))});
function fillCompany(r){if(r.introuvable){msgCompany('Aucun établissement trouvé.',true);field('entrepriseSiret').focus();return}const d=r.entreprise||{};[['entrepriseId',d.id],['entrepriseSiret',d.siret],['entrepriseRaisonSociale',d.raisonSociale],['entrepriseEnseigne',d.enseigne],['entrepriseAdresse',d.numeroVoie],['entrepriseComplementAdresse',d.complementAdresse],['entrepriseCodePostal',d.codePostal],['entrepriseCommune',d.commune],['entreprisePays',d.pays||'France']].forEach(([k,v])=>field(k).value=v??'');applyCountryRules();msgCompany(r.source==='grist'?'Entreprise existante chargée.':'Données publiques chargées.');if(d.id)google.script.run.withSuccessHandler(loadContacts).withFailureHandler(e=>msgCompany(e.message,true)).EUC_PFMP_listerContactsEntreprise(d.id)}
function msgCompany(t,e){const x=document.querySelector('#companyStatus');x.textContent=t;x.classList.toggle('error',!!e)}
async function publicApi(r){const c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);try{const rep=await fetch(r.url,{headers:{Accept:'application/json'},signal:c.signal});if(!rep.ok)throw new Error(rep.status===429?'API temporairement limitée.':'API entreprises indisponible ('+rep.status+').');google.script.run.withSuccessHandler(fillCompany).withFailureHandler(e=>msgCompany(e.message,true)).EUC_ENT_traiterReponseApiNavigateur(await rep.json(),r.siret)}catch(e){msgCompany(e.name==='AbortError'?'API entreprises trop lente.':e.message,true)}finally{clearTimeout(timer)}}
document.querySelector('#searchSiret').onclick=()=>{msgCompany('Recherche en cours…');google.script.run.withSuccessHandler(r=>r.source==='api_navigateur'?publicApi(r):fillCompany(r)).withFailureHandler(e=>{msgCompany(e.message||String(e),true);field('entrepriseSiret').focus()}).EUC_ENT_rechercherSiret(field('entrepriseSiret').value)};
function splitName(x){const parts=String(x||'').trim().split(/\s+/);return {prenom:parts.length>1?parts.shift():'',nom:parts.join(' ')||parts[0]||''}}
function loadContacts(rows){const s=field('contactEntrepriseId');s.innerHTML='<option value="">Saisie manuelle</option>'+rows.map((x,i)=>`<option value="${x.id}" data-i="${i}">${esc(x.nom)} — ${esc(x.fonction)}</option>`).join('');s.onchange=()=>{const x=rows[Number(s.selectedOptions[0].dataset.i)];if(x){const n=splitName(x.nom);field('responsableNom').value=n.nom;field('responsablePrenom').value=n.prenom;field('responsableFonction').value=x.fonction||'';field('responsableTelephone').value=x.telephone||'';field('responsableCourriel').value=x.courriel||''}}}
field('tuteurEstResponsable').onchange=()=>{if(!field('tuteurEstResponsable').checked){document.querySelector('#tutorCopyStatus').textContent='Les champs du tuteur sont indépendants.';return}validateProfessionalPhone(field('responsableTelephone'),field('entreprisePays').value,true);['Nom','Prenom','Fonction','Telephone','Courriel'].forEach(k=>field('tuteur'+k).value=field('responsable'+k).value||'');validateProfessionalPhone(field('tuteurTelephone'),field('entreprisePays').value,true);document.querySelector('#tutorCopyStatus').textContent='Les informations du responsable ont été reprises et restent modifiables.'};
function summarySection(title,rows){const visible=rows.filter(x=>String(x[1]??'').trim()!=='');return '<section><h3>'+esc(title)+'</h3><dl>'+visible.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')+'</dl></section>'}
function summary(){validateAllPhones(true);const d=data(),o=selectedOffer(),p=selectedPeriod(),official=d.dateOfficielleDebut&&d.dateOfficielleFin?formatDateFrPourAffichage(d.dateOfficielleDebut)+' → '+formatDateFrPourAffichage(d.dateOfficielleFin):'',real=d.dateDeclareeDebut&&d.dateDeclareeFin?formatDateFrPourAffichage(d.dateDeclareeDebut)+' → '+formatDateFrPourAffichage(d.dateDeclareeFin):'';document.querySelector('#summary').innerHTML=summarySection('Élève et formation',[['Statut',d.statutJeune],['Classe',o&&o.classe],['Formation préparée',o&&o.diplome],['Période officielle',p&&p.libelle||'Dates libres apprenti'],['Situation de dates',d.scenarioDates||'Dates libres apprenti'],['Dates officielles',official],['Dates réelles',real!==official?real:''],['Motif de la différence',d.scenarioDates==='Dates officielles'?'':d.motif],['Commentaire',d.commentaireJeune],['Jeune',[d.jeunePrenom,d.jeuneNom].filter(Boolean).join(' ')],['Courriel',d.jeuneCourriel],['Téléphone',d.jeuneTelephone]])+summarySection('Entreprise',[['Raison sociale',d.entrepriseRaisonSociale],['Nom commercial',d.entrepriseEnseigne],['SIRET',d.entrepriseSiret],['Adresse',d.entrepriseAdresse],['Complément d’adresse',d.entrepriseComplementAdresse],['Code postal',d.entrepriseCodePostal],['Ville',d.entrepriseCommune],['Pays',d.entreprisePays]])+summarySection('Responsable',[['Nom et prénom',[d.responsablePrenom,d.responsableNom].filter(Boolean).join(' ')],['Fonction',d.responsableFonction],['Téléphone',d.responsableTelephone],['Courriel',d.responsableCourriel]])+summarySection('Tuteur',[['Nom et prénom',[d.tuteurPrenom,d.tuteurNom].filter(Boolean).join(' ')],['Fonction',d.tuteurFonction],['Téléphone',d.tuteurTelephone],['Courriel',d.tuteurCourriel],['Rôle',d.tuteurEstResponsable?'Également responsable dans l’entreprise':'']])}
document.querySelectorAll('.edit-step').forEach(b=>b.onclick=()=>{step=Number(b.dataset.editStep);show()});
function data(){const disabled=[...form.querySelectorAll(':disabled')];disabled.forEach(x=>x.disabled=false);const d=Object.fromEntries(new FormData(form));disabled.forEach(x=>x.disabled=true);const o=selectedOffer(),p=selectedPeriod();d.elapsedMs=Date.now()-started;d.entrepriseConfirmee=field('entrepriseConfirmee').checked;d.tuteurEstResponsable=field('tuteurEstResponsable').checked;d.datesConformes=d.scenarioDates==='Dates officielles';if(d.datesConformes)d.motif='';d.turnstileToken=turnstileToken;d.anneeLibelle=catalog&&catalog.annees.find(x=>String(x.id)===d.anneeId)?.code||'';d.classeId=o&&o.classeId;d.classeLibelle=o&&o.classe;d.diplomeId=o&&o.diplomeId;d.diplomeLibelle=o&&o.diplome;d.periodeLibelle=p&&p.libelle||'';d.dateOfficielleDebut=p&&p.debut||'';d.dateOfficielleFin=p&&p.fin||'';return d}
window.EUC_PFMP_turnstileOk=t=>turnstileToken=t;window.EUC_PFMP_turnstileReset=()=>turnstileToken='';form.onsubmit=e=>{e.preventDefault();const btn=document.querySelector('#submitBtn');if(btn.disabled)return;if(!validate())return;btn.disabled=true;msg('Simulation en cours…');google.script.run.withSuccessHandler(r=>{btn.disabled=false;msg('Simulation réussie — référence '+r.reference+'. Aucune donnée envoyée.');turnstileToken='';if(window.turnstile)turnstile.reset()}).withFailureHandler(x=>{btn.disabled=false;msg(x.message||String(x),true);turnstileToken='';if(window.turnstile)turnstile.reset()}).EUC_PFMP_simulerSoumission(data())};
field('nonce').value=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());setMotifState(false);applyCountryRules();show();google.script.run.withSuccessHandler(loadCatalog).withFailureHandler(e=>msg(e.message||String(e),true)).EUC_PFMP_chargerReferentiel();
})();</script>
