<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>body{font-family:Arial;background:#f5fbf8}.wrap{max-width:1400px;margin:auto;padding:22px}.kpis{display:flex;gap:10px;margin:14px 0}.k{background:#fff;border:1px solid #c5e4dc;border-radius:12px;padding:10px 14px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.a{display:inline-block;background:#d92d20;color:white;border-radius:50%;width:18px;height:18px;text-align:center;font-weight:900}</style></head><body><main class="wrap"><a id="back">← Classes</a><h1 id="title"></h1><div class="kpis" id="kpis"></div><table><thead><tr><th>Élève</th><th>Statut</th><th>Entreprise</th><th>Adresse</th><th>Contact</th><th>Tuteur</th></tr></thead><tbody id="tb"></tbody></table></main><script>(function(){const D=<?!= detailJson ?>,P=<?!= paramsJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;title.textContent=(D.classe&&D.classe.nom)||'Classe';back.href=BASE+'?page=suivi-conventions-public-famille&annee='+encodeURIComponent(P.annee)+'&famille='+encodeURIComponent(P.famille);const s=D.stats||{};kpis.innerHTML='<div class="k">Effectif <b>'+Number(s.total||0)+'</b></div><div class="k">Apprenti <b>'+Number(s.apprentis||0)+'</b></div><div class="k">Avec convention <b>'+Number(s.avecConvention||0)+'</b></div>';tb.innerHTML=(D.lignes||[]).map(x=>'<tr><td>'+(x.apprenti?'<span class="a">A</span> ':'')+'<b>'+String(x.nom||'')+' '+String(x.prenom||'')+'</b></td><td>'+String(x.statut||'')+'</td><td>'+String(x.entreprise||'—')+'</td><td>'+String(x.adresseEntreprise||'—')+'</td><td>'+String(x.contactEntreprise||'—')+'</td><td>'+String(x.tuteurEntreprise||'—')+'</td></tr>').join('')})();</script></body></html>
