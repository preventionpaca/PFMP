<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>Suivi des conventions PFMP</title>
<style>
:root{--g:#0b8f72;--g2:#dff4ed;--ink:#17312b;--mut:#5f746e;--line:#cfe5de;--bg:#f7fbf9;--red:#d92d20;--orange:#e67e00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.hero{background:#fff;border-bottom:1px solid var(--line);padding:24px 18px}.wrap{max-width:1180px;margin:auto}.hero h1{margin:0;color:#0f4035}.sub{margin-top:5px;color:var(--mut)}.content{padding:18px}.crumb{display:flex;gap:7px;align-items:center;font-size:13px;margin-bottom:16px}.crumb a{text-decoration:none;color:#0b745f;font-weight:800}.crumb span{color:var(--mut)}.level-nav{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:20;padding:10px 0;background:var(--bg)}.level-btn{border:1px solid var(--line);background:#fff;color:#0b745f;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.level-btn.active{background:var(--g);color:#fff;border-color:var(--g)}.section{margin-bottom:14px}.section-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:20px;font-weight:800;color:#0c5f4e;cursor:pointer}.section-body{display:none;padding-top:12px}.section.open .section-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(12,76,62,.05)}.head{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:800;color:#0c5f4e}.badge{background:var(--g2);color:#0b745f;padding:5px 8px;border-radius:999px;font-size:12px}.period{display:block;text-decoration:none;color:inherit;padding:10px 0;border-top:1px solid #e7f1ed}.period.loading{opacity:.6;pointer-events:none}.period.loading .label::after{content:' · chargement…';font-size:12px;color:var(--mut)}.row{display:flex;justify-content:space-between;gap:12px}.label{font-weight:700}.count{font-weight:800}.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--g)}.dates{font-size:12px;color:var(--mut)}.bar{height:6px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%}.fill.red{background:var(--red)}.fill.orange{background:var(--orange)}.fill.green{background:var(--g)}.loading,.error{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
</style></head><body>
<header class="hero"><div class="wrap"><h1 id="title">Suivi des conventions</h1><div id="sub" class="sub"></div></div></header><main class="content"><div class="wrap"><div class="crumb"><a id="homeCrumb" href="#">Suivi des conventions</a><span>›</span><strong id="famCrumb"></strong></div><div class="level-nav" id="levelNav"></div><div id="sections" class="loading">Chargement des classes…</div></div></main>
<script>
const C=<?!= config ?>;const PARAMS=<?!= paramsJson ?>;
(function(){const sections=document.getElementById('sections'),TTL=180000;
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cls(p){const n=Number(p.total)||0,r=n?100*(Number(p.conventions)||0)/n:0;return r>=100?'green':(r>=65?'orange':'red')}
function levelOf(name,fam){const n=String(name||'').toUpperCase();if(fam==='BACPRO'){if(/^T/.test(n))return 'Terminale';if(/^1/.test(n))return 'Première';if(/^2/.test(n))return 'Seconde';}if(fam==='BTS'){if(/^2/.test(n))return '2e année';return '1re année';}if(fam==='CAP'){if(/^T/.test(n)||/^2/.test(n))return 'Terminale CAP';return '1re année CAP';}return 'Autres';}
homeCrumb.href=C.baseUrl+'?page=suivi-conventions&annee='+encodeURIComponent(PARAMS.annee||'');famCrumb.textContent=PARAMS.famille==='BACPRO'?'BAC PRO':PARAMS.famille;const key='PFMP_V51_FAMILY_'+PARAMS.annee+'_'+PARAMS.famille;
function render(res){title.textContent=res.familleLibelle||'Suivi';sub.textContent='Synthèse par niveau puis par classe · '+res.annee;famCrumb.textContent=res.familleLibelle||famCrumb.textContent;const groups={};(res.classes||[]).forEach(c=>{const l=levelOf(c.classe,res.famille);(groups[l]||(groups[l]=[])).push(c);});const order=res.famille==='BACPRO'?['Terminale','Première','Seconde']:res.famille==='BTS'?['1re année','2e année']:['1re année CAP','Terminale CAP'];levelNav.innerHTML=order.filter(l=>groups[l]).map((l,i)=>'<button class="level-btn'+(i===0?' active':'')+'" data-level="'+esc(l)+'">'+esc(l)+'</button>').join('');sections.className='';sections.innerHTML=order.filter(l=>groups[l]).map((l,i)=>'<section class="section'+(i===0?' open':'')+'" data-section="'+esc(l)+'"><button class="section-head"><span>'+esc(l)+'</span><span>▾</span></button><div class="section-body">'+groups[l].map(c=>'<article class="card"><div class="head"><span>'+esc(c.classe)+'</span><span class="badge">'+c.effectif+' élève(s)</span></div>'+(c.periodes||[]).map(p=>{const col=cls(p);const href=C.baseUrl+'?page=suivi-pfmp-classe&annee='+encodeURIComponent(res.annee)+'&classe='+encodeURIComponent(c.classeId)+'&periode='+encodeURIComponent(p.id)+'&origine=suivi-conventions&famille='+encodeURIComponent(res.famille)+'&familleLibelle='+encodeURIComponent(res.familleLibelle||res.famille);return '<a class="period" data-class="'+c.classeId+'" data-period="'+p.id+'" href="'+href+'"><div class="row"><div><div class="label">'+esc(p.libelle)+'</div><div class="dates">'+esc([p.debutFr,p.finFr].filter(Boolean).join(' → '))+'</div></div><div class="count '+col+'">'+p.conventions+' / '+p.total+' · '+(p.apprentis||0)+' appr.'+'</div></div><div class="bar"><div class="fill '+col+'" style="width:'+Math.min(100,p.pourcentage||0)+'%"></div></div></a>';}).join('')+'</article>').join('')+'</div></section>').join('');
function openLevel(l){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('open',s.dataset.section===l));document.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('active',b.dataset.level===l));const target=document.querySelector('[data-section="'+CSS.escape(l)+'"]');if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}
document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>openLevel(b.dataset.level));document.querySelectorAll('.section-head').forEach(b=>b.onclick=()=>openLevel(b.closest('.section').dataset.section));
let timer=null,last='';document.querySelectorAll('.period').forEach(a=>{a.addEventListener('click',()=>a.classList.add('loading'));a.addEventListener('mouseenter',function(){clearTimeout(timer);const id=a.dataset.class+'|'+a.dataset.period;if(id===last)return;timer=setTimeout(function(){last=id;google.script.run.withFailureHandler(function(){}).EUC_SUIVI_CLASSE_prewarmV51({annee:res.annee,classe:Number(a.dataset.class),periode:Number(a.dataset.period)});},250);});a.addEventListener('mouseleave',()=>clearTimeout(timer));});}
try{const raw=sessionStorage.getItem(key);if(raw){const o=JSON.parse(raw);if(Date.now()-o.t<TTL)render(o.v);}}catch(e){}google.script.run.withSuccessHandler(r=>{render(r);try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),v:r}));}catch(e){}}).withFailureHandler(e=>{if(!sections.querySelector('.card')){sections.className='error';sections.textContent='Erreur : '+String(e&&e.message||e);}}).EUC_APP172_chargerFamille(PARAMS);})();
</script></body></html>
