<style>:root{font-family:Inter,system-ui,sans-serif;color:#12372f;background:#f2f7f4;line-height:1.45}*{box-sizing:border-box}body{margin:0}.shell{max-width:920px;margin:auto;padding:32px 18px}.recipe-banner,.captcha-warning{padding:12px 16px;border-radius:9px;background:#fff2c7;color:#6b4800;font-weight:800}.recipe-banner{text-align:center;position:sticky;top:0;z-index:5}header{margin-bottom:24px}.eyebrow{color:#08745b;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:.2em 0}nav ol{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:0;list-style:none}nav li{height:8px;background:#d4e2dc;border-radius:20px;font-size:0}nav li.active{background:#00866a}.step{display:none;background:white;border:1px solid #d7e4de;border-radius:18px;padding:clamp(20px,5vw,40px);box-shadow:0 18px 45px #12372f12}.step.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}label,fieldset{display:grid;gap:7px;font-weight:650}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #afc7bd;border-radius:9px;background:#fff}input:focus,select:focus,textarea:focus{outline:3px solid #b8eadc;border-color:#08745b}.choices{display:grid;gap:14px}.choices label,.confirm,fieldset label{display:flex;align-items:center;gap:10px}.choices input,.confirm input,fieldset input{width:auto}.actions{display:flex;justify-content:space-between;padding:18px 4px}button{border:0;border-radius:9px;background:#08745b;color:white;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#dce9e4;color:#17483d}button:disabled{opacity:.5;cursor:wait}.siret-block{display:grid;gap:7px}.siret-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.siret-controls button{white-space:nowrap}.status{min-height:1.5em;color:#8a5400}.status.error{color:#b42318}.callout,.summary{background:#edf7f3;border-left:4px solid #08745b;padding:14px;border-radius:7px}.summary section+section{border-top:1px solid #c9ddd5;margin-top:16px;padding-top:10px}.summary dl{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:7px}.summary dt{font-weight:800}.summary dd{margin:0}.summary-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.hint,.version{color:#5b746b;font-size:.9rem}.version{text-align:center}.hp{position:absolute;left:-10000px}.cf-turnstile{min-height:70px;margin:20px 0}.required{color:#b42318;font-weight:900}.required-note{font-weight:700}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.step-error-summary{padding:10px 14px;border-left:4px solid #b42318;background:#fff0ee;color:#8f1d14;margin-bottom:16px}.field-error{display:block;color:#b42318;font-size:.9rem;font-weight:650;margin-top:4px}[aria-invalid="true"]{border-color:#b42318;box-shadow:0 0 0 1px #b42318}input:disabled,select:disabled,textarea:disabled{background:#eef3f1;color:#38584f}@media(max-width:650px){.shell{padding:18px 10px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.siret-controls{grid-template-columns:1fr}.siret-controls button{width:100%}.summary dl{grid-template-columns:1fr}.summary dd{margin-bottom:8px}nav ol{gap:3px}}</style>
