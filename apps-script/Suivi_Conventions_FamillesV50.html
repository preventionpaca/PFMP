<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<title>Suivi des conventions PFMP</title>
<style>
:root{--g:#0b8f72;--g2:#dff4ed;--g3:#eef9f5;--ink:#17312b;--mut:#5f746e;--line:#cfe5de;--bg:#f7fbf9;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
.hero{background:#fff;border-bottom:1px solid var(--line);padding:25px 18px}.wrap{max-width:1180px;margin:auto}.eyebrow{color:var(--g);font-weight:800;font-size:13px}.hero h1{margin:7px 0 4px;font-size:30px;color:#0f4035}.sub{color:var(--mut)}
.content{padding:20px 18px}.crumb{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--mut);margin-bottom:16px}.crumb b{color:#0b745f}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 3px 14px rgba(12,76,62,.05)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:22px;font-weight:800;color:#0c5f4e}.go{background:var(--g);color:#fff;border-radius:9px;padding:8px 11px;font-weight:800;font-size:12px}.meta{font-size:12px;color:var(--mut);margin:7px 0 12px}
.period{padding:10px 0;border-top:1px solid #e7f1ed}.row{display:flex;justify-content:space-between;gap:12px}.label{font-weight:700}.count{font-weight:800;color:var(--g)}.bar{height:6px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--g)}
.wait{padding:12px;background:var(--g3);border-radius:10px;color:var(--mut);font-size:13px}.err{padding:10px;background:#fff1f1;border-radius:10px;color:#9b2c2c;font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><div class="eyebrow">LYCÉE LES EUCALYPTUS</div><h1>Suivi des conventions PFMP</h1><div class="sub">Synthèse par famille de formation</div></div></header>
<main class="content"><div class="wrap">
<div class="crumb"><b>Suivi des conventions</b></div>
<div class="top"><strong id="summary"></strong><label>Année scolaire <select id="year"></select></label></div>
<div class="grid" id="grid"></div>
</div></main>
<script>
const C=<?!= config ?>; const REQUESTED_YEAR=<?!= requestedYear ?>;
(function(){
  const fams=[{code:'BACPRO',libelle:'BAC PRO'},{code:'BTS',libelle:'BTS'},{code:'CAP',libelle:'CAP'}];
  const TTL=300000;
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function currentYear(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,a=m>=9?y:y-1;return a+'-'+(a+1)}
  const active=REQUESTED_YEAR||currentYear(),y0=Number(active.slice(0,4));
  year.innerHTML=[y0-1,y0,y0+1].map(y=>'<option value="'+y+'-'+(y+1)+'"'+((y+'-'+(y+1))===active?' selected':'')+'>'+y+'-'+(y+1)+'</option>').join('');
  year.onchange=()=>location.href=C.baseUrl+'?page=suivi-conventions&annee='+encodeURIComponent(year.value);
  summary.textContent='Année '+active;

  grid.innerHTML=fams.map(f=>{
    const href=C.baseUrl+'?page=suivi-conventions-famille&annee='+encodeURIComponent(active)+'&famille='+encodeURIComponent(f.code);
    return '<a class="card" data-fam="'+f.code+'" href="'+href+'"><div class="head"><div class="title">'+esc(f.libelle)+'</div><div class="go">Voir les classes</div></div><div class="meta" id="meta-'+f.code+'">Décompte en attente</div><div id="periods-'+f.code+'" class="wait">Chargement…</div></a>';
  }).join('');

  function render(code,f){
    meta=document.getElementById('meta-'+code); box=document.getElementById('periods-'+code);
    meta.textContent=(f.classes||0)+' classe(s) · '+(f.effectif||0)+' élève(s)';
    const ps=f.periodes||[]; box.className='';
    box.innerHTML=ps.length?ps.map(p=>'<div class="period"><div class="row"><div class="label">'+esc(p.libelle)+'</div><div class="count">'+p.conventions+' / '+p.total+'</div></div><div class="bar"><div class="fill" style="width:'+Math.min(100,p.pourcentage||0)+'%"></div></div></div>').join(''):'Aucune période.';
  }

  function cacheKey(code){return 'PFMP_V50_OV_'+active+'_'+code}
  function loadOne(i){
    if(i>=fams.length)return;
    const f=fams[i],k=cacheKey(f.code);
    try{
      const raw=sessionStorage.getItem(k);
      if(raw){const o=JSON.parse(raw);if(Date.now()-o.t<TTL)render(f.code,o.v);}
    }catch(e){}
    google.script.run.withSuccessHandler(function(r){
      render(f.code,r||{});
      try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),v:r||{}}));}catch(e){}
      loadOne(i+1);
    }).withFailureHandler(function(){loadOne(i+1);}).EUC_SUIVI_PUBLIC_resumeFamilleV50({annee:active,famille:f.code});
  }
  loadOne(0);
})();
</script>
</body>
</html>
