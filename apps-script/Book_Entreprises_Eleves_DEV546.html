<html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book des entreprises — élèves et familles</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--g:#087f70;--dark:#075f55;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085;--ink:#172b27;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);font-size:16px}.hero{background:linear-gradient(135deg,var(--dark),#0d8b78);color:#fff;padding:26px}.hero h1{margin:0 0 6px;font-size:31px}.hero p{margin:0;line-height:1.45}.wrap{max-width:1320px;margin:auto;padding:16px}.breadcrumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.breadcrumb a{color:var(--g);font-weight:800;text-decoration:none}.card,.company{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}.notice{background:#eaf7f3;border-left:4px solid var(--g);padding:12px 14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:10px}.filters label{display:grid;gap:5px;color:var(--mut);font-size:14px;font-weight:800}select,input{width:100%;padding:10px;border:1px solid #aacfc5;border-radius:8px;background:#fff;color:var(--ink);font-size:15px}.actions,.pager{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff;font-size:15px;font-weight:800;cursor:pointer}button.secondary{background:#fff;color:var(--g);border:1px solid var(--g)}button:disabled{opacity:.62;cursor:wait}.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.status{color:var(--mut)}.error{color:var(--danger);font-weight:800}.summary{display:flex;gap:16px;align-items:baseline}.summary strong{font-size:30px}.companies{display:grid;gap:12px}.company{margin:0}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.company-link{padding:0;background:none;color:var(--ink);f </style><style>.public-profile{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:10px}.public-brand{display:flex;gap:14px;align-items:center}.public-logo{width:110px;min-height:80px;border:1px dashed #8bcabb;border-radius:9px;display:grid;place-items:center;overflow:hidden;color:var(--mut)}.public-logo img{max-width:100%;max-height:100px;object-fit:contain}.public-actions{display:grid;gap:8px;margin-top:12px}.public-action{border-left:4px solid var(--g);padding:9px 11px;background:#f8fbfa;border-radius:8px}.public-action h4,.public-action p{margin:4px 0}.public-action p{white-space:pre-wrap}</style></head><body><header class="hero"><div class="wrap"><h1>Book des entreprises — élèves et familles</h1></div></header><main class="wrap">
<nav class="breadcrumb" aria-label="Fil d’Ariane"><a id="home" href="https://pfmp.loucodi.fr/" target="_top" hidden>← Retour au suivi PFMP</a><span id="homeSep" hidden>›</span><strong>Book des entreprises</strong></nav>
<section class="card"><div class="filters"><label>Famille<select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></label><label>Diplôme<select id="diploma"><option value="">Tous</option></select></label><label>Ville<select id="city"><option value="">Toutes</option></select></label><label>Entreprise<input id="company" list="companiesOptions" placeholder="Tapez quelques lettres"><datalist id="companiesOptions"></datalist></label><label>Tri<select id="sort"><option value="RECENT">Dernières saisies</option><option value="ACCUEILS">Nombre d’élèves accueillis</option></select></label><label>Résultats par page<select id="pageSize"><option>10</option><option>30</option><option>40</option><option>50</option><option>100</option><option>200</option><option value="ALL">Tous</option></select></label></div><div class="actions"><button id="apply">Appliquer les filtres</button><button id="reset" class="secondary">Réinitialiser</button><button id="mapToggle" class="secondary">Afficher la carte</button><button id="print" class="secondary" disabled>Imprimer / PDF</button><span id="status" class="status"></span></div></section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const B=<?!= bootJson ?>,$=id=>document.getElementById(id);/* AUDIT-PERF (4) : le lien vers le suivi enseignants n'apparaît que pour la route des personnels ; jamais sur book-entreprise.loucodi.fr (familles). */if(B.retourSuivi===true){$('home').hidden=false;$('homeSep').hidden=false;}else{$('home').remove();$('homeSep').remove();}let DATA=[],LOADING=false,PAGE=1,META={totalPages:1},CURRENT=null,MAP=null,LAYER=null,MAP_BUSY=false;
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function href(v){return encodeURI(String(v||'')).replace(/"/g,'%22')}
function busy(id,on,label){LOADING=!!on;let b=$(id);if(!b.dataset.label)b.dataset.label=b.textContent;b.disabled=!!on;b.innerHTML=on?'<span class="spin"></span>'+esc(label||'Chargement…'):esc(b.dataset.label)}
function query(noPage){let q={famille:$('family').value,diplome:$('diploma').value,ville:$('city').value,entreprise:$('company').value,tri:$('sort').value,mode:'PARENTS'};if(!noPage){q.page=PAGE;q.pageSize=$('pageSize').value}return q}
function options(id,values,empty){let el=$(id),current=el.value,all=[...new Set((values||[]).filter(Boolean))];el.innerHTML='<option value="">'+esc(empty)+'</option>'+all.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(all.includes(current))el.value=current}
function facets(f){f=f||{};options('diploma',f.diplome,'Tous');options('city',f.ville,'Toutes');$('companiesOptions').innerHTML=(f.entreprise||[]).map(v=>'<option value="'+esc(v)+'"></option>').join('')}
function countText(x){let n=Number(x.elevesAccueillis||0),s=Number(x.scolairesAccueillis||0),a=Number(x.apprentisAccueillis||0);return n+' élève'+(n>1?'s':'')+' accueilli'+(n>1?'s':'')+' : '+s+' scolaire'+(s>1?'s':'')+' · '+a+' apprenti'+(a>1?'s':'')}
function render(r){DATA=r.entreprises||[];META=r;PAGE=Number(r.page||1);facets(r.facets);$('total').textContent=Number(r.total||0);$('print').disabled=!DATA.length;$('pageInfo').textContent='Page '+PAGE+' / '+Number(r.totalPages||1);$('prevPage').disabled=PAGE<=1;$('nextPage').disabled=PAGE>=Number(r.totalPages||1);let offset=r.pageSize?((PAGE-1)*Number(r.pageSize)):0;$('list').innerHTML=DATA.length?DATA.map((x,i)=>'<article class="company"><div class="head"><div><button class="company-link" data-index="'+i+'">'+(offset+i+1)+'. '+esc(x.entreprise)+'</button><div class="address">'+esc(x.adresse)+'</div></div><div class="count">'+esc(countText(x))+'</div></div></article>').join(''):'<section class="company empty">Aucune entreprise ne correspond à ces filtres.</section>';document.querySelectorAll('.company-link').forEach(b=>b.onclick=()=>openDetail(DATA[Number(b.dataset.index)]))}
/* DEV572 : à l'ouverture, les filtres viennent du cache serveur ; la liste n'est chargée qu'à la demande. */
let SEQ=0;
function ouvrir(){const pret=()=>{$('status').className='status';$('status').textContent='Choisissez vos filtres puis cliquez sur « Appliquer les filtres ».'};if(B.facettes){facets(B.facettes);pret();return}$('status').className='status';$('status').textContent='Préparation des filtres en arrière-plan… Vous pouvez déjà saisir une entreprise.';const s=SEQ;google.script.run.withSuccessHandler(r=>{if(SEQ!==s)return;facets(r&&r.facets);pret()}).withFailureHandler(()=>{if(SEQ===s)pret()}).EUC_DEV546_studentBookData({page:1,pageSize:1})}
function load(resetPage){if(LOADING)return;SEQ++;if(resetPage)PAGE=1;busy('apply',true,'Chargement…');$('status').className='status';$('status').textContent='Chargement des entreprises…';let done=false,t=setTimeout(()=>{if(done)return;done=true;busy('apply',false);$('status').className='error';$('status').textContent='Le serveur n’a pas répondu sous 20 secondes. Réessayez.'},20000);google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(t);busy('apply',false);$('status').textContent='';render(r)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(t);busy('apply',false);$('status').className='error';$('status').textContent='Erreur : '+String(e&&e.message||e)}).EUC_DEV546_studentBookData(query())}
function contactYears(c){return(c.annees&&c.annees.length?c.annees:[c.annee]).filter(Boolean).join(' · ')}
function routeLink(x){let lat=Number(x.latitude),lon=Number(x.longitude);if(!isFinite(lat)||!isFinite(lon))return'';return '<a class="route-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&amp;destination='+encodeURIComponent(lat+','+lon)+'">Itinéraire depuis ma position</a>'}
function contact(c){let years=contactYears(c),a=['<strong>'+(years?esc(years)+' — ':'')+esc(c.nom||'Contact non nommé')+'</strong>'];(c.telephones||String(c.telephone||'').split(' · ')).filter(Boolean).forEach(v=>a.push('<a href="tel:'+href(v)+'">'+esc(v)+'</a>'));(c.courriels||String(c.courriel||'').split(' · ')).filter(Boolean).forEach(v=>a.push('<a href="mailto:'+href(v)+'">'+esc(v)+'</a>'));return '<li class="contact-lines">'+a.join('<br>')+'</li>'}function contacts(a,empty){return a&&a.length?a.map(contact).join(''):'<li>'+esc(empty)+'</li>'}
function publicAction(x){let links=(x.liens||[]).map(l=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(l.url)+'">'+esc(l.label)+'</a>').join(' · ');return '<article class="public-action"><small>'+esc(x.date||'')+' · '+esc(x.categorieLabel||'Action')+'</small><h4>'+esc(x.titre)+'</h4>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+((x.lieu||x.classesDiplomes)?'<div class="status">'+esc([x.lieu,x.classesDiplomes].filter(Boolean).join(' · '))+'</div>':'')+(links?'<div>'+links+'</div>':'')+'</article>'}
function loadPublicProfile(c){let done=false,t=setTimeout(()=>{if(done||CURRENT!==c)return;done=true;$('publicSite').textContent='Le profil met trop de temps à répondre.';$('publicActions').innerHTML='<span class="status">Historique indisponible.</span>'},20000);google.script.run.withSuccessHandler(r=>{if(done||CURRENT!==c)return;done=true;clearTimeout(t);r=r||{};$('publicLogo').innerHTML=r.logo?'<img alt="Logo de '+esc(c.entreprise)+'" src="'+r.logo.data+'">':'Aucun logo';$('publicSite').innerHTML=r.site?'<a target="_blank" rel="noopener noreferrer" href="'+esc(r.site)+'">Visiter le site de l’entreprise</a>':'Aucun site internet renseigné.';$('publicActions').innerHTML=r.actions&&r.actions.length?r.actions.map(publicAction).join(''):'<span class="status">Aucune action publique renseignée.</span>'}).withFailureHandler(()=>{if(done||CURRENT!==c)return;done=true;clearTimeout(t);$('publicSite').textContent='Profil indisponible.';$('publicActions').innerHTML='<span class="status">Historique indisponible.</span>'}).EUC_DEV562_publicCompanyProfile({entreprise:c.entreprise,adresse:c.adresse})}
function openDetail(c){CURRENT=c;$('detailTitle').textContent=c.entreprise;$('detailAddress').textContent=c.adresse;$('detailCount').textContent=countText(c);$('responsibles').innerHTML=contacts(c.responsables,'Aucun responsable renseigné');$('tutors').innerHTML=contacts(c.tuteurs,'Aucun tuteur renseigné');$('detailMap').disabled=!c.adresse;$('detailMapStatus').textContent='';$('detailPhoto').textContent='Chargement de la photo…';$('publicLogo').textContent='Chargement du logo…';$('publicSite').textContent='Chargement du profil…';$('publicActions').innerHTML='<span class="status">Chargement de l’historique…</span>';$('detail').showModal();loadPublicProfile(c);let done=false,t=setTimeout(()=>{if(done||CURRENT!==c)return;done=true;$('detailPhoto').textContent='La photo met trop de temps à répondre.'},20000);google.script.run.withSuccessHandler(r=>{if(done||CURRENT!==c)return;done=true;clearTimeout(t);$('detailPhoto').innerHTML=r&&r.photo?'<img alt="Devanture de '+esc(c.entreprise)+'" src="'+r.photo.data+'">':'Aucune photo de devanture'}).withFailureHandler(()=>{if(done||CURRENT!==c)return;done=true;clearTimeout(t);$('detailPhoto').textContent='Photo indisponible'}).EUC_DEV551_publicCompanyPhoto({entreprise:c.entreprise,adresse:c.adresse})}
function diplomaLines(x){let diplomas=[...new Set((x.diplomes||[]).filter(Boolean))];return diplomas.length?'<div class="map-diplomas"><b>Diplômes accueillis</b>'+diplomas.map(d=>'<div>'+esc(d)+'</div>').join('')+'</div>':''}
function popup(x){let contacts=(x.responsables||[]).concat(x.tuteurs||[]).slice(0,4).map(c=>{let years=contactYears(c);return '<div>'+(years?esc(years)+' — ':'')+esc(c.nom)+(c.telephone?'<br>'+esc(c.telephone):'')+(c.courriel?'<br>'+esc(c.courriel):'')+'</div>'}).join('');return '<b>'+esc(x.entreprise)+'</b><br>'+esc(x.adresse)+'<br><b>'+esc(countText(x))+'</b>'+diplomaLines(x)+'<div class="map-contacts">'+contacts+'</div>'+routeLink(x)}
function ensureMap(){if(MAP)return;MAP=L.map('map').setView([43.7102,7.2620],10);LAYER=L.layerGroup().addTo(MAP);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(MAP)}
function mapLoad(focus){if(MAP_BUSY)return;MAP_BUSY=true;$('mapPanel').hidden=false;ensureMap();setTimeout(()=>MAP.invalidateSize(),0);busy('mapToggle',true,'Chargement carte…');$('mapStatus').textContent='Chargement des points correspondant aux filtres…';let done=false,t=setTimeout(()=>{if(done)return;done=true;MAP_BUSY=false;busy('mapToggle',false);$('mapStatus').className='error';$('mapStatus').textContent='Le serveur n’a pas répondu sous 20 secondes.'},20000);google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(t);MAP_BUSY=false;busy('mapToggle',false);LAYER.clearLayers();let bounds=[],focused=null;(r.points||[]).forEach(x=>{let ll=[x.latitude,x.longitude],m=L.marker(ll).addTo(LAYER).bindPopup(popup(x),{maxWidth:400});bounds.push(ll);if(focus&&Math.abs(Number(focus.latitude)-x.latitude)<.000001&&Math.abs(Number(focus.longitude)-x.longitude)<.000001)focused=m});if(bounds.length)MAP.fitBounds(bounds,{padding:[30,30],maxZoom:15});if(focused){MAP.setView(focused.getLatLng(),16);focused.openPopup()}$('mapStatus').textContent=Number(r.total||0)+' entreprise(s) géolocalisée(s).';$('mapToggle').textContent='Actualiser la carte'}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(t);MAP_BUSY=false;busy('mapToggle',false);$('mapStatus').className='error';$('mapStatus').textContent='Erreur : '+String(e&&e.message||e)}).EUC_DEV547_bookMapData(query(true))}
function showCurrentPoint(c){$('detail').close();$('mapPanel').hidden=false;ensureMap();LAYER.clearLayers();let marker=L.marker([Number(c.latitude),Number(c.longitude)]).addTo(LAYER).bindPopup(popup(c),{maxWidth:400});MAP.setView(marker.getLatLng(),16);marker.openPopup();setTimeout(()=>MAP.invalidateSize(),0);$('mapStatus').className='status';$('mapStatus').textContent='1 entreprise géolocalisée : '+c.entreprise+'.';$('mapPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function focusCurrent(){let c=CURRENT;if(!c||MAP_BUSY)return;if(c.latitude!=null&&c.longitude!=null){showCurrentPoint(c);return}MAP_BUSY=true;busy('detailMap',true,'Localisation…');$('detailMapStatus').textContent='Recherche du point…';let done=false,t=setTimeout(()=>{if(done)return;done=true;MAP_BUSY=false;busy('detailMap',false);$('detailMapStatus').className='error';$('detailMapStatus').textContent='La localisation n’a pas répondu sous 20 secondes.'},20000);google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(t);MAP_BUSY=false;busy('detailMap',false);if(!r||!r.ok){$('detailMapStatus').className='error';$('detailMapStatus').textContent='Localisation précise indisponible.';return}c.latitude=Number(r.latitude);c.longitude=Number(r.longitude);$('detailMapStatus').textContent='';showCurrentPoint(c)}).withFailureHandler(()=>{if(done)return;done=true;clearTimeout(t);MAP_BUSY=false;busy('detailMap',false);$('detailMapStatus').className='error';$('detailMapStatus').textContent='Localisation précise indisponible.'}).EUC_DEV560_publicCompanyPoint({entreprise:c.entreprise,adresse:c.adresse})}function reset(){if(LOADING)return;['family','diploma','city','company'].forEach(id=>$(id).value='');$('sort').value='RECENT';$('pageSize').value='10';load(true)}
$('apply').onclick=()=>load(true);$('reset').onclick=reset;$('mapToggle').onclick=()=>mapLoad(null);$('print').onclick=()=>window.print();$('prevPage').onclick=()=>{if(PAGE>1){PAGE--;load(false)}};$('nextPage').onclick=()=>{if(PAGE<META.totalPages){PAGE++;load(false)}};$('pageSize').onchange=()=>load(true);$('sort').onchange=()=>load(true);$('detailClose').onclick=()=>$('detail').close();$('detailMap').onclick=focusCurrent;ouvrir();
</script></body></html>
