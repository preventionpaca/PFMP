<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#f5fbf8;color:#152b27;margin:0}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between}.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.k{background:#fff;border:1px solid #c5e4dc;border-radius:12px;padding:10px 14px}.table{overflow:auto;background:#fff;border:1px solid #c5e4dc;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #edf2f0;text-align:left;vertical-align:top}.a{display:inline-block;background:#d92d20;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;font-weight:900;margin-right:5px}.badge{font-weight:800;color:#d92d20}</style></head><body><main class="wrap"><div class="top"><div><h1 id="title"></h1><div id="period"></div></div><a id="back">← Retour aux classes</a></div><div class="kpis" id="kpis"></div><div class="table"><table><thead><tr><th>Élève</th><th>Statut</th><th>Entreprise</th><th>Adresse entreprise</th><th>Contact entreprise</th><th>Tuteur entreprise</th><th>Professeur principal</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>
(function(){const D=<?!= detailJson ?>,P=<?!= paramsJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;title.textContent='Suivi PFMP — '+((D.classe&&D.classe.nom)||'Classe');period.textContent=(D.periode&&D.periode.libelle)||'';back.href=BASE+'?page=suivi-conventions-public-famille&annee='+encodeURIComponent(P.annee)+'&famille='+encodeURIComponent(P.famille);var st=D.stats||{};kpis.innerHTML='<div class="k">Effectif <b>'+Number(st.total||0)+'</b></div><div class="k">Apprenti <b>'+Number(st.apprentis||0)+'</b></div><div class="k">Avec convention <b>'+Number(st.avecConvention||0)+'</b></div><div class="k">Sans convention <b>'+Number(st.sansConvention||0)+'</b></div><div class="k">Annulées / interrompues <b>'+Number(st.annulees||0)+'</b></div>';tb.innerHTML=(D.lignes||[]).map(function(x){return '<tr><td>'+(x.apprenti?'<span class="a">A</span>':'')+'<b>'+String(x.nom||'')+' '+String(x.prenom||'')+'</b></td><td class="'+(x.apprenti?'badge':'')+'">'+String(x.statut||'')+'</td><td>'+String(x.entreprise||'—')+'</td><td>'+String(x.adresseEntreprise||'—')+'</td><td>'+String(x.contactEntreprise||'—')+'</td><td>'+String(x.tuteurEntreprise||'—')+'</td><td>'+String(x.professeurPrincipal||'—')+'</td></tr>'}).join('')})();
</script></body></html>
