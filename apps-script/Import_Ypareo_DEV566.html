<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Yparéo</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f8f6;color:#17332e;font-family:Arial,sans-serif}.hero{background:#08745f;color:#fff;padding:28px}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #bfe2da;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:800}input,select,button{font:inherit;padding:10px;border:1px solid #83c7b8;border-radius:8px}button,.btn{font:inherit;padding:10px;border:1px solid #83c7b8;border-radius:8px;background:#08745f;color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#fff;color:#08745f}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.spin{display:none;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:7px}.busy .spin{display:inline-block}@keyframes r{to{transform:rotate(360deg)}}.status{min-height:24px;color:#596b67}.status.error{color:#a51d2d}.status.ok{color:#08745f}.warning{padding:11px;border-left:4px solid #df8b00;background:#fff6df}.okbox{padding:11px;border-left:4px solid #08745f;background:#e9f8f4}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:8px;border-bottom:1px solid #dbe9e5;text-align:left;vertical-align:top}.table{overflow:auto}.bad{color:#a51d2d;font-weight:800}.good{color:#08745f;font-weight:800}[hidden]{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head>
<body><header class="hero"><div class="wrap"><h1>Import des apprentis Yparéo</h1><p>CSV, XLS ou XLSX — prévisualisation obligatoire avant toute écriture.</p></div></header><main class="wrap">
<p><a id="home" class="btn secondary" href="https://alternance.loucodi.fr/" target="_top">← Retour à l’administration PFMP</a></p>
<section class="card"><div id="mode" class="warning">Chargement de la configuration…</div><div class="grid"><label>Année scolaire<select id="year"></select></label><label>Fichiers Yparéo (un ou plusieurs groupes)<input id="file" type="file" multiple accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label></div><h2>Correspondances de groupes</h2><div id="mappings" class="grid"></div><div class="actions"><button id="saveMap" class="secondary"><span class="spin"></span><span>Enregistrer les correspondances</span></button><button id="analyze"><span class="spin"></span><span>Analyser le fichier</span></button><button id="import" hidden><span class="spin"></span><span>Importer les lignes validées</span></button></div><p id="status" class="status" role="status"></p></section>
<section id="result" class="card" hidden><h2>Prévisualisation</h2><p id="summary"></p><div class="table"><table><thead><tr><th>Ligne</th><th>Groupe</th><th>Classe cible</th><th>Apprenant</th><th>Statut</th><th>Action</th><th>Contrôle</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>const BOOT=<?!= bootJson ?>,state={config:null,rawRows:[],analysis:null};const $=s=>document.querySelector(s),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.text=btn.lastElementChild.textContent;btn.disabled=true;btn.classList.add('busy');btn.lastElementChild.textContent=label}else{btn.disabled=false;btn.classList.remove('busy');btn.lastElementChild.textContent=btn.dataset.text||btn.lastElementChild.textContent}}
function call(name,arg,btn,label,timeout=60000){return new Promise((resolve,reject)=>{let done=false,t=setTimeout(()=>{if(done)return;done=true;busy(btn,false);reject(new Error('Délai dépassé. Réessayez.'))},timeout),runner=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(t);busy(btn,false);resolve(v)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(t);busy(btn,false);reject(new Error(e&&e.message||e))});busy(btn,true,label);runner[name](arg)})}
function msg(text,type=''){const el=$('#status');el.textContent=text;el.className='status '+type}
function mappingPayload(){return[...document.querySelectorAll('[data-source]')].map(el=>({source:el.dataset.source,classe:el.value}))}
function renderConfig(config){state.config=config;$('#mode').className=config.mode==='LIVE'?'okbox':'warning';$('#mode').textContent=config.mode==='LIVE'?'Mode LIVE : l’import reste soumis à confirmation.':'Mode sécurisé DRY_RUN : analyse possible, aucune écriture Grist ni création de contrat.';const classes=(config.classes||[]).map(x=>`<option value="${esc(x.classe)}">${esc(x.classe)}</option>`).join('');$('#mappings').innerHTML=(config.mappings||[]).map(m=>`<label>${esc(m.source)}<select data-source="${esc(m.source)}">${classes}</select></label>`).join('');(config.mappings||[]).forEach(m=>{const el=[...document.querySelectorAll('[data-source]')].find(x=>x.dataset.source===m.source);if(el)el.value=m.classe});$('#import').hidden=true}
function parseWorkbook(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Lecture du fichier impossible.'));reader.onload=()=>{try{let book;if(/\.csv$/i.test(file.name)){const text=new TextDecoder('windows-1252').decode(new Uint8Array(reader.result));book=XLSX.read(text,{type:'string',raw:false})}else book=XLSX.read(reader.result,{type:'array',raw:false,cellDates:false});const sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});resolve(rows)}catch(e){reject(new Error('Fichier Yparéo illisible : '+e.message))}};reader.readAsArrayBuffer(file)})}
async function saveMappings(){try{renderConfig(await call('EUC_DEV566_saveMappings',{mappings:mappingPayload()},$('#saveMap'),'Enregistrement…'));msg('Correspondances enregistrées.','ok')}catch(e){msg(e.message,'error')}}
/* Plusieurs exports (un par groupe Yparéo) : lignes réunies, lignes strictement identiques retirées. */
async function lireFichiers(files){const vus={},rows=[];let doublons=0;for(const f of files){for(const r of await parseWorkbook(f)){const k=JSON.stringify(r);if(vus[k]){doublons++;continue}vus[k]=1;rows.push(r)}}return {rows,doublons}}
async function analyze(){const files=Array.from($('#file').files||[]);if(!files.length)return msg('Choisissez un ou plusieurs fichiers CSV, XLS ou XLSX.','error');msg('Lecture et contrôle de '+files.length+' fichier(s)…');try{const lu=await lireFichiers(files);state.rawRows=lu.rows;state.fusion={fichiers:files.length,lignes:lu.rows.length,doublons:lu.doublons};const q={annee:$('#year').value,rows:state.rawRows,mappings:mappingPayload()};state.analysis=await call('EUC_DEV566_analyze',q,$('#analyze'),'Analyse…',120000);renderAnalysis();msg((state.fusion.fichiers>1?state.fusion.fichiers+' fichiers réunis : '+state.fusion.lignes+' ligne(s)'+(state.fusion.doublons?', '+state.fusion.doublons+' doublon(s) retiré(s)':'')+'. ':'')+'Analyse terminée : aucune écriture n’a été effectuée.',state.analysis.blocked?'error':'ok')}catch(e){msg(e.message,'error')}}
function renderAnalysis(){const a=state.analysis;$('#result').hidden=false;$('#summary').textContent=`${a.total} ligne(s) : ${a.ready} prête(s), ${a.blocked} bloquée(s). Niveau cible : Autres formations.`;$('#rows').innerHTML=(a.lines||[]).map(x=>`<tr><td>${x.index}</td><td>${esc(x.group)}</td><td>${esc(x.classe)}</td><td>${esc(x.nom)} ${esc(x.prenom)}</td><td>${esc(x.kind)}</td><td>${esc(x.action)}</td><td class="${x.ready?'good':'bad'}">${x.ready?'Prête':esc(x.issues.join(' ; '))}</td></tr>`).join('');$('#import').hidden=!(a.mode==='LIVE'&&!a.blocked&&a.ready)}
async function runImport(){if(!state.analysis||state.analysis.blocked)return;if(!confirm('Confirmer l’import réel des '+state.analysis.ready+' ligne(s) validée(s) ?'))return;const q={annee:$('#year').value,rows:state.rawRows,mappings:mappingPayload(),confirmed:true,requestId:(crypto.randomUUID?crypto.randomUUID():Date.now()+'x'+Math.random()).replace(/-/g,'')};try{const r=await call('EUC_DEV566_import',q,$('#import'),'Import…',330000);msg(`${r.total||0} ligne(s) importée(s), ${r.created||0} élève(s) créé(s), ${r.updated||0} mis à jour.`,'ok');$('#import').hidden=true}catch(e){msg(e.message,'error')}}
async function init(){const years=BOOT.years||[];$('#year').innerHTML=years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');if(BOOT.params&&BOOT.params.annee)$('#year').value=BOOT.params.annee;try{renderConfig(await call('EUC_DEV566_importConfig',{},null,'Chargement…'));msg('Choisissez le fichier à contrôler.')}catch(e){msg(e.message,'error')}}
$('#saveMap').onclick=saveMappings;$('#analyze').onclick=analyze;$('#import').onclick=runImport;init();</script></body></html>
