<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
body{font-family:Arial,sans-serif;background:#f7fbf9;color:#17312b;margin:0}
.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #cfe3dc;border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:4px}
input{padding:7px;border:1px solid #cfe3dc;border-radius:6px}button{border:0;border-radius:6px;background:#0b8f72;color:white;padding:8px 10px;font-weight:700;cursor:pointer}
.stage{margin-top:10px;padding:10px;border:1px solid #dde9e5;border-radius:8px}pre{white-space:pre-wrap;word-break:break-word;background:#f4faf7;padding:8px;border-radius:6px}
.good{color:#08745e;font-weight:700}.bad{color:#b42318;font-weight:700}.wait{color:#b54708;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>Audit chargement actuel — DEV226</h1>
<div class="card"><div class="row">
<label>Année<input id="year" value="2026-2027"></label>
<label>ID classe<input id="cid" value="3"></label>
<label>Nom classe<input id="cname" value="1CAR"></label>
<button id="all">Tout tester</button>
</div></div>
<div id="s211" class="stage"><b>1. Loader DEV211</b><div class="state"></div><pre></pre></div>
<div id="scols" class="stage"><b>2. Vérification colonnes DEV214</b><div class="state"></div><pre></pre></div>
<div id="slatest" class="stage"><b>3. Lecture dossiers DEV214</b><div class="state"></div><pre></pre></div>
<div id="s214" class="stage"><b>4. Loader final DEV214</b><div class="state"></div><pre></pre></div>
</div>
<script>
const tests=[
['s211','EUC_DEV226_stage211',()=>[year.value,Number(cid.value),cname.value]],
['scols','EUC_DEV226_stage214Cols',()=>[]],
['slatest','EUC_DEV226_stage214Latest',()=>[]],
['s214','EUC_DEV226_stage214Loader',()=>[year.value,Number(cid.value),cname.value]]
];
function runOne(id,method,args){
 const el=document.getElementById(id),st=el.querySelector('.state'),pre=el.querySelector('pre');
 st.textContent='En cours…';st.className='state wait';pre.textContent='';
 let done=false; const timer=setTimeout(()=>{if(!done){st.textContent='BLOQUÉ > 20 s';st.className='state bad';}},20000);
 google.script.run.withSuccessHandler(r=>{done=true;clearTimeout(timer);st.textContent='OK';st.className='state good';pre.textContent=JSON.stringify(r,null,2);})
 .withFailureHandler(e=>{done=true;clearTimeout(timer);st.textContent='ERREUR';st.className='state bad';pre.textContent=String(e&&e.message||e);})[method](...args());
}
all.onclick=()=>tests.forEach(t=>runOne(t[0],t[1],t[2]));
</script>
</body></html>
