<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial,sans-serif;background:#f5fbf8;color:#153c35;margin:0}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.head{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #bfe4da;border-radius:16px;padding:18px}.btn{display:inline-flex;gap:7px;align-items:center;background:#079b79;color:#fff;border:0;text-decoration:none;padding:9px 13px;border-radius:9px;font-weight:800;cursor:pointer}.counts{display:none;margin-top:12px;border-top:1px solid #e5efec;padding-top:9px}.counts.show{display:block}.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:4px 0}.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><main class="wrap"><div class="head"><h1>Point sur les stages</h1><button id="toggle" class="btn">Afficher les décomptes</button></div><div class="grid" id="grid"></div></main>
<script>
(function(){
 const P=<?!= paramsJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;
 function wait(b,t){b.innerHTML='<span class="spin"></span>'+t;b.disabled=true}
 function card(f,l){return '<section class="card"><h2>'+l+'</h2><button class="btn fam" data-f="'+f+'">Voir les classes</button><div class="counts" id="c-'+f+'"></div></section>'}
 grid.innerHTML=card('BACPRO','BAC PRO')+card('BTS','BTS')+card('CAP','CAP');
 document.querySelectorAll('.fam').forEach(function(b){b.onclick=function(){wait(b,'Chargement…');location.href=BASE+'?page=suivi-conventions-public-famille&annee='+encodeURIComponent(P.annee)+'&famille='+b.dataset.f}});
 let loaded=false,shown=false;
 function render(D){['BACPRO','BTS','CAP'].forEach(function(f){var fam=(D.familles&&D.familles[f])||{},box=document.getElementById('c-'+f);box.innerHTML=(fam.niveaux||[]).map(function(l){return '<div><b>'+l.niveau+'</b>'+(l.periodes||[]).map(function(p){return '<div class="row"><span>'+p.libelle+'</span><strong>'+Number(p.conventions||0)+' / '+Number(p.eleves||p.total||0)+(Number(p.apprentis||0)?' + '+Number(p.apprentis)+' apprenti(s)':'')+'</strong></div>'}).join('')+'</div>'}).join('')})}
 toggle.onclick=function(){shown=!shown;document.querySelectorAll('.counts').forEach(function(x){x.classList.toggle('show',shown)});if(!shown){toggle.textContent='Afficher les décomptes';return}if(loaded){toggle.textContent='Masquer les décomptes';return}wait(toggle,'Chargement du décompte…');google.script.run.withSuccessHandler(function(r){loaded=true;render(r||{});toggle.disabled=false;toggle.textContent='Masquer les décomptes'}).withFailureHandler(function(){toggle.disabled=false;toggle.textContent='Réessayer'}).EUC_DEV352_summaryData_(P.annee)};
})();
</script>
<style id="EUC_DEV365_PUBLIC_ROOT">
#home,[id*="home"][class*="btn"],a[href*="page=admin-pfmp"]{display:none!important}
</style>
<script>
(function(){
 function clean(){
  document.querySelectorAll('a,button').forEach(function(el){
   var t=String(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
   if(t==='accueil pfmp'||t==='retour à l’accueil'||t==="retour à l'accueil"||t==='retour accueil'){
    el.style.display='none';
   }
  });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();
})();
</script>
</body></html>
