<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;background:#f4f6f9;color:#182230;margin:0}main{max-width:900px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px}h1{margin-top:0}.row{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center;margin:10px 0}label{font-weight:700}input{padding:.7rem;border:1px solid #b9c6d2;border-radius:6px;font:inherit;width:100%;box-sizing:border-box}button{margin-top:14px;padding:.8rem 1rem;border:0;border-radius:7px;background:#07866e;color:#fff;font-weight:700}.status{margin-top:14px;padding:10px;border-radius:7px}.ok{background:#e7f7ef}.back{display:inline-block;margin-bottom:14px}</style></head><body><main><a class="back" id="back">← Retour au centre d’administration</a><section class="card"><h1>Paramètres de la convention</h1><p>Ces valeurs sont lues au moment de générer la convention. Une modification ne nécessite aucun changement de code.</p><div id="form"></div><button id="save">Enregistrer les paramètres</button><div id="status" class="status"></div></section></main><script>const C=<?!= config ?>;(function(){const f=document.getElementById('form'),s=document.getElementById('status');document.getElementById('back').href=C.baseUrl+'?page=admin-pfmp';google.script.run.withSuccessHandler(rows=>{f.innerHTML=rows.map(r=>'<div class="row"><label>'+esc(r.Description||r.Cle)+'</label><input data-cle="'+esc(r.Cle)+'" value="'+esc(r.Valeur||'')+'"></div>').join('')}).withFailureHandler(err=>s.textContent=err.message||err).EUC_PARAM_CONV_lister();document.getElementById('save').onclick=()=>{const items=[...f.querySelectorAll('input')].map(i=>({cle:i.dataset.cle,valeur:i.value}));google.script.run.withSuccessHandler(r=>{s.className='status ok';s.textContent='Paramètres enregistrés : '+r.misAJour+' valeur(s) mise(s) à jour.'}).withFailureHandler(err=>s.textContent=err.message||err).EUC_PARAM_CONV_enregistrer(items)};function esc(v){const d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}})();</script></body></html>
