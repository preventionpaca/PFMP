<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi des PFMP</title>
<style>
:root{--vert:#0b6b4f;--vert2:#07856f;--clair:#e7f4ee;--texte:#16302a;--gris:#5b6b66;--bord:#d5e6de;--fond:#f6faf8;--alerte:#9a3412;--alerte-fond:#fff1e8;--ok:#166534;--ok-fond:#e3f5ea;--app:#7c2d92;--app-fond:#f6e9fb;--jaune:#fffbe6}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;color:var(--texte);background:var(--fond)}
header{background:linear-gradient(135deg,#eef9f5,#d8f0e6);color:#0b4f40;border-bottom:1px solid #bfe2da;padding:14px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
header h1{margin:0;font-size:20px}header .info{opacity:.85;font-size:13px}
main{max-width:1400px;margin:0 auto;padding:12px 16px 48px}
a{color:var(--vert)}
.barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.onglet,.btn{font:700 14px Arial,sans-serif;border:1px solid var(--bord);background:#fff;color:var(--texte);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none}
.onglet[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.plein{background:var(--vert);border-color:var(--vert);color:#fff}
input[type=search]{font:15px Arial,sans-serif;padding:8px 12px;border:1px solid var(--bord);border-radius:8px;min-width:240px;flex:1;max-width:420px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.carte{display:block;background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.carte:hover,.carte:focus-visible{border-color:var(--vert2);box-shadow:0 2px 10px rgba(11,107,79,.12);outline:none}
.carte h3{margin:0 0 2px;font-size:17px}.carte .pp{color:var(--gris);font-size:13px;margin-bottom:8px}
.per{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #eef4f1;font-size:14px}
.per b{font-variant-numeric:tabular-nums}
.jauge{height:6px;border-radius:3px;background:#eef2f0;overflow:hidden;margin-top:3px}.jauge i{display:block;height:100%;background:var(--vert2)}
.note{color:var(--gris);font-size:13px}
.app{color:var(--app);font-weight:700}
h2{font-size:18px;margin:18px 0 8px}
.compteurs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.compteur{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:8px 12px}.compteur span{font-size:12px;color:var(--gris)}.compteur b{display:block;font-size:22px}
.tableau{background:#fff;border:1px solid var(--bord);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #edf3f0;vertical-align:top}
th{position:sticky;top:0;background:#f3f8f5;color:var(--gris);font-size:12px;z-index:1}
tr.apprenti td{background:var(--jaune)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-AVEC{background:var(--ok-fond);color:var(--ok)}.b-SANS{background:var(--alerte-fond);color:var(--alerte)}
.b-ANNULEE,.b-INTERROMPUE,.b-RUPTURE{background:#f1f1f1;color:#555}.b-CONTRAT{background:var(--ok-fond);color:var(--ok)}.b-SANS_CONTRAT{background:var(--alerte-fond);color:var(--alerte)}.b-APPRENTI{background:var(--app-fond);color:var(--app)}
.b-PDIF_ENTREPRISE{background:var(--ok-fond);color:var(--ok)}.b-PDIF_LYCEE{background:#e8f0fe;color:#1d4ed8}.b-PDIF_A_DEFINIR{background:var(--alerte-fond);color:var(--alerte)}
.mixte{display:block;margin-top:4px;font-size:12px;color:var(--app)}
.petit{display:block;margin-top:3px;font-size:12px;color:var(--gris)}.decale{display:block;margin-top:3px;font-size:12px;color:var(--alerte);font-weight:700}
.total{font-size:12px;color:var(--gris);text-align:right;margin-top:1px}.total b{color:var(--texte)}
.per{cursor:pointer;border-radius:6px}.per:hover,.per:focus-visible{background:var(--clair);outline:none}.gros b{font-size:17px}
.carte{cursor:pointer}.occupe{opacity:.6;pointer-events:none}.occupe::after{content:'Chargement…';display:block;font-size:12px;color:var(--vert);margin-top:4px}
.bulle{position:fixed;z-index:20;overflow:hidden;background:#fff;border:1px solid var(--bord);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px 14px;font-size:13px;pointer-events:none}
.bulle-titre{font-weight:700;margin-bottom:6px}.colonnes{display:flex;flex-wrap:wrap;gap:6px 18px}
.groupe{min-width:150px;flex:1}.groupe ul{margin:4px 0 0;padding-left:16px}.groupe.large ul{columns:3 200px;column-gap:24px}
details.niveau{background:#fff;border:1px solid var(--bord);border-radius:12px;margin:10px 0;padding:0 14px}
details.niveau>summary{cursor:pointer;padding:12px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.niveau>summary::before{content:'▸';color:var(--vert);font-weight:700}details.niveau[open]>summary::before{content:'▾'}
details.niveau>summary .titre{font-weight:700;font-size:17px}details.niveau .grille{padding-bottom:14px}
button.compteur{font:inherit;color:inherit;text-align:left;cursor:pointer}button.compteur[aria-expanded="true"]{border-color:var(--vert2);background:var(--clair)}
.noms{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:14px}
.imprime-seul{display:none}
.maj{position:sticky;top:0;z-index:15;background:#fff7d6;border-bottom:1px solid #f0d77a;padding:8px 16px;text-align:center;font-weight:700;color:#5c4700}.maj .btn{margin-left:10px;padding:5px 12px}
a.vers-carte{color:var(--texte);text-decoration:none;border-bottom:1px dotted var(--vert2)}a.vers-carte:hover{color:var(--vert)}
.pastille{display:inline-block;width:18px;height:18px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:5px;vertical-align:1px}
select{font:14px Arial,sans-serif;padding:7px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
.coord{font-size:13px}.coord b{display:block;font-size:14px}
.vide{padding:24px;text-align:center;color:var(--gris)}
.retour{font-weight:700;text-decoration:none}
.erreur{background:var(--alerte-fond);color:var(--alerte);padding:12px 16px;border-radius:10px;font-weight:700}
@media (max-width:700px){header h1{font-size:18px}th:nth-child(4),td:nth-child(4){display:none}}
@page{size:A4 landscape;margin:10mm}
.meme-ent{margin-top:14px;padding:12px 14px;background:#f7fbf9;border:1px solid var(--bord);border-radius:12px}.meme-ent h3{margin:0 0 4px;font-size:15px;color:#0b6b4f}.meme-ent table{width:100%;border-collapse:collapse;font-size:13px}.meme-ent th,.meme-ent td{text-align:left;vertical-align:top;padding:6px 7px;border-bottom:1px solid #e3ece8}.meme-ent td{white-space:pre-line}.meme-ent .ok{color:#0b745f;font-weight:700}.meme-ent .alerte{color:#a15c00;font-weight:700}@media print{.meme-ent{break-inside:avoid;background:#fff}}
@media print{header,.barre,.noprint{display:none!important}body{background:#fff;font-size:11px}.tableau{border:0;overflow:visible}th{position:static}.imprime-seul{display:block;font-weight:700}tr.apprenti td{background:#fffbe6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}a{color:inherit;text-decoration:none}}
.pp-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}.pp-modal[hidden]{display:none}.pp-carte{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}.pp-carte h2{margin:0 0 4px}.pp-outils{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0}.colonnes-choix{border:1px solid #cfe3dc;border-radius:10px;background:#f6fbf9;padding:8px 12px;margin:6px 0}.colonnes-choix label{display:inline-flex;align-items:center;gap:4px;margin:3px 14px 3px 0;font-size:.9rem}.colonnes-choix .note{display:block;margin-top:4px}.pp-carte input#ppCode{padding:7px;border:1px solid #9cc;border-radius:7px;min-width:260px}.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-2px;animation:ppspin .7s linear infinite}@keyframes ppspin{to{transform:rotate(360deg)}}@media print{.pp-modal{display:none!important}}.edition{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#e3f4ee;color:#0b6b4f;border:1px solid #9fd8c9}.edition.non{background:#fff4e5;color:#9a4a00;border-color:#f3c48a}.pdf-liens{display:block;margin-top:4px;font-size:12px}.pdf-liens a{display:block;margin-top:2px}
.lieu-stage-cell{margin-top:6px;padding:6px 8px;border:2px solid #d97706;border-radius:6px;background:#fff7d6;color:#92400e;font-weight:700}
</style>
</head>
<body>
<header><h1>Suivi des PFMP</h1><span class="info" id="info"></span><a id="versAdmin" class="noprint" hidden style="color:#0b4f40;background:#fff;border:1px solid #0b6b4f;border-radius:8px;padding:5px 12px;font-weight:700;text-decoration:none;margin-left:auto" target="_top">← Administration PFMP</a></header>
<div id="maj" class="maj noprint" role="status" hidden>Des données ont été modifiées dans Grist depuis l’ouverture de cette page. <button type="button" class="btn plein" id="actualiser">Actualiser</button></div>
<main id="app" aria-live="polite"></main>
<script>
/* DEV714 : calcul partagé avec le serveur (EUC_DEV714_MemeEntreprise.js) : élèves de la classe et d'autres classes dans une même entreprise. */
<?!= dev714 ?>
var D=<?!= donnees ?>,CFG=<?!= config ?>;
(function(){
  'use strict';
  var app=document.getElementById('app');
  var FAM={BACPRO:'BAC PRO',CAP:'CAP',BTS:'BTS',APPRENTIS:'Classes entières : apprentis et formation continue',AUTRES:'Autres formations'},ORDRE=['BACPRO','CAP','BTS','APPRENTIS','AUTRES'];
  var NIV=['Seconde','Première','Terminale','1CAP','TCAP','1re année','2e année','CFA RAN','CFA RAN + CFAI','GRETA + CFAI','GRETA','Formation continue — GRETA','Autres'];
  var LIB={AVEC:'Convention enregistrée',SANS:'Sans convention',ANNULEE:'Annulée',INTERROMPUE:'Interrompue',APPRENTI:'Apprenti',PDIF_ENTREPRISE:'En entreprise',PDIF_LYCEE:'Au lycée',PDIF_A_DEFINIR:'À définir',CONTRAT:'Contrat',SANS_CONTRAT:'Sans contrat',RUPTURE:'Contrat rompu'};
  var parId={};D.classes.forEach(function(c){parId[c.id]=c;});
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
  function dfr(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';}
  function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();}
  if(CFG.admin){var va=document.getElementById('versAdmin');va.hidden=false;va.href=CFG.base+'?page=admin-pfmp';document.querySelector('header h1').textContent='Suivi des PFMP — administration';}
  document.getElementById('info').textContent='Année '+(D.annee||'')+(D.temoin?' · données Grist à jour (action n° '+D.temoin+')':'');
  if(D.erreur){app.innerHTML='<p class="erreur">Les données n’ont pas pu être lues : '+esc(D.erreur)+'. Rechargez la page dans un instant.</p>';return;}

  /* Accordéons ouverts : mémorisés dans ce navigateur seulement. */
  var OUVERTS={};try{OUVERTS=JSON.parse(localStorage.getItem('pfmpOuverts')||'{}')||{};}catch(e){}
  function memoriser(){try{localStorage.setItem('pfmpOuverts',JSON.stringify(OUVERTS));}catch(e){}}

  function etat(){var h=new URLSearchParams(location.hash.slice(1));return {f:h.get('f')||'',c:Number(h.get('c'))||0,p:Number(h.get('p'))||0,q:h.get('q')||''};}
  function aller(o){var h=new URLSearchParams();Object.keys(o).forEach(function(k){if(o[k])h.set(k,o[k]);});var nh='#'+h.toString();
    if(location.hash!==nh){try{history.pushState(null,'',nh);}catch(e){location.hash=nh;return;}}rendre();}
  var familles=ORDRE.filter(function(f){return D.classes.some(function(c){return c.famille===f;});});

  /* Répartition d'une période par statut : [libellé, noms]. */
  function repartition(c,p){
    var par={};c.eleves.forEach(function(e){var st=(p.lignes[e[0]]||['SANS'])[0];(par[st]=par[st]||[]).push(e[1]);});
    var ordre=p.pdif?['PDIF_ENTREPRISE','APPRENTI','PDIF_LYCEE','PDIF_A_DEFINIR']:c.ce?['CONTRAT','SANS_CONTRAT','RUPTURE']:['AVEC','APPRENTI','SANS','ANNULEE','INTERROMPUE'];
    return ordre.filter(function(k){return par[k];}).map(function(k){return [LIB[k]||k,par[k]];});
  }
  function colonnes(groupes){return groupes.map(function(g){return '<div class="groupe"><b>'+esc(g[0])+' ('+g[1].length+')</b><ul>'+g[1].map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul></div>';}).join('')||'<p class="note">Aucun élève.</p>';}
  /* Compteurs d'une période : [libellé, valeur, noms]. Classe entière d'apprentis : contrats, pas conventions. */
  /* DEV660 : conventions éditées (PDF généré) ou non, élèves scolaires de la période ; cliquer donne les noms. */
  function editions(c,p){
    var oui=[],non=[];
    c.eleves.forEach(function(e){var l=p.lignes[e[0]]||['SANS'];if(l[0]==='APPRENTI'||l[4])return;(/^\d{4}-/.test(l[5]||'')?oui:non).push(e[1]);});
    return [['Conventions éditées',oui.length+' / '+(oui.length+non.length),oui],['Conventions non éditées',non.length,non]];
  }
  function compteurs(c,p){
    var n=p.n,par={};
    c.eleves.forEach(function(e){var st=(p.lignes[e[0]]||['SANS'])[0];(par[st]=par[st]||[]).push(e[1]);});
    function liste(codes){var l=[];codes.forEach(function(k){l=l.concat(par[k]||[]);});return l;}
    var tous=c.eleves.map(function(e){return e[1];});
    if(p.pdif)return [['Effectif',n.effectif,tous],['En entreprise',n.entreprise,liste(['PDIF_ENTREPRISE','APPRENTI'])],['Au lycée',n.lycee,liste(['PDIF_LYCEE'])],['À définir',n.aDefinir,liste(['PDIF_A_DEFINIR'])]];
    if(c.ce)return [['Effectif',n.effectif,tous],['Apprentis',n.apprentis,tous],['En entreprise',n.avec+' / '+n.effectif,liste(['CONTRAT'])],['Avec contrat',n.avec,liste(['CONTRAT'])],['Sans contrat',n.sans,liste(['SANS_CONTRAT','RUPTURE'])],['Contrats annulés / interrompus',n.annulees,liste(['RUPTURE'])]];
    return [['Effectif',n.effectif,tous]].concat(c.apprentisAffiches?[['Apprentis',n.apprentis,liste(['APPRENTI'])],['En entreprise, tous statuts',(n.avec+n.apprentis)+' / '+n.effectif,liste(['AVEC','APPRENTI'])]]:[])
      .concat([['Avec convention',n.avec+' / '+n.scolaires,liste(['AVEC'])],['Sans convention',n.sans,liste(['SANS','ANNULEE','INTERROMPUE'])],['Annulées / interrompues',n.annulees,liste(['ANNULEE','INTERROMPUE'])]]).concat(editions(c,p));
  }
  function resumePeriode(c,p){
    var n=p.n,ouvre=' data-c="'+c.id+'" data-p="'+p.id+'" role="button" tabindex="0"';
    if(p.pdif)return '<div class="per"'+ouvre+'><span>P.dif.</span><span class="note">entreprise <b>'+n.entreprise+'</b> · lycée <b>'+n.lycee+'</b> · à définir <b>'+n.aDefinir+'</b></span></div>';
    if(c.ce){var pc=n.effectif?Math.round(100*n.avec/n.effectif):0;
      return '<div class="per"'+ouvre+'><span>'+esc(p.libelle)+' <span class="note">'+dfr(p.debut)+'</span></span><span class="gros"><b>'+n.avec+' / '+n.effectif+'</b></span></div>'+
        '<div class="total">apprentis avec contrat'+(n.sans?' · '+n.sans+' sans contrat':'')+(n.annulees?' · '+n.annulees+' rompu(s)':'')+'</div><div class="jauge" aria-hidden="true"><i style="width:'+pc+'%"></i></div>';}
    var tot=n.avec+n.apprentis,pct=n.effectif?Math.round(100*tot/n.effectif):0,app=c.apprentisAffiches&&n.apprentis;
    /* Chiffre principal : élèves en entreprise (scolaires sous convention + apprentis) sur l'effectif Pronote. */
    return '<div class="per"'+ouvre+'><span>'+esc(p.libelle)+' <span class="note">'+dfr(p.debut)+'</span></span><span class="gros"><b>'+tot+' / '+n.effectif+'</b></span></div>'+
      '<div class="total">'+n.avec+' / '+n.scolaires+' scolaires avec convention'+(app?' <span class="app">+ '+n.apprentis+' apprenti(s)</span>':'')+(n.annulees?' · '+n.annulees+' annulée(s)':'')+'</div>'+
      '<div class="jauge" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
  }
  function carte(c){
    return '<div class="carte" data-c="'+c.id+'" role="link" tabindex="0"><h3>'+esc(c.nom)+'</h3><div class="pp">'+esc(c.niveau)+(c.ce?' · '+c.effectif+(c.fc?' stagiaire(s)':' apprenti(s)'):'')+(c.pp.length?' · PP : '+esc(c.pp.join(', ')):'')+'</div>'+(c.periodes.length?c.periodes.map(function(p){return resumePeriode(c,p);}).join(''):'<p class="note">'+(c.effectif?'Aucune période (appel, visite) dans le calendrier.':'Aucun apprenti cette année.')+'</p>')+'</div>';
  }
  function accueil(s){
    var f=s.f&&familles.indexOf(s.f)>=0?s.f:familles[0];
    var html='<div class="barre noprint" role="group" aria-label="Familles">'+familles.map(function(x){return '<button class="onglet" type="button" data-f="'+x+'" aria-pressed="'+(x===f)+'">'+FAM[x]+'</button>';}).join('')+
      '<input type="search" id="q" placeholder="Rechercher une classe ou un élève" value="'+esc(s.q)+'" aria-label="Rechercher une classe ou un élève"></div>';
    if(s.q){
      var q=norm(s.q),res=[];
      D.classes.forEach(function(c){
        if(norm(c.nom).indexOf(q)>=0)res.push('<li><a href="#c='+c.id+'">'+esc(c.nom)+'</a> <span class="note">'+esc(FAM[c.famille])+'</span></li>');
        c.eleves.forEach(function(e){if(norm(e[1]).indexOf(q)>=0)res.push('<li><a href="#c='+c.id+'">'+esc(e[1])+'</a> <span class="note">'+esc(c.nom)+'</span></li>');});
      });
      html+=res.length?'<ul>'+res.slice(0,60).join('')+'</ul>':'<p class="vide">Aucun résultat.</p>';
    }else{
      var dela=D.classes.filter(function(c){return c.famille===f;}),niveaux={};
      dela.forEach(function(c){(niveaux[c.niveau]=niveaux[c.niveau]||[]).push(c);});
      Object.keys(niveaux).sort(function(a,b){return (NIV.indexOf(a)+99)%99-(NIV.indexOf(b)+99)%99||a.localeCompare(b);}).forEach(function(nv){
        var cl=niveaux[nv],k=f+'|'+nv,eff=0,ent=0,sco=0,avec=0;
        cl.forEach(function(c){var p=c.periodes.filter(function(x){return !x.pdif;})[0];if(p){eff+=p.n.effectif;ent+=p.n.avec+(c.ce?0:p.n.apprentis);sco+=p.n.scolaires;avec+=p.n.avec;}});
        var effCe=cl.reduce(function(t,c){return t+(c.effectif||0);},0),resume=f==='APPRENTIS'?effCe+' inscrit(s)'+(eff?' · 1re période : <b>'+ent+' / '+eff+'</b> avec contrat':''):'PFMP n°1 : <b>'+ent+' / '+eff+'</b> élèves en entreprise · '+avec+' / '+sco+' scolaires avec convention';
        html+='<details class="niveau" data-k="'+esc(k)+'"'+(OUVERTS[k]?' open':'')+'><summary><span class="titre">'+esc(nv)+'</span><span class="note">'+cl.length+' classe(s) · '+resume+'</span></summary><div class="grille">'+cl.map(carte).join('')+'</div></details>';
      });
    }
    app.innerHTML=html;
    app.querySelectorAll('details.niveau').forEach(function(d){d.addEventListener('toggle',function(){OUVERTS[d.getAttribute('data-k')]=d.open;memoriser();});});
    var q=document.getElementById('q');
    q.oninput=function(){var v=q.value;clearTimeout(q._t);q._t=setTimeout(function(){aller({f:f,q:v});},250);};
    if(s.q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  }
  function coord(o){if(!o||!(o.nom||o.tel||o.mail))return '';return '<div class="coord">'+(o.nom?'<b>'+esc(o.nom)+'</b>':'')+(o.tel?'<a href="tel:'+esc(o.tel.replace(/\s/g,''))+'">'+esc(o.tel)+'</a><br>':'')+(o.mail?'<a href="mailto:'+esc(o.mail)+'">'+esc(o.mail)+'</a>':'')+'</div>';}

  var bulle=document.createElement('div');bulle.className='bulle';bulle.hidden=true;document.body.appendChild(bulle);
  /* Bulle en position fixe, toujours dans l'écran : elle ne doit jamais agrandir la page
   * (sinon la barre de défilement apparaît, la souris « sort » et la bulle clignote). */
  function montrer(el,html){bulle.innerHTML=html;bulle.hidden=false;var r=el.getBoundingClientRect(),w=Math.min(620,window.innerWidth-24);bulle.style.width=w+'px';
    bulle.style.maxHeight=Math.max(160,window.innerHeight-24)+'px';
    var h=bulle.offsetHeight,x=Math.max(12,Math.min(r.left,window.innerWidth-w-12)),y=r.bottom+6;
    if(y+h>window.innerHeight-12)y=Math.max(12,r.top-h-6);
    if(y+h>window.innerHeight-12)y=Math.max(12,window.innerHeight-h-12);
    bulle.style.left=x+'px';bulle.style.top=y+'px';}
  function cacher(){bulle.hidden=true;}
  function rendre(){var s=etat();cacher();if(s.c)classe(s);else accueil(s);
    app.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){aller({f:b.getAttribute('data-f')});};});
    app.querySelectorAll('[data-c]').forEach(function(b){
      function ouvrirClasse(ev){if(ev)ev.stopPropagation();b.classList.add('occupe');var c=b.getAttribute('data-c'),p=b.getAttribute('data-p')||'';setTimeout(function(){aller({c:c,p:p});},30);}
      b.onclick=ouvrirClasse;b.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ouvrirClasse(ev);}};
      if(b.hasAttribute('data-p')){
        b.onmouseenter=function(){var c=parId[b.getAttribute('data-c')],p=c&&c.periodes.filter(function(x){return String(x.id)===b.getAttribute('data-p');})[0];
          if(p)montrer(b,'<div class="bulle-titre">'+esc(c.nom)+' — '+esc(p.libelle)+'</div><div class="colonnes">'+colonnes(repartition(c,p))+'</div><p class="note">Cliquer pour ouvrir la liste des élèves.</p>');};
        b.onmouseleave=cacher;

  /* Liens internes (#…) : jamais de navigation de la fenêtre principale (base target _top). */
  document.addEventListener('click',function(ev){

    google.script.run.withSuccessHandler(function(r){if(r&&r.temoin&&D.temoin&&String(r.temoin)!==String(D.temoin))document.getElementById('maj').hidden=false;}).EUC_SUIVI2_temoinActuel();}
  document.addEventListener('visibilitychange',controler);setInterval(controler,180000);

  window.addEventListener('beforeprint',function(){var e=app.querySelector('.imprime-seul .edite');if(e)e.textContent=' — Édité le '+maintenant();});
  /* Retour depuis la carte : classe et période passées dans l'adresse. */
  if(!location.hash&&CFG.depart&&CFG.depart.c){try{history.replaceState(null,'','#c='+CFG.depart.c+(CFG.depart.p?'&p='+CFG.depart.p:''));}catch(e){}}
  rendre();
})();
