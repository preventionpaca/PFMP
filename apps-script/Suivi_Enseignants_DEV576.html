<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi des PFMP</title>
<style>
:root{--vert:#0b6b4f;--vert2:#07856f;--clair:#e7f4ee;--texte:#16302a;--gris:#5b6b66;--bord:#d5e6de;--fond:#f6faf8;--alerte:#9a3412;--alerte-fond:#fff1e8;--ok:#166534;--ok-fond:#e3f5ea;--app:#7c2d92;--app-fond:#f6e9fb;--jaune:#fffbe6}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;color:var(--texte);background:var(--fond)}
header{background:linear-gradient(90deg,#064e3b,#0b6b4f);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
header h1{margin:0;font-size:20px}header .info{opacity:.85;font-size:13px}
main{max-width:1400px;margin:0 auto;padding:12px 16px 48px}
a{color:var(--vert)}
.barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.onglet,.btn{font:700 14px Arial,sans-serif;border:1px solid var(--bord);background:#fff;color:var(--texte);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none}
.onglet[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.plein{background:var(--vert);border-color:var(--vert);color:#fff}
input[type=search]{font:15px Arial,sans-serif;padding:8px 12px;border:1px solid var(--bord);border-radius:8px;min-width:240px;flex:1;max-width:420px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.carte{display:block;background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.carte:hover,.carte:focus-visible{border-color:var(--vert2);box-shadow:0 2px 10px rgba(11,107,79,.12);outline:none}
.carte h3{margin:0 0 2px;font-size:17px}.carte .pp{color:var(--gris);font-size:13px;margin-bottom:8px}
.per{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-top:1px solid #eef4f1;font-size:14px}
.per b{font-variant-numeric:tabular-nums}
.jauge{height:6px;border-radius:3px;background:#eef2f0;overflow:hidden;margin-top:3px}.jauge i{display:block;height:100%;background:var(--vert2)}
.note{color:var(--gris);font-size:13px}
.app{color:var(--app);font-weight:700}
h2{font-size:18px;margin:18px 0 8px}
.compteurs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.compteur{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:8px 12px}.compteur span{font-size:12px;color:var(--gris)}.compteur b{display:block;font-size:22px}
.tableau{background:#fff;border:1px solid var(--bord);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #edf3f0;vertical-align:top}
th{position:sticky;top:0;background:#f3f8f5;color:var(--gris);font-size:12px;z-index:1}
tr.apprenti td{background:var(--jaune)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-AVEC{background:var(--ok-fond);color:var(--ok)}.b-SANS{background:var(--alerte-fond);color:var(--alerte)}
.b-ANNULEE,.b-INTERROMPUE{background:#f1f1f1;color:#555}.b-APPRENTI{background:var(--app-fond);color:var(--app)}
.b-PDIF_ENTREPRISE{background:var(--ok-fond);color:var(--ok)}.b-PDIF_LYCEE{background:#e8f0fe;color:#1d4ed8}.b-PDIF_A_DEFINIR{background:var(--alerte-fond);color:var(--alerte)}
.mixte{display:block;margin-top:4px;font-size:12px;color:var(--app)}
.petit{display:block;margin-top:3px;font-size:12px;color:var(--gris)}.decale{display:block;margin-top:3px;font-size:12px;color:var(--alerte);font-weight:700}
.total{font-size:12px;color:var(--gris);text-align:right;margin-top:2px}.total b{color:var(--texte)}
details.niveau{background:#fff;border:1px solid var(--bord);border-radius:12px;margin:10px 0;padding:0 14px}
details.niveau>summary{cursor:pointer;padding:12px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.niveau>summary::before{content:'▸';color:var(--vert);font-weight:700}details.niveau[open]>summary::before{content:'▾'}
details.niveau>summary .titre{font-weight:700;font-size:17px}details.niveau .grille{padding-bottom:14px}
button.compteur{font:inherit;color:inherit;text-align:left;cursor:pointer}button.compteur[aria-expanded="true"]{border-color:var(--vert2);background:var(--clair)}
.noms{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:14px}
.imprime-seul{display:none}
.pastille{display:inline-block;width:18px;height:18px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:5px;vertical-align:1px}
select{font:14px Arial,sans-serif;padding:7px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
.coord{font-size:13px}.coord b{display:block;font-size:14px}
.vide{padding:24px;text-align:center;color:var(--gris)}
.retour{font-weight:700;text-decoration:none}
.erreur{background:var(--alerte-fond);color:var(--alerte);padding:12px 16px;border-radius:10px;font-weight:700}
@media (max-width:700px){header h1{font-size:18px}th:nth-child(4),td:nth-child(4){display:none}}
@page{size:A4 landscape;margin:10mm}
@media print{header,.barre,.noprint{display:none!important}body{background:#fff;font-size:11px}.tableau{border:0;overflow:visible}th{position:static}.imprime-seul{display:block;font-weight:700}tr.apprenti td{background:#fffbe6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}a{color:inherit;text-decoration:none}}
</style>
</head>
<body>
<header><h1>Suivi des PFMP</h1><span class="info" id="info"></span></header>
<main id="app" aria-live="polite"></main>
<script>
var D=<?!= donnees ?>,CFG=<?!= config ?>;
(function(){
  'use strict';
  var app=document.getElementById('app');
  var FAM={BACPRO:'BAC PRO',CAP:'CAP',BTS:'BTS',AUTRES:'Autres formations'},ORDRE=['BACPRO','CAP','BTS','AUTRES'];
  var NIV=['Seconde','Première','Terminale','1CAP','TCAP','1re année','2e année','Autres'];
  var LIB={AVEC:'Convention enregistrée',SANS:'Sans convention',ANNULEE:'Annulée',INTERROMPUE:'Interrompue',APPRENTI:'Apprenti',PDIF_ENTREPRISE:'En entreprise',PDIF_LYCEE:'Au lycée',PDIF_A_DEFINIR:'À définir'};
  var parId={};D.classes.forEach(function(c){parId[c.id]=c;});
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
  function dfr(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';}
  function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();}
  document.getElementById('info').textContent='Année '+(D.annee||'')+(D.temoin?' · données Grist à jour (action n° '+D.temoin+')':'');
  if(D.erreur){app.innerHTML='<p class="erreur">Les données n’ont pas pu être lues : '+esc(D.erreur)+'. Rechargez la page dans un instant.</p>';return;}

  /* Accordéons ouverts : mémorisés dans ce navigateur seulement. */
  var OUVERTS={};try{OUVERTS=JSON.parse(localStorage.getItem('pfmpOuverts')||'{}')||{};}catch(e){}
  function memoriser(){try{localStorage.setItem('pfmpOuverts',JSON.stringify(OUVERTS));}catch(e){}}

  function etat(){var h=new URLSearchParams(location.hash.slice(1));return {f:h.get('f')||'',c:Number(h.get('c'))||0,p:Number(h.get('p'))||0,q:h.get('q')||''};}
  function aller(o){var h=new URLSearchParams();Object.keys(o).forEach(function(k){if(o[k])h.set(k,o[k]);});var nh='#'+h.toString();
    if(location.hash!==nh){try{history.pushState(null,'',nh);}catch(e){location.hash=nh;return;}}rendre();}
  var familles=ORDRE.filter(function(f){return D.classes.some(function(c){return c.famille===f;});});

  function resumePeriode(c,p){
    var n=p.n;
    if(p.pdif)return '<div class="per"><span>P.dif.</span><span class="note">entreprise <b>'+n.entreprise+'</b> · lycée <b>'+n.lycee+'</b> · à définir <b>'+n.aDefinir+'</b></span></div>';
    var pct=n.scolaires?Math.round(100*n.avec/n.scolaires):0,app=c.apprentisAffiches&&n.apprentis;
    return '<div class="per"><span>'+esc(p.libelle)+' <span class="note">'+dfr(p.debut)+'</span></span><span><b>'+n.avec+' / '+n.scolaires+'</b>'+(app?' <span class="app">+ '+n.apprentis+' app.</span>':'')+'</span></div>'+
      (app?'<div class="total">En entreprise, tous statuts : <b>'+(n.avec+n.apprentis)+' / '+n.effectif+'</b></div>':'')+
      '<div class="jauge" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
  }
  function carte(c){
    return '<button class="carte" type="button" data-c="'+c.id+'"><h3>'+esc(c.nom)+'</h3><div class="pp">'+esc(c.niveau)+(c.pp.length?' · PP : '+esc(c.pp.join(', ')):'')+'</div>'+c.periodes.map(function(p){return resumePeriode(c,p);}).join('')+'</button>';
  }
  function accueil(s){
    var f=s.f&&familles.indexOf(s.f)>=0?s.f:familles[0];
    var html='<div class="barre noprint" role="group" aria-label="Familles">'+familles.map(function(x){return '<button class="onglet" type="button" data-f="'+x+'" aria-pressed="'+(x===f)+'">'+FAM[x]+'</button>';}).join('')+
      '<input type="search" id="q" placeholder="Rechercher une classe ou un élève" value="'+esc(s.q)+'" aria-label="Rechercher une classe ou un élève"></div>';
    if(s.q){
      var q=norm(s.q),res=[];
      D.classes.forEach(function(c){
        if(norm(c.nom).indexOf(q)>=0)res.push('<li><a href="#c='+c.id+'">'+esc(c.nom)+'</a> <span class="note">'+esc(FAM[c.famille])+'</span></li>');
        c.eleves.forEach(function(e){if(norm(e[1]).indexOf(q)>=0)res.push('<li><a href="#c='+c.id+'">'+esc(e[1])+'</a> <span class="note">'+esc(c.nom)+'</span></li>');});
      });
      html+=res.length?'<ul>'+res.slice(0,60).join('')+'</ul>':'<p class="vide">Aucun résultat.</p>';
    }else{
      var dela=D.classes.filter(function(c){return c.famille===f;}),niveaux={};
      dela.forEach(function(c){(niveaux[c.niveau]=niveaux[c.niveau]||[]).push(c);});
      Object.keys(niveaux).sort(function(a,b){return (NIV.indexOf(a)+99)%99-(NIV.indexOf(b)+99)%99||a.localeCompare(b);}).forEach(function(nv){
        var cl=niveaux[nv],k=f+'|'+nv,eff=0,ent=0,sco=0,avec=0;
        cl.forEach(function(c){var p=c.periodes.filter(function(x){return !x.pdif;})[0];if(p){eff+=p.n.effectif;ent+=p.n.avec+p.n.apprentis;sco+=p.n.scolaires;avec+=p.n.avec;}});
        html+='<details class="niveau" data-k="'+esc(k)+'"'+(OUVERTS[k]?' open':'')+'><summary><span class="titre">'+esc(nv)+'</span><span class="note">'+cl.length+' classe(s) · PFMP n°1 : '+avec+' / '+sco+' scolaires avec convention</span></summary><div class="grille">'+cl.map(carte).join('')+'</div></details>';
      });
    }
    app.innerHTML=html;
    app.querySelectorAll('details.niveau').forEach(function(d){d.addEventListener('toggle',function(){OUVERTS[d.getAttribute('data-k')]=d.open;memoriser();});});
    var q=document.getElementById('q');
    q.oninput=function(){var v=q.value;clearTimeout(q._t);q._t=setTimeout(function(){aller({f:f,q:v});},250);};
    if(s.q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  }
  function coord(o){if(!o||!(o.nom||o.tel||o.mail))return '';return '<div class="coord">'+(o.nom?'<b>'+esc(o.nom)+'</b>':'')+(o.tel?'<a href="tel:'+esc(o.tel.replace(/\s/g,''))+'">'+esc(o.tel)+'</a><br>':'')+(o.mail?'<a href="mailto:'+esc(o.mail)+'">'+esc(o.mail)+'</a>':'')+'</div>';}
  /* Ouverture d'une autre page de l'application : dans le cadre pfmp.loucodi.fr, on passe par la coquille. */
  function ouvrir(url){
    if(CFG.wrapper){var w=window;for(var i=0;i<6;i++){try{w=w.parent;w.postMessage({type:'EUC_PFMP_WRAPPER_NAVIGATE',url:url},'*');}catch(e){break;}}return;}
    try{window.top.location.href=url;}catch(e){window.open(url,'_top');}
  }
  function classe(s){
    var c=parId[s.c];if(!c){aller({});return;}
    var p=c.periodes.filter(function(x){return x.id===s.p;})[0]||c.periodes.filter(function(x){return !x.pdif;})[0]||c.periodes[0];
    var n=p.n,par={};
    c.eleves.forEach(function(e){var st=(p.lignes[e[0]]||['SANS'])[0];(par[st]=par[st]||[]).push(e[1]);});
    function liste(codes){var l=[];codes.forEach(function(k){l=l.concat(par[k]||[]);});return l;}
    var cpt=p.pdif
      ?[['Effectif',n.effectif,c.eleves.map(function(e){return e[1];})],['En entreprise',n.entreprise,liste(['PDIF_ENTREPRISE','APPRENTI'])],['Au lycée',n.lycee,liste(['PDIF_LYCEE'])],['À définir',n.aDefinir,liste(['PDIF_A_DEFINIR'])]]
      :[['Effectif',n.effectif,c.eleves.map(function(e){return e[1];})]].concat(c.apprentisAffiches?[['Apprentis',n.apprentis,liste(['APPRENTI'])],['En entreprise, tous statuts',(n.avec+n.apprentis)+' / '+n.effectif,liste(['AVEC','APPRENTI'])]]:[])
        .concat([['Avec convention',n.avec+' / '+n.scolaires,liste(['AVEC'])],['Sans convention',n.sans,liste(['SANS','ANNULEE','INTERROMPUE'])],['Annulées / interrompues',n.annulees,liste(['ANNULEE','INTERROMPUE'])]]);
    var lignes=c.eleves.map(function(e){
      var l=p.lignes[e[0]]||['SANS',-1,'','',0],f=l[1]>=0?D.fiches[l[1]]:null,st=l[0],app=st==='APPRENTI'||!!l[4];
      var badge='<span class="badge b-'+st+'">'+esc(LIB[st]||st)+'</span>'+(st==='APPRENTI'&&f&&f.contratDebut?'<span class="mixte">Contrat depuis le '+dfr(f.contratDebut)+'</span>':'');
      if(st!=='APPRENTI'&&f&&!p.pdif){
        if(f.debut&&f.debut>p.debut)badge+='<span class="decale">Début décalé : '+dfr(f.debut)+'</span>';
        if(f.fin&&f.fin>p.fin)badge+='<span class="decale">Fin prolongée : '+dfr(f.fin)+'</span>';
        if(f.enregistreLe)badge+='<span class="petit">Enregistrée le '+dfr(f.enregistreLe)+(f.numero?' · '+esc(f.numero):'')+'</span>';
      }
      if(l[4])badge+='<span class="badge b-APPRENTI" style="margin-top:4px">Apprenti</span><span class="mixte">Apprenti depuis le '+dfr(l[4][0])+(l[4][1]?' (jusqu’au '+dfr(l[4][1])+')':'')+'</span>';
      var ent=esc(f&&f.entreprise)+(f&&f.nomSaisi?'<span class="petit">Saisi : '+esc(f.nomSaisi)+'</span>':'');
      return '<tr class="'+(app?'apprenti':'')+'"><td>'+(app?'<span class="pastille" title="Apprenti">A</span>':'')+'<b>'+esc(e[1])+'</b></td><td>'+badge+'</td><td>'+ent+'</td><td>'+esc(f&&f.adresse)+'</td><td>'+coord(f&&f.contact)+'</td><td>'+coord(f&&f.tuteur)+'</td><td>'+esc(c.pp.join(', '))+'</td><td>'+esc(l[2])+'</td><td>'+esc(l[3])+'</td></tr>';
    }).join('');
    var memes=D.classes.filter(function(x){return x.famille===c.famille;});
    var carteUrl=CFG.base+'?page=cartographie-pfmp&annee='+encodeURIComponent(D.annee)+'&famille='+encodeURIComponent(c.famille)+'&classe='+c.id+'&periode='+p.id+'&retour=enseignants&public=1';
    app.innerHTML='<nav class="barre noprint" aria-label="Fil d’Ariane"><a class="retour" href="#f='+c.famille+'">← '+esc(FAM[c.famille])+'</a>'+
      '<label class="note" for="autre">Classe</label><select id="autre">'+memes.map(function(x){return '<option value="'+x.id+'"'+(x.id===c.id?' selected':'')+'>'+esc(x.nom)+'</option>';}).join('')+'</select></nav>'+
      '<h2>'+esc(c.nom)+' <span class="note">'+esc(c.niveau)+(c.pp.length?' · Professeur principal : '+esc(c.pp.join(', ')):'')+'</span></h2>'+
      '<div class="barre noprint" role="group" aria-label="Périodes">'+c.periodes.map(function(x){return '<button class="onglet" type="button" data-p="'+x.id+'" aria-pressed="'+(x.id===p.id)+'">'+esc(x.libelle)+'</button>';}).join('')+
      '<span class="note">'+dfr(p.debut)+' → '+dfr(p.fin)+'</span><button class="btn" type="button" id="imprimer">Imprimer</button><button class="btn" type="button" id="pdf">Exporter PDF</button>'+
      '<button class="btn" type="button" id="carte">Carte des lieux de stage</button></div>'+
      '<p class="imprime-seul">'+esc(c.nom)+' — '+esc(p.libelle)+' ('+dfr(p.debut)+' → '+dfr(p.fin)+') — '+esc(D.annee)+'</p>'+
      '<div class="compteurs">'+cpt.map(function(x,i){return '<button type="button" class="compteur" data-i="'+i+'" title="'+esc(x[2].join(', ')||'Aucun élève')+'" aria-expanded="false"><span>'+x[0]+'</span><b>'+x[1]+'</b></button>';}).join('')+'</div>'+
      '<div id="noms" class="noms noprint" hidden></div>'+
      '<div class="tableau"><table><thead><tr><th>Élève</th><th>Convention / statut</th><th>Entreprise</th><th>Adresse entreprise</th><th>Coordonnées entreprise</th><th>Coordonnées tuteur</th><th>Professeur principal</th><th>Suivi téléphonique</th><th>Professeur visiteur</th></tr></thead><tbody>'+
      (lignes||'<tr><td colspan="9" class="vide">Aucun élève.</td></tr>')+'</tbody></table></div>';
    var titre=document.title;
    document.getElementById('imprimer').onclick=function(){window.print();};
    document.getElementById('pdf').onclick=function(){document.title=('PFMP '+c.nom+' '+p.libelle+' '+D.annee).replace(/[^\w\- ]+/g,'');window.print();setTimeout(function(){document.title=titre;},1000);};
    document.getElementById('carte').onclick=function(){this.disabled=true;this.textContent='Ouverture de la carte…';ouvrir(carteUrl);};
    document.getElementById('autre').onchange=function(){var x=parId[this.value],r=x&&x.periodes.filter(function(q){return q.libelle===p.libelle;})[0];aller({c:this.value,p:r?r.id:''});};
    app.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){aller({c:c.id,p:b.getAttribute('data-p')});};});
    app.querySelectorAll('.compteur').forEach(function(b){b.onclick=function(){
      var x=cpt[Number(b.getAttribute('data-i'))],box=document.getElementById('noms'),deja=b.getAttribute('aria-expanded')==='true';
      app.querySelectorAll('.compteur').forEach(function(o){o.setAttribute('aria-expanded','false');});
      if(deja){box.hidden=true;return;}
      b.setAttribute('aria-expanded','true');box.hidden=false;
      box.innerHTML='<b>'+esc(x[0])+'</b> : '+(x[2].length?esc(x[2].join(' · ')):'aucun élève');
    };});
    window.scrollTo(0,0);
  }
  function rendre(){var s=etat();if(s.c)classe(s);else accueil(s);
    app.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){aller({f:b.getAttribute('data-f')});};});
    app.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){aller({c:b.getAttribute('data-c')});};});
  }
  /* Liens internes (#…) : jamais de navigation de la fenêtre principale (base target _top). */
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a[href^="#"]'):null;if(!a)return;
    ev.preventDefault();var h=new URLSearchParams(a.getAttribute('href').slice(1)),o={};h.forEach(function(v,k){o[k]=v;});aller(o);
  });
  window.addEventListener('hashchange',rendre);window.addEventListener('popstate',rendre);
  /* Retour depuis la carte : classe et période passées dans l'adresse. */
  if(!location.hash&&CFG.depart&&CFG.depart.c){try{history.replaceState(null,'','#c='+CFG.depart.c+(CFG.depart.p?'&p='+CFG.depart.p:''));}catch(e){}}
  rendre();
})();
</script>
</body>
</html>
