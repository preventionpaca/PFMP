<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172b27}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:28px}.wrap{max-width:1250px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:150px 160px 1fr 1fr;gap:12px}label{font-size:12px;font-weight:800;color:var(--mut)}select,input{width:100%;margin-top:5px;padding:10px;border:1px solid #aacfc5;border-radius:8px;background:#fff}button,a.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid #8bcabb}.actions{display:flex;gap:10px;align-items:end;margin-top:14px}.result{background:#edf9f5;border:1px solid #9fd7c9;border-radius:10px;padding:14px;margin-top:14px}.code{font:800 22px monospace;letter-spacing:2px}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8efed;text-align:left}th{font-size:12px;color:var(--mut)}@media(max-width:800px){.grid{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}}
</style></head><body><header class="hero"><div class="wrap"><h1>Accès temporaires des professeurs principaux</h1><p>Un code ouvre uniquement une classe et une période. Il expire automatiquement le dernier jour de la PFMP.</p></div></header><main class="wrap"><p><a id="back" class="btn secondary">← Administration PFMP</a></p><section class="card"><div class="grid"><label>Année<select id="year"></select></label><label>Famille<select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></label><label>Classe<select id="classe"></select></label><label>Période<select id="periode"></select></label></div><div class="actions"><label style="flex:1">Professeur principal<select id="principal"></select></label><button id="inspect" class="secondary">Afficher les accès</button><button id="generate" class="primary">Générer un nouveau code</button></div><div id="status" class="muted"></div><div id="result"></div></section><section class="card"><h2>Accès de la période</h2><div id="list" class="muted">Choisissez une classe et une période.</div></section></main><script>
const B=<?!= bootJson ?>,$=id=>document.getElementById(id);let CAT={classes:[]},DATA=null;$('back').href=B.baseUrl+'?page=admin-pfmp';$('year').innerHTML=(B.years||[]).map(x=>'<option '+(x===B.current?'selected':'')+'>'+x+'</option>').join('');
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function busy(b,on,t){if(on){b.dataset.old=b.textContent;b.disabled=true;b.textContent=t}else{b.disabled=false;b.textContent=b.dataset.old||b.textContent}}function fail(e){$('status').textContent='Erreur : '+(e&&e.message||e)}
function loadCat(){google.script.run.withSuccessHandler(d=>{CAT=d||{classes:[]};classes()}).withFailureHandler(fail).EUC_DEV441_catalogAdmin($('year').value)}function classes(){let a=CAT.classes||[];if($('family').value)a=a.filter(x=>x.famille===$('family').value);$('classe').innerHTML='<option value="">— Choisir —</option>'+a.map(x=>'<option value="'+x.classeId+'">'+esc(x.classe)+'</option>').join('');periods()}function periods(){let c=(CAT.classes||[]).find(x=>String(x.classeId)===String($('classe').value));$('periode').innerHTML='<option value="">— Choisir —</option>'+((c&&c.periodes)||[]).map(x=>'<option value="'+x.id+'">'+esc(x.libelle)+' · '+esc(x.fin)+'</option>').join('');$('principal').innerHTML='';$('list').textContent='Cliquez sur « Afficher les accès ».'}
function q(){return{annee:$('year').value,classeId:Number($('classe').value),periodeId:Number($('periode').value)}}function render(d){DATA=d;$('principal').innerHTML=(d.principaux||[]).map(x=>'<option value="'+x.id+'">'+esc(x.nom)+(x.email?' · '+esc(x.email):'')+'</option>').join('')||'<option value="">Aucun professeur principal associé</option>';$('list').innerHTML=(d.acces||[]).length?'<table><thead><tr><th>Professeur</th><th>Expiration</th><th>État</th><th></th></tr></thead><tbody>'+d.acces.map(x=>'<tr><td>'+esc(x.professeur)+'</td><td>'+esc(x.expiration)+'</td><td>'+(x.actif?'Actif':'Révoqué')+'</td><td>'+(x.actif?'<button class="secondary revoke" data-id="'+x.id+'">Révoquer</button>':'')+'</td></tr>').join('')+'</tbody></table>':'Aucun accès créé pour cette période.';document.querySelectorAll('.revoke').forEach(b=>b.onclick=()=>{if(!confirm('Révoquer cet accès ?'))return;google.script.run.withSuccessHandler(inspect).withFailureHandler(fail).EUC_DEV441_revokePpAccess({id:Number(b.dataset.id)})})}
function inspect(){if(!q().classeId||!q().periodeId){$('status').textContent='Choisissez une classe et une période.';return}busy($('inspect'),true,'Chargement…');google.script.run.withSuccessHandler(d=>{busy($('inspect'),false);$('status').textContent='';render(d)}).withFailureHandler(e=>{busy($('inspect'),false);fail(e)}).EUC_DEV441_ppAdminData(q())}
$('generate').onclick=()=>{let p=Number($('principal').value);if(!p){$('status').textContent='Choisissez un professeur principal.';return}busy($('generate'),true,'Génération…');google.script.run.withSuccessHandler(r=>{busy($('generate'),false);$('result').innerHTML='<div class="result"><div>Code à transmettre au professeur principal :</div><div class="code">'+esc(r.code)+'</div><p>Valable pour <b>'+esc(r.classe)+'</b> — '+esc(r.periode)+' jusqu’au '+esc(r.expiration)+'.</p><button id="copy" class="secondary">Copier le code et le lien</button></div>';document.getElementById('copy').onclick=()=>navigator.clipboard.writeText('Code : '+r.code+'\nAccès : '+r.url);inspect()}).withFailureHandler(e=>{busy($('generate'),false);fail(e)}).EUC_DEV441_generatePpAccess({...q(),profId:p})};$('inspect').onclick=inspect;$('year').onchange=loadCat;$('family').onchange=classes;$('classe').onchange=periods;$('periode').onchange=inspect;loadCat();
</script></body></html>
