<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conventions générées — PFMP</title>
<style>
:root{--vert:#0b6b4f;--vert-clair:#e7f4ee;--texte:#16302a;--gris:#5b6b66;--bord:#cfe3da;--alerte:#9a3412;--alerte-fond:#fff4ed}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Arial,sans-serif;color:var(--texte);background:#f7fbf9}
header{background:linear-gradient(135deg,#eef9f5,#d8f0e6);color:#0b4f40;border-bottom:1px solid #bfe2da;padding:16px 20px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;opacity:.9}
nav{padding:10px 20px;font-size:14px}nav a{color:var(--vert);font-weight:700;text-decoration:none}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
section{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:14px 16px;margin:12px 0}
.ligne{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input[type=search]{font:700 14px Arial,sans-serif;border-radius:7px;padding:8px 12px}
button{border:0;background:var(--vert);color:#fff;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
button.leger{background:var(--vert-clair);color:var(--vert);padding:5px 10px;font-size:13px}
select,input[type=search]{border:1px solid var(--bord);background:#fff;font-weight:400}
label{font-weight:700}
.note{color:var(--gris);font-size:13px}
.message{font-weight:700}.message.erreur{color:var(--alerte)}
h2{font-size:16px;margin:0}
.niveau{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.classes{margin-top:8px}
.classe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--bord)}
.classe b{min-width:110px}
.pastille{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--vert-clair);color:var(--vert);font-weight:700;font-size:12px}
.pastille.manque{background:var(--alerte-fond);color:var(--alerte)}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bord);vertical-align:top}
th{color:var(--gris)}
tr.titre td{background:var(--vert-clair);font-weight:700;color:var(--vert)}
tr.sans td{color:var(--alerte)}
tr.annulee td{color:var(--gris);text-decoration:line-through}
.hist{margin:4px 0 0;padding-left:18px;font-size:12px;color:var(--gris)}.hist .retenue{color:var(--texte)}
summary{cursor:pointer;margin-top:3px}
tr.anterieure td{color:var(--gris);background:#fafcfb}
.spin{display:none;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:tour .7s linear infinite;vertical-align:-2px;margin-right:6px}
.busy .spin{display:inline-block}
@keyframes tour{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Conventions générées</h1>
  <p>Toutes les conventions créées par le générateur, par niveau puis par classe. Lecture seule : rien n’est modifié.</p>
</header>
<nav><a href="<?= adminBase ?>?page=admin-pfmp">Administration PFMP</a> › Conventions générées</nav>
<main>
  <section>
    <div class="ligne">
      <label for="annee">Année</label><select id="annee"></select>
      <label for="periode">Période</label><select id="periode"><option value="">Toutes</option></select>
      <label><input type="checkbox" id="sans"> Montrer aussi les élèves sans convention générée</label>
      <label><input type="checkbox" id="toutes"> Montrer aussi les générations antérieures (réimpressions)</label>
      <button id="tout" type="button" data-action="tout"><span class="spin"></span><span class="txt">Tout afficher</span></button>
      <span id="message" class="message" role="status" aria-live="polite"></span>
    </div>
    <p class="note" id="totaux"></p>
  </section>
  <div id="structure"></div>
  <section id="filtre" hidden><div class="ligne"><label for="cherche">Rechercher</label><input id="cherche" type="search" placeholder="Élève, numéro, entreprise…" style="min-width:260px"><span id="compte" class="note"></span></div></section>
  <div id="resultat"></div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);},ANNEE=<?!= JSON.stringify(annee || '') ?>,DELAI=120000,STRUCT=null,LISTE=null,TITRE='';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function heure(ms){return ms?new Date(ms).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'date inconnue';}
  function dfr(d){return d?String(d).split('-').reverse().join('/'):'';}
  function message(t,err){$('message').textContent=t||'';$('message').className='message'+(err?' erreur':'');}
  /* Appel serveur avec délai maximal : succès, erreur et dépassement rendent la main de la même façon. */
  function appel(nom,args,ok,ko){
    var fini=false,timer=setTimeout(function(){if(fini)return;fini=true;ko(new Error('Pas de réponse après 2 minutes : réessayez.'));},DELAI);
    var run=google.script.run.withSuccessHandler(function(r){if(fini)return;fini=true;clearTimeout(timer);ok(r);}).withFailureHandler(function(e){if(fini)return;fini=true;clearTimeout(timer);ko(e);});
    run[nom].apply(run,args);
  }
  /* Pendant une lecture, tous les boutons sont bloqués ; celui qui a été cliqué montre le chargement. */
  function occupe(btn){
    document.querySelectorAll('button[data-action]').forEach(function(b){
      b.disabled=!!btn;b.classList.toggle('busy',b===btn);
      var t=b.querySelector('.txt');if(!t)return;
      if(!b.dataset.libelle)b.dataset.libelle=t.textContent;
      t.textContent=b===btn?'Chargement…':b.dataset.libelle;
    });
    $('annee').disabled=!!btn;$('periode').disabled=!!btn;$('sans').disabled=!!btn;$('toutes').disabled=!!btn;
  }
  function bouton(action,attrs,texte){return '<button type="button" class="leger" data-action="'+action+'" '+attrs+'><span class="spin"></span><span class="txt">'+esc(texte)+'</span></button>';}
  function dessinerStructure(){
    var s=STRUCT;
    $('totaux').textContent=s.total+' convention(s) en '+s.annee+' (une par élève, période et séquence), issues de '+s.generations+' génération(s) : chaque réimpression depuis le générateur en ajoute une.';
    var per=$('periode').value;
    $('periode').innerHTML='<option value="">Toutes</option>'+s.periodes.map(function(p){return '<option value="'+esc(p)+'">'+esc(p)+'</option>';}).join('');
    if(s.periodes.indexOf(per)>=0)$('periode').value=per;
    $('structure').innerHTML=s.niveaux.length?s.niveaux.map(function(n){
      return '<section><div class="niveau"><h2>'+esc(n.libelle)+' <span class="pastille">'+n.total+'</span></h2>'+bouton('niveau','data-niveau="'+esc(n.cle)+'"','Afficher le niveau')+'</div><div class="classes">'+n.classes.map(function(c){
        return '<div class="classe"><b>'+esc(c.nom)+'</b><span class="note">'+c.eleves+' élève(s) · '+c.total+' convention(s)'+(c.generations>c.total?' · '+c.generations+' générations':'')+'</span>'+
          c.periodes.map(function(p){return bouton('periode','data-classe="'+c.id+'" data-periode="'+esc(p.libelle)+'"',p.libelle+' : '+p.total)+(p.sans?' <span class="pastille manque" title="Élèves sans convention générée pour cette période">'+p.sans+' sans</span>':'');}).join(' ')+
          (c.horsPeriode?' <span class="pastille manque">'+c.horsPeriode+' hors période</span>':'')+' '+bouton('classe','data-classe="'+c.id+'"','Toute la classe')+'</div>';
      }).join('')+'</div></section>';
    }).join(''):'<section class="note">Aucune classe pour cette année.</section>';
  }
  function chargerStructure(){
    message('');STRUCT=null;LISTE=null;$('resultat').innerHTML='';$('filtre').hidden=true;$('totaux').textContent='';
    $('structure').innerHTML='<section class="note busy"><span class="spin"></span>Chargement de la structure…</section>';
    occupe($('tout'));
    appel('EUC_DEV645_structure',[$('annee').value],function(r){occupe(null);STRUCT=r;dessinerStructure();},function(e){occupe(null);$('structure').innerHTML='';message(e&&e.message||'Lecture impossible.',true);});
  }
  function ligne(l){
    if(l.sansConvention)return '<tr class="sans"><td><b>'+esc(l.eleve)+'</b></td><td>'+esc(l.periode)+'<br><span class="note">'+dfr(l.debut)+' → '+dfr(l.fin)+'</span></td><td colspan="4">Aucune convention générée</td></tr>';
    var type=l.rattrapage?' · rattrapage':(l.remplacement?' · remplacement':'');
    var qui=function(h){return heure(h.ms)+' · '+esc(h.auteur||'auteur non enregistré')+' · '+esc(h.mode);};
    var hist=(l.historique||[]).length>1?'<details><summary><span class="pastille">'+l.generations+' générations</span></summary><ol class="hist">'+l.historique.map(function(h){return '<li'+(h.retenue?' class="retenue"':'')+'>'+qui(h)+(h.retenue?' — <b>retenue</b>':'')+(h.saisie?' — remplie par l’entreprise':'')+'</li>';}).join('')+'</ol></details>':'';
    var gen=l.anterieure?'<br><span class="note">Génération antérieure · '+esc(l.auteur||'auteur non enregistré')+' · '+(l.lot?'Classe entière':'Élève seul')+'</span>':'<br><span class="note">'+esc(l.auteur||'auteur non enregistré')+' · '+(l.lot?'Classe entière':'Élève seul')+'</span>'+hist;
    return '<tr'+(l.annulee?' class="annulee"':(l.anterieure?' class="anterieure"':''))+'><td><b>'+esc(l.eleve)+'</b></td><td>'+esc(l.periode)+esc(type)+'<br><span class="note">'+dfr(l.debut)+' → '+dfr(l.fin)+'</span></td><td>'+esc(l.numero||'—')+'<br><span class="note">'+esc(l.statut)+'</span></td><td>'+esc(heure(l.ms))+gen+'</td><td>'+(l.saisieEntreprise?'Saisie le '+dfr(l.saisieEntreprise):'<span class="note">Pas encore</span>')+'</td><td>'+esc(l.entreprise||'—')+'</td></tr>';
  }
  function dessinerListe(){
    var q=$('cherche').value.trim().toLowerCase(),l=(LISTE.lignes||[]).filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>=0;}),niv='',cl='',html=[];
    $('compte').textContent=TITRE+' : '+LISTE.conventions+' convention(s)'+(LISTE.anterieures?', '+LISTE.anterieures+' génération(s) antérieure(s)':'')+(LISTE.sansConvention?', '+LISTE.sansConvention+' élève(s) sans convention':'')+(q?' — '+l.length+' ligne(s) trouvée(s)':'')+'.';
    l.forEach(function(x){
      if(x.niveauLibelle!==niv){niv=x.niveauLibelle;cl='';html.push('<tr class="titre"><td colspan="6">'+esc(niv)+'</td></tr>');}
      if(x.classe!==cl){cl=x.classe;html.push('<tr><td colspan="6"><b>'+esc(cl)+'</b></td></tr>');}
      html.push(ligne(x));
    });
    $('resultat').innerHTML=l.length?'<section><div class="table"><table><thead><tr><th>Élève</th><th>Période</th><th>Numéro et statut</th><th>Générée le, par</th><th>Entreprise (QR)</th><th>Entreprise</th></tr></thead><tbody>'+html.join('')+'</tbody></table></div></section>':'<section class="note">Aucune convention à afficher.</section>';
  }
  function lister(btn,q,titre){
    q.periode=q.periode!=null?q.periode:$('periode').value;q.sansConvention=$('sans').checked;q.toutes=$('toutes').checked;
    TITRE=titre+(q.periode?' — '+q.periode:'');
    occupe(btn);message('');
    appel('EUC_DEV645_lister',[$('annee').value,q],function(r){occupe(null);LISTE=r;$('filtre').hidden=false;dessinerListe();$('filtre').scrollIntoView({behavior:'smooth'});},function(e){occupe(null);message(e&&e.message||'Lecture impossible.',true);});
  }
  function nomClasse(id){var t='';(STRUCT?STRUCT.niveaux:[]).forEach(function(n){n.classes.forEach(function(c){if(String(c.id)===String(id))t=c.nom;});});return t;}
  $('structure').onclick=function(ev){
    var b=ev.target.closest('button[data-action]');if(!b||b.disabled)return;
    if(b.dataset.action==='niveau')lister(b,{niveau:b.dataset.niveau},b.closest('section').querySelector('h2').firstChild.textContent.trim());
    else if(b.dataset.action==='classe')lister(b,{classeId:Number(b.dataset.classe),periode:''},nomClasse(b.dataset.classe));
    else if(b.dataset.action==='periode')lister(b,{classeId:Number(b.dataset.classe),periode:b.dataset.periode},nomClasse(b.dataset.classe));
  };
  $('tout').onclick=function(){if(STRUCT)lister(this,{},'Toute l’année '+STRUCT.annee);};
  $('cherche').oninput=function(){if(LISTE)dessinerListe();};
  var now=new Date(),d=now.getMonth()>=7?now.getFullYear():now.getFullYear()-1;
  [d+1,d,d-1].forEach(function(y){var o=document.createElement('option');o.value=y+'-'+(y+1);o.textContent=o.value;$('annee').appendChild(o);});
  $('annee').value=ANNEE||(d+'-'+(d+1));
  $('annee').onchange=chargerStructure;
  chargerStructure();
})();
</script>
</body>
</html>
