<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Listes et émargement</title>
<style>
:root{--vert:#0b6b4f;--bord:#cfe3dc;--fond:#f4f8f6;--gris:#5b6b66}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--fond);color:#163}
header{background:linear-gradient(90deg,#064e3b,#0b6b4f);color:#fff;padding:14px 20px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header a{color:#fff;font-weight:700;margin-left:auto}
main{max-width:1100px;margin:18px auto;padding:0 16px}
.outils{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px 16px;display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center}
select,input[type=text]{font:14px Arial,sans-serif;padding:7px 9px;border:1px solid var(--bord);border-radius:8px}
label{display:inline-flex;gap:6px;align-items:center}
.btn{font:700 14px Arial,sans-serif;padding:8px 14px;border-radius:8px;border:1px solid var(--vert);background:#fff;color:var(--vert);cursor:pointer}
.btn.plein{background:var(--vert);color:#fff}
.feuille{background:#fff;border:1px solid var(--bord);border-radius:12px;margin-top:14px;padding:16px 18px}
.feuille h2{margin:0;font-size:18px}.sous{color:var(--gris);margin:4px 0 12px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #b9cfc7;padding:7px 8px;text-align:left;vertical-align:middle}
th{background:#eef6f2;font-size:13px}td.num{width:40px;text-align:right;color:var(--gris)}td.sign{width:30%;height:34px}
.vide{padding:24px;text-align:center;color:var(--gris)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-2px;animation:t .7s linear infinite}@keyframes t{to{transform:rotate(360deg)}}
@page{size:A4 portrait;margin:12mm}
@media print{header,.outils{display:none!important}body{background:#fff}main{margin:0;max-width:none;padding:0}.feuille{border:0;padding:0}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header><h1>Listes et feuilles d’émargement</h1><span id="info"></span><a href="<?= adminBase ?>?page=admin-pfmp">← Administration PFMP</a></header>
<main>
  <div class="outils">
    <label>Liste <select id="classe"></select></label>
    <label><input type="checkbox" id="colTel"> Téléphone</label>
    <label><input type="checkbox" id="colMail"> Courriel</label>
    <label><input type="checkbox" id="colSign" checked> Colonne d’émargement</label>
    <label>Titre <input type="text" id="titre" placeholder="ex. Présentation des métiers — 12/11" size="34"></label>
    <button class="btn" type="button" id="imprimer">Imprimer</button>
    <button class="btn plein" type="button" id="pdf">Exporter PDF</button>
  </div>
  <div class="feuille" id="feuille"></div>
</main>
<script>
var D=<?!= donnees ?>;
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);},FAM={BACPRO:'BAC PRO',CAP:'CAP',BTS:'BTS',AUTRES:'Autres formations',PROFS:'Professeurs — réunions'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(D.erreur){$('feuille').innerHTML='<p class="vide">Chargement impossible : '+esc(D.erreur)+'</p>';return;}
  $('info').textContent='Année '+(D.annee||'');
  var groupes={};D.classes.forEach(function(c){(groupes[c.famille]=groupes[c.famille]||[]).push(c);});
  $('classe').innerHTML=Object.keys(groupes).filter(function(f){return groupes[f].length;}).map(function(f){return '<optgroup label="'+esc(FAM[f]||f)+'">'+groupes[f].map(function(c){return '<option value="'+c.id+'">'+esc(c.nom)+' ('+c.eleves.length+')</option>';}).join('')+'</optgroup>';}).join('');
  try{var m=JSON.parse(localStorage.getItem('eucListes')||'{}');if(m.c&&D.classes.some(function(c){return String(c.id)===String(m.c);}))$('classe').value=m.c;['colTel','colMail','colSign'].forEach(function(k){if(k in m)$(k).checked=!!m[k];});}catch(e){}
  function choix(){return D.classes.filter(function(c){return String(c.id)===$('classe').value;})[0];}
  function cols(){var l=['N°','Nom','Prénom'];if($('colTel').checked)l.push('Téléphone');if($('colMail').checked)l.push('Courriel');if($('colSign').checked)l.push('Émargement');return l;}
  function lignes(c){return c.eleves.map(function(e,i){var l=[String(i+1),e[0],e[1]];if($('colTel').checked)l.push(e[2]);if($('colMail').checked)l.push(e[3]);if($('colSign').checked)l.push('');return l;});}
  function sousTitre(c){return [c.niveau,FAM[c.famille]||c.famille,c.eleves.length+(c.famille==='PROFS'?' professeur(s)':' élève(s)'),D.annee].filter(Boolean).join(' · ');}
  function rendre(){var c=choix();if(!c){$('feuille').innerHTML='<p class="vide">Aucune classe.</p>';return;}
    try{localStorage.setItem('eucListes',JSON.stringify({c:c.id,colTel:$('colTel').checked,colMail:$('colMail').checked,colSign:$('colSign').checked}));}catch(e){}
    var t=$('titre').value.trim(),en=cols();
    $('feuille').innerHTML='<h2>'+esc(t?t+' — ':'')+esc(c.nom)+'</h2><p class="sous">'+esc(sousTitre(c))+'</p><table><thead><tr>'+en.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
      lignes(c).map(function(l){return '<tr>'+l.map(function(v,i){var h=en[i];return '<td'+(h==='N°'?' class="num"':h==='Émargement'?' class="sign"':'')+'>'+(h==='Nom'?'<b>'+esc(v)+'</b>':esc(v))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
  ['classe','colTel','colMail','colSign'].forEach(function(k){$(k).onchange=rendre;});$('titre').oninput=rendre;
  $('imprimer').onclick=function(){window.print();};
  function chargerPdf(ok,ko){if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable)return ok();var libs=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js'],i=0;(function suivant(){if(i>=libs.length)return ok();var s=document.createElement('script');s.src=libs[i++];s.onload=suivant;s.onerror=ko;document.head.appendChild(s);})();}
  $('pdf').onclick=function(){var b=this,c=choix();if(!c)return;b.disabled=true;b.innerHTML='<span class="spin"></span>Préparation…';var fin=function(){b.disabled=false;b.textContent='Exporter PDF';};
    chargerPdf(function(){try{var t=$('titre').value.trim(),en=cols(),large=$('colTel').checked&&$('colMail').checked,doc=new window.jspdf.jsPDF({orientation:large?'landscape':'portrait',unit:'mm',format:'a4'}),W=doc.internal.pageSize.getWidth(),d=new Date(),edite='Édité le '+d.toLocaleDateString('fr-FR');
      doc.setFontSize(14);doc.setTextColor(11,107,79);doc.text((t?t+' — ':'')+c.nom,10,13);doc.setFontSize(9);doc.setTextColor(70);doc.text(sousTitre(c),10,19);doc.text(edite,W-10,13,{align:'right'});
      var styles={0:{cellWidth:10,halign:'right'}},iS=en.indexOf('Émargement');if(iS>=0)styles[iS]={cellWidth:large?60:55};
      doc.autoTable({startY:23,head:[en],body:lignes(c),theme:'grid',styles:{fontSize:9,cellPadding:2,minCellHeight:iS>=0?9:0,valign:'middle'},headStyles:{fillColor:[11,107,79]},columnStyles:styles,margin:{left:10,right:10,bottom:12},
        didDrawPage:function(){var h=doc.internal.pageSize.getHeight();doc.setFontSize(8);doc.setTextColor(110);doc.text(c.nom+' — '+edite,10,h-5);doc.text('Page '+doc.internal.getCurrentPageInfo().pageNumber,W-10,h-5,{align:'right'});}});
      var u=URL.createObjectURL(doc.output('blob')),a=document.createElement('a');a.href=u;a.download=(((t?t+' ':'')+'Liste '+c.nom+' '+D.annee).replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_'))+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}catch(err){alert('PDF impossible : '+(err&&err.message||err));}fin();},function(){fin();alert('Le module PDF n’a pas pu être chargé.');});};
  rendre();
})();
</script>
</body>
</html>
