<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#f5fbf8;color:#16342e;margin:0}.wrap{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #c6e4dc;border-radius:14px;padding:14px}.period{display:flex;justify-content:space-between;text-decoration:none;color:inherit;padding:9px 0;border-top:1px solid #edf2f0}.back{color:#08705d;font-weight:800;text-decoration:none}.spin{width:13px;height:13px;border:2px solid #a9d8cd;border-top-color:#08705d;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style></head><body><main class="wrap"><a class="back" id="back">← Retour</a><h1 id="title"></h1><div class="grid" id="grid"></div></main><script>(function(){const D=<?!= dataJson ?>,P=<?!= paramsJson ?>,BASE=<?!= JSON.stringify(baseUrl) ?>;title.textContent=P.famille==='BACPRO'?'BAC PRO':P.famille;back.href=BASE+'?page=suivi-conventions-public&annee='+encodeURIComponent(P.annee);grid.innerHTML=(D.classes||[]).map(function(c){return '<section class="card"><h3>'+String(c.classe||c.nom||'')+'</h3>'+(c.periodes||[]).map(function(p){return '<a class="period" data-c="'+(c.classeId||c.id)+'" data-p="'+p.id+'" href="#"><b>'+String(p.libelle||'Période')+'</b><span>'+Number(p.conventions||0)+' / '+Number(p.total||c.effectif||0)+(Number(p.apprentis||0)?' + '+Number(p.apprentis)+' A':'')+'</span></a>'}).join('')+'</section>'}).join('');document.querySelectorAll('.period').forEach(function(a){a.onclick=function(e){e.preventDefault();a.innerHTML='<span class="spin"></span> Chargement…';location.href=BASE+'?page=suivi-pfmp-classe-public&annee='+encodeURIComponent(P.annee)+'&famille='+encodeURIComponent(P.famille)+'&classe='+encodeURIComponent(a.dataset.c)+'&periode='+encodeURIComponent(a.dataset.p)}})})();</script></body></html>
