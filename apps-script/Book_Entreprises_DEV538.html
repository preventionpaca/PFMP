<!doctype html>
<html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book des entreprises PFMP</title><style>
:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085;--ink:#172b27;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:24px}.hero h1{margin:0 0 6px}.hero p{margin:0}.wrap{max-width:1500px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}.filters label{display:grid;gap:5px;font-size:12px;font-weight:800;color:var(--mut)}select,input{width:100%;padding:9px;border:1px solid #aacfc5;border-radius:8px;background:#fff;color:var(--ink)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--g);color:#fff}button.secondary{background:#fff;color:var(--g);border:1px solid var(--g)}button:disabled{opacity:.62;cursor:wait}.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.status{color:var(--mut)}.error{color:var(--danger);font-weight:800}.summary{display:flex;gap:18px;align-items:baseline}.summary strong{font-size:28px}.companies{display:grid;gap:12px}.company{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;break-inside:avoid}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.head h2{margin:0 0 5px;font-size:18px}.count{white-space:nowrap;border-radius:999px;padding:7px 10px;background:#eaf7f3;color:#075f55;font-weight:900}.muted{color:var(--mut)}.history{max-height:250px;overflow:auto;margin-top:12px;border-top:1px solid #e5ecea}.history table{width:100%;border-collapse:collapse;min-width:850px}.history th,.history td{padding:8px 6px;border-bottom:1px solid #edf1f0;text-align:left;font-size:12px}.history th{position:sticky;top:0;background:#fff;color:#475467}.empty{padding:28px;text-align:center;color:var(--mut)}
@media(max-width:980px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.filters{grid-template-columns:1fr}.head{display:block}.count{display:inline-block;margin-top:8px}}@media print{.hero{background:#fff;color:#000;padding:0}.filters,.actions{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;padding:0}.company{page-break-inside:avoid}.history{max-height:none;overflow:visible}.history table{min-width:0}}
</style></head><body><header class="hero"><div class="wrap"><h1>Book des entreprises PFMP</h1><p>Historique des accueils et classement des entreprises selon les filtres combinés.</p></div></header><main class="wrap">
<section class="card"><div class="filters"><label>Année<select id="year"></select></label><label id="windowLabel">Fenêtre historique<select id="window"><option value="3">3 dernières années</option><option value="5">5 dernières années</option><option value="10">10 dernières années</option><option value="0">Toutes les années</option></select></label><label>Famille<select id="family"><option value="">Toutes</option><option>BACPRO</option><option>BTS</option><option>CAP</option></select></label><label>Diplôme<input id="diploma" placeholder="Ex. Carrossier"></label><label>Niveau<input id="level" placeholder="Ex. Terminale"></label><label>Classe<input id="classe" placeholder="Ex. TCAR"></label><label>Période<input id="period" placeholder="Ex. PFMP n°1"></label><label>Entreprise<input id="company" placeholder="Nom ou adresse"></label><label>Élève<input id="student" placeholder="Nom ou prénom"></label><label>Professeur visiteur<input id="teacher" placeholder="Nom du professeur"></label></div><div class="actions"><button id="apply">Appliquer les filtres</button><button id="reset" class="secondary">Réinitialiser</button><button id="csv" class="secondary" disabled>Exporter Excel (CSV)</button><button id="pdf" class="secondary" disabled>Imprimer / PDF</button><span id="status" class="status" role="status"></span></div></section>
<section class="card summary"><strong id="total">0</strong><span>entreprise(s) correspondant aux filtres, classées par nombre d’élèves accueillis.</span></section><section id="list" class="companies"></section>
</main><script>
const B=<?!= bootJson ?>,$=id=>document.getElementById(id);let DATA=[];function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function busy(on){let b=$('apply');if(!b.dataset.label)b.dataset.label=b.textContent;b.disabled=!!on;b.innerHTML=on?'<span class="spin"></span>Chargement…':esc(b.dataset.label)}function query(){return{annee:$('year').value,fenetre:Number($('window').value),famille:$('family').value,diplome:$('diploma').value,niveau:$('level').value,classe:$('classe').value,periode:$('period').value,entreprise:$('company').value,eleve:$('student').value,professeur:$('teacher').value}}
function rows(h){return(h||[]).map(x=>'<tr><td>'+esc(x.annee)+'</td><td><strong>'+esc(x.eleve||'—')+'</strong></td><td>'+esc(x.classe)+'</td><td>'+esc(x.niveau)+'</td><td>'+esc(x.diplome)+'</td><td>'+esc(x.periode)+'</td><td>'+esc(x.professeurVisiteur||'—')+'</td></tr>').join('')}function render(r){DATA=r.entreprises||[];$('total').textContent=DATA.length;$('csv').disabled=!DATA.length;$('pdf').disabled=!DATA.length;$('list').innerHTML=DATA.length?DATA.map((x,i)=>'<article class="company"><div class="head"><div><h2>'+(i+1)+'. '+esc(x.entreprise)+'</h2><div class="muted">'+esc(x.adresse)+(x.siret?' · SIRET '+esc(x.siret):'')+'</div></div><div class="count">'+Number(x.elevesAccueillis||0)+' élève'+(Number(x.elevesAccueillis||0)>1?'s':'')+' accueilli'+(Number(x.elevesAccueillis||0)>1?'s':'')+'</div></div><div class="history"><table><thead><tr><th>Année</th><th>Élève</th><th>Classe</th><th>Niveau</th><th>Diplôme</th><th>Période</th><th>Professeur visiteur</th></tr></thead><tbody>'+rows(x.historique)+'</tbody></table></div></article>').join(''):'<section class="card empty">Aucune entreprise ne correspond à ces filtres.</section>'}
function load(){busy(true);$('status').className='status';$('status').textContent='Chargement de l’historique…';let done=false,t=setTimeout(()=>{if(done)return;done=true;busy(false);$('status').className='error';$('status').textContent='Le serveur n’a pas répondu sous 20 secondes. Réduisez la fenêtre historique ou réessayez.'},20000),method=B.mode==='ADMIN'?'EUC_DEV538_bookData':'EUC_DEV538_staffBookData';google.script.run.withSuccessHandler(r=>{if(done)return;done=true;clearTimeout(t);busy(false);$('status').className='status';$('status').textContent='Données actualisées.';render(r)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(t);busy(false);$('status').className='error';$('status').textContent='Erreur : '+(e&&e.message||e)})[method](query())}
function reset(){['family','diploma','level','classe','period','company','student','teacher'].forEach(id=>$(id).value='');$('year').value=B.current||'ALL';$('window').value='3';syncWindow();load()}function syncWindow(){$('window').disabled=$('year').value!=='ALL';$('windowLabel').style.opacity=$('window').disabled?'.55':'1'}function csv(){let lines=[['Rang','Entreprise','Adresse','SIRET','Nombre élèves','Année','Élève','Classe','Niveau','Diplôme','Période','Professeur visiteur']];DATA.forEach((c,i)=>(c.historique||[]).forEach(h=>lines.push([i+1,c.entreprise,c.adresse,c.siret,c.elevesAccueillis,h.annee,h.eleve,h.classe,h.niveau,h.diplome,h.periode,h.professeurVisiteur])));let text='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='book-entreprises-pfmp.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
let years=(B.years||[]).filter(Boolean);$('year').innerHTML='<option value="ALL">Toutes les années</option>'+years.map(y=>'<option>'+esc(y)+'</option>').join('');$('year').value=B.current||years[0]||'ALL';$('year').onchange=syncWindow;$('apply').onclick=load;$('reset').onclick=reset;$('csv').onclick=csv;$('pdf').onclick=()=>window.print();syncWindow();load();
</script></body></html>
