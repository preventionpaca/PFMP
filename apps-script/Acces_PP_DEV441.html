<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--g:#087f70;--bg:#f3f8f7;--line:#c8e1da;--mut:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172b27}.hero{background:linear-gradient(135deg,#075f55,#0d8b78);color:#fff;padding:28px}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}input,select{padding:10px;border:1px solid #aacfc5;border-radius:8px;background:#fff}button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:1px solid #8bcabb}.login{display:flex;gap:10px;align-items:end}.login input{font:700 18px monospace;min-width:300px;text-transform:uppercase}.muted{color:var(--mut)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8efed;text-align:left}th{font-size:12px;color:var(--mut)}.tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.hidden{display:none!important}@media(max-width:700px){.login{flex-direction:column;align-items:stretch}.login input{min-width:0}table{font-size:13px}}
</style></head><body><header class="hero"><div class="wrap"><h1>Affectations PFMP — professeur principal</h1><p>Accès temporaire limité à votre classe et à la période indiquée.</p></div></header><main class="wrap"><section id="login" class="card"><div class="login"><label style="flex:1">Code temporaire<br><input id="code" autocomplete="one-time-code" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"></label><button id="unlock" class="primary">Ouvrir</button></div><p id="loginStatus" class="muted"></p></section><section id="workspace" class="card hidden"><h2 id="title"></h2><p id="scope" class="muted"></p><div class="tools"><label>Type de suivi<br><select id="type"><option value="VISITE">Professeur visiteur</option><option value="TELEPHONE">Suivi téléphonique</option></select></label><label style="flex:1">Professeur<br><select id="prof" style="width:100%"></select></label><button id="assign" class="primary">Affecter aux élèves sélectionnés</button></div><div id="status" class="muted"></div><div id="table"></div></section></main><script>
const $=id=>document.getElementById(id);let CODE='',DATA=null;function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function fail(e){$('loginStatus').textContent=e&&e.message||e;$('unlock').disabled=false;$('unlock').textContent='Ouvrir'}function render(d){DATA=d;sessionStorage.setItem('eucPpCode',CODE);$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('title').textContent=d.scope.classe+' — '+d.scope.periode;$('scope').textContent='Accès de '+d.scope.professeurPrincipal+' · expiration : '+d.scope.expiration;$('prof').innerHTML=(d.professeurs||[]).map(x=>'<option value="'+x.id+'">'+esc(x.nom)+(x.discipline?' — '+esc(x.discipline):'')+'</option>').join('');$('table').innerHTML='<table><thead><tr><th><input id="all" type="checkbox"></th><th>Élève</th><th>Statut</th><th>Suivi téléphonique</th><th>Professeur visiteur</th></tr></thead><tbody>'+d.lignes.map(x=>'<tr><td><input class="student" type="checkbox" value="'+x.eleveId+'"></td><td><b>'+esc(x.eleve)+'</b></td><td>'+esc(x.statut)+'</td><td>'+esc(x.telephone||'—')+'</td><td>'+esc(x.visite||'—')+'</td></tr>').join('')+'</tbody></table>';document.getElementById('all').onchange=e=>document.querySelectorAll('.student').forEach(x=>x.checked=e.target.checked)}function unlock(){CODE=$('code').value.trim();if(!CODE)return;$('unlock').disabled=true;$('unlock').textContent='Contrôle…';google.script.run.withSuccessHandler(d=>{$('unlock').disabled=false;render(d);$('status').textContent='Accès ouvert en '+Number(d.durationMs||0)+' ms.'}).withFailureHandler(fail).EUC_DEV448_unlockPp({code:CODE})}$('unlock').onclick=unlock;$('code').onkeydown=e=>{if(e.key==='Enter')unlock()};$('assign').onclick=()=>{let ids=Array.from(document.querySelectorAll('.student:checked')).map(x=>Number(x.value));if(!ids.length){$('status').textContent='Sélectionnez au moins un élève.';return}$('assign').disabled=true;$('status').textContent='Affectation en lot…';google.script.run.withSuccessHandler(r=>{$('assign').disabled=false;const selected={};(r.eleveIds||[]).forEach(id=>selected[Number(id)]=true);(DATA.lignes||[]).forEach(x=>{if(!selected[Number(x.eleveId)])return;if(r.type==='TELEPHONE')x.telephone=r.professeur.nom;else x.visite=r.professeur.nom});render(DATA);$('status').textContent=(r.warning||'Affectation enregistrée.')+' ('+Number(r.durationMs||0)+' ms)'}).withFailureHandler(e=>{$('assign').disabled=false;$('status').textContent='Erreur : '+(e&&e.message||e)}).EUC_DEV448_affecterPp({code:CODE,type:$('type').value,profId:Number($('prof').value),eleveIds:ids})};const saved=sessionStorage.getItem('eucPpCode');if(saved){$('code').value=saved;unlock()}
</script></body></html>
