<!doctype html>
<html lang="fr">
<head>
<base target="_self">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#0b8f72;--bg:#f7fbf9;--line:#cfe5de;--mut:#667085;--red:#d92d20;--orange:#e67e00;--grey:#98a2b3}
*{box-sizing:border-box}
html.euc-atrium-embedded body{padding-top:0!important}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17312b}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:24px}
h1{margin:0;color:#0f4035}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none;transition:.15s;cursor:pointer}
.card:hover{border-color:var(--g);transform:translateY(-1px)}
.card.loading{opacity:.72;transform:scale(.995)}
.card.loading .go{background:#dff4ed;color:#0b745f}
.card.loading .go::after{content:" · chargement…"}
.title{font-size:22px;font-weight:800;color:#0c5f4e}
.meta{font-size:12px;color:var(--mut);margin:6px 0 12px}
.period{border-top:1px solid #edf2ef;padding:9px 0}
.row{display:flex;justify-content:space-between;gap:10px}
.count{font-weight:800}.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--g)}.grey{color:var(--grey)}
.go{display:inline-block;background:var(--g);color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;margin-top:10px}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><h1>Point sur les stages</h1></div></header>
<main class="wrap">
<label>Année scolaire <select id="year"></select></label>
<div id="grid" class="grid"></div>
</main>
<script>
const C=<?!= config ?>;
const REQUESTED_YEAR=<?!= requestedYear ?>;

(function(){
  function currentYear(){
    const d=new Date(),y=d.getFullYear(),a=d.getMonth()+1>=9?y:y-1;
    return a+'-'+(a+1);
  }

  function colorClass(p){
    const total=Number(p.total)||0;
    if(total<=0)return 'grey';
    const ratio=100*(Number(p.conventions)||0)/total;
    return ratio>=100?'green':(ratio>=65?'orange':'red');
  }

  function nav(state){
    try{
      if(window.parent && window.parent!==window){
        window.parent.postMessage({type:'EUC_ATRIUM_NAV',state:state},'*');
        return;
      }
    }catch(e){}
    const u=new URL(C.baseUrl);
    Object.keys(state).forEach(k=>u.searchParams.set(k,state[k]));
    location.href=u.toString();
  }

  const active=REQUESTED_YEAR||currentYear();
  const y0=Number(active.slice(0,4));

  year.innerHTML=[y0-1,y0,y0+1].map(function(y){
    const code=y+'-'+(y+1);
    return '<option value="'+code+'"'+(code===active?' selected':'')+'>'+code+'</option>';
  }).join('');

  year.onchange=function(){
    nav({page:'suivi-conventions-public',annee:this.value});
  };

  google.script.run
    .withSuccessHandler(function(fams){
      grid.innerHTML=(fams||[]).map(function(f){
        return '<article class="card" data-family="'+f.code+'">'+
          '<div class="title">'+f.libelle+'</div>'+
          '<div class="meta">'+(f.classes||0)+' classe(s) · '+(f.effectif||0)+' élève(s) · '+(f.apprentis||0)+' apprenti(s)</div>'+
          (f.periodes||[]).map(function(p){
            const c=colorClass(p);
            return '<div class="period"><div class="row"><b>'+p.libelle+'</b><span class="count '+c+'">'+p.conventions+' / '+p.total+'</span></div></div>';
          }).join('')+
          '<span class="go">Voir les classes</span>'+
        '</article>';
      }).join('');

      document.querySelectorAll('.card[data-family]').forEach(function(card){
        card.onclick=function(){
          card.classList.add('loading');
          nav({
            page:'suivi-conventions-public-famille',
            annee:active,
            famille:card.dataset.family
          });
        };
      });
    })
    .withFailureHandler(function(e){
      grid.innerHTML='<div>Erreur : '+String(e&&e.message||e)+'</div>';
    })
    .EUC_DEV181_resumeFamilles({annee:active});
})();
</script>
</body>
</html>
