<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<title>Suivi des conventions PFMP</title>
<style>
:root{--g:#0b8f72;--g2:#dff4ed;--g3:#eef9f5;--ink:#17312b;--mut:#5f746e;--line:#cfe5de;--bg:#f7fbf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
.hero{background:#fff;border-bottom:1px solid var(--line);padding:25px 18px}.wrap{max-width:1180px;margin:auto}.hero h1{margin:0;color:#0f4035}.sub{margin-top:5px;color:var(--mut)}
.content{padding:20px 18px}.back{display:inline-block;text-decoration:none;color:#0b745f;font-weight:800;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(12,76,62,.05)}
.head{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:800;color:#0c5f4e}.badge{background:var(--g2);color:#0b745f;padding:5px 8px;border-radius:999px;font-size:12px}
.period{display:block;text-decoration:none;color:inherit;padding:10px 0;border-top:1px solid #e7f1ed}.row{display:flex;justify-content:space-between;gap:12px}.label{font-weight:700}.count{font-weight:800;color:var(--g)}.dates{font-size:12px;color:var(--mut)}
.bar{height:6px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--g)}
.loading,.error{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><h1 id="title">Suivi des conventions</h1><div id="sub" class="sub"></div></div></header>
<main class="content"><div class="wrap"><a id="back" class="back" href="#">← Retour à la synthèse</a><div id="grid" class="loading">Chargement des classes…</div></div></main>
<script>
const C=<?!= config ?>; const PARAMS=<?!= paramsJson ?>;
(function(){
  const grid=document.getElementById('grid');
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  back.href=C.baseUrl+'?page=suivi-conventions&annee='+encodeURIComponent(PARAMS.annee||'');
  google.script.run.withSuccessHandler(function(res){
    title.textContent=res.familleLibelle||'Suivi'; sub.textContent='Synthèse par classe · '+res.annee;
    grid.className='grid';
    grid.innerHTML=(res.classes||[]).map(c=>'<section class="card"><div class="head"><span>'+esc(c.classe)+'</span><span class="badge">'+c.effectif+' élève(s)</span></div>'+
      (c.periodes||[]).map(p=>{const href=C.baseUrl+'?page=suivi-pfmp-classe&annee='+encodeURIComponent(res.annee)+'&classe='+encodeURIComponent(c.classeId)+'&periode='+encodeURIComponent(p.id)+'&origine=suivi-conventions&famille='+encodeURIComponent(res.famille);return '<a class="period" href="'+href+'"><div class="row"><div><div class="label">'+esc(p.libelle)+'</div><div class="dates">'+esc([p.debutFr,p.finFr].filter(Boolean).join(' → '))+'</div></div><div class="count">'+p.conventions+' / '+p.total+'</div></div><div class="bar"><div class="fill" style="width:'+Math.min(100,p.pourcentage||0)+'%"></div></div></a>';}).join('')+'</section>').join('');
  }).withFailureHandler(e=>{grid.className='error';grid.textContent='Erreur de chargement : '+String(e&&e.message||e);}).EUC_SUIVI_PUBLIC_chargerFamilleV49(PARAMS);
})();
</script>
</body>
</html>
