<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<title>Suivi des conventions — famille</title>
<style>
:root{--b:#1B396A;--b2:#3F72AF;--bg:#f5f7fb;--line:#dce3ee;--mut:#667085}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}
.hero{padding:20px 18px;color:#fff;background:linear-gradient(135deg,var(--b),var(--b2))}
.wrap{max-width:1180px;margin:auto}.content{padding:18px}.back{display:inline-block;margin-bottom:16px;text-decoration:none;color:var(--b);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(31,42,68,.06)}
.head{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:800;color:var(--b)}.badge,.dates{font-size:12px;color:var(--mut)}
.period{display:block;text-decoration:none;color:inherit;padding:10px 0;border-top:1px solid #edf0f4}.row{display:flex;justify-content:space-between;gap:12px}.label{font-weight:700}.count{font-weight:800;color:var(--b)}
.bar{height:6px;background:#e7ebf2;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--b2),var(--b))}
.loading,.error{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><h1 id="title">Suivi des conventions</h1><div id="sub"></div></div></header>
<main class="content"><div class="wrap">
<a id="back" class="back" href="#">← Retour à la synthèse</a>
<div id="grid" class="loading">Chargement des classes…</div>
</div></main>
<script>
const C=<?!= config ?>;
const PARAMS=<?!= paramsJson ?>;
(function(){
  const grid=document.getElementById('grid');
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  document.getElementById('back').href=C.baseUrl+'?page=suivi-conventions&annee='+encodeURIComponent(PARAMS.annee||'');
  google.script.run.withSuccessHandler(function(res){
    document.getElementById('title').textContent=res.familleLibelle||'Suivi';
    document.getElementById('sub').textContent='Synthèse par classe · '+res.annee;
    const rows=res.classes||[];
    grid.className='grid';
    grid.innerHTML=rows.map(c=>'<section class="card"><div class="head"><span>'+esc(c.classe)+'</span><span class="badge">'+c.effectif+' élève(s)</span></div>'+
      (c.periodes||[]).map(p=>{
        const href=C.baseUrl+'?page=suivi-pfmp-classe&annee='+encodeURIComponent(res.annee)+'&classe='+encodeURIComponent(c.classeId)+'&periode='+encodeURIComponent(p.id)+'&origine=suivi-conventions&famille='+encodeURIComponent(res.famille);
        return '<a class="period" href="'+href+'"><div class="row"><div><div class="label">'+esc(p.libelle)+'</div><div class="dates">'+esc([p.debutFr,p.finFr].filter(Boolean).join(' → '))+'</div></div><div class="count">'+p.conventions+' / '+p.total+'</div></div><div class="bar"><div class="fill" style="width:'+Math.min(100,p.pourcentage||0)+'%"></div></div></a>';
      }).join('')+'</section>').join('');
  }).withFailureHandler(function(e){grid.className='error';grid.textContent='Erreur : '+String(e&&e.message||e)}).EUC_SUIVI_PUBLIC_chargerFamilleV47(PARAMS);
})();
</script>
</body>
</html>
