<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#eef7f4;color:#073b35;margin:0}main{max-width:820px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #cfe1dc;border-radius:14px;padding:18px}.status{padding:12px;border-radius:8px;background:#eef6ff;margin-bottom:12px}.err{background:#fff0f0;color:#8b1111}.ok{background:#e8f7ef}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a.btn,button{font:inherit;border:0;border-radius:8px;background:#008f78;color:#fff;padding:10px 16px;text-decoration:none;font-weight:700;cursor:pointer}.note{padding:12px;background:#f6faf9;border:1px solid #dbe9e5;border-radius:8px;margin-top:12px}</style><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head><body><main><section class="card"><h1>Convention PFMP — PDF</h1><div id="status" class="status">Composition sur le patron PDF vierge…</div><div id="actions" class="actions" hidden><a id="download" class="btn">Télécharger le PDF</a><button id="print">Ouvrir / imprimer</button></div><div id="meta" class="note">DEV.117 — signature recentrée + continuation entreprise QR.</div></section></main><script>
const PAYLOAD=<?!= payload ?>;
(async()=>{
 const status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download'),printBtn=document.getElementById('print'),meta=document.getElementById('meta');
 try{
  if(!window.PDFLib||!window.qrcode)throw new Error('Bibliothèques PDF/QR non chargées.');
  const{PDFDocument,StandardFonts,rgb}=PDFLib;
  const masterBytes=Uint8Array.from(atob(PAYLOAD.pdfBase64),c=>c.charCodeAt(0));
  const COLORS={NOIR:rgb(17/255,17/255,17/255),ORANGE:rgb(227/255,92/255,0),ROUGE:rgb(190/255,30/255,30/255),BLEU:rgb(30/255,70/255,145/255)};
  const Z={PERIODE_LIGNE:{p:0,x:95,y:771,w:278,h:23},CLASSE_LIGNE:{p:0,x:378,y:771,w:80,h:23},ELEVE_LIGNE:{p:0,x:24,y:756,w:432,h:13},ADRESSE_ELEVE_LIGNE:{p:0,x:24,y:744,w:432,h:12},CONTACT_ELEVE_LIGNE:{p:0,x:24,y:732,w:432,h:12},DIPLOME_LIGNE:{p:0,x:24,y:714,w:432,h:15},ETABLISSEMENT_LIGNE:{p:0,x:24,y:695,w:432,h:14},PROVISEUR_LIGNE:{p:0,x:24,y:680,w:432,h:14},PROF_LIGNE:{p:0,x:24,y:665,w:432,h:14},QR:{p:0,x:480,y:726,w:72,h:72},/* centre visuel recalé encore 4 pt vers la gauche */PROF_SIGNATURE_LIGNE:{p:1,x:330,y:115,w:160,h:18},REFERENCE_LIGNE:{p:1,x:405,y:43,w:165,h:13}};
  function safe(v){return String(v??'').replace(/\u00a0|\u202f/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').trim()}
  function parseRich(text,defaultColor,baseSize){const tokens=safe(text).split(/(\*\*|\[arrow\]|\[orange\]|\[\/orange\]|\[rouge\]|\[\/rouge\]|\[bleu\]|\[\/bleu\]|\[size=\d+(?:\.\d+)?\]|\[\/size\])/i).filter(Boolean);let b=false,c=(defaultColor||'NOIR').toUpperCase(),s=baseSize,r=[];tokens.forEach(t=>{const l=t.toLowerCase();if(t==='**'){b=!b;return}if(l==='[arrow]'){r.push({arrow:true,color:'ORANGE',size:s});return}if(l==='[orange]'){c='ORANGE';return}if(l==='[rouge]'){c='ROUGE';return}if(l==='[bleu]'){c='BLEU';return}if(l==='[/orange]'||l==='[/rouge]'||l==='[/bleu]'){c=(defaultColor||'NOIR').toUpperCase();return}let m=/^\[size=(\d+(?:\.\d+)?)\]$/i.exec(t);if(m){s=Number(m[1]);return}if(l==='[/size]'){s=baseSize;return}r.push({text:t,bold:b,color:c,size:s})});return r}
  function runWidth(r,font,bold,scale){if(r.arrow)return 11*scale;return (r.bold?bold:font).widthOfTextAtSize(r.text,r.size*scale)}
  function widthRuns(runs,font,bold,scale){return runs.reduce((n,r)=>n+runWidth(r,font,bold,scale),0)}
  function drawArrow(page,x,y,size,color){const cy=y+size*.38,shaft=6.2,head=3.3;page.drawLine({start:{x,y:cy},end:{x:x+shaft,y:cy},thickness:1.25,color});page.drawLine({start:{x:x+shaft,y:cy},end:{x:x+shaft-head,y:cy+head},thickness:1.25,color});page.drawLine({start:{x:x+shaft,y:cy},end:{x:x+shaft-head,y:cy-head},thickness:1.25,color});}
  function drawRich(page,r,line,font,bold){const base=Number(line&&line.taille||6),configuredMin=Number(line&&line.tailleMin||4),runs=parseRich(line&&line.texte||'',line&&line.couleur||'NOIR',base);if(!runs.length)return;let scale=1,w=widthRuns(runs,font,bold,scale),minScale=Math.min(1,configuredMin/base);while(scale>minScale&&w>r.w-4){scale=Math.max(minScale,scale-.01);w=widthRuns(runs,font,bold,scale)}const hardMin=Math.min(minScale,3.4/base);while(scale>hardMin&&w>r.w-4){scale=Math.max(hardMin,scale-.01);w=widthRuns(runs,font,bold,scale)}if(w>r.w-4){scale*=Math.max(.1,(r.w-4)/w);w=widthRuns(runs,font,bold,scale)}const align=String(line&&line.alignement||'LEFT').toUpperCase(),v=String(line&&line.alignementVertical||'MIDDLE').toUpperCase(),mx=Math.max(...runs.map(a=>(a.size||base)*scale));let x=r.x+2;if(align==='CENTER')x=r.x+(r.w-w)/2;else if(align==='RIGHT')x=r.x+r.w-w-2;let y=r.y+1;if(v==='MIDDLE')y=r.y+(r.h-mx)/2+.45;else if(v==='TOP')y=r.y+r.h-mx-1;runs.forEach(a=>{if(a.arrow){drawArrow(page,x,y,mx,COLORS.ORANGE);x+=11*scale;return}const f=a.bold?bold:font,s=a.size*scale;page.drawText(a.text,{x,y,size:s,font:f,color:COLORS[a.color]||COLORS.NOIR});x+=f.widthOfTextAtSize(a.text,s)})}
  function drawQR(page,url){const r=Z.QR,q=qrcode(0,'L');q.addData(String(url||''));q.make();const n=q.getModuleCount(),quiet=4,total=n+quiet*2,box=Math.min(r.w,r.h),cell=box/total,x0=r.x+(r.w-box)/2,y0=r.y+(r.h-box)/2;for(let row=0;row<n;row++)for(let col=0;col<n;col++)if(q.isDark(row,col))page.drawRectangle({x:x0+(col+quiet)*cell,y:y0+box-(row+quiet+1)*cell,width:cell+.04,height:cell+.04,color:COLORS.NOIR})}
  async function buildOne(data){const pdf=await PDFDocument.load(masterBytes.slice());if(pdf.getPageCount()!==2)throw new Error('Le modèle PDF maître doit contenir exactement 2 pages.');const pages=pdf.getPages(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold),L=data.lignes||{};['PERIODE_LIGNE','CLASSE_LIGNE','ELEVE_LIGNE','ADRESSE_ELEVE_LIGNE','CONTACT_ELEVE_LIGNE','DIPLOME_LIGNE','ETABLISSEMENT_LIGNE','PROVISEUR_LIGNE','PROF_LIGNE','PROF_SIGNATURE_LIGNE','REFERENCE_LIGNE'].forEach(n=>{const r=Z[n];drawRich(pages[r.p],r,L[n]||{},font,bold)});drawQR(pages[0],data.formUrl);return await pdf.save({useObjectStreams:false})}
  let finalBytes;if(PAYLOAD.items.length===1){status.textContent='Fusion de la convention…';finalBytes=await buildOne(PAYLOAD.items[0]);}else{const out=await PDFDocument.create();for(let i=0;i<PAYLOAD.items.length;i++){status.textContent='Fusion '+(i+1)+' / '+PAYLOAD.items.length+'…';const oneBytes=await buildOne(PAYLOAD.items[i]),one=await PDFDocument.load(oneBytes),cp=await out.copyPages(one,[0,1]);out.addPage(cp[0]);out.addPage(cp[1])}finalBytes=await out.save({useObjectStreams:false})}const url=URL.createObjectURL(new Blob([finalBytes],{type:'application/pdf'}));download.href=url;download.download=PAYLOAD.filename||'Convention_PFMP.pdf';printBtn.onclick=()=>window.open(url,'_blank');actions.hidden=false;status.className='status ok';status.textContent='PDF prêt : '+PAYLOAD.items.length+' convention(s), '+PAYLOAD.items.length*2+' page(s).';meta.textContent='DEV.117 — patron vierge + QR entreprise — '+(PAYLOAD.version||'')
 }catch(e){console.error(e);status.className='status err';status.textContent='Erreur PDF : '+(e&&e.message?e.message:String(e))}
})();
</script></body></html>
