<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion des apprentis</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f7fbf9;
}
.viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#f7fbf9;
}
iframe{
  position:absolute;
  left:0;
  top:-92px;
  width:100%;
  height:calc(100% + 92px);
  border:0;
  background:#f7fbf9;
}
@media(max-width:700px){
  iframe{
    top:-92px;
    height:calc(100% + 92px);
  }
}
</style>
</head>
<body>
<div class="viewport">
  <iframe
    id="app"
    title="Gestion des apprentis"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer">
  </iframe>
</div>

<script>
(function(){
  const GAS =
    'https://script.google.com/macros/s/' +
    'AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg' +
    '/exec';

  const frame = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  const u = new URL(GAS);

  u.searchParams.set('page','apprentissage-public-pfmp');

  ['annee','classe'].forEach(function(k){
    const v = q.get(k);
    if(v) u.searchParams.set(k,v);
  });

  frame.src = u.toString();
})();
</script>
</body>
</html>
