<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point sur les stages</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbf9}
.viewport{position:fixed;inset:0;overflow:hidden;background:#f7fbf9}
iframe{
  position:absolute;
  left:0;
  top:-92px;
  width:100%;
  height:calc(100% + 92px);
  border:0;
  background:#f7fbf9;
}
</style>
</head>
<body>
<div class="viewport">
  <iframe id="app" title="Point sur les stages"></iframe>
</div>

<script>
(function(){
  const GAS='https://script.google.com/macros/s/AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg/exec';
  const frame=document.getElementById('app');

  function state(){
    const q=new URLSearchParams(location.search);
    return {
      page:q.get('page')||'suivi-conventions-public',
      annee:q.get('annee')||'',
      famille:q.get('famille')||'',
      classe:q.get('classe')||'',
      periode:q.get('periode')||''
    };
  }

  function load(){
    const s=state();
    const u=new URL(GAS);
    Object.keys(s).forEach(function(k){
      if(s[k])u.searchParams.set(k,s[k]);
    });
    frame.src=u.toString();
  }

  function navigate(s){
    const q=new URLSearchParams();
    Object.keys(s||{}).forEach(function(k){
      if(s[k])q.set(k,s[k]);
    });

    history.pushState(
      s,
      '',
      location.pathname+(q.toString()?'?'+q.toString():'')
    );

    load();
  }

  window.addEventListener('message',function(ev){
    const d=ev.data||{};
    if(d.type==='EUC_ATRIUM_NAV' && d.state){
      navigate(d.state);
    }
  });

  window.addEventListener('popstate',load);

  load();
})();
</script>
</body>
</html>
