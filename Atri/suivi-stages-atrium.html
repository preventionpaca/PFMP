<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Point sur les stages</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f7fbf9;
  font-family:Arial,sans-serif;
}
.shell{
  position:fixed;
  inset:0;
  background:#f7fbf9;
}
.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:92px;
  background:#fff;
  border-bottom:1px solid #cfe5de;
}
.header-inner{
  max-width:1180px;
  height:100%;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  align-items:center;
}
.header h1{
  margin:0;
  color:#0f4035;
  font-size:30px;
}
.navbar{
  position:absolute;
  top:92px;
  left:0;
  right:0;
  min-height:72px;
  background:#f7fbf9;
  border-bottom:1px solid #dfeee8;
}
.nav-inner{
  max-width:1180px;
  min-height:72px;
  margin:0 auto;
  padding:12px 24px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:16px;
}
.year-box{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.year-box select{
  padding:7px 9px;
  border:1px solid #cfe5de;
  border-radius:8px;
  background:#fff;
}
.crumb{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  font-size:13px;
}
.crumb a{
  color:#0b745f;
  text-decoration:none;
  font-weight:800;
  cursor:pointer;
}
.crumb .current{
  color:#334155;
  font-weight:800;
}

/*
 * DEV191 :
 * plus aucun décalage négatif de l'iframe.
 * C'était lui qui coupait exactement le haut des pages internes.
 */
.viewport{
  position:absolute;
  top:164px;
  left:0;
  right:0;
  bottom:0;
  overflow:hidden;
  background:#f7fbf9;
}
iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#f7fbf9;
}
</style>
</head>

<body>
<div class="shell">

<header class="header">
  <div class="header-inner">
    <h1>Point sur les stages</h1>
  </div>
</header>

<nav class="navbar" aria-label="Navigation Point sur les stages">
  <div class="nav-inner">

    <div class="year-box">
      <label for="year">Année scolaire</label>
      <select id="year"></select>
    </div>

    <div id="crumb" class="crumb"></div>

  </div>
</nav>

<div class="viewport">
  <iframe
    id="app"
    title="Point sur les stages">
  </iframe>
</div>

</div>

<script>
(function(){

  const GAS=
    'https://script.google.com/macros/s/'+
    'AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg'+
    '/exec';

  const frame=document.getElementById('app');
  const year=document.getElementById('year');
  const crumb=document.getElementById('crumb');

  let meta={
    page:'',
    family:'',
    classLabel:'',
    periodLabel:''
  };

  function state(){
    const q=new URLSearchParams(location.search);

    return {
      page:q.get('page')||'suivi-conventions-public',
      annee:q.get('annee')||'',
      famille:q.get('famille')||'',
      classe:q.get('classe')||'',
      periode:q.get('periode')||''
    };
  }

  function currentSchoolYear(){
    const d=new Date();
    const y=d.getFullYear();
    const start=d.getMonth()+1>=9?y:y-1;
    return start+'-'+(start+1);
  }

  function normalizeState(s){
    if(!s.annee){
      s.annee=currentSchoolYear();
    }
    return s;
  }

  function renderYear(){
    const s=normalizeState(state());
    const y0=Number(s.annee.slice(0,4));

    year.innerHTML=[y0-1,y0,y0+1].map(function(y){
      const code=y+'-'+(y+1);

      return '<option value="'+code+'"'+
        (code===s.annee?' selected':'')+
        '>'+
        code+
        '</option>';
    }).join('');
  }

  function famLabel(f){
    return f==='BACPRO'?'BAC PRO':f;
  }

  function link(label,target){
    return '<a href="#" data-target="'+
      encodeURIComponent(JSON.stringify(target))+
      '">'+
      label+
      '</a>';
  }

  function renderCrumb(){
    const s=normalizeState(state());
    const items=[];

    items.push(
      link(
        'Accueil',
        {
          page:'suivi-conventions-public',
          annee:s.annee
        }
      )
    );

    items.push('›');

    items.push(
      link(
        'Suivi des conventions',
        {
          page:'suivi-conventions-public',
          annee:s.annee
        }
      )
    );

    if(s.famille){
      items.push('›');

      items.push(
        s.page==='suivi-conventions-public-famille'
          ? '<span class="current">'+famLabel(s.famille)+'</span>'
          : link(
              famLabel(s.famille),
              {
                page:'suivi-conventions-public-famille',
                annee:s.annee,
                famille:s.famille
              }
            )
      );
    }

    if(s.page==='suivi-pfmp-classe-public'){
      items.push('›');

      items.push(
        '<span class="current">'+
        (meta.classLabel||'Classe')+
        '</span>'
      );

      items.push('›');

      items.push(
        '<span class="current">'+
        (meta.periodLabel||'Période')+
        '</span>'
      );
    }

    crumb.innerHTML=items.join(' ');

    crumb.querySelectorAll('a[data-target]')
      .forEach(function(a){
        a.onclick=function(ev){
          ev.preventDefault();

          const target=
            JSON.parse(
              decodeURIComponent(
                a.dataset.target
              )
            );

          navigate(target);
        };
      });
  }

  function load(){
    const s=normalizeState(state());
    const u=new URL(GAS);

    Object.keys(s).forEach(function(k){
      if(s[k]){
        u.searchParams.set(k,s[k]);
      }
    });

    renderYear();
    renderCrumb();

    frame.src=u.toString();
  }

  function navigate(s){
    const q=new URLSearchParams();

    Object.keys(s||{}).forEach(function(k){
      if(s[k]){
        q.set(k,s[k]);
      }
    });

    meta={
      page:'',
      family:'',
      classLabel:'',
      periodLabel:''
    };

    history.pushState(
      s,
      '',
      location.pathname+
      (q.toString()?'?'+q.toString():'')
    );

    load();
  }

  year.onchange=function(){
    navigate({
      page:'suivi-conventions-public',
      annee:year.value
    });
  };

  window.addEventListener(
    'message',
    function(ev){
      const d=ev.data||{};

      if(
        d.type==='EUC_ATRIUM_NAV' &&
        d.state
      ){
        navigate(d.state);
        return;
      }

      if(
        d.type==='EUC_ATRIUM_META' &&
        d.meta
      ){
        meta=d.meta;
        renderCrumb();
      }
    }
  );

  window.addEventListener(
    'popstate',
    function(){
      meta={
        page:'',
        family:'',
        classLabel:'',
        periodLabel:''
      };
      load();
    }
  );

  load();

})();
</script>

</body>
</html>
