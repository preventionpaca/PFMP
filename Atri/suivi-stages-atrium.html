<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi des PFMP — consultation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="pfmpApp" src="https://script.google.com/a/macros/lycee-les-eucalyptus.org/s/AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg/exec?page=suivi-conventions-public&amp;wrapper=1" title="Suivi des PFMP — consultation"></iframe>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('pfmpApp');
  var host='script.google.com';
  var path='/a/macros/lycee-les-eucalyptus.org/s/AKfycby6ykCxTxhUjq8FeKoBzgEMj6xzdrjXnBFgOt-1pAw1GfkaAigWMH7jj0EIg_BWpEkmxg/exec';
  function allowed(raw){
    try{
      var u=new URL(String(raw||''));
      return u.protocol==='https:'&&u.hostname===host&&u.pathname===path&&
        (u.searchParams.get('page')||'').indexOf('suivi-')===0?u:null;
    }catch(e){return null;}
  }
  window.addEventListener('message',function(ev){
    if(!ev.data||!/^EUC_PFMP_WRAPPER_/.test(String(ev.data.type||'')))return;
    if(ev.origin!=='null'&&
       !/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/i.test(ev.origin)&&
       ev.origin!=='https://script.google.com')return;
    if(ev.data.type==='EUC_PFMP_WRAPPER_QUERY'){
      try{ev.source.postMessage({type:'EUC_PFMP_WRAPPER_READY'},'*');}catch(e){}
      return;
    }
    if(ev.data.type==='EUC_PFMP_WRAPPER_NAVIGATE'){
      var target=allowed(ev.data.url);
      if(target)frame.src=target.toString();
    }
  });
})();
</script>
</body>
</html>
