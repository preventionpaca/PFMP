<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#1d2939}
    .wrap{max-width:1100px;margin:auto;padding:24px}
    .card{background:#fff;border:1px solid #d9e1ec;border-radius:16px;padding:18px;margin-bottom:18px}
    h1{margin-top:0}.sub{color:#667085}
    label{font-weight:700;display:block;margin-bottom:6px}
    input[type=text],textarea{width:100%;box-sizing:border-box;border:1px solid #b9c7d8;border-radius:9px;padding:9px 10px}
    textarea{min-height:120px}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf0f4;padding:9px;text-align:left}
    th{background:#f8fafc}.email{width:100%}
    .actions{display:flex;gap:10px;justify-content:flex-end}
    button,a.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none}
    .primary{background:#165d9c;color:#fff}.secondary{background:#fff;color:#1d2939;border:1px solid #d9e1ec}
    #status{display:none;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-weight:700}
    #status.show{display:block}.ok{background:#ecfdf3;color:#067647}.err{background:#fff1f2;color:#b42318}.info{background:#eef5fb;color:#164e7a}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Paramètres des envois PFMP</h1>
  <p class="sub">Les professeurs principal, de suivi téléphonique et visiteurs sont destinataires. Les personnes ci-dessous sont ajoutées en copie si elles sont cochées.</p>

  <div id="status"></div>

  <div class="card">
    <label>Objet du mail</label>
    <input id="objet" type="text">
    <div class="sub" style="margin-top:6px">Variables : {{CLASSE}}, {{PERIODE}}, {{ANNEE}}</div>
  </div>

  <div class="card">
    <label>Message d’accompagnement</label>
    <textarea id="message"></textarea>
  </div>

  <div class="card">
    <h2>Copies institutionnelles</h2>
    <table>
      <thead><tr><th>Inclure</th><th>Fonction</th><th>Adresse email</th></tr></thead>
      <tbody id="dest"></tbody>
    </table>
  </div>

  <div class="actions">
    <a id="back" class="btn secondary" href="#">Retour</a>
    <button id="save" class="primary">Enregistrer</button>
  </div>
</div>

<script>
const C=<?!= config ?>;
let P=<?!= paramsJson ?>;
const dest=document.getElementById('dest');
const status=document.getElementById('status');

function esc(v){const d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}
function show(text,type){status.textContent=text;status.className='show '+type}

function render(){
  document.getElementById('objet').value=P.objet||'';
  document.getElementById('message').value=P.message||'';
  dest.innerHTML=(P.destinataires||[]).map(function(x){
    return '<tr data-key="'+esc(x.key)+'">'+
      '<td><input class="actif" type="checkbox" '+(x.actif?'checked':'')+'></td>'+
      '<td><b>'+esc(x.label)+'</b></td>'+
      '<td><input class="email" type="text" value="'+esc(x.email||'')+'" placeholder="adresse@domaine.fr"></td>'+
    '</tr>';
  }).join('');
}

document.getElementById('save').onclick=function(){
  const btn=this;btn.disabled=true;show('Enregistrement en cours...','info');

  const destinataires=Array.from(dest.querySelectorAll('tr[data-key]')).map(function(tr){
    return {key:tr.dataset.key,actif:tr.querySelector('.actif').checked,email:tr.querySelector('.email').value.trim()};
  });

  google.script.run
    .withSuccessHandler(function(r){btn.disabled=false;P=r;render();show('Paramètres enregistrés.','ok')})
    .withFailureHandler(function(e){btn.disabled=false;show('Erreur : '+(e&&e.message||e),'err')})
    .EUC_V157_sauverParametres({
      objet:document.getElementById('objet').value,
      message:document.getElementById('message').value,
      destinataires:destinataires
    });
};

document.getElementById('back').href=C.baseUrl+'?page=suivi-pfmp-classes';
render();
</script>
</body>
</html>
