<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#1d2939;--muted:#667085;--line:#d9e1ec;--accent:#165d9c;--ok:#079669;--warn:#d97706;--bad:#c62828}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
    h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}.back{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--ink)}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
    .yearbox{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:end;margin-bottom:20px}
    select{width:100%;border:1px solid #b9c7d8;border-radius:10px;padding:11px 12px;background:#fff;font:inherit}
    .section-title{font-size:21px;margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .classlink{display:block;text-decoration:none;color:inherit}.classcard{cursor:pointer;transition:.15s ease}.classcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.10)}
    .classhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.classhead b{font-size:19px}
    .badge{font-size:12px;background:#eef5fb;color:#165d9c;padding:5px 8px;border-radius:999px}
    .period{border-top:1px solid #edf0f4;padding:10px 0 0;margin-top:10px}.period-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .counter{font-weight:800;font-size:16px}.counter.ok{color:var(--ok)}.counter.warn{color:var(--warn)}.counter.bad{color:var(--bad)}
    .dates{font-size:12px;color:var(--muted);margin-top:3px}.empty{padding:24px;text-align:center;color:var(--muted)}.status{margin-top:8px;color:var(--muted)}
    .coming{margin-top:12px;font-size:12px;color:var(--muted)}
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.yearbox{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Suivi des PFMP par classe</h1><div class="sub">Vue synthétique des conventions enregistrées par période.</div></div>
    <a id="back" class="back" href="#">← Retour Administration PFMP</a>
  </div>

  <div class="card yearbox">
    <div>
      <label for="yearSelect" style="display:block;font-weight:700;margin-bottom:7px">Année scolaire</label>
      <select id="yearSelect"></select>
    </div>
    <div class="sub">L'année scolaire est le filtre principal et reste mémorisée pour les outils PFMP.</div>
  </div>

  <div id="content"></div>
  <div id="status" class="status"></div>
</div>

<script>
const C=<?!= config ?>;
const ANNEE_CTX=<?!= anneeContextJson ?>;
const ACCUEIL_INIT=<?!= accueilJson ?>;

(function(){
  document.getElementById('back').href=C.baseUrl+'?page=admin-pfmp';
  const yearSelect=document.getElementById('yearSelect');
  const content=document.getElementById('content');
  const status=document.getElementById('status');
  let yearContext=ANNEE_CTX||{annees:[],active:''};
  let accueil=ACCUEIL_INIT||{cartes:[]};

  function esc(v){const d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}
  function renderYears(){
    yearSelect.innerHTML=(yearContext.annees||[]).map(function(y){
      return '<option value="'+esc(y.code)+'"'+(y.code===yearContext.active?' selected':'')+'>'+esc(y.libelle||y.code)+'</option>';
    }).join('');
  }
  function counterClass(p){
    if(!p.total)return 'bad';
    if(p.conventions>=p.total)return 'ok';
    if(p.conventions===0)return 'bad';
    return 'warn';
  }
  function render(){
    const cats={};
    (accueil.cartes||[]).forEach(function(c){if(!cats[c.categorie])cats[c.categorie]=[];cats[c.categorie].push(c)});
    const order=['BAC PRO','BTS','CAP'];
    let html='';
    order.concat(Object.keys(cats).filter(k=>order.indexOf(k)<0)).forEach(function(cat){
      const cards=cats[cat]||[];if(!cards.length)return;
      html+='<h2 class="section-title">'+esc(cat)+'</h2><div class="grid">';
      html+=cards.map(function(c){
        const periods=(c.periodes||[]).map(function(p){
          return '<div class="period"><div class="period-line"><span>'+esc(p.libelle)+'</span><span class="counter '+counterClass(p)+'">'+p.conventions+' / '+p.total+'</span></div><div class="dates">'+esc([p.debut,p.fin].filter(Boolean).join(' → '))+'</div></div>';
        }).join('')||'<div class="period sub">Aucune période configurée.</div>';
        const href=C.baseUrl+'?page=suivi-pfmp-classe&annee='+encodeURIComponent(yearContext.active)+'&classe='+encodeURIComponent(c.classeId);
        return '<a class="classlink" href="'+href+'"><div class="card classcard">'+
          '<div class="classhead"><b>'+esc(c.classe)+'</b><span class="badge">'+c.effectif+' élève(s)</span></div>'+
          periods+
          '<div class="coming">Cliquer pour ouvrir le tableau détaillé</div>'+
        '</div></a>';
      }).join('');
      html+='</div>';
    });
    content.innerHTML=html||'<div class="card empty">Aucune classe PFMP pour cette année scolaire.</div>';
    status.textContent=(accueil.cartes||[]).length+' classe(s) affichée(s) pour '+yearContext.active+'.';
  }
  function reloadYear(code){
    window.location.href=C.baseUrl+'?page=suivi-pfmp-classes&annee='+encodeURIComponent(code);
  }
  yearSelect.onchange=function(){reloadYear(yearSelect.value)};
  renderYears();render();
})();
</script>

<script id="DEV161_FIX3_ENT_CLASSES">
(function(){
  const ENT_MODE=new URLSearchParams(window.location.search).get('mode')==='ent';
  function apply(){
    document.querySelectorAll('a[href*="page=suivi-pfmp-classe"]').forEach(function(a){
      if(ENT_MODE && a.href.indexOf('mode=ent')<0)a.href+=(a.href.indexOf('?')>=0?'&':'?')+'mode=ent';
    });
    if(ENT_MODE){document.querySelectorAll('a[href*="admin-pfmp"],button[id*="admin"],a[id*="back"]').forEach(function(x){x.style.display='none';});}
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(function(n){n.nodeValue=n.nodeValue.replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g,'$3/$2/$1');});
  }
  apply();
  new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});
})();
</script>

    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(244,247,251,.72);backdrop-filter:blur(2px);z-index:99999
  }
  #eucLoadingOverlayFix5.show{display:flex}
  .euc-loading-card{
    display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d9e1ec;
    border-radius:14px;padding:16px 20px;box-shadow:0 15px 40px rgba(16,24,40,.18);
    color:#163a63
  }

  }

  .euc-ent-mode #assignToolbarV156,

  .euc-ent-mode #sendTable{display:none!important}
  .euc-ent-mode table th:first-child,
  .euc-ent-mode table td:first-child{display:none!important}

<script id="EUC_CLASSES_FIX5_SCRIPT">
(function(){
  'use strict';

  function qs(name){
    try{return new URLSearchParams(window.location.search).get(name)||'';}catch(e){return '';}
  }

  function ensureOverlay(){
    var el=document.getElementById('eucLoadingOverlayFix5');
    if(el)return el;
    el=document.createElement('div');
    el.id='eucLoadingOverlayFix5';
    el.innerHTML='<div class="euc-loading-card"><span class="euc-spinner"></span><b>Chargement en cours…</b></div>';
    document.body.appendChild(el);
    return el;
  }

  function showLoading(){
    ensureOverlay().classList.add('show');
  }

  function classLabel(link){
    var b=link.querySelector('.classhead b') || link.querySelector('b');
    return (b?b.textContent:link.textContent||'').trim().toUpperCase();
  }

  function bacRank(label){
    if(/^T/.test(label) || /^TER/.test(label))return 10;
    if(/^1/.test(label) || /^PREM/.test(label))return 20;
    if(/^2/.test(label) || /^SEC/.test(label))return 30;
    return 40;
  }

  function btsRank(label){
    if(/(^|[^0-9])1([^0-9]|$)/.test(label) || /1ERE|1ÈRE|PREMIERE|PREMIÈRE/.test(label))return 10;
    if(/(^|[^0-9])2([^0-9]|$)/.test(label) || /2EME|2ÈME|DEUXIEME|DEUXIÈME/.test(label))return 20;
    return 30;
  }

  function hideVfmpForTerminale(link){
    var label=classLabel(link);
    var terminale=(/^T/.test(label) || /^TER/.test(label));
    if(!terminale)return;

    var card=link.querySelector('.classcard') || link;
    Array.from(card.children).forEach(function(child){
      if(/VFMP/i.test(child.textContent||'')){
        child.style.display='none';
      }
    });
  }

  function hasDeclaredPeriod(link){
    var txt=(link.textContent||'').trim();

    // Tant que la carte n'est pas réellement peuplée, ne jamais la masquer.
    if(!txt)return true;

    var hasPfmp=/\b(PFMP|STAGE)\b/i.test(txt);
    var hasDate=/\b(?:\d{1,2}\/\d{1,2}\/\d{4}|\d{4}-\d{2}-\d{2})\b/.test(txt);

    // Une période affichée suffit à conserver la vignette.
    if(hasPfmp && hasDate)return true;

    // Si le rendu n'est pas terminé, on conserve également la carte.
    if(/élève\(s\)|eleve\(s\)/i.test(txt) && !hasPfmp)return true;

    return false;
  }

  function sortCards(){
    var links=Array.from(document.querySelectorAll('a.classlink'));
    if(!links.length)return;

    links.forEach(function(link){
      hideVfmpForTerminale(link);

      // Important : le masquage doit être réversible.
      // Une carte masquée pendant un rendu intermédiaire doit pouvoir réapparaître.
      if(hasDeclaredPeriod(link)){
        link.style.display='';
      }else{
        link.style.display='none';
      }
    });

    var parents=[];
    links.forEach(function(link){
      if(link.parentElement && parents.indexOf(link.parentElement)<0)parents.push(link.parentElement);
    });

    parents.forEach(function(parent){
      var children=Array.from(parent.children).filter(function(x){
        return x.matches && x.matches('a.classlink');
      });
      if(children.length<2)return;

      var isBts=/BTS/i.test((parent.parentElement&&parent.parentElement.textContent)||'') &&
                !/BAC PRO/i.test((parent.parentElement&&parent.parentElement.textContent)||'');

      children.sort(function(a,b){
        var la=classLabel(a), lb=classLabel(b);
        var ra=isBts?btsRank(la):bacRank(la);
        var rb=isBts?btsRank(lb):bacRank(lb);
        return ra-rb || la.localeCompare(lb,'fr');
      });
      children.forEach(function(x){parent.appendChild(x);});
    });
  }

  function activateEntMode(){
    var ent=qs('mode')==='ent';
    if(!ent)return;

    document.body.classList.add('euc-ent-mode');

    var back=document.getElementById('back');
    if(back)back.style.display='none';

    Array.from(document.querySelectorAll('a.classlink')).forEach(function(a){
      try{
        var u=new URL(a.href,window.location.href);
        u.searchParams.set('mode','ent');
        a.href=u.toString();
      }catch(e){}
    });
  }

  function bindLoading(){
    document.addEventListener('click',function(e){
      var a=e.target.closest && e.target.closest('a.classlink');
      if(a && a.href){
        showLoading();
      }
    },true);

    var year=document.getElementById('yearSelect');
    if(year){
      year.addEventListener('change',showLoading,true);
    }
  }

  function run(){
    ensureOverlay();
    sortCards();
    activateEntMode();
    bindLoading();

    var obs=new MutationObserver(function(){
      sortCards();
      activateEntMode();
    });
    obs.observe(document.body,{childList:true,subtree:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',run);
  }else{
    run();
  }
})();

</script>
<script id="EUC_ENT_PUBLIC_FIX7">
(function(){
  function ent(){try{var u=new URL(location.href);return u.searchParams.get('mode')==='ent'||u.searchParams.get('page')==='suivi-pfmp-ent';}catch(e){return false;}}
  function apply(){
    if(!ent())return;
    document.body.classList.add('euc-ent-mode');
    var back=document.getElementById('back');if(back)back.style.display='none';
    Array.from(document.querySelectorAll('a.classlink')).forEach(function(a){try{var u=new URL(a.href,location.href);u.searchParams.set('page','suivi-pfmp-ent-classe');u.searchParams.set('mode','ent');a.href=u.toString();}catch(e){}});
    var year=document.getElementById('yearSelect');
    if(year&&!year.dataset.entFix7){year.dataset.entFix7='1';year.addEventListener('change',function(ev){ev.stopImmediatePropagation();var base=(typeof C!=='undefined'&&C.baseUrl)?C.baseUrl:location.href.split('?')[0];location.href=base+'?page=suivi-pfmp-ent&mode=ent&annee='+encodeURIComponent(year.value);},true);}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
  new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body>
</html>
