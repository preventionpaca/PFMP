<script>(function(){const $=s=>document.querySelector(s),status=$('#status'),sheet=$('#sheet');let fiche=null,busy=false;function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function fail(e){busy=false;status.textContent='Erreur : '+(e&&e.message||e)}google.script.run.withSuccessHandler(r=>{const phone=r.personnels.filter(x=>x.telephone),visit=r.personnels.filter(x=>x.visite);$('#staff-phone').innerHTML+=""+phone.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('');$('#staff-visit').innerHTML+=""+visit.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('');$('#staff-empty').hidden=r.personnels.length>0;if(r.lectureSeule||r.mutationMode==='DRY_RUN')$('#mode').textContent=r.lectureSeule?'LECTURE SEULE — les corrections sont désactivées.':'MODE DRY_RUN — les corrections sont uniquement simulées.'}).withFailureHandler(fail).EUC_ADMIN_chargerReferentiel();$('#lookup').onsubmit=e=>{e.preventDefault();if(busy)return;busy=true;google.script.run.withSuccessHandler(show).withFailureHandler(fail).EUC_ADMIN_chargerFiche($('#submission').value)};function show(r){busy=false;fiche=r;$('#sections').innerHTML=Object.entries(r.sections).map(([title,values])=>`<section><h2>${esc(title)}</h2><dl>${Object.entries(values).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(Array.isArray(v)?v.join(' — '):v)}</dd></div>`).join('')}</dl></section>`).join('');sheet.hidden=false;$('#simulate').disabled=r.lectureSeule;status.textContent=r.lectureSeule?'Fiche ouverte en lecture seule.':'Fiche prête pour une simulation DRY_RUN.'}$('#simulate').onclick=()=>{if(!fiche||busy)return;busy=true;$('#simulate').disabled=true;google.script.run.withSuccessHandler(()=>{busy=false;status.textContent='Simulation validée : aucune écriture réalisée.'}).withFailureHandler(fail).EUC_ADMIN_preparerMutation('CORRECTION',{id:fiche.id,fields:{Version_suivi:fiche.revision}},{Commentaire_administratif:'Simulation'},{versionAttendue:fiche.revision,motif:$('#reason').value,doubleClickToken:Date.now().toString(36)})}})();</script>
