<script>(function(){
const $=s=>document.querySelector(s),status=$('#status'),dashboard=$('#dashboard'),classView=$('#class-view'),listView=$('#list-view'),classGrid=$('#class-grid'),periodGrid=$('#period-grid'),categoryGrid=$('#category-grid'),specialtyGrid=$('#specialty-grid'),tbody=$('#rows'),loading=$('#table-loading'),form=$('#filters'),year=$('#year');let meta=null,synth=[],category=sessionStorage.getItem('euc-suivi-category')||'BAC_PRO',specialty='',selectedClass=null,selectedPeriod=null,page=1,total=0,quick='';
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function crumb(){const p=[year.value];if(category)p.push(category==='BAC_PRO'?'Bac professionnel':category);if(specialty)p.push(specialty);if(selectedClass)p.push(selectedClass.code);if(selectedPeriod)p.push(selectedPeriod.libelle);$('#breadcrumb').textContent=p.join(' > ')}function dots(){return '<span class="pending">…</span>'}function metric(code,key){const rows=synth.filter(x=>String(x.Classe_code||x.Classe)===code),vals=rows.map(x=>Number(x[key])||0);return vals.length?Math.max(...vals):0}function badge(v){return v.badgeSortie?`<span class="badge exit">${esc(v.badgeSortie)}</span>`:'<span class="badge present">Présent</span>'}
function loadHome(){status.textContent='Chargement des métadonnées…';google.script.run.withSuccessHandler(renderHome).withFailureHandler(fail).EUC_SUIVI_chargerAccueil(year.value||PREFILTRES.annee)}
function renderHome(r){if(r.lectureSeule!==true)return fail({message:'Accès en lecture seule requis.'});meta=r.metadonnees;synth=[];year.innerHTML=meta.annees.map(a=>`<option${a===meta.annee?' selected':''}>${esc(a)}</option>`).join('');$('#historical-banner').hidden=meta.annee!=='2025-2026';$('#current-banner').hidden=meta.annee!=='2026-2027';const cats=['CAP','BAC_PRO','BTS'].filter(c=>meta.classes.some(x=>x.categorie===c));if(!cats.includes(category))category=cats.includes('BAC_PRO')?'BAC_PRO':cats[0];renderCategories(cats);renderSpecialties();status.textContent='Tableau de bord en lecture seule';dashboard.hidden=false;classView.hidden=false;listView.hidden=true;selectedClass=null;selectedPeriod=null;crumb();loadCounters()}
function renderCategories(cats){categoryGrid.innerHTML=cats.map(c=>`<button type="button" role="tab" aria-selected="${c===category}" data-category="${c}">${c==='BAC_PRO'?'Bac professionnel':c}</button>`).join('')+`<button type="button" role="tab" aria-selected="${category==='ALL'}" data-category="ALL">Toutes les formations</button>`;categoryGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;sessionStorage.setItem('euc-suivi-category',category);specialty='';selectedClass=null;renderCategories(cats);renderSpecialties()})}
function categoryClasses(){return category==='ALL'?meta.classes:meta.classes.filter(x=>x.categorie===category)}function renderSpecialties(){const specs=[...new Set(categoryClasses().map(x=>x.specialite))].sort((a,b)=>a.localeCompare(b,'fr'));if(!specs.includes(specialty))specialty=specs[0]||'';specialtyGrid.innerHTML=specs.map(s=>`<button type="button" aria-pressed="${s===specialty}" data-specialty="${esc(s)}">${esc(s)}</button>`).join('');specialtyGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>{specialty=b.dataset.specialty;selectedClass=null;renderSpecialties()});renderClasses();crumb()}
function calendarAnomalies(c){return metric(c.code,'Anomalies')+(c.statutCalendrier==='A_VERIFIER'?1:0)}function renderClasses(){const rows=categoryClasses().filter(x=>x.specialite===specialty);classGrid.innerHTML=rows.map(c=>`<button type="button" class="compact-class${selectedClass&&selectedClass.code===c.code?' selected':''}" aria-selected="${!!selectedClass&&selectedClass.code===c.code}" data-code="${esc(c.code)}" title="${esc(c.diplomeLibelle||c.libelle)}"><strong>${esc(c.code)}</strong><span>Effectif <b data-metric="effectif">${synth.length?metric(c.code,'Effectif_total'):dots()}</b></span><span>Manquantes <b data-metric="missing">${synth.length?metric(c.code,'Sans_convention'):dots()}</b></span><span>Anomalies <b data-metric="anomalies">${synth.length?calendarAnomalies(c):dots()}</b></span><span>Périodes <b>${c.periodes.length}</b></span></button>`).join('');classGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseClass(b.dataset.code));if(!selectedClass){$('#period-title').textContent='Sélectionnez une classe';periodGrid.innerHTML='<p>Les périodes s’afficheront ici.</p>'}}
function loadCounters(){google.script.run.withSuccessHandler(r=>{synth=r.lignes||[];renderClasses();if(selectedClass)chooseClass(selectedClass.code)}).withFailureHandler(()=>classGrid.querySelectorAll('.pending').forEach(x=>x.textContent='—')).EUC_SUIVI_chargerSyntheses(year.value)}
function chooseClass(code){selectedClass=meta.classes.find(c=>c.code===code);selectedPeriod=null;renderClasses();$('#period-title').textContent=selectedClass.code;if(selectedClass.periodes.length){periodGrid.innerHTML=selectedClass.periodes.map((p,i)=>{const s=synth.find(x=>String(x.Classe_code||x.Classe)===code&&(String(x.Periode||'')===String(p.id)||(p.id==='HISTORIQUE_NON_RELIEE'&&!x.Periode)));return `<button type="button" class="compact-period" data-index="${i}"><strong>${esc(p.libelle)}</strong><span>${esc(p.dates)}</span><span>${s?Number(s.Effectif_total)||0:0} élève(s) · ${s?Number(s.Avec_convention)||0:0} convention(s) · ${s?Number(s.Sans_convention)||0:0} manquante(s) · ${s?Number(s.Anomalies)||0:0} anomalie(s)</span></button>`}).join('');periodGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>choosePeriod(selectedClass.periodes[Number(b.dataset.index)].id))}else if(selectedClass.aucunePeriodePrevue){periodGrid.innerHTML='<div class="calendar-none"><strong>Aucune période de stage prévue en 2026-2027.</strong><span>Cette situation correspond au calendrier officiel enregistré.</span></div>'}else{periodGrid.innerHTML='<div class="calendar-check"><strong>Les périodes de cette classe restent à vérifier.</strong></div>'}crumb()}
function applyQuick(){form.elements.etat.value=quick==='SANS_CONVENTION'?'SANS_CONVENTION':quick==='ANOMALIE'?'ANOMALIE':'';form.elements.scolarite.value=quick==='SORTI'?'SORTI':'';quick=''}function choosePeriod(id){selectedPeriod=selectedClass.periodes.find(p=>p.id===id);page=1;classView.hidden=true;listView.hidden=false;if(quick)applyQuick();crumb();loadList()}function params(){return {...Object.fromEntries(new FormData(form)),annee:year.value,classe:selectedClass.code,periode:selectedPeriod.id,page,taille:50}}function loadList(){loading.hidden=false;google.script.run.withSuccessHandler(renderList).withFailureHandler(failList).EUC_SUIVI_chargerSelection(params())}function renderList(r){loading.hidden=true;total=r.total;$('#count').textContent=total;$('#page').textContent=r.page;tbody.innerHTML=r.lignes.length?r.lignes.map(v=>`<tr><td>${esc(v.nom)}</td><td>${esc(v.prenom)}</td><td>${esc(v.classe)}</td><td>${esc(v.periode)}</td><td>${esc(v.datesOfficielles)}</td><td>${esc(v.etatConvention)}</td><td>${esc(v.entreprise)}</td><td>${badge(v)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty-state">Aucun élève n’a encore été importé pour cette classe et cette année scolaire.</td></tr>'}function fail(e){status.textContent='Erreur : '+(e&&e.message||'Accès non autorisé.')}function failList(e){loading.hidden=true;fail(e)}
year.onchange=()=>loadHome();$('#change-class').onclick=()=>{listView.hidden=true;classView.hidden=false;selectedPeriod=null;renderClasses();if(selectedClass)chooseClass(selectedClass.code);crumb()};$('#change-period').onclick=()=>{listView.hidden=true;classView.hidden=false;selectedPeriod=null;if(selectedClass)chooseClass(selectedClass.code);crumb()};form.onsubmit=e=>{e.preventDefault();page=1;loadList()};$('#prev').onclick=()=>{if(page>1){page--;loadList()}};$('#next').onclick=()=>{if(page*50<total){page++;loadList()}};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{quick=b.dataset.quick;if(!selectedClass||!selectedPeriod){status.textContent='Choisissez une classe puis une période.';return}applyQuick();loadList()});loadHome()})();</script>
